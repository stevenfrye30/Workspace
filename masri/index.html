<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masri — Egyptian Arabic reference desk</title>
<!-- Inline SVG favicon (gold م on the site background). Declaring an icon stops the
     browser's implicit /favicon.ico request, which 404s on GitHub Pages. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312161f'/%3E%3Ctext x='32' y='46' font-family='Noto Naskh Arabic,Traditional Arabic,serif' font-size='42' fill='%23d9a441' text-anchor='middle'%3E%D9%85%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161f; --surf:#1a1f2b; --surf2:#222838; --card:#1e2431;
    --fg:#e9edf4; --muted:#8b97ad; --border:#2c3446;
    --gold:#d9a441; --blue:#5fb2e6; --green:#6fce9a;
    --ar:'Noto Naskh Arabic','Traditional Arabic','Amiri','Times New Roman',serif;
    --ui:'Inter',system-ui,-apple-system,sans-serif;
    --r:10px;
    /* Display-settings knobs (overridden inline on <html> by the Aa panel; saved
       in localStorage 'masri-display'). Text sizes multiply base px via calc();
       Arabic size scales independently of general text size. */
    --ui-scale:1; --ar-scale:1.14; --ar-color:var(--fg);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.55;min-height:100vh}
  .ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}

  /* ── header ── */
  header{background:var(--surf);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header .title-ar{font-family:var(--ar);font-size:30px;color:var(--gold);line-height:1;direction:rtl;unicode-bidi:isolate}
  header h1{font-size:20px;font-weight:600;letter-spacing:.02em}
  header .sub{color:var(--muted);font-style:italic;font-size:14px;flex:1;min-width:220px}

  /* ── nav ── */
  nav{background:var(--surf);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 12px;position:sticky;top:0;z-index:10}
  .tab{background:none;border:none;color:var(--muted);font-family:var(--ui);font-size:13px;font-weight:600;
       letter-spacing:.03em;padding:14px 16px;cursor:pointer;white-space:nowrap;flex:0 0 auto;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

  /* ── subsection nav (subordinate to the 7 main tabs) ── */
  #subnav{display:flex;flex-wrap:wrap;gap:6px;max-width:960px;margin:0 auto;padding:12px 20px 0}
  #subnav:empty{display:none;padding:0}
  .subtab{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:20px;
          font-family:var(--ui);font-size:12px;font-weight:600;padding:5px 13px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
          transition:color .15s,border-color .15s,background .15s}
  .subtab:hover{color:var(--fg)}
  .subtab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .subtab.active{background:var(--gold);color:#111;border-color:var(--gold)}
  @media (max-width:600px){ #subnav{flex-wrap:nowrap;overflow-x:auto} }

  /* ── practice subnav bar (Back · current section · Prev/Next) ── */
  .prac-back{font-weight:600}
  .prac-here{align-self:center;color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .prac-spacer{flex:1 1 auto;min-width:8px}
  .prac-nav{flex:0 0 auto}

  /* ── practice dashboard (card grid; each card is a real button) ── */
  .pd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .pd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;text-align:left;
           cursor:pointer;font-family:var(--ui);display:flex;flex-direction:column;gap:5px;transition:border-color .15s,background .15s}
  .pd-card:hover{border-color:var(--gold);background:var(--surf2)}
  .pd-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .pd-title{font-weight:600;color:var(--fg);font-size:calc(14.5px * var(--ui-scale))}
  .pd-title .pd-arrow{color:var(--gold);font-weight:700;margin-left:3px}
  .pd-desc{color:var(--muted);font-size:calc(12.5px * var(--ui-scale));line-height:1.5}
  @media (max-width:600px){ .pd-grid{grid-template-columns:1fr} }

  /* ── display settings (Aa popover in the header) ── */
  .ds-wrap{position:relative;align-self:center;margin-left:auto}
  .ds-btn{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-weight:600;font-size:14px;padding:6px 12px;cursor:pointer;line-height:1}
  .ds-btn:hover{border-color:var(--gold)}
  .ds-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ds-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:min(320px,calc(100vw - 24px));
       background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .ds-panel[hidden]{display:none}
  .ds-h{font-size:12px;font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .ds-group{margin-bottom:11px}
  .ds-glabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-weight:600}
  .ds-opts{display:flex;flex-wrap:wrap;gap:6px}
  .ds-opt{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:20px;font-family:var(--ui);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer}
  .ds-opt:hover{border-color:var(--gold)}
  .ds-opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ds-opt[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
  .ds-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--border);margin-top:4px;padding-top:10px}
  .ds-reset{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:var(--ui);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer}
  .ds-reset:hover{color:var(--fg);border-color:var(--gold)}
  .ds-reset:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* On mobile the popover becomes a fixed, viewport-anchored sheet at the bottom
     so it never sits over the header, main tabs, or Practice sub-nav (which live
     at the top). Centered, fully within the viewport, scrolls if tall. Desktop
     keeps the anchored-under-the-button popover above. */
  @media (max-width:600px){
    .ds-panel{position:fixed;left:50%;right:auto;top:auto;bottom:14px;transform:translateX(-50%);
       width:calc(100vw - 20px);max-width:360px;max-height:78vh;overflow-y:auto}
  }

  /* ── layout ── */
  main{max-width:960px;margin:0 auto;padding:28px 20px 90px}
  .panel{display:none}
  .panel.active{display:block}
  .lead{color:var(--muted);font-size:calc(14px * var(--ui-scale));max-width:760px;margin-bottom:22px;line-height:1.65}
  .lead b{color:var(--fg)}
  h2{font-size:15px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.07em;margin:30px 0 12px}
  h2:first-of-type{margin-top:0}
  .note{color:var(--muted);font-size:calc(13px * var(--ui-scale));margin-bottom:12px;line-height:1.6}
  .note b{color:var(--fg)}

  /* ── start here ── */
  .start-list{list-style:none;margin:0 0 6px;padding:0}
  .start-list li{position:relative;padding:7px 0 7px 20px;color:var(--fg);font-size:14px;line-height:1.6;border-bottom:1px solid var(--border)}
  .start-list li:last-child{border-bottom:none}
  .start-list li::before{content:"\203A";position:absolute;left:3px;color:var(--gold);font-weight:700}
  .goto{color:var(--gold);cursor:pointer;font-weight:600}
  .goto:hover{text-decoration:underline}
  /* ── start here (goal-based front door) ── */
  .sh-lead{margin-bottom:8px}
  .sh-sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
  .sh-tip{color:var(--muted);font-size:13px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0 0 26px;line-height:1.7}
  .sh-tip code{margin:0 1px}
  .sh-searchlink{background:none;border:none;color:var(--gold);font-family:var(--ui);font-weight:600;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .sh-searchlink:hover{color:var(--fg)}
  .sh-goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:6px}
  .sh-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:5px}
  .sh-card-title{font-weight:600;color:var(--fg);font-size:14px}
  .sh-card-desc{color:var(--muted);font-size:12.5px;line-height:1.5;flex:1}
  .sh-card-go{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .sh-go{background:var(--gold);border:none;border-radius:8px;color:#111;font-family:var(--ui);font-size:12.5px;font-weight:600;padding:7px 12px;cursor:pointer}
  .sh-go:hover{opacity:.9}
  .sh-also{display:inline-flex;flex-wrap:wrap;gap:6px}
  .sh-go2{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-size:12px;padding:6px 10px;cursor:pointer}
  .sh-go2:hover{border-color:var(--gold)}
  .sh-path{margin:6px 0 4px;padding-left:24px;color:var(--fg)}
  .sh-path li{margin-bottom:7px;line-height:1.5}
  .sh-step{background:none;border:none;color:var(--gold);font-family:var(--ui);font-size:14px;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
  .sh-step:hover{color:var(--fg)}
  .sh-sym{font-family:var(--ui);font-size:16px;color:var(--gold);font-weight:600;white-space:nowrap}
  .sh-more{margin:12px 0 0}
  .sh-phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .sh-phrase{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
  .sh-pen{color:var(--fg);font-size:13.5px;font-weight:600;margin-bottom:6px}
  .sh-pform{display:flex;align-items:center;flex-wrap:wrap;gap:5px 10px;padding:5px 0}
  .sh-pform + .sh-pform{border-top:1px dashed var(--border)}
  .sh-who{width:100%;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .sh-pform .ar{font-family:var(--ar);font-size:calc(20px * var(--ar-scale));color:var(--fg);direction:rtl;unicode-bidi:isolate}
  .sh-pform .tr{color:var(--blue);font-size:12.5px;font-style:italic}
  .sh-copy{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:6px;font-family:var(--ui);font-size:11px;padding:3px 9px;margin-left:auto;cursor:pointer;flex:0 0 auto}
  .sh-copy:hover{color:var(--fg);border-color:var(--gold)}
  .sh-copy.copied{background:var(--green);color:#111;border-color:var(--green)}
  .sh-go:focus-visible,.sh-go2:focus-visible,.sh-step:focus-visible,.sh-copy:focus-visible,.sh-searchlink:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (max-width:600px){ .sh-goals{grid-template-columns:1fr} .sh-phrases{grid-template-columns:1fr} }

  /* ── search ── */
  .search{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);
          color:var(--fg);font-family:var(--ui);font-size:14px;padding:11px 14px;margin-bottom:20px;outline:none}
  .search:focus{border-color:var(--gold)}
  .search::placeholder{color:var(--muted)}

  /* ── global search ── */
  #gsearch{background:var(--surf);padding:12px 24px 14px;border-bottom:1px solid var(--border)}
  #gsearch .search{margin-bottom:0}
  #gsearch-results{margin-top:10px;max-height:52vh;overflow-y:auto;display:none}
  #gsearch-results.show{display:block}
  .gres-count{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin:2px 0 8px}
  .gres{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-family:var(--ui)}
  .gres:hover{border-color:var(--gold)}
  .gres .where{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .gres .ar{font-family:var(--ar);font-size:calc(18px * var(--ar-scale));color:var(--fg);direction:rtl;unicode-bidi:isolate}
  .gres .tr{color:var(--blue);font-size:12px;font-style:italic;margin-right:8px}
  .gres .en{color:var(--fg);font-size:13px;margin-top:3px}
  .gres .snip{color:var(--muted);font-size:11.5px;margin-top:3px}
  .gres-empty{color:var(--muted);font-style:italic;padding:8px 2px}

  /* ── tables ── */
  /* Content tables are centered (headers + all data cells). Arabic cells stay
     RTL/isolated via .ar; IPA/English/transliteration are plain LTR text — only
     their alignment is centered, never their direction. Arabic table text is
     enlarged and scaled independently through --ar-scale (+ --ar-color). */
  table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:calc(14px * var(--ui-scale))}
  th{text-align:center;color:var(--muted);font-weight:600;font-size:calc(11px * var(--ui-scale));text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--border)}
  td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center}
  tr:hover td{background:var(--surf2)}
  td.ar{font-size:calc(22px * var(--ar-scale));color:var(--ar-color);line-height:1.5}
  td .tr{color:var(--blue);font-family:var(--ar),monospace}
  .card-table{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
  .card-table h3{font-size:calc(14px * var(--ui-scale));font-weight:600;color:var(--fg);padding:13px 14px 11px;border-bottom:1px solid var(--border);background:var(--surf2);text-align:center}
  .card-table table{margin:0}
  /* Independent tables laid two-up on wider screens with a real CSS grid, so DOM
     order flows normally left-to-right then top-to-bottom (not down-then-across).
     minmax(0,1fr) keeps wide cells from forcing overflow; each .card-table stays
     whole. Single column on mobile. */
  .tables-2col{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  .tables-2col > .card-table{margin-bottom:0}
  @media (min-width:760px){ .tables-2col{grid-template-columns:repeat(2, minmax(0, 1fr))} }

  /* ── grids ── */
  .grid{display:grid;gap:12px}
  .g-letters{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .g-cells{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .g-list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

  .letter{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
  .letter .glyph{font-family:var(--ar);font-size:calc(44px * var(--ar-scale));color:var(--gold);line-height:1.1}
  .letter .lname{font-size:13px;font-weight:600;margin-top:2px}
  .letter .lsound{color:var(--blue);font-size:13px;margin-top:2px}
  .letter .forms{display:flex;justify-content:center;gap:6px;margin:10px 0 6px;direction:rtl}
  .letter .form{flex:1;background:var(--surf2);border-radius:6px;padding:6px 0}
  .letter .form .fg{font-family:var(--ar);font-size:calc(22px * var(--ar-scale));color:var(--fg);line-height:1}
  .letter .form .fl{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .letter .lnote{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}

  .cell{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
  .cell .glyph{font-family:var(--ar);font-size:calc(28px * var(--ar-scale));color:var(--gold)}
  .cell .digit{font-family:var(--ar);font-size:calc(18px * var(--ar-scale));color:var(--muted)}
  .cell .tr{color:var(--blue);font-size:13px;margin-top:2px}
  .cell .en{color:var(--muted);font-size:12px}

  .item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
  .item .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .item .a{font-family:var(--ar);font-size:calc(22px * var(--ar-scale));color:var(--ar-color);line-height:1.5}
  .item .t{color:var(--blue);font-size:calc(13px * var(--ui-scale));font-style:italic}
  .item .e{color:var(--muted);font-size:calc(13px * var(--ui-scale));margin-top:4px}

  /* ── sounds (grouped pronunciation reference) ── */
  .snd-jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
  .snd-jbtn{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:20px;font-family:var(--ui);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .snd-jbtn:hover{border-color:var(--gold)}
  .snd-jbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .snd-sub{font-size:12px;font-weight:600;color:var(--fg);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
  .snd-xref{font-style:italic}
  .snd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:8px}
  .snd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px}
  .snd-big{border-color:var(--gold)}
  .snd-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .snd-glyph{font-family:var(--ar);font-size:calc(38px * var(--ar-scale));color:var(--gold);line-height:1;unicode-bidi:isolate}
  .snd-big .snd-glyph{font-size:calc(52px * var(--ar-scale))}
  .snd-hmeta{min-width:0}
  .snd-name{font-size:13px;font-weight:600;color:var(--fg)}
  .snd-line{font-size:calc(13px * var(--ui-scale));margin-top:2px}
  .snd-sym{color:var(--green);font-weight:600}
  .snd-ipa{color:var(--muted);font-family:var(--ui)}
  .snd-sum{font-size:calc(13px * var(--ui-scale));color:var(--fg);line-height:1.5}
  .snd-ex{font-size:13px;color:var(--muted);margin-top:7px}
  .snd-ex .ar{font-family:var(--ar);font-size:calc(18px * var(--ar-scale));color:var(--fg)}
  .snd-ex .tr{color:var(--blue);font-style:italic;margin:0 3px}
  .snd-more{margin-top:8px}
  .snd-more summary{font-size:11.5px;color:var(--gold);cursor:pointer;font-weight:600;list-style:none}
  .snd-more summary::-webkit-details-marker{display:none}
  .snd-more summary::before{content:"\25B8 "}
  .snd-more[open] summary::before{content:"\25BE "}
  .snd-more summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .snd-det{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:6px}
  .snd-audio audio{width:100%;margin-top:8px}
  .snd-vsym{font-family:var(--ui);font-size:16px;font-weight:600;color:var(--gold)}
  .snd-vh{color:var(--gold);font-weight:700}
  .snd-pairs{display:flex;flex-direction:column;gap:6px}
  .snd-pair{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px}
  .snd-pv{font-weight:600;color:var(--gold)}
  .snd-pair .tr{color:var(--blue);font-style:italic;margin:0 2px}
  .snd-pen{color:var(--muted);font-size:12px}
  .snd-parrow{color:var(--muted);margin:0 6px}
  .snd-cmpgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .snd-cmp{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
  .snd-cmprow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .snd-cmpside{display:inline-flex;align-items:center;gap:6px}
  .snd-cmpside .snd-glyph{font-size:calc(30px * var(--ar-scale))}
  .snd-cmpvs{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .snd-cmpnote{font-size:12.5px;color:var(--fg);line-height:1.5}
  .snd-cmpex{font-size:12px;color:var(--muted);margin-top:7px}
  .snd-cmpex .ar{font-family:var(--ar);font-size:calc(16px * var(--ar-scale));color:var(--fg)}
  .snd-cmpex .tr{color:var(--blue);font-style:italic}
  @media (max-width:600px){ .snd-grid,.snd-cmpgrid{grid-template-columns:1fr} .snd-big .snd-glyph{font-size:calc(46px * var(--ar-scale))} }

  /* ── alphabet (reading reference) ── */
  #p-alphabet h2{scroll-margin-top:66px}
  /* Full alphabet sequence — 28 letters read right-to-left; each jumps to its card. */
  .alp-allrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;direction:rtl;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin:0 0 14px}
  .alp-allkey{background:var(--surf2);border:1px solid var(--border);border-radius:8px;min-width:44px;padding:6px 4px;cursor:pointer;font-family:var(--ar);font-size:calc(28px * var(--ar-scale));color:var(--gold);line-height:1.15;unicode-bidi:isolate}
  .alp-allkey:hover{border-color:var(--gold)}
  .alp-allkey:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (max-width:600px){ .alp-allkey{min-width:38px;font-size:calc(24px * var(--ar-scale))} }
  .alp-jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
  .alp-jbtn{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:20px;font-family:var(--ui);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .alp-jbtn:hover{border-color:var(--gold)}
  .alp-glyph{font-family:var(--ar);font-size:calc(36px * var(--ar-scale));color:var(--gold);line-height:1;unicode-bidi:isolate}
  .alp-formdefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin:12px 0}
  .alp-fdef{font-size:13px;color:var(--muted)}
  .alp-fdef b{color:var(--fg)}
  .alp-jex{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
  .alp-jexcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
  .alp-jexword{font-family:var(--ar);font-size:calc(34px * var(--ar-scale));color:var(--gold);direction:rtl;unicode-bidi:isolate;text-align:center}
  .alp-jexmeta{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
  .alp-jexmeta .tr{color:var(--blue);font-style:italic}
  .alp-jexkind{font-size:12px;color:var(--fg);margin-top:8px;line-height:1.5}
  .alp-fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .alp-fam{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
  .alp-famlet{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-family:var(--ui)}
  .alp-famlet:hover{border-color:var(--gold)}
  .alp-famlet .alp-glyph{grid-row:span 3;font-size:calc(32px * var(--ar-scale))}
  .alp-famdots{font-size:11px;color:var(--muted)}
  .alp-famsnd{font-size:12px;color:var(--green);font-weight:600}
  .alp-famex{grid-column:2;font-size:11.5px;color:var(--muted)}
  .alp-famex .ar{font-family:var(--ar);font-size:calc(15px * var(--ar-scale));color:var(--fg)}
  .alp-famex .tr{color:var(--blue);font-style:italic}
  .alp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  /* transliteration key — compact collapsed reference under the letter cards */
  .alp-translit{margin:14px 0 22px;border:1px solid var(--border);border-radius:var(--r);background:var(--surf2);overflow:hidden}
  .alp-translit > summary{cursor:pointer;font-weight:600;color:var(--gold);font-size:calc(13.5px * var(--ui-scale));padding:11px 14px;list-style:none}
  .alp-translit > summary::-webkit-details-marker{display:none}
  .alp-translit > summary::before{content:"\25B8 "}
  .alp-translit[open] > summary::before{content:"\25BE "}
  .alp-translit > summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .alp-translit-body{padding:0 14px 6px}
  .alp-translit-tbl{margin-bottom:10px;overflow-x:auto}
  .alp-translit-tbl td,.alp-translit-tbl th{padding:8px 12px}
  .alp-translit .note{margin:0 0 10px}
  .alp-tsym{font-weight:700;color:var(--green);font-size:calc(15px * var(--ui-scale));white-space:nowrap}
  .alp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;scroll-margin-top:70px}
  .alp-chead{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .alp-cmeta{min-width:0}
  .alp-lname{font-size:13px;font-weight:600;color:var(--fg)}
  .alp-lname .ar{font-family:var(--ar);color:var(--muted);font-size:calc(13px * var(--ar-scale));font-weight:400;margin-right:4px}
  .alp-lsound{font-size:12.5px;color:var(--green);margin:2px 0 6px}
  .alp-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid}
  .alp-badge-both{color:var(--green);border-color:var(--green)}
  .alp-badge-break{color:var(--gold);border-color:var(--gold)}
  .alp-forms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .alp-form{flex:1 1 0;min-width:52px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center}
  .alp-fg{font-family:var(--ar);font-size:calc(24px * var(--ar-scale));color:var(--fg);unicode-bidi:isolate;line-height:1.1}
  .alp-fl{font-size:9px;color:var(--muted);margin-top:5px}
  .alp-ex{font-size:13px;color:var(--muted)}
  .alp-ex .ar{font-family:var(--ar);font-size:calc(18px * var(--ar-scale));color:var(--fg)}
  .alp-ex .tr{color:var(--blue);font-style:italic;margin:0 3px}
  .alp-brk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .alp-carriers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:6px}
  .alp-brkcard,.alp-carrier{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
  .alp-brkmeta,.alp-carriermeta{min-width:0}
  .alp-spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .alp-spcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px}
  .alp-sphead{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .alp-spnote{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:7px}
  .alp-dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .alp-distcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
  .alp-distpair{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .alp-distpair .alp-glyph{font-size:calc(30px * var(--ar-scale))}
  .alp-distnote{font-size:12.5px;color:var(--fg);line-height:1.5}
  .alp-mark{font-size:calc(26px * var(--ar-scale));color:var(--gold)}
  .alp-markdemo .ar{font-family:var(--ar);font-size:calc(20px * var(--ar-scale));color:var(--fg)}
  .alp-markdemo .tr{color:var(--blue);font-style:italic}
  .alp-jbtn:focus-visible,.alp-famlet:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (max-width:600px){ .alp-grid,.alp-fams,.alp-jex,.alp-brk,.alp-carriers,.alp-spgrid,.alp-dist,.alp-formdefs{grid-template-columns:1fr} }

  /* ── symbols (IPA ⇄ Arabic reference, two coordinated panels) ── */
  .sym-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start}
  .sym-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .sym-scroll{overflow-x:auto}
  .sym-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0;font-size:calc(13.5px * var(--ui-scale))}
  .sym-table col.sym-c-ex{width:41%}
  .sym-table col.sym-c-ipa{width:16%}
  .sym-table col.sym-c-en{width:27%}
  .sym-table col.sym-c-ar{width:16%}
  .sym-table thead th{position:sticky;top:0;background:var(--surf2);color:var(--muted);font-weight:600;font-size:10.5px;
       text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:9px 12px;border-bottom:1px solid var(--border)}
  .sym-grouprow td{background:var(--surf2);color:var(--gold);font-weight:700;font-size:10.5px;
       text-transform:uppercase;letter-spacing:.05em;padding:7px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center}
  .sym-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center;overflow-wrap:anywhere}
  .sym-table tr:last-child td{border-bottom:none}
  .sym-row:hover td{background:var(--surf2)}
  .sym-ex .ar{font-family:var(--ar);font-size:calc(18px * var(--ar-scale));color:var(--ar-color);margin-left:5px}
  .sym-ex .tr{color:var(--blue);font-style:italic}
  .sym-ex .gloss{color:var(--muted)}
  .sym-en{color:var(--fg);line-height:1.4}
  .sym-masri{display:block;margin-top:4px;font-size:10.5px;color:var(--gold);line-height:1.4}
  .sym-ipa{color:var(--green);font-weight:600;font-family:var(--ui);direction:ltr;white-space:nowrap;cursor:pointer;border-radius:5px}
  .sym-ar{font-family:var(--ar);font-size:calc(24px * var(--ar-scale));color:var(--gold);direction:rtl;unicode-bidi:isolate;text-align:center;cursor:pointer;border-radius:5px;line-height:1.4}
  .sym-ipa:hover,.sym-ar:hover{outline:1px solid var(--border)}
  .sym-ipa.copied,.sym-ar.copied{background:var(--green);color:#111}
  .sym-copyhint{color:var(--muted);font-size:12px;margin:-8px 0 10px}
  /* visible attribution / IPA-vs-Masri note above the chart */
  .sym-refnote{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 16px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surf2)}
  .sym-refnote a{color:var(--gold)}
  /* "Hear /…/" IPA reference-sound button beside each example (wraps cleanly; state = icon + label + pulse, not colour only) */
  .sym-play{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--border);border-radius:6px;color:var(--gold);cursor:pointer;font-family:var(--ui);font-size:11px;line-height:1;height:22px;padding:0 7px;vertical-align:middle;white-space:nowrap}
  .sym-play-ico{font-size:9px}
  .sym-play:hover{border-color:var(--gold)}
  .sym-play:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .sym-play.playing{background:var(--green);color:#111;border-color:var(--green);animation:sym-pulse 1.1s ease-in-out infinite}
  .sym-play.unavailable{color:var(--muted);cursor:not-allowed;opacity:.65}
  @keyframes sym-pulse{0%,100%{box-shadow:0 0 0 0 rgba(111,206,154,.55)}50%{box-shadow:0 0 0 4px rgba(111,206,154,0)}}
  .sym-noclip{display:inline-flex;align-items:center;height:22px;font-family:var(--ui);font-size:11px;color:var(--muted);font-style:italic;vertical-align:middle;white-space:nowrap}
  .sym-holdnote{font-family:var(--ui);font-size:10.5px;color:var(--muted);font-style:italic;white-space:nowrap;vertical-align:middle}
  .sym-audiostatus{font-size:12px;color:var(--muted);min-height:1.1em;margin-top:6px}
  @media (max-width:600px){ .sym-wrap{grid-template-columns:1fr} }

  /* ── listening & speaking ── */
  .ls-modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .ls-mode{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:20px;font-family:var(--ui);font-size:calc(12.5px * var(--ui-scale));font-weight:600;padding:7px 14px;cursor:pointer;white-space:nowrap}
  .ls-mode:hover{border-color:var(--gold)}
  .ls-mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ls-mode[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
  .ls-desc{color:var(--muted);font-size:calc(13px * var(--ui-scale));line-height:1.55;margin:0 0 14px;max-width:760px}
  .ls-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 16px}
  .ls-filter{display:flex;align-items:center;gap:7px}
  .ls-filter label{font-size:calc(12px * var(--ui-scale));color:var(--muted);font-weight:600}
  .ls-select{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-size:calc(13px * var(--ui-scale));padding:6px 10px;cursor:pointer;max-width:100%}
  .ls-select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ls-stats{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:calc(12px * var(--ui-scale));color:var(--muted);margin-left:auto}
  .ls-stat b{color:var(--fg)}
  .ls-audionote{border:1px solid var(--border);background:var(--surf2);border-radius:8px;padding:8px 11px;color:var(--muted);font-size:calc(12px * var(--ui-scale));line-height:1.5;margin:0 0 16px}
  .ls-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 18px 16px;margin:0 0 14px}
  .ls-count{font-size:calc(11.5px * var(--ui-scale));color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px}
  .ls-ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:calc(30px * var(--ar-scale));color:var(--ar-color);line-height:1.5;text-align:center;margin:6px 0}
  .ls-ar.small{font-size:calc(24px * var(--ar-scale))}
  .ls-tr{direction:ltr;unicode-bidi:isolate;color:var(--blue);font-style:italic;font-size:calc(15px * var(--ui-scale));text-align:center;margin:6px 0}
  .ls-en{direction:ltr;unicode-bidi:isolate;color:var(--fg);font-size:calc(15px * var(--ui-scale));text-align:center;margin:6px 0}
  .ls-prompt{direction:ltr;unicode-bidi:isolate;color:var(--fg);font-size:calc(15px * var(--ui-scale));line-height:1.55;text-align:center;margin:4px 0 10px}
  .ls-hidden{color:var(--muted);font-style:italic;font-size:calc(13px * var(--ui-scale));text-align:center;margin:8px 0}
  .ls-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
  .ls-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-size:calc(13px * var(--ui-scale));font-weight:600;padding:9px 14px;cursor:pointer;min-height:40px}
  .ls-btn:hover{border-color:var(--gold)}
  .ls-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ls-btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
  .ls-btn.play[aria-pressed="true"]{background:var(--green);color:#111;border-color:var(--green)}
  .ls-btn.unavailable{color:var(--muted);cursor:not-allowed;opacity:.7}
  .ls-btn:disabled{opacity:.5;cursor:not-allowed}
  .ls-opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .ls-opt{display:block;width:100%;text-align:left;background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:10px;font-family:var(--ui);font-size:calc(14px * var(--ui-scale));padding:12px 14px;cursor:pointer;min-height:44px}
  .ls-opt:hover{border-color:var(--gold)}
  .ls-opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .ls-opt.correct{background:rgba(111,206,154,.16);border-color:var(--green);color:var(--fg)}
  .ls-opt.wrong{background:rgba(224,122,122,.14);border-color:#e07a7a;color:var(--fg)}
  .ls-opt:disabled{cursor:default}
  .ls-feedback{font-size:calc(13px * var(--ui-scale));line-height:1.55;margin-top:12px;min-height:1.2em;text-align:center}
  .ls-feedback.good{color:var(--green)}
  .ls-feedback.bad{color:#e79a9a}
  .ls-status{font-size:calc(12px * var(--ui-scale));color:var(--muted);min-height:1.1em;margin-top:8px;text-align:center}
  .ls-dlg-line{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
  .ls-dlg-line:last-child{border-bottom:none}
  .ls-dlg-role{flex:0 0 auto;font-size:calc(11px * var(--ui-scale));font-weight:700;color:var(--muted);min-width:64px;padding-top:4px}
  .ls-dlg-line.you .ls-dlg-role{color:var(--gold)}
  .ls-dlg-body{min-width:0;flex:1}
  .ls-dlg-line .ls-ar{text-align:right;font-size:calc(22px * var(--ar-scale));margin:2px 0}
  .ls-dlg-line .ls-tr,.ls-dlg-line .ls-en{text-align:left;margin:2px 0}
  .ls-dlg-turn{font-size:calc(12px * var(--ui-scale));color:var(--gold);font-weight:600;margin:2px 0 6px}
  .ls-roles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  @media (max-width:600px){
    .ls-stats{margin-left:0;width:100%}
    .ls-ar{font-size:calc(26px * var(--ar-scale))}
    .ls-btn,.ls-mode{flex:1 1 auto;justify-content:center}
  }

  /* ── word builder ── */
  .wb-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .wb-field{display:flex;flex-direction:column;gap:5px}
  .wb-field span{font-size:12px;color:var(--muted);font-weight:600}
  .wb-field em{color:var(--gold);font-style:normal;font-weight:400}
  .wb-in{background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-family:var(--ui);font-size:15px;padding:10px 12px;outline:none;min-width:0}
  .wb-in:focus{border-color:var(--gold)}
  .wb-in::placeholder{color:var(--muted);font-style:italic;opacity:.7}
  .wb-in.ar{font-family:var(--ar);font-size:calc(20px * var(--ar-scale))}
  .wb-ltr{direction:ltr;text-align:left;font-family:var(--ui)}
  .wb-btns{display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap}
  .wb-clear{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;padding:9px 16px}
  .wb-clear:hover{color:var(--fg);border-color:var(--gold)}
  .wb-toggle{display:inline-flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none}
  .wb-toggle input{accent-color:var(--gold);cursor:pointer}
  .wb-hint{color:var(--muted);font-style:italic;padding:8px 2px}
  .wb-status{font-size:12.5px;margin:0 2px 14px;line-height:1.5}
  .wb-status.wb-found{color:var(--green)}
  .wb-status.wb-unknown{color:var(--gold)}
  .wb-choose{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .wb-clabel{width:100%;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .wb-alt{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;cursor:pointer;font-family:var(--ui);font-size:13px;padding:6px 12px}
  .wb-alt:hover{border-color:var(--gold)}
  .wb-alt.active{background:var(--gold);color:#111;border-color:var(--gold)}
  .wb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px}
  .wb-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
  .wb-head{text-align:center;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .wb-head .wb-letterslabel{margin-top:18px}
  .wb-word{font-family:var(--ar);font-size:calc(62px * var(--ar-scale));color:var(--gold);line-height:1.15;direction:rtl;unicode-bidi:isolate;word-break:break-word}
  .wb-letters{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px}
  .wb-letter{font-family:var(--ar);font-size:calc(34px * var(--ar-scale));color:var(--fg);unicode-bidi:isolate}
  .wb-sep{color:var(--muted);font-size:22px}
  .wb-gap{width:28px}
  .wb-ld{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
  .wb-ld-group{display:flex;flex-wrap:wrap;gap:5px 10px;padding:8px 11px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;max-width:100%}
  .wb-ld-item{font-size:12.5px;color:var(--muted);white-space:nowrap;line-height:1.6}
  .wb-ld-ch{font-family:var(--ar);font-size:calc(16px * var(--ar-scale));color:var(--fg);unicode-bidi:isolate;margin-right:2px}
  .wb-details{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
  .wb-drow.wb-full{grid-column:1 / -1}
  .wb-dval{font-size:16px;color:var(--fg);line-height:1.45}
  .wb-ipaval{color:var(--blue)}
  @media (max-width:600px){
    .wb-word{font-size:calc(46px * var(--ar-scale))}
    .wb-letter{font-size:calc(26px * var(--ar-scale))}
    .wb-card{padding:18px 15px}
    .wb-details{grid-template-columns:1fr;gap:12px}
    .wb-ld{gap:8px}
    .wb-ld-group{gap:4px 8px;padding:7px 9px}
  }

  /* ── type · test (typing practice + keyboard reference) ── */
  .tt-help{margin:0 0 16px}
  .tt-help > summary{cursor:pointer;font-size:12.5px;color:var(--gold);font-weight:600;list-style:none;padding:2px 0}
  .tt-help > summary::-webkit-details-marker{display:none}
  .tt-help > summary::before{content:"\25B8 "}
  .tt-help[open] > summary::before{content:"\25BE "}
  .tt-help ol{margin:8px 0 0 18px;color:var(--muted);font-size:12.5px;line-height:1.7}
  .tt-kbdnote{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:16px 0 0;font-size:calc(13px * var(--ui-scale));color:var(--fg);line-height:1.55}
  .tt-kbdnote kbd{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:var(--ui);font-size:11.5px;color:var(--gold)}
  /* the "how to add" disclosure lives inside the same help box, attached below the Win+Space line */
  .tt-kbdnote .tt-help{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--border)}
  /* mode selector */
  .tt-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
  .tt-mode{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px;text-align:center;cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;color:var(--fg);transition:border-color .15s,background .15s}
  .tt-mode:hover{border-color:var(--gold)}
  .tt-mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tt-mode[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
  .tt-mode .tt-mdesc{display:block;font-weight:400;font-size:11px;margin-top:3px;opacity:.85}
  /* prompt card */
  .tt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 18px;text-align:center;margin-bottom:14px}
  .tt-prompt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .tt-target{font-family:var(--ar);color:var(--ar-color);direction:rtl;unicode-bidi:isolate;line-height:1.4;word-break:break-word}
  .tt-target.letter{font-size:calc(72px * var(--ar-scale))}
  .tt-target.word{font-size:calc(46px * var(--ar-scale))}
  .tt-meaning{color:var(--muted);font-size:calc(13px * var(--ui-scale));margin-top:8px}
  .tt-hintline{color:var(--blue);font-size:calc(13px * var(--ui-scale));font-style:italic;margin-top:6px;min-height:1.2em}
  .tt-hintline .ar{font-family:var(--ar);font-style:normal}
  .tt-input{width:100%;max-width:320px;margin:16px auto 0;display:block;background:var(--surf2);border:1px solid var(--border);border-radius:8px;
       color:var(--fg);font-family:var(--ar);font-size:calc(30px * var(--ar-scale));text-align:center;padding:10px 12px;outline:none;direction:rtl;unicode-bidi:isolate}
  .tt-input:focus{border-color:var(--gold)}
  .tt-fb{min-height:1.5em;margin-top:12px;font-size:calc(14px * var(--ui-scale));font-weight:600}
  .tt-fb .ar{font-family:var(--ar);font-weight:400}
  .tt-fb.ok{color:var(--green)}
  .tt-fb.no{color:var(--gold)}
  .tt-fb .tag{display:inline-block;border-radius:5px;padding:0 5px;margin:0 2px;font-weight:700;font-size:.8em;vertical-align:middle}
  .tt-fb.ok .tag{background:var(--green);color:#111}
  .tt-fb.no .tag{background:var(--gold);color:#111}
  .tt-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .tt-btn{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-size:13px;font-weight:600;padding:8px 15px;cursor:pointer}
  .tt-btn:hover{border-color:var(--gold)}
  .tt-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tt-btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
  .tt-score{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:4px}
  .tt-score b{color:var(--fg)}
  /* keyboard */
  .tt-kbdbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .tt-kbwrap{overflow-x:auto;padding-bottom:6px}
  .tt-kbd{display:inline-flex;flex-direction:column;gap:6px;min-width:640px}
  .tt-krow{display:flex;gap:6px;justify-content:flex-start}
  /* realistic physical-keyboard row stagger: the number row sits left of the Q row,
     and each lower row steps slightly further right (ANSI-style offsets). */
  .tt-kbd .tt-krow:nth-child(2){margin-left:26px}   /* Q row */
  .tt-kbd .tt-krow:nth-child(3){margin-left:44px}   /* A row */
  .tt-kbd .tt-krow:nth-child(4){margin-left:70px}   /* Z row */
  .tt-key{flex:0 0 auto;width:48px;min-height:48px;background:var(--card);border:1px solid var(--border);border-radius:8px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px}
  .tt-key.wide{width:auto;min-width:64px;padding-left:10px;padding-right:10px}
  .tt-key .tt-q{font-family:var(--ui);font-size:10px;color:var(--muted);line-height:1}
  .tt-key .tt-ka{font-family:var(--ar);font-size:calc(20px * var(--ar-scale));color:var(--fg);direction:rtl;unicode-bidi:isolate;line-height:1.3;margin-top:2px}
  .tt-key.digit .tt-ka{color:var(--muted)}
  .tt-key.hideq .tt-q{visibility:hidden}
  .tt-key.target{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,164,65,.35)}
  .tt-key.correct{background:var(--green);border-color:var(--green)}
  .tt-key.correct .tt-q,.tt-key.correct .tt-ka{color:#0c1a12}
  .tt-key.wrong{background:#5a2f2f;border-color:#8a4a4a}
  .tt-capture{outline:none}
  .tt-capture:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
  .tt-fbsub{font-size:calc(12px * var(--ui-scale));color:var(--muted);font-weight:400;margin-top:6px}
  .tt-target.enprompt{font-family:var(--ui);font-size:calc(26px * var(--ui-scale));color:var(--fg);direction:ltr;font-weight:600}
  /* selectors + review top bar */
  .tt-topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .tt-review-btn{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:20px;font-family:var(--ui);font-size:12px;font-weight:600;padding:6px 13px;cursor:pointer}
  .tt-review-btn:hover{border-color:var(--gold)}
  .tt-review-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tt-review-btn.has{background:var(--gold);color:#111;border-color:var(--gold)}
  .tt-review-btn[aria-disabled="true"]{cursor:default;opacity:.7}
  .tt-sel{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px;align-items:flex-end}
  .tt-selgroup{display:flex;flex-direction:column;gap:5px}
  .tt-sellabel{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .tt-selopts{display:flex;flex-wrap:wrap;gap:5px}
  .tt-opt{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:20px;font-family:var(--ui);font-size:12px;font-weight:600;padding:4px 11px;cursor:pointer}
  .tt-opt:hover{border-color:var(--gold)}
  .tt-opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tt-opt[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold)}
  .tt-select{background:var(--surf2);border:1px solid var(--border);color:var(--fg);border-radius:8px;font-family:var(--ui);font-size:12.5px;font-weight:600;padding:6px 10px;cursor:pointer}
  .tt-select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* character-by-character diff */
  .tt-diff{margin-top:12px;text-align:center;font-weight:400}
  .tt-diffline{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}
  .tt-difflab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:72px;text-align:right}
  .tt-diffrow{display:inline-flex;gap:5px}
  .tt-dc{position:relative;width:calc(34px * var(--ar-scale));min-width:30px;height:calc(40px * var(--ar-scale));min-height:38px;border:1px solid var(--border);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--surf2)}
  .tt-dc .tt-dch{font-family:var(--ar);font-size:calc(20px * var(--ar-scale));color:var(--fg)}
  .tt-dsym{position:absolute;top:-8px;right:-6px;font-size:11px;font-weight:700;font-family:var(--ui);line-height:1;background:var(--card);border-radius:50%;padding:1px 2px}
  .tt-dc.ok{border-color:var(--green)}
  .tt-dc.ok .tt-dsym{color:var(--green)}
  .tt-dc.bad{border:2px solid #d98a8a;background:#3a2626}
  .tt-dc.bad .tt-dsym{color:#e88}
  .tt-dc.exp{border:2px dashed var(--gold)}
  .tt-dc.exp .tt-dsym{color:var(--gold)}
  .tt-dc.extra{border:2px dotted #d98a8a;background:#3a2626}
  .tt-dc.extra .tt-dch{text-decoration:line-through}
  .tt-dc.extra .tt-dsym{color:#e88}
  .tt-dc.gap{border-style:dashed;opacity:.75}
  .tt-diffcap{font-size:calc(12.5px * var(--ui-scale));color:var(--fg);margin-top:8px}
  .tt-difflegend{font-size:11px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;align-items:center}
  .tt-difflegend .tt-dc{width:24px;min-width:24px;height:26px;min-height:26px}
  .tt-difflegend .tt-dch{font-size:13px}
  /* review panel */
  .tt-review{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
  .tt-revhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tt-revh{font-size:15px;font-weight:600;color:var(--fg);margin:0}
  .tt-summary{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:calc(13px * var(--ui-scale));color:var(--fg);line-height:1.7;margin-bottom:12px}
  .tt-summode{color:var(--muted)}
  .tt-mgroup{margin-bottom:12px}
  .tt-mlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tt-mitem{display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-family:var(--ar);font-size:calc(18px * var(--ar-scale))}
  .tt-mcount{font-family:var(--ui);font-size:11px;color:var(--gold);font-weight:700}
  .tt-mrows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .tt-mrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:var(--ar);font-size:calc(18px * var(--ar-scale))}
  .tt-mrow .tt-mgloss{font-family:var(--ui);font-size:12.5px;color:var(--fg)}
  .tt-mrow .tt-mreason{font-family:var(--ui);font-size:11px;color:var(--muted);margin-left:auto}
  .tt-revactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .tt-reviewbanner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--gold);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:calc(13px * var(--ui-scale));color:var(--fg)}
  .tt-reviewbanner .tt-btn{margin-left:auto}
  /* passage typing */
  .tt-target.seg{font-family:var(--ar);font-size:calc(26px * var(--ar-scale));color:var(--fg);direction:rtl;unicode-bidi:isolate;line-height:1.7;word-break:break-word;text-align:center}
  .tt-input.seg{max-width:100%;width:100%;font-size:calc(22px * var(--ar-scale));text-align:right}
  .tt-textarea{width:100%;max-width:100%;min-height:110px;resize:vertical;line-height:1.7;text-align:right;padding:10px 12px}
  .tt-privacy{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  .tt-passmeta{font-size:11.5px;color:var(--muted);margin-bottom:8px;text-align:center}
  .tt-passvar{color:var(--gold)}
  .tt-passref{font-family:var(--ui);font-size:11px;color:var(--gold);border:1px solid var(--border);border-radius:20px;padding:1px 8px;margin-right:4px;white-space:nowrap}
  .tt-passtoggles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
  .tt-btn.small{font-size:11.5px;padding:5px 10px}
  .tt-passfull{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;direction:rtl;font-family:var(--ar);font-size:calc(18px * var(--ar-scale));line-height:2;color:var(--muted)}
  .tt-passfullseg{margin-left:4px}
  .tt-passprog{margin-top:12px;text-align:center;font-family:var(--ui);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .tt-passprog b{color:var(--fg);font-weight:600}
  .tt-passfullseg.cur{color:var(--fg);background:rgba(217,164,65,.15);border-radius:4px;padding:0 3px}
  /* passage column diff — stacked target/typed cells that wrap cleanly, RTL */
  .tt-diffcols{display:flex;flex-wrap:wrap;gap:4px;direction:rtl;justify-content:center;margin:8px 0}
  .tt-dcol{position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;min-width:26px;background:var(--surf2);overflow:visible}
  .tt-dcol .tt-dtop,.tt-dcol .tt-dbot{padding:3px 5px;text-align:center;font-family:var(--ar);font-size:calc(17px * var(--ar-scale));line-height:1.35;unicode-bidi:isolate}
  .tt-dcol .tt-dtop{color:var(--fg);border-bottom:1px solid var(--border)}
  .tt-dcol .tt-dbot{color:var(--muted)}
  .tt-dcsym{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:700;font-family:var(--ui);background:var(--card);border-radius:50%;padding:1px 2px;line-height:1}
  .tt-dcol.ok{border-color:var(--green)}
  .tt-dcol.sub{border-color:#d98a8a}
  .tt-dcol.sub .tt-dbot{color:#e88;text-decoration:line-through}
  .tt-dcol.sub .tt-dcsym{color:#e88}
  .tt-dcol.del{border:2px dashed var(--gold)}
  .tt-dcol.del .tt-dcsym{color:var(--gold)}
  .tt-dcol.ins{border:2px dotted #d98a8a}
  .tt-dcol.ins .tt-dbot{color:#e88;text-decoration:line-through}
  .tt-dcol.ins .tt-dcsym{color:#e88}
  @media (max-width:600px){
    .tt-target.letter{font-size:calc(60px * var(--ar-scale))}
    .tt-target.word{font-size:calc(38px * var(--ar-scale))}
    .tt-target.seg{font-size:calc(22px * var(--ar-scale))}
    .tt-key{width:40px;min-height:42px}
    .tt-difflab{min-width:60px}
    .tt-mrow .tt-mreason{margin-left:0}
    .tt-dcol{min-width:22px}
  }

  /* ── notes ── */
  .compose{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px}
  .compose textarea{width:100%;min-height:68px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;
       color:var(--fg);font-family:'Inter',system-ui,'Noto Naskh Arabic','Traditional Arabic',sans-serif;font-size:14px;
       padding:10px 12px;outline:none;resize:vertical;line-height:1.5}
  .compose textarea:focus{border-color:var(--gold)}
  .compose-row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .n-select{background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--fg);
       font-family:var(--ui);font-size:13px;padding:8px 10px;outline:none}
  .n-select:focus{border-color:var(--gold)}
  .btn{background:var(--gold);border:none;border-radius:8px;color:#111;cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;padding:9px 16px}
  .btn:hover{opacity:.9}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:20px;cursor:pointer;font-family:var(--ui);font-size:12px;padding:5px 12px}
  .chip:hover{color:var(--fg)}
  .chip.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
  .note{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
  .note .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  .note .cat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
  .note .when{font-size:11px;color:var(--muted)}
  .note .body{font-family:'Inter',system-ui,'Noto Naskh Arabic','Traditional Arabic',sans-serif;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .note .actions{display:flex;gap:6px;margin-top:8px}
  .note .actions button{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-family:var(--ui);font-size:11.5px;padding:4px 10px}
  .note .actions button:hover{color:var(--fg);border-color:var(--gold)}
  .note .n-edit{width:100%;min-height:60px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;
       color:var(--fg);font-family:'Inter',system-ui,'Noto Naskh Arabic','Traditional Arabic',sans-serif;font-size:14px;padding:9px 11px;outline:none;resize:vertical;line-height:1.5}
  .note.starter{border-style:dashed}
  .empty{color:var(--muted);font-style:italic;padding:20px 0}
  footer{max-width:960px;margin:0 auto;padding:24px 20px 60px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
  footer b{color:var(--fg)}
  code{background:var(--surf2);color:var(--gold);padding:1px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <span class="title-ar">مصري</span>
  <h1>Masri</h1>
  <span class="sub">Egyptian Arabic — a reference desk. Look it up, read it, done.</span>
  <div class="ds-wrap">
    <button id="ds-btn" class="ds-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="ds-panel" aria-label="Display settings" title="Display settings">Aa</button>
    <div id="ds-panel" class="ds-panel" role="dialog" aria-label="Display settings" aria-modal="false" hidden></div>
  </div>
</header>

<div id="gsearch">
  <input id="gsearch-input" class="search" placeholder="Search the desk…" autocomplete="off" spellcheck="false">
  <div id="gsearch-results"></div>
</div>

<nav id="nav"></nav>
<nav id="subnav" aria-label="Subsection"></nav>

<main>
  <section id="p-sounds"   class="panel"></section>
  <section id="p-alphabet" class="panel"></section>
  <section id="p-symbols"  class="panel"></section>
  <section id="p-word-builder" class="panel"></section>
  <section id="p-test"     class="panel"></section>
  <section id="p-practice" class="panel"></section>
  <section id="p-listening" class="panel"></section>
  <section id="p-grammar"  class="panel"></section>
  <section id="p-verbs"    class="panel"></section>
  <section id="p-numbers"  class="panel"></section>
  <section id="p-time"     class="panel"></section>
  <section id="p-around"   class="panel"></section>
  <section id="p-shopping" class="panel"></section>
  <section id="p-food"     class="panel"></section>
  <section id="p-health"   class="panel"></section>
  <section id="p-people"   class="panel"></section>
  <section id="p-descriptions" class="panel"></section>
  <section id="p-phrases"  class="panel"></section>
  <section id="p-vocab"    class="panel"></section>
</main>

<footer>
  <b>Masri</b> focuses on everyday Egyptian Arabic, primarily Cairene speech. Usage and pronunciation
  vary across Egypt, and Modern Standard Arabic appears only when a contrast is helpful.
</footer>

<!-- reference content (plain JS so it also works on double-click) -->
<script src="data/sounds.js"></script>
<script src="data/alphabet.js"></script>
<script src="data/symbols.js"></script>
<script src="data/listening.js"></script>
<script src="data/typing.js"></script>
<script src="data/passages.js"></script>
<script src="data/grammar.js"></script>
<script src="data/verbs.js"></script>
<script src="data/numbers.js"></script>
<script src="data/time.js"></script>
<script src="data/getting-around.js"></script>
<script src="data/shopping.js"></script>
<script src="data/food.js"></script>
<script src="data/health.js"></script>
<script src="data/people.js"></script>
<script src="data/descriptions.js"></script>
<script src="data/phrases.js"></script>
<script src="data/vocab.js"></script>
<script>
const M = window.MASRI || {};
const TAT = 'ـ'; // tatweel (kashida) for showing joined letter shapes
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const GROUPS = [
  { id:'g-sounds',   label:'Sounds & Alphabet', sections:['alphabet','symbols','sounds'] },
  // Practice consolidates the twelve former topic sections. Its landing section
  // is the `practice` dashboard (cards navigate to the rest); `dashboard` flags
  // the group so the subnav shows a compact Back / Prev / Next bar instead of a
  // crowded 13-button row.
  { id:'g-practice', label:'Practice',          dashboard:'practice',
    sections:['practice','listening','grammar','verbs','numbers','time','around','shopping','food','health','people','descriptions','phrases','vocab'] },
  // Type: moving from recognizing letters to physically typing Arabic. Test (the
  // practice modes) is the default landing section; Word Builder (the existing panel,
  // unchanged) is second.
  { id:'g-type',     label:'Type',              sections:['test','word-builder'] },
];
const SECTION_LABEL = {
  sounds:'Sounds', alphabet:'Alphabet', symbols:'Symbols', 'word-builder':'Word Builder',
  practice:'Practice', listening:'Listening & Speaking',
  grammar:'Grammar', verbs:'Verbs',
  numbers:'Numbers', time:'Time & Days', around:'Getting Around', shopping:'Money & Shopping',
  food:'Food & Ordering', health:'Health & Emergencies', people:'People & Small Talk',
  descriptions:'Colors & Descriptions', phrases:'Phrases', vocab:'Vocabulary',
  test:'Test',
};
const SECTION_GROUP = {};
GROUPS.forEach(g => g.sections.forEach(sid => SECTION_GROUP[sid] = g.id));

/* ── nav ── */
const nav = document.getElementById('nav');
const subnav = document.getElementById('subnav');
const tabBtns = {};
GROUPS.forEach(g => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.textContent = g.label;
  b.setAttribute('role', 'tab');
  b.onclick = () => showGroup(g.id);
  nav.appendChild(b);
  tabBtns[g.id] = b;
});

function showGroup(groupId, sectionId){
  const g = GROUPS.find(x => x.id === groupId); if(!g) return;
  Object.keys(tabBtns).forEach(k => tabBtns[k].classList.toggle('active', k === groupId));
  const sid = (sectionId && g.sections.indexOf(sectionId) >= 0) ? sectionId : g.sections[0];
  buildSubnav(g, sid);
  showSection(sid);
}

function buildSubnav(g, activeSid){
  if(g.dashboard){ buildPracticeSubnav(g, activeSid); return; } // Practice -> dashboard + Back/Prev/Next
  if(g.sections.length <= 1){ subnav.innerHTML = ''; return; }   // single-section group -> no subsections
  subnav.setAttribute('role', 'tablist');
  subnav.innerHTML = g.sections.map(sid =>
    `<button class="subtab${sid===activeSid?' active':''}" role="tab" aria-selected="${sid===activeSid}" data-section="${esc(sid)}">${esc(SECTION_LABEL[sid])}</button>`
  ).join('');
  const btns = Array.prototype.slice.call(subnav.querySelectorAll('.subtab'));
  btns.forEach((b, i) => {
    b.onclick = () => showSection(b.dataset.section);
    b.onkeydown = e => {
      if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        e.preventDefault();
        const nb = btns[(i + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length];
        nb.focus(); showSection(nb.dataset.section);
      }
    };
  });
}

// Practice subnav: on the dashboard, nothing (the cards ARE the navigation).
// Inside a section, a compact bar — Back to the dashboard plus Prev/Next across
// the twelve sections — rather than a crowded row of thirteen subtabs.
function buildPracticeSubnav(g, activeSid){
  const items = g.sections.filter(s => s !== g.dashboard);
  if(activeSid === g.dashboard){ subnav.removeAttribute('role'); subnav.innerHTML = ''; return; }
  const i = items.indexOf(activeSid);
  const prev = items[(i - 1 + items.length) % items.length];
  const next = items[(i + 1) % items.length];
  subnav.removeAttribute('role');
  subnav.innerHTML =
      `<button class="subtab prac-back" data-practice-go="${esc(g.dashboard)}" aria-label="Back to the Practice dashboard">&larr; Practice</button>`
    + `<span class="prac-here" aria-current="page">${esc(SECTION_LABEL[activeSid])}</span>`
    + `<span class="prac-spacer"></span>`
    + `<button class="subtab prac-nav" data-practice-go="${esc(prev)}" aria-label="Previous section: ${esc(SECTION_LABEL[prev])}">&lsaquo; Prev</button>`
    + `<button class="subtab prac-nav" data-practice-go="${esc(next)}" aria-label="Next section: ${esc(SECTION_LABEL[next])}">Next &rsaquo;</button>`;
  subnav.querySelectorAll('[data-practice-go]').forEach(b =>
    b.onclick = () => { activate(b.dataset.practiceGo); window.scrollTo(0, 0); });
}

function showSection(sid){
  // Navigating away from Symbols or Listening must stop any playing clip and reset its
  // button (audio is not tied to panel visibility, so it would otherwise keep playing).
  if(window.MASRI && window.MASRI._symbolAudio) window.MASRI._symbolAudio.stop();
  if(window.MASRI && window.MASRI._listeningAudio) window.MASRI._listeningAudio.stop();
  document.querySelectorAll('main .panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('p-' + sid); if(panel) panel.classList.add('active');
  subnav.querySelectorAll('.subtab').forEach(b => {
    const on = b.dataset.section === sid;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}

function activate(sectionId){
  const gid = SECTION_GROUP[sectionId]; if(gid) showGroup(gid, sectionId);
}

/* ── renderers ── */
function tableEl(headers, rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.map(r=>`<tr>${r.map(c=>{
        const s = String(c);
        const isAr = /[؀-ۿ]/.test(s) && !/[A-Za-z<]/.test(s); // pure-Arabic cell → big + RTL
        return `<td${isAr?' class="ar"':''}>${s}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table>`;
}

// Render a list of independent reference tables (each {title, headers, rows, note})
// as .card-table cards. When there is more than one, wrap them in .tables-2col so
// the desktop lays them two-up (balanced multicol; single column on mobile). Shared
// by Grammar, Verbs, Time, Getting Around, Shopping, Food, Health, People,
// Colors & Descriptions — the sections that previously stacked tables full-width.
function renderTableCards(arr){
  const cards = (arr || []).map(t => `
    <div class="card-table">
      <h3>${esc(t.title)}</h3>
      ${t.note ? `<div class="note" style="padding:10px 14px 0">${t.note}</div>` : ''}
      ${tableEl(t.headers, t.rows)}
    </div>`).join('');
  return (arr && arr.length > 1) ? `<div class="tables-2col">${cards}</div>` : cards;
}

// SOUNDS — grouped Egyptian-Arabic pronunciation reference. Builds from
// window.MASRI.sounds: signature sounds, Cairene shifts, throat & back, emphatic,
// Egyptian r, short/long vowels, and confusable pairs. Compact cards
// keep the key facts visible; longer notes sit in a native <details>. Internal jump
// buttons scroll to anchors (no history, no localStorage).
(function(){
  const d = M.sounds; if(!d) return;
  const panel = document.getElementById('p-sounds');

  // Bold the first occurrence of the target vowel symbol (weight, not colour; no competing spelling).
  function vh(tr, sym){
    const i = String(tr).indexOf(sym);
    if(i < 0) return esc(tr);
    return esc(tr.slice(0, i)) + '<b class="snd-vh">' + esc(sym) + '</b>' + esc(tr.slice(i + sym.length));
  }

  // One sound card. Optional `audio` (a trusted local file) would render a play
  // control; none are set yet, so nothing synthetic is shown.
  function card(c, big){
    let h = `<div class="snd-card${big ? ' snd-big' : ''}">`;
    h += `<div class="snd-head"><span class="snd-glyph ar" dir="rtl">${c.letter}</span>`
       + `<div class="snd-hmeta"><div class="snd-name">${esc(c.name)}</div>`
       + `<div class="snd-line"><span class="snd-sym">${esc(c.sym)}</span> <span class="snd-ipa" dir="ltr">${esc(c.ipa)}</span></div></div></div>`;
    if(c.summary) h += `<div class="snd-sum">${c.summary}</div>`;
    if(c.ex_ar) h += `<div class="snd-ex"><span class="ar" dir="rtl">${c.ex_ar}</span> <span class="tr" dir="ltr">${esc(c.ex)}</span> — ${esc(c.ex_en)}</div>`;
    if(c.audio) h += `<div class="snd-audio"><audio controls preload="none" src="${esc(c.audio)}"></audio></div>`;
    if(c.detail) h += `<details class="snd-more"><summary>More detail</summary><div class="snd-det">${c.detail}</div></details>`;
    return h + `</div>`;
  }
  const grid = (cards, big) => `<div class="snd-grid">` + cards.map(c => card(c, big)).join('') + `</div>`;

  function vowelTable(rows){
    return `<div class="card-table"><table><thead><tr><th>Vowel</th><th>Example</th><th>Masri</th><th>Meaning</th></tr></thead><tbody>`
      + rows.map(v => `<tr><td class="snd-vsym">${esc(v.sym)}</td><td><span class="ar" dir="rtl">${v.ar}</span></td>`
          + `<td><span class="tr" dir="ltr">${vh(v.ex, v.sym)}</span></td><td>${esc(v.en)}${v.note ? ' — ' + v.note : ''}</td></tr>`).join('')
      + `</tbody></table></div>`;
  }

  let h = `<p class="lead">${d.intro}</p>`;

  // jump navigation
  h += `<nav class="snd-jump" aria-label="Sound groups">`
     + d.jump.map(j => `<button class="snd-jbtn" data-anchor="${esc(j.anchor)}">${esc(j.label)}</button>`).join('')
     + `</nav>`;

  // A · Cairene signature + shifts
  h += `<h2 id="snd-cairene">Cairene signature sounds</h2>`;
  h += grid(d.signature, true);
  h += `<h3 class="snd-sub">Common Cairene shifts</h3>`;
  h += `<p class="note">${d.shifts.intro}</p>`;
  h += grid(d.shifts.cards, false);

  // B · Throat & back
  h += `<h2 id="snd-throat">Throat &amp; back sounds</h2>`;
  h += `<p class="note">${d.throat.intro}</p>`;
  h += grid(d.throat.cards, false);

  // C · Emphatic
  h += `<h2 id="snd-emphatic">Emphatic consonants</h2>`;
  h += `<p class="note">${d.emphatic.intro}</p>`;
  h += grid(d.emphatic.cards, false);
  if(d.emphatic.crossref) h += `<p class="note snd-xref">${d.emphatic.crossref}</p>`;

  // D · Egyptian r
  h += `<h2 id="snd-ra">Egyptian ر</h2>`;
  const r = d.ra;
  h += grid([{ letter: r.letter, name: r.name, sym: r.sym, ipa: r.ipa, summary: r.summary, detail: r.detail }], false);
  h += `<div class="card-table"><table><thead><tr><th>Position</th><th>Example</th><th>Meaning</th></tr></thead><tbody>`
     + r.examples.map(e => `<tr><td>${esc(e.pos)}</td><td><span class="ar" dir="rtl">${e.ar}</span> <span class="tr" dir="ltr">${esc(e.ex)}</span></td><td>${esc(e.en)}</td></tr>`).join('')
     + `</tbody></table></div>`;

  // Vowels
  h += `<h2 id="snd-vowels">Vowels</h2>`;
  h += `<p class="note">${d.vowels.intro}</p>`;
  h += `<h3 class="snd-sub">Short vowels</h3>` + vowelTable(d.vowels.short);
  h += `<p class="note">${esc(d.vowels.shortNote)}</p>`;
  h += `<h3 class="snd-sub">Long vowels</h3>` + vowelTable(d.vowels.long);
  h += `<h3 class="snd-sub">Short vs long</h3>`;
  h += `<div class="snd-pairs">` + d.vowels.pairs.map(p =>
      `<div class="snd-pair"><span class="snd-pv">${esc(p.s.sym)}</span> <span class="tr" dir="ltr">${esc(p.s.ex)}</span> <span class="snd-pen">${esc(p.s.en)}</span>`
    + ` <span class="snd-parrow" aria-hidden="true">→</span> `
    + `<span class="snd-pv">${esc(p.l.sym)}</span> <span class="tr" dir="ltr">${esc(p.l.ex)}</span> <span class="snd-pen">${esc(p.l.en)}</span></div>`).join('')
    + `</div>`;

  // Comparisons
  h += `<h2 id="snd-compare">Sounds learners often confuse</h2>`;
  h += `<p class="note">${d.compare.intro}</p>`;
  h += `<div class="snd-grid snd-cmpgrid">` + d.compare.cards.map(c => `
    <div class="snd-cmp">
      <div class="snd-cmprow">
        <span class="snd-cmpside"><span class="snd-glyph ar" dir="rtl">${c.a.L}</span><span class="snd-sym">${esc(c.a.sym)}</span></span>
        <span class="snd-cmpvs" aria-hidden="true">vs</span>
        <span class="snd-cmpside"><span class="snd-glyph ar" dir="rtl">${c.b.L}</span><span class="snd-sym">${esc(c.b.sym)}</span></span>
      </div>
      <div class="snd-cmpnote">${esc(c.note)}</div>
      <div class="snd-cmpex"><span class="ar" dir="rtl">${c.a.ar}</span> <span class="tr" dir="ltr">${esc(c.a.ex)}</span> (${esc(c.a.en)}) · <span class="ar" dir="rtl">${c.b.ar}</span> <span class="tr" dir="ltr">${esc(c.b.ex)}</span> (${esc(c.b.en)})</div>
    </div>`).join('') + `</div>`;

  panel.innerHTML = h;

  // internal jump controls — scroll only, no hash/history
  panel.querySelectorAll('.snd-jbtn').forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById(b.dataset.anchor); if(t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
})();

// ALPHABET — a practical Arabic reading reference: joining, shape families, a full
// alphabetical reference, connection breakers, special forms, and reading marks.
// Builds from window.MASRI.alphabet. Contextual forms are approximated with the
// tatweel (kashida); non-connectors show only Isolated + Final (they never join
// left). Jump buttons scroll to anchors — no history, no localStorage.
(function(){
  const d = M.alphabet; if(!d) return;
  const panel = document.getElementById('p-alphabet');

  // Isolated/Initial/Medial/Final via kashida. Non-connectors get only two real
  // shapes (Isolated, Final) — they do not join the following letter.
  function forms(L, conn){
    return conn
      ? { Isolated: L, Initial: L + TAT, Medial: TAT + L + TAT, Final: TAT + L }
      : { Isolated: L, Final: TAT + L };
  }
  const exLine = (ar, ex, en) => `<div class="alp-ex"><span class="ar" dir="rtl">${ar}</span> <span class="tr" dir="ltr">${esc(ex)}</span> — ${esc(en)}</div>`;

  // Combined intro at the very top: the full alphabet SEQUENCE (right-to-left)
  // immediately followed by the detailed per-letter reference, so they read as one
  // introduction. Each sequence letter jumps to its detailed card below.
  let h = `<h2 id="alp-ref">The Arabic alphabet</h2>`;
  h += `<div class="alp-allrow" dir="rtl" role="list" aria-label="The 28 Arabic letters in order, right to left">`
     + d.letters.map(L => `<button class="alp-allkey ar" dir="rtl" role="listitem" data-anchor="alp-L-${esc(L.letter)}" aria-label="${esc(L.name)} — jump to details">${L.letter}</button>`).join('')
     + `</div>`;
  // Detailed per-letter cards — this IS the alphabetical reference (no separate section).
  h += `<div class="alp-grid">` + d.letters.map(L => {
    const f = forms(L.letter, L.connector);
    const badge = L.connector
      ? `<span class="alp-badge alp-badge-both">connects both sides</span>`
      : `<span class="alp-badge alp-badge-break">breaks after itself</span>`;
    let c = `<div class="alp-card" id="alp-L-${L.letter}">`;
    c += `<div class="alp-chead"><span class="alp-glyph ar" dir="rtl">${L.letter}</span>`
       + `<div class="alp-cmeta"><div class="alp-lname">${esc(L.name)} <span class="ar" dir="rtl">${L.name_ar}</span></div>`
       + `<div class="alp-lsound">${esc(L.sound)}</div>${badge}</div></div>`;
    c += `<div class="alp-forms">` + Object.keys(f).map(k =>
        `<div class="alp-form"><div class="alp-fg ar" dir="rtl">${f[k]}</div><div class="alp-fl">${k}</div></div>`).join('') + `</div>`;
    c += exLine(L.ex_ar, L.ex, L.ex_en);
    if(L.note) c += `<details class="snd-more"><summary>More detail</summary><div class="snd-det">${L.note}</div></details>`;
    return c + `</div>`;
  }).join('') + `</div>`;

  // Secondary reference: a compact 4-item menu, then a collapsed transliteration key
  // and three condensed sections. The detailed cards above are the alphabetical
  // reference, so there is no separate "Alphabetical reference" section here.
  h += `<nav class="alp-jump" aria-label="Alphabet reference sections">`
     + d.jump.filter(j => j.anchor !== 'alp-wb').map(j => `<button class="alp-jbtn" data-anchor="${esc(j.anchor)}">${esc(j.label)}</button>`).join('')
     + `</nav>`;

  // 1 · How to read Masri transliteration (collapsed by default)
  if(d.translit){
    const t = d.translit;
    h += `<details class="alp-translit" id="alp-translit"><summary>${esc(t.title)}</summary><div class="alp-translit-body">`
       + `<div class="card-table alp-translit-tbl"><table><thead><tr><th>Symbol</th><th>Means</th><th>Example</th></tr></thead><tbody>`
       + t.rows.map(r => `<tr><td class="alp-tsym" dir="ltr">${esc(r.sym)}</td><td>${esc(r.means)}</td>`
           + `<td><span class="tr" dir="ltr">${esc(r.ex_tr)}</span> — ${esc(r.ex_en)}</td></tr>`).join('')
       + `</tbody></table></div>`
       + (t.note ? `<p class="note">${esc(t.note)}</p>` : '')
       + `</div></details>`;
  }

  // 2 · Joining and connection breakers (joining rules + the six breakers, combined)
  h += `<h2 id="alp-join">Joining and connection breakers</h2>`;
  h += `<div class="alp-join">`
     + `<ul class="start-list"><li>Arabic runs <b>right to left</b>.</li>`
     + `<li>Most letters connect to the letters before and after them within a word.</li>`
     + `<li>Six letters break the connection after themselves: <span class="ar" dir="rtl">${d.joining.breakers}</span> — they join a letter on their right, but not the next letter on their left.</li></ul>`;
  h += `<div class="alp-formdefs">` + d.joining.forms.map(f => `<div class="alp-fdef"><b>${esc(f.name)}</b> — ${esc(f.desc)}</div>`).join('') + `</div>`;
  h += `<p class="note snd-xref">${esc(d.joining.segmentNote)}</p>`;
  h += `<div class="alp-jex">` + d.joining.examples.map(e =>
      `<div class="alp-jexcard"><div class="alp-jexword ar" dir="rtl">${e.ar}</div><div class="alp-jexmeta"><span class="tr" dir="ltr">${esc(e.ex)}</span> — ${esc(e.en)}</div><div class="alp-jexkind">${esc(e.kind)}</div></div>`).join('') + `</div>`;
  // The six breakers as a compact reference row (names + example) — no repeated explanation.
  h += `<div class="alp-brk">` + d.breakers.letters.map(b =>
      `<div class="alp-brkcard"><span class="alp-glyph ar" dir="rtl">${b.L}</span><div class="alp-brkmeta"><div class="alp-lname">${esc(b.name)}</div>${exLine(b.ex_ar, b.ex, b.ex_en)}</div></div>`).join('') + `</div>`;

  // 3 · Shape families
  h += `<h2 id="alp-families">Shape families</h2>`;
  h += `<p class="note">${esc(d.familiesNote)}</p>`;
  h += `<div class="alp-fams">` + d.families.map(fam => `<div class="alp-fam">`
      + fam.letters.map(x => `<button class="alp-famlet" data-anchor="alp-L-${esc(x.L)}" aria-label="Go to ${esc(x.ex_en)} letter ${esc(x.L)} in the reference">
          <span class="alp-glyph ar" dir="rtl">${x.L}</span>
          <span class="alp-famdots">${esc(x.dots)}</span>
          <span class="alp-famsnd">${esc(x.sound)}</span>
          <span class="alp-famex"><span class="ar" dir="rtl">${x.ex_ar}</span> <span class="tr" dir="ltr">${esc(x.ex)}</span> — ${esc(x.ex_en)}</span>
        </button>`).join('')
      + `</div>`).join('') + `</div>`;

  // 4 · Special forms and reading marks (hamza, tāʾ marbūṭa/maqṣūra/lām-alif, distinctions, marks)
  h += `<h2 id="alp-special">Special forms and reading marks</h2>`;
  const sp = d.special;
  h += `<h3 class="snd-sub">Hamza (ء) and its carriers</h3>`;
  h += `<p class="note">${sp.hamza.intro}</p>`;
  h += `<div class="alp-carriers">` + sp.hamza.carriers.map(c =>
      `<div class="alp-carrier"><span class="alp-glyph ar" dir="rtl">${c.form}</span><div class="alp-carriermeta"><div class="alp-lname">${esc(c.label)}</div>${exLine(c.ex_ar, c.ex, c.ex_en)}</div></div>`).join('') + `</div>`;
  const spCard = (o) => `<div class="alp-spcard"><div class="alp-sphead"><span class="alp-glyph ar" dir="rtl">${o.L}</span><span class="alp-lname">${esc(o.name)}</span></div><div class="alp-spnote">${o.note}</div>${exLine(o.ex_ar, o.ex, o.ex_en)}</div>`;
  h += `<h3 class="snd-sub">Tāʾ marbūṭa · alif maqṣūra · lām-alif</h3>`;
  h += `<div class="alp-spgrid">` + spCard(sp.tamarbuta) + spCard(sp.maqsura) + spCard(sp.lamalif) + `</div>`;
  h += `<h3 class="snd-sub">Useful visual distinctions</h3>`;
  h += `<div class="alp-dist">` + sp.distinctions.map(x =>
