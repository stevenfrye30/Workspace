    } else if(item._type==='passage'){
      card=`<div class="tt-card"><div class="tt-prompt">Type this segment${item.title?' — '+esc(item.title):''}</div><div class="tt-target seg" dir="rtl">${esc(item.target)}</div>`
        +`<label class="tt-prompt" for="tt-ri" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
        +`<input id="tt-ri" class="tt-input seg" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the passage segment">`
        +`<div class="tt-fb" id="tt-rf" role="status" aria-live="polite"></div>`
        +`<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="check">Check</button><button type="button" class="tt-btn" data-a="show">Show answer</button></div></div>`;
    } else {
      const want=KEYMAP[item.ch]?KEYMAP[item.ch].code:null;
      card=`<div class="tt-card"><div class="tt-prompt">Which physical key types this letter?</div><div class="tt-target letter">${esc(item.ch)}</div>`
        +`<div class="tt-fb" id="tt-rf" role="status" aria-live="polite">Click the box, then press the key.</div>`
        +`<div class="tt-capture" id="tt-rcap" tabindex="0" role="button" aria-label="Press the physical key">Press the key…</div>`
        +`<div class="tt-controls"><button type="button" class="tt-btn" data-a="show">Show answer</button></div></div>`;
      card=card; item._want=want;
    }
    body.innerHTML = `<div class="tt-reviewbanner" role="status"><b>Review mode</b> — ${remain} item(s) to master (2 correct each) <button type="button" class="tt-btn" data-a="exit">Exit review</button></div>`
      + card + scoreBar(reviewMode.score);
    body.querySelector('[data-a=exit]').addEventListener('click', exitReview);
    const fb=body.querySelector('#tt-rf'); let done=false;
    function advance(){ render(); }
    if(item._type==='letter' || item._type==='word' || item._type==='passage'){
      const inp=body.querySelector('#tt-ri'), checkBtn=body.querySelector('[data-a=check]'); inp.focus();
      const target = item._type==='letter'?item.ch : item._type==='word'?item.ar : item.target;
      function check(){ if(done){ advance(); return; } const raw=inp.value.trim(); if(!raw) return;
        const good = item._type==='letter' ? (cp(raw).length===1 && raw===target)
                   : item._type==='word' ? (norm(raw)===target)
                   : (passSegNorm(raw,false)===passSegNorm(target,false));
        if(good){ reviewResolve(item,'correct'); done=true; fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct'; checkBtn.textContent='Next'; }
        else { reviewResolve(item,'wrong'); fb.className='tt-fb no';
          fb.innerHTML = item._type==='letter' ? ('You typed: '+arSpan(raw)+' &nbsp; Target: '+arSpan(target))
                       : item._type==='word' ? ('Not quite.'+renderDiff(target, norm(raw)))
                       : ('Not quite.'+renderDiffCols(passSegNorm(target,false), passSegNorm(raw,false)));
          if(item._type==='letter') inp.value=''; inp.focus(); }
        updateScore(reviewMode.score);
      }
      checkBtn.addEventListener('click', check);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
      body.querySelector('[data-a=show]').addEventListener('click', ()=>{ if(done){ advance(); return; } reviewResolve(item,'complete'); done=true; fb.className='tt-fb no'; fb.innerHTML='Answer: '+arSpan(target); checkBtn.textContent='Next'; updateScore(reviewMode.score); });
    } else {
      const cap=body.querySelector('#tt-rcap'); cap.focus();
      const markKey=()=>{};
      cap.addEventListener('keydown', e=>{ if(e.ctrlKey||e.altKey||e.metaKey) return; if(e.key==='Tab') return; if(!KEY_CODES.has(e.code)) return; e.preventDefault(); if(done) return;
        if(e.code===item._want){ reviewResolve(item,'correct'); done=true; fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct — '+esc(codeLabel(item._want))+' key'; updateScore(reviewMode.score); setTimeout(advance,700); }
        else { reviewResolve(item,'wrong'); fb.className='tt-fb no'; fb.innerHTML='That key types '+arSpan(CODE2AR[e.code]||'')+' — try again'; updateScore(reviewMode.score); }
      });
      body.querySelector('[data-a=show]').addEventListener('click', ()=>{ if(done) return; reviewResolve(item,'complete'); done=true; fb.className='tt-fb no'; fb.innerHTML=arSpan(item.ch)+' is on the '+esc(item._want?codeLabel(item._want):'?')+' key'; setTimeout(advance,900); });
    }
  }
  function exitReview(){ reviewMode=null; render(); }

  // Mode 3: Keyboard (reference + physical-key quiz) --------------------------
  function keyboardHtml(highlight){
    const rows=(M.typing&&M.typing.rows)||[];
    return `<div class="tt-kbwrap"><div class="tt-kbd" role="group" aria-label="Windows Arabic 101 layout">`
      + rows.map(row=>`<div class="tt-krow">`+row.map(k=>{
          const cls=['tt-key']; if(k.digit)cls.push('digit'); if(kbView==='ar')cls.push('hideq');
          if(highlight&&highlight.code===k.code)cls.push(highlight.cls);
          return `<div class="${cls.join(' ')}" data-code="${k.code}"><span class="tt-q">${esc(k.q)}</span><span class="tt-ka">${esc(k.ar)}</span></div>`;
        }).join('')+`</div>`).join('')
      +`</div></div>`;
  }
  function renderKeyboard(){
    const layout=(M.typing&&M.typing.layoutName)||'Arabic keyboard';
    let h=reviewBar()+`<div class="tt-kbdbar" role="group" aria-label="Keyboard mode">`
      +`<button type="button" class="tt-btn ${kbTab==='ref'?'primary':''}" data-k="ref" aria-pressed="${kbTab==='ref'}">Reference</button>`
      +`<button type="button" class="tt-btn ${kbTab==='quiz'?'primary':''}" data-k="quiz" aria-pressed="${kbTab==='quiz'}">Key quiz</button>`
      +`<span class="tt-score" style="margin:0 0 0 auto">Layout: <b>${esc(layout)}</b></span></div>`;
    if(kbTab==='ref'){
      h+=`<div class="tt-kbdbar"><span class="tt-prompt" style="margin:0">View</span>`
        +`<button type="button" class="tt-btn ${kbView==='both'?'primary':''}" data-v="both" aria-pressed="${kbView==='both'}">English key + Arabic</button>`
        +`<button type="button" class="tt-btn ${kbView==='ar'?'primary':''}" data-v="ar" aria-pressed="${kbView==='ar'}">Arabic only</button></div>`
        +keyboardHtml(null)
        +`<p class="note">${esc((M.typing&&M.typing.layoutNote)||'')} Shift-layer characters are not shown.</p>`;
      body.innerHTML=h; wireCommon();
    } else {
      const quizItems=ALL_LETTERS.filter(l=>KEYMAP[l.ch]);
      if(!Q.deck) Q.deck=makeDeck(quizItems, x=>x&&x.ch);
      if(!Q.target) Q.target=Q.deck.next();
      const t=Q.target, want=KEYMAP[t.ch].code;
      h+=`<div class="tt-card"><div class="tt-prompt">Which physical key types this letter?</div>`
        +`<div class="tt-target letter">${esc(t.ch)}</div>`
        +`<div class="tt-fb" id="tt-qf" role="status" aria-live="polite">Click the box below, then press the matching key on your keyboard.</div>`
        +`<div class="tt-capture" id="tt-qcap" tabindex="0" role="button" aria-label="Press the physical key for the shown letter">Press the key…</div>`
        +`<div class="tt-controls"><button type="button" class="tt-btn" data-a="skip">Skip</button>`
        +`<button type="button" class="tt-btn" data-a="reveal">Show answer</button>`
        +`<button type="button" class="tt-btn primary" data-a="next" hidden>Next</button></div></div>`
        +scoreBar(Q.score)+keyboardHtml(null);
      body.innerHTML=h; wireCommon();
      const cap=body.querySelector('#tt-qcap'), fb=body.querySelector('#tt-qf'), nextBtn=body.querySelector('[data-a=next]');
      cap.focus();
      const markKey=(code,cls)=>{ const el=body.querySelector('.tt-key[data-code="'+code+'"]'); if(el) el.classList.add(cls); };
      function finish(){ Q.done=true; markKey(want,'correct'); nextBtn.hidden=false; nextBtn.focus(); }
      function nextQ(){ Q.target=Q.deck.next(); Q.done=false; renderKeyboard(); }
      cap.addEventListener('keydown', e=>{
        if(e.ctrlKey||e.altKey||e.metaKey) return;   // never intercept OS/browser shortcuts (incl. Win+Space)
        if(e.key==='Tab') return;
        if(!KEY_CODES.has(e.code)) return;
        e.preventDefault();
        if(Q.done) return;
        if(e.code===want){ bump(Q.score,'correct'); fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct — the <b>'+esc(codeLabel(want))+'</b> key types '+arSpan(t.ch); updateScore(Q.score); finish(); }
        else { bump(Q.score,'wrong'); record('key', t.ch, {ch:t.ch, code:want, q:codeLabel(want)}, 'incorrect'); fb.className='tt-fb no'; fb.innerHTML='That key types '+arSpan(CODE2AR[e.code]||'')+' — try again'; markKey(e.code,'wrong'); updateScore(Q.score);
          const wc=e.code; setTimeout(()=>{ const el=body.querySelector('.tt-key[data-code="'+wc+'"]'); if(el) el.classList.remove('wrong'); }, 450); }
      });
      nextBtn.addEventListener('click', nextQ);
      body.querySelector('[data-a=skip]').addEventListener('click', ()=>{ if(Q.done){ nextQ(); return; } bump(Q.score,'complete'); record('key', t.ch, {ch:t.ch, code:want, q:codeLabel(want)}, 'skipped'); updateScore(Q.score); fb.className='tt-fb no'; fb.innerHTML='It is the <b>'+esc(codeLabel(want))+'</b> key'; finish(); });
      body.querySelector('[data-a=reveal]').addEventListener('click', ()=>{ if(Q.done) return; bump(Q.score,'complete'); record('key', t.ch, {ch:t.ch, code:want, q:codeLabel(want)}, 'revealed'); updateScore(Q.score); fb.className='tt-fb no'; fb.innerHTML=arSpan(t.ch)+' is on the <b>'+esc(codeLabel(want))+'</b> key'; finish(); });
    }
    body.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click', ()=>{ kbTab=b.dataset.k; renderKeyboard(); }));
    body.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click', ()=>{ kbView=b.dataset.v; lsSet('masri-keyboard-view',kbView); renderKeyboard(); }));
  }

  // Mode 4: Passage Typing ---------------------------------------------------
  // Segment-comparison normalization: keep letters + single spaces, drop punctuation
  // and tatweel; in loose mode also drop diacritics/superscript-alef (default). In
  // Quran "exact" mode diacritics are kept. Distinct letters are never folded.
  const PASS_DIA_OPTS = [ {id:'loose',label:'Ignore marks'}, {id:'exact',label:'Exact (with marks)'} ];
  function passSegNorm(s, exact){
    s = String(s);
    s = exact ? s.replace(/ـ/g,'') : s.replace(/[ً-ْٰـ]/g,'');
    s = s.replace(/[.،؛؟!:«»“”"'()\[\]{}…۔٪-٭]/g,' ');
    return s.replace(/\s+/g,' ').trim();
  }
  // Split pasted text into segments on newlines + sentence enders; keep it session-only.
  function splitCustom(text){
    return String(text).split(/\n+|(?<=[.؟!؛])\s+/).map(s=>s.trim()).filter(Boolean).map(s=>({ar:s}));
  }
  // Aligned diff for passages: stacked target/typed column-cells in an RTL flex-wrap
  // row (wraps cleanly for long segments; spaces shown as ␣; state by outline+symbol).
  function renderDiffCols(targetStr, typedStr){
    const spc = x => x===' ' ? '␣' : x;
    const ops = diffOps(cp(targetStr), cp(typedStr));
    const col=(top,bot,state,sym)=>`<div class="tt-dcol ${state}"><span class="tt-dtop">${top==null?'·':arSpan(spc(top))}</span><span class="tt-dbot">${bot==null?'·':arSpan(spc(bot))}</span>${sym?'<span class="tt-dcsym" aria-hidden="true">'+sym+'</span>':''}</div>`;
    const cols = ops.map(o=> o.op==='match'?col(o.t,o.y,'ok','')
        : o.op==='sub'?col(o.t,o.y,'sub','✗')
        : o.op==='del'?col(o.t,null,'del','＋')
        : col(null,o.y,'ins','✗') ).join('');
    const firstBad=ops.find(o=>o.op!=='match');
    let cap='';
    if(firstBad){ const pos=ops.filter((o,idx)=>idx<=ops.indexOf(firstBad)).filter(o=>o.op!=='ins').length;
      if(firstBad.op==='sub') cap=`Position ${pos}: expected ${arSpan(spc(firstBad.t))}, you typed ${arSpan(spc(firstBad.y))}`;
      else if(firstBad.op==='del') cap=`Missing ${arSpan(spc(firstBad.t))} around position ${pos}`;
      else cap=`Extra ${arSpan(spc(firstBad.y))} that isn't in the segment`; }
    return `<div class="tt-diff"><div class="tt-difflab" style="text-align:center;min-width:0">Target (top) vs You typed (bottom) — right to left</div>`
      +`<div class="tt-diffcols" dir="rtl">${cols}</div>`
      +(cap?`<div class="tt-diffcap">${cap}</div>`:'')
      +`<div class="tt-difflegend"><span class="tt-dc ok"><span class="tt-dch">✓</span></span> match · <span class="tt-dc bad"><span class="tt-dsym">✗</span></span> wrong · <span class="tt-dc exp"><span class="tt-dsym">＋</span></span> missing · <span class="tt-dc gap"><span class="tt-dch">␣</span></span> space</div></div>`;
  }
  function passList(){ const arr=(M.passages && M.passages[passCat])||[]; return arr.filter(p=> passDiff==='all' || p.difficulty===passDiff); }
  // Random pick from the CURRENT category + difficulty list only; avoids repeating the
  // passage already on screen unless the filtered list has just one entry.
  function randomPassage(){
    const l=passList(); if(!l.length) return;
    const pool = (l.length>1 && P.passage) ? l.filter(x=>x.id!==P.passage.id) : l;
    P.passage = pool[Math.floor(Math.random()*pool.length)];
    P.seg=0; P.done=false; P.score=newScore(); render();
  }
  function nextPassage(){
    const l=passList(); if(!l.length) return;
    const i=l.findIndex(x=>P.passage && x.id===P.passage.id);
    P.passage = l[(i+1)%l.length]; P.seg=0; P.done=false; P.score=newScore(); render();
  }
  function passProgressInner(){
    return `This session: <b>${PS.passages}</b> passage${PS.passages===1?'':'s'}`
      + ` · <b>${PS.segments}</b> segment${PS.segments===1?'':'s'} · <b>${PS.mistakes}</b> mistake${PS.mistakes===1?'':'s'}`;
  }
  function passProgress(){ return `<div class="tt-passprog">${passProgressInner()}</div>`; }
  // The card is not re-rendered on a wrong answer, so refresh the tally in place.
  function updateProgress(){ const el=body.querySelector('.tt-passprog'); if(el) el.innerHTML=passProgressInner(); }
  function passCatPills(){
    return `<div class="tt-selgroup" role="group" aria-label="Passage category"><span class="tt-sellabel">Category</span><div class="tt-selopts">`
      + PASS_CATS.map(c=> c.available
          ? `<button type="button" class="tt-opt" data-sel="passCat" data-val="${esc(c.id)}" aria-pressed="${c.id===passCat}">${esc(c.label)}</button>`
          : `<button type="button" class="tt-opt" disabled aria-disabled="true" title="${esc(c.note||'Coming soon')}">${esc(c.label)} · soon</button>`
        ).join('') + `</div></div>`;
  }
  function renderPassage(){
    if(!M.passages){ body.innerHTML=reviewBar()+'<p class="note">Passage data unavailable.</p>'; wireCommon(); return; }
    let sel = passCatPills();
    if(passCat!=='custom') sel += pillGroup('passDiff', PASS_DIFFS, passDiff, 'Difficulty');
    if(passCat==='quran')  sel += pillGroup('passDia', PASS_DIA_OPTS, passDia, 'Diacritics');
    const selRow = reviewBar() + `<div class="tt-sel">`+sel+`</div>`;
    if(passCat==='custom'){ renderCustom(selRow); return; }
    const list=passList();
    if(!list.length){ body.innerHTML = selRow + `<p class="note">No passages in this set at this difficulty. Change the filters above.</p>`; wireCommon(); return; }
    if(!P.passage || P.passage.id==='custom' || !list.some(x=>x.id===P.passage.id)){ P.passage=list[0]; P.seg=0; P.done=false; }
    const picker = `<div class="tt-sel"><div class="tt-selgroup"><label class="tt-sellabel" for="tt-passel">Passage</label><select id="tt-passel" class="tt-select">`
      + list.map(p=>`<option value="${esc(p.id)}"${p.id===P.passage.id?' selected':''}>${esc(p.title)} · ${esc(p.difficulty)}</option>`).join('')
      + `</select><button type="button" class="tt-btn small" data-a="randpass">Random passage</button></div></div>`;
    renderSegmentCard(selRow + picker, P.passage.lines, P.passage);
  }
  function renderCustom(prefix){
    if(!P.customLines || !P.customLines.length){
      body.innerHTML = prefix
        + `<div class="tt-card"><div class="tt-prompt">Paste your own Arabic text</div>`
        + `<p class="note tt-privacy">Your text stays in this browser tab only — it is not saved to your device or sent anywhere, and it clears when you reload the page.</p>`
        + `<label class="tt-prompt" for="tt-custom" style="display:block;margin:8px 0 4px">Arabic text</label>`
        + `<textarea id="tt-custom" class="tt-input tt-textarea" dir="rtl" rows="5" autocomplete="off" spellcheck="false" aria-label="Paste Arabic text to practice"></textarea>`
        + `<div class="tt-fb" id="tt-cfb" role="status" aria-live="polite"></div>`
        + `<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="load">Start typing this</button><button type="button" class="tt-btn" data-a="clear">Clear text</button></div></div>`;
      wireCommon();
      const ta=body.querySelector('#tt-custom'), cfb=body.querySelector('#tt-cfb'); ta.focus();
      body.querySelector('[data-a=load]').addEventListener('click',()=>{ const txt=ta.value.trim();
        if(!txt){ cfb.className='tt-fb no'; cfb.textContent='Please paste some Arabic text first.'; return; }
        const lines=splitCustom(txt); if(!lines.length){ cfb.className='tt-fb no'; cfb.textContent='No usable text found.'; return; }
        P.custom=txt; P.customLines=lines; P.passage={ id:'custom', title:'Your text', difficulty:'custom', variety:'Your text', lines }; P.seg=0; P.done=false; P.score=newScore(); render(); });
      body.querySelector('[data-a=clear]').addEventListener('click',()=>{ ta.value=''; P.custom=''; cfb.textContent=''; ta.focus(); });
      return;
    }
    renderSegmentCard(prefix + `<div class="tt-sel"><button type="button" class="tt-btn" data-a="clearcustom">Clear text &amp; paste new</button></div>`, P.customLines, P.passage);
  }
  function renderSegmentCard(prefix, segs, p){
    const n=segs.length, exact = passCat==='quran' && passDia==='exact';
    function wireExtras(){
      const psel=body.querySelector('#tt-passel'); if(psel) psel.addEventListener('change',()=>{ const np=passList().find(x=>x.id===psel.value); if(np){ P.passage=np; P.seg=0; P.done=false; P.score=newScore(); render(); } });
      const cc=body.querySelector('[data-a=clearcustom]'); if(cc) cc.addEventListener('click',()=>{ P.custom=''; P.customLines=null; P.passage=null; P.seg=0; P.score=newScore(); render(); });
      const rp=body.querySelector('[data-a=randpass]'); if(rp) rp.addEventListener('click', randomPassage);
      const np=body.querySelector('[data-a=nextpass]'); if(np) np.addEventListener('click', nextPassage);
    }
    if(P.seg>=n){
      body.innerHTML = prefix + `<div class="tt-card"><div class="tt-prompt">Passage complete</div>`
        + `<p class="note">You finished “${esc(p.title)}” — ${n} segment(s).</p>`
        + passProgress()
        + `<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="restart">Practice again</button>`
        + (passCat!=='custom'?'<button type="button" class="tt-btn" data-a="nextpass">Next passage</button><button type="button" class="tt-btn" data-a="randpass">Random passage</button>':'')
        + `</div></div>`+scoreBar(P.score);
      wireCommon(); wireExtras();
      body.querySelector('[data-a=restart]').addEventListener('click',()=>{ P.seg=0; P.done=false; render(); });
      return;
    }
    const seg=segs[P.seg];
    const ref = (passCat==='quran' && seg.ref) ? ` <span class="tt-passref">${esc(seg.ref)}</span>` : '';
    const hasTr = segs.some(s=>s.tr), hasEn = segs.some(s=>s.en);
    body.innerHTML = prefix
      + `<div class="tt-card">`
      + `<div class="tt-passmeta">${esc(p.title)} · <span class="tt-passvar">${esc(p.variety||'')}</span>${p.source?' · '+esc(p.source):''}</div>`
      + `<div class="tt-prompt">Segment <b>${P.seg+1}</b> of <b>${n}</b>${ref}</div>`
      + `<div class="tt-target seg" dir="rtl">${esc(seg.ar)}</div>`
      + (P.showTr && seg.tr ? `<div class="tt-meaning" dir="ltr">${esc(seg.tr)}</div>` : '')
      + (P.showEn && seg.en ? `<div class="tt-meaning">${esc(seg.en)}</div>` : '')
      + `<div class="tt-passtoggles">`
        + `<button type="button" class="tt-btn small" data-a="togglefull" aria-pressed="${passDisplay==='full'}">${passDisplay==='full'?'Hide full passage':'Show full passage'}</button>`
        + (hasTr?`<button type="button" class="tt-btn small" data-a="toggletr" aria-pressed="${P.showTr}">${P.showTr?'Hide transliteration':'Show transliteration'}</button>`:'')
        + (hasEn?`<button type="button" class="tt-btn small" data-a="toggleen" aria-pressed="${P.showEn}">${P.showEn?'Hide English':'Show English'}</button>`:'')
        + `</div>`
      + (passDisplay==='full'?`<div class="tt-passfull" dir="rtl">`+segs.map((s,i)=>`<span class="tt-passfullseg${i===P.seg?' cur':''}">${esc(s.ar)}</span>`).join(' ')+`</div>`:'')
      + passProgress()
      + `<label class="tt-prompt" for="tt-pi" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
      + `<input id="tt-pi" class="tt-input seg" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type this Arabic segment">`
      + `<div class="tt-fb" id="tt-pf" role="status" aria-live="polite"></div>`
      + `<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="check">Check</button>`
        + `<button type="button" class="tt-btn" data-a="skip">Skip</button>`
        + `<button type="button" class="tt-btn" data-a="show">Show answer</button>`
        + (P.seg>0?`<button type="button" class="tt-btn" data-a="prev">Previous</button>`:'')
        + `</div></div>` + scoreBar(P.score);
    wireCommon(); wireExtras();
    const inp=body.querySelector('#tt-pi'), fb=body.querySelector('#tt-pf'), checkBtn=body.querySelector('[data-a=check]');
    inp.focus();
    const mKey=p.id+'#'+P.seg;
    function recordSeg(reason, typed){ record('passage', mKey, {target:seg.ar, title:p.title, category:passCat, difficulty:p.difficulty, seg:P.seg, passageId:p.id, lastTyped:typed||''}, reason); }
    function advance(){ if(P.seg+1>=n) PS.passages++; P.seg++; P.done=false; render(); }
    function check(){ if(P.done){ advance(); return; } const raw=inp.value.trim(); if(!raw) return;
      if(passSegNorm(raw,exact)===passSegNorm(seg.ar,exact)){ bump(P.score,'correct'); PS.segments++; P.done=true; fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct'; checkBtn.textContent='Next'; }
      else { bump(P.score,'wrong'); PS.mistakes++; recordSeg('incorrect', passSegNorm(raw,exact)); fb.className='tt-fb no'; fb.innerHTML='Not quite — try again.'+renderDiffCols(passSegNorm(seg.ar,exact), passSegNorm(raw,exact)); inp.focus(); }
      updateScore(P.score); updateProgress();
    }
    checkBtn.addEventListener('click', check);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
    body.querySelector('[data-a=skip]').addEventListener('click',()=>{ if(P.done){ advance(); return; } bump(P.score,'complete'); recordSeg('skipped'); updateScore(P.score); fb.className='tt-fb no'; fb.innerHTML='Skipped — it was '+arSpan(seg.ar); P.done=true; checkBtn.textContent='Next'; });
    body.querySelector('[data-a=show]').addEventListener('click',()=>{ if(P.done){ advance(); return; } bump(P.score,'complete'); recordSeg('revealed'); updateScore(P.score); fb.className='tt-fb no'; fb.innerHTML='Answer: '+arSpan(seg.ar)+(seg.tr?' <span dir="ltr">('+esc(seg.tr)+')</span>':''); P.done=true; checkBtn.textContent='Next'; });
    const prev=body.querySelector('[data-a=prev]'); if(prev) prev.addEventListener('click',()=>{ if(P.seg>0){ P.seg--; P.done=false; render(); } });
    body.querySelector('[data-a=togglefull]').addEventListener('click',()=>{ passDisplay=passDisplay==='full'?'hidden':'full'; lsSet('masri-passage-display',passDisplay); render(); });
    const ttr=body.querySelector('[data-a=toggletr]'); if(ttr) ttr.addEventListener('click',()=>{ P.showTr=!P.showTr; render(); });
    const ten=body.querySelector('[data-a=toggleen]'); if(ten) ten.addEventListener('click',()=>{ P.showEn=!P.showEn; render(); });
  }

  render();
})();

// PHRASES + VOCAB share the searchable list layout
function renderList(panelId, groups, groupKey, itemsKey, mapItem, placeholder){
  const panel = document.getElementById(panelId);
  const search = document.createElement('input');
  search.className = 'search';
  search.placeholder = placeholder;
  const body = document.createElement('div');
  panel.appendChild(search);
  panel.appendChild(body);

  function draw(q){
    q = (q || '').trim().toLowerCase();
    let any = false;
    body.innerHTML = groups.map(g => {
      const items = g[itemsKey].filter(it => !q || mapItem.search(it).toLowerCase().includes(q));
      if(!items.length) return '';
      any = true;
      return `<h2>${esc(g[groupKey])}</h2><div class="grid g-list">`
        + items.map(mapItem.html).join('') + `</div>`;
    }).join('');
    if(!any) body.innerHTML = `<p class="empty">Nothing matches “${esc(q)}”.</p>`;
  }
  search.addEventListener('input', () => draw(search.value));
  draw('');
}

if(M.phrases){
  renderList('p-phrases', M.phrases, 'category', 'items', {
    search: it => `${it.ar} ${it.tr} ${it.en}`,
    html: it => `<div class="item">
        <div class="top"><span class="a ar">${it.ar}</span></div>
        <div class="t">${esc(it.tr)}</div>
        <div class="e">${esc(it.en)}</div>
      </div>`,
  }, 'Search phrases — Arabic, transliteration, or English…');
}
if(M.vocab){
  renderList('p-vocab', M.vocab, 'theme', 'words', {
    search: w => `${w.ar} ${w.tr} ${w.en}`,
    html: w => `<div class="item">
        <div class="top"><span class="a ar">${w.ar}</span><span class="t">${esc(w.tr)}</span></div>
        <div class="e">${esc(w.en)}</div>
      </div>`,
  }, 'Search vocabulary — Arabic, transliteration, or English…');
}

// GLOBAL SEARCH — one box that searches across all loaded window.MASRI data.
// Independent of the per-section search boxes in Phrases / Vocabulary / Notes.
(function(){
  const gi = document.getElementById('gsearch-input');
  const box = document.getElementById('gsearch-results');
  if(!gi || !box) return;
  const label = SECTION_LABEL;
  const strip = s => String(s).replace(/<[^>]*>/g, '');
  const recs = [];
  const push = (sec,group,ar,tr,en,note) =>
    recs.push({sec, secLabel: label[sec]||sec, group: group||'', ar: ar||'', tr: tr||'', en: en||'', note: note||''});
  const fromTables = (sec,tables) =>
    (tables||[]).forEach(t => (t.rows||[]).forEach(r => push(sec, t.title, r[0], r[1], r[2], strip(t.note||''))));

  ['verbs','time','around','shopping','food','health','people','descriptions']
    .forEach(k => { if(M[k] && M[k].tables) fromTables(k, M[k].tables); });
  if(Array.isArray(M.grammar)) fromTables('grammar', M.grammar);
  if(Array.isArray(M.phrases)) M.phrases.forEach(c => (c.items||[]).forEach(it => push('phrases', c.category, it.ar, it.tr, it.en, it.note)));
  if(Array.isArray(M.vocab))   M.vocab.forEach(t => (t.words||[]).forEach(w => push('vocab', t.theme, w.ar, w.tr, w.en, '')));
  if(M.sounds){
    (M.sounds.consonants||[]).forEach(c => push('sounds','Sounds', c.letter, c.name, c.egyptian + (c.approx?' · '+c.approx:''), strip(c.note||'')));
    if(M.sounds.vowels) (M.sounds.vowels.rows||[]).forEach(v => push('sounds','Sounds · vowels', v.ex_ar, v.ex, v.sound+' — '+v.gloss, ''));
  }
  if(M.alphabet) (M.alphabet.letters||[]).forEach(l => push('alphabet','Alphabet', l.letter, l.name, l.sound, strip(l.note||'')));
  if(M.numbers) ['ones','teens','tens'].forEach(g => (M.numbers[g]||[]).forEach(n => push('numbers','Numbers', n.ar, n.tr, String(n.n), n.digit)));
  if(M.listening){
    const tl = {}; (M.listening.topics||[]).forEach(t => tl[t.id] = t.label);
    (M.listening.phrases||[]).forEach(p => push('listening', (tl[p.topic]||p.topic), p.arabic, p.transliteration, p.english, ''));
    (M.listening.dialogues||[]).forEach(dl => (dl.lines||[]).forEach(ln => push('listening', dl.title, ln.arabic, ln.transliteration, ln.english, '')));
  }

  // Beginner-friendly normalization: lowercase, strip Latin diacritics via NFD
  // (ā→a, ḥ→h, ṣ→s, ṭ→t, ḍ→d, ẓ→z, ī→i, ū→u, ē→e, ō→o), Arabic tashkeel, and the
  // ʿ / ʾ marks. Digraphs kh / gh / sh are plain ASCII and stay as typed.
  function norm(s){
    return String(s).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')            // Latin combining diacritics
      .replace(/[ؗ-ًؚ-ْٰـ]/g, '') // Arabic tashkeel + tatweel
      .replace(/[ʿʾʔʕˤʼʻ‘’`']/g, '') // ayn / hamza marks
      .normalize('NFC')
      .replace(/[آأإ]/g, 'ا')   // aa/alef-hamza forms -> alef
      .replace(/ؤ/g, 'و')                   // waw-hamza -> waw
      .replace(/ئ/g, 'ي')                   // ya-hamza -> ya
      .replace(/ى/g, 'ي')                   // alef maqsura -> ya
      .replace(/ة/g, 'ه')                   // ta marbuta -> ha
      .replace(/ـ/g, '');                         // tatweel
  }
  recs.forEach(r => { r._ar=norm(r.ar); r._tr=norm(r.tr); r._en=norm(r.en); r._group=norm(r.group); r._note=norm(r.note); });

  // Search-only aliases: common beginner romanizations mapped to the entries they should
  // find. Matched by the query but NEVER displayed — they do not touch the shown Arabic,
  // transliteration, or English. Targeted (not a global doubled-consonant collapse, which
  // would merge distinct geminated words and still miss the o/u and vowel cases).
  const ALIAS_RULES = [
    { has: t => t.includes('ezzayyak') || t.includes('ezzayyik'), add: 'ezayak izzayak ezzayak ezayk ezzayik' }, // how are you
    { has: t => t.includes('ezzāy'), add: 'ezay ezzay izzay ezai' },   // how
    { has: t => t.includes('shukr'), add: 'shokran shukr shokr' },     // thanks
    { has: t => t.includes('menēn'), add: 'mneen mnen mineen menen' }, // where from
    { has: t => t.includes('ahlan'), add: 'hello' }                    // everyday hello
  ];
  recs.forEach(r => { let a=''; ALIAS_RULES.forEach(rule => { if(rule.has(r.tr)) a += ' '+rule.add; }); r._alias = norm(a); });

  // Relevance score for a record against a normalized query.
  // exact ar/tr/en > starts-with > substring > title/category > note-only.
  function score(r, nq){
    let s = 0;
    if(r._ar === nq)         s = Math.max(s, 100);
    if(r._tr === nq)         s = Math.max(s, 95);
    if(r._en === nq)         s = Math.max(s, 90);
    if(r._ar.startsWith(nq)) s = Math.max(s, 75);
    if(r._tr.startsWith(nq)) s = Math.max(s, 73);
    if(r._en.startsWith(nq)) s = Math.max(s, 71);
    if(r._ar.includes(nq))   s = Math.max(s, 55);
    if(r._tr.includes(nq))   s = Math.max(s, 53);
    if(r._en.includes(nq))   s = Math.max(s, 51);
    if(r._alias && r._alias.includes(nq)) s = Math.max(s, 60);   // beginner-spelling aliases (search-only)
    if(r._group.includes(nq))s = Math.max(s, 30);
    if(r._note.includes(nq)) s = Math.max(s, 10);
    return s;
  }

  const MAX = 60;
  function run(q){
    q = q.trim();
    if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
    const nq = norm(q);
    const scored = [];
    for(const r of recs){ const sc = score(r, nq); if(sc > 0) scored.push({r, sc}); }
    scored.sort((a,b) => b.sc - a.sc);        // stable sort → ties keep original order
    const res = scored.map(x => x.r);
    box.classList.add('show');
    if(!res.length){ box.innerHTML = `<div class="gres-empty">No results for “${esc(q)}”.</div>`; return; }
    const shown = res.slice(0, MAX);
    box.innerHTML = `<div class="gres-count">${res.length} result${res.length!==1?'s':''}${res.length>MAX?` (showing ${MAX})`:''}</div>`
      + shown.map(r => `<button class="gres" data-sec="${esc(r.sec)}">
          <div class="where">${esc(r.secLabel)}${r.group?' · '+esc(r.group):''}</div>
          ${r.ar?`<span class="ar">${esc(r.ar)}</span>`:''}${r.tr?`<span class="tr">${esc(r.tr)}</span>`:''}
          ${r.en?`<div class="en">${esc(r.en)}</div>`:''}
          ${r.note?`<div class="snip">${esc(r.note)}</div>`:''}
        </button>`).join('');
    box.querySelectorAll('.gres').forEach(b => b.onclick = () => {
      activate(b.dataset.sec); box.classList.remove('show'); gi.value=''; window.scrollTo(0,0);
    });
  }
  gi.addEventListener('input', () => run(gi.value));
  gi.addEventListener('keydown', e => { if(e.key==='Escape'){ gi.value=''; run(''); } });
})();

// DISPLAY SETTINGS — a header "Aa" popover adjusting text/Arabic size, text/Arabic
// colour, and the Arabic font by setting CSS custom properties on <html>. Choices
// persist in localStorage ('masri-display') and are re-applied on load. No external
// fonts, no dependencies. Keyboard accessible (Escape closes, focus managed);
// clicking outside closes. Applying centrally via CSS variables means the existing
// renderers need no changes.
(function(){
  const btn = document.getElementById('ds-btn');
  const panel = document.getElementById('ds-panel');
  if(!btn || !panel) return;
  const root = document.documentElement;
  const KEY = 'masri-display';

  const FONTS = {
    default: "'Noto Naskh Arabic','Traditional Arabic','Amiri','Times New Roman',serif",
    trad:    "'Traditional Arabic','Noto Naskh Arabic','Amiri',serif",
    clean:   "'Segoe UI','Tahoma','Arial','Noto Sans Arabic',sans-serif"
  };
  const CTRL = [
    { id:'ui',  label:'General text size', def:'default',
      opts:[['smaller','Smaller'],['default','Default'],['larger','Larger'],['xl','Extra large']],
      map:{smaller:'0.9',default:'1',larger:'1.12',xl:'1.28'} },
    { id:'ar',  label:'Arabic text size', def:'default',
      opts:[['default','Default'],['large','Large'],['xl','Extra large'],['max','Maximum']],
      map:{default:'1.14',large:'1.32',xl:'1.5',max:'1.75'} },
    { id:'fg',  label:'General text color', def:'default',
      opts:[['default','Default'],['contrast','High contrast'],['soft','Soft']] },
    { id:'arc', label:'Arabic text color', def:'default',
      opts:[['default','Default'],['white','White'],['gold','Gold'],['blue','Blue'],['green','Green']],
      map:{default:'var(--fg)',white:'#ffffff',gold:'#e8c15a',blue:'#7cc0ef',green:'#7fd6a6'} },
    { id:'arf', label:'Arabic font', def:'default',
      opts:[['default','Site default'],['trad','Traditional Arabic'],['clean','Clean Arabic']] }
  ];
  const byId = {}; CTRL.forEach(c => byId[c.id] = c);
  const DEFAULTS = {}; CTRL.forEach(c => DEFAULTS[c.id] = c.def);

  function load(){
    let s = {};
    try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){}
    const out = {}; CTRL.forEach(c => out[c.id] = (c.opts.some(o => o[0] === s[c.id]) ? s[c.id] : c.def));
    return out;
  }
  let state = load();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function apply(){
    root.style.setProperty('--ui-scale', byId.ui.map[state.ui]);
    root.style.setProperty('--ar-scale', byId.ar.map[state.ar]);
    root.style.setProperty('--ar-color', byId.arc.map[state.arc]);
    root.style.setProperty('--ar', FONTS[state.arf] || FONTS.default);
    if(state.fg === 'contrast'){ root.style.setProperty('--fg','#ffffff'); root.style.setProperty('--muted','#c2ccdd'); }
    else if(state.fg === 'soft'){ root.style.setProperty('--fg','#c6cedb'); root.style.setProperty('--muted','#828da3'); }
    else { root.style.removeProperty('--fg'); root.style.removeProperty('--muted'); }
  }

  function syncPressed(){
    panel.querySelectorAll('.ds-opt').forEach(b =>
      b.setAttribute('aria-pressed', String(state[b.dataset.ctrl] === b.dataset.val)));
  }
  function buildPanel(){
    let h = `<div class="ds-h">Display</div>`;
    h += CTRL.map(c =>
      `<div class="ds-group" role="group" aria-label="${esc(c.label)}"><div class="ds-glabel">${esc(c.label)}</div><div class="ds-opts">`
      + c.opts.map(o => `<button type="button" class="ds-opt" data-ctrl="${c.id}" data-val="${o[0]}" aria-pressed="${state[c.id]===o[0]}">${esc(o[1])}</button>`).join('')
      + `</div></div>`).join('');
    h += `<div class="ds-foot"><button type="button" class="ds-reset" id="ds-reset">Reset to defaults</button></div>`;
    panel.innerHTML = h;
    panel.querySelectorAll('.ds-opt').forEach(b => b.addEventListener('click', () => {
      state[b.dataset.ctrl] = b.dataset.val; save(); apply(); syncPressed();
    }));
    document.getElementById('ds-reset').addEventListener('click', () => {
      state = Object.assign({}, DEFAULTS); save(); apply(); syncPressed();
    });
  }

  function onKey(e){ if(e.key === 'Escape'){ e.preventDefault(); closePanel(true); } }
  function onOutside(e){ if(!panel.contains(e.target) && e.target !== btn){ closePanel(false); } }
  function openPanel(){
    panel.hidden = false; btn.setAttribute('aria-expanded','true');
    const first = panel.querySelector('.ds-opt'); if(first) first.focus();
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('mousedown', onOutside, true);
  }
  function closePanel(focusBtn){
    panel.hidden = true; btn.setAttribute('aria-expanded','false');
    document.removeEventListener('keydown', onKey, true);
    document.removeEventListener('mousedown', onOutside, true);
    if(focusBtn) btn.focus();
  }
  btn.addEventListener('click', () => { panel.hidden ? openPanel() : closePanel(true); });

  buildPanel();
  apply();   // re-apply saved preferences on load
})();

// open first panel
showGroup('g-sounds');   // open on Sounds & Alphabet, Alphabet active by default
</script>
</body>
</html>
