      `<div class="alp-distcard"><div class="alp-distpair"><span class="alp-glyph ar" dir="rtl">${x.a}</span><span class="snd-cmpvs" aria-hidden="true">vs</span><span class="alp-glyph ar" dir="rtl">${x.b}</span></div><div class="alp-distnote">${esc(x.note)}</div></div>`).join('') + `</div>`;
  h += `<h3 class="snd-sub">Reading marks</h3>`;
  h += `<p class="note">${esc(d.marks.intro)}</p>`;

     + d.marks.rows.map(m => `<tr><td class="alp-mark ar" dir="rtl">ـ${m.mark}</td><td>${esc(m.name)} <span class="ar" dir="rtl">${m.name_ar}</span></td><td>${esc(m.desc)}</td><td class="alp-markdemo"><span class="ar" dir="rtl">${m.demo.split(' = ')[0]}</span>${m.demo.indexOf(' = ')>=0 ? ' = <span class="tr" dir="ltr">'+esc(m.demo.split(' = ')[1])+'</span>' : ''}</td></tr>`).join('')
     + `</tbody></table></div>`;
  h += `<p class="note snd-xref">${esc(d.marks.tanwin)}</p>`;

// SYMBOLS — Arabic phoneme ⇄ IPA ⇄ English ⇄ letter reference, presented as one
// table split across two coordinated panels (they share column structure and
// stack on mobile). Builds from window.MASRI.symbols. Clicking an IPA or Arabic
// cell copies that symbol (clipboard API with an execCommand fallback for file://).
// Only the Arabic column and the example word carry RTL — IPA / English stay LTR.
(function(){
  const d = M.symbols; if(!d) return;
  const panel = document.getElementById('p-symbols'); if(!panel) return;

  function copyText(text, el){
    const flash = () => { el.classList.add('copied'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('copied'), 450); };
    const fallback = () => { try {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); flash();
    } catch(e){} };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(flash, fallback);
    else fallback();
  }

  const ipaSymbol = s => String(s).replace(/^\/|\/$/g, '');   // /dʒ/ -> dʒ for copying

  // Symbols audio. Consonants + short vowels play a formal IPA phonetic-sample clip
  // (Wikimedia Commons — see audio/ipa/CREDITS.md): the REFERENCE sound, NOT an Egyptian
  // recording of the example word (the Masri notes stay visible where Egyptian differs).
  // No isolated IPA long-vowel clip that demonstrates duration exists on Commons, so the
  // long vowels /iː/ and /aː/ instead play a native Arabic recording of the example word
  // (which holds the long vowel) so the length is audible in context. /uː/ has no example-
  // word recording yet (فول), so it plays the /u/ *quality* clip with an honest "length
  // pending" note. Diphthongs have no single clip. The 36 verified rows are untouched.
  const IPA_TAG = { '/b/':'b','/t/':'t','/d/':'d','/tˤ/':'t-emphatic','/dˤ/':'d-emphatic','/k/':'k','/q/':'q','/ʔ/':'hamza',
    '/m/':'m','/n/':'n','/f/':'f','/θ/':'th','/ð/':'dh','/ðˤ/':'dh-emphatic','/s/':'s','/sˤ/':'s-emphatic','/z/':'z',
    '/ʃ/':'sh','/x/':'kh','/ɣ/':'gh','/ħ/':'h-pharyngeal','/ʕ/':'ayn','/h/':'h','/dʒ/':'j','/l/':'l','/r/':'r','/j/':'y','/w/':'w',
    '/i/':'i','/u/':'u','/a/':'a' };
  // Long vowels → native Arabic example-word recording (Shtooka Project, CC BY 3.0 US).
  const WORD_CLIP = { '/iː/': { file:'ex-kibir.ogg', word:'كبير', tr:'kibīr' },
                      '/aː/': { file:'ex-bab.ogg',   word:'باب',  tr:'bāb'   } };
  const QUALITY_HOLD = new Set(['/uː/']);   // plays the /u/ quality; a dedicated long /uː/ clip is still being sourced
  const NO_CLIP = new Set(['/aj/','/aw/']); // diphthongs: no single IPA reference clip
  const audioBase = (d.audio && d.audio.base) || 'audio/ipa/';
  const audioReady = !!(d.audio && d.audio.ready);

  function playBtnHtml(r){
    const ipa = esc(r.ipa);
    if(NO_CLIP.has(r.ipa)) return `<span class="sym-noclip" title="A diphthong is a vowel sequence, so the IPA chart has no single reference clip">no single IPA clip</span>`;
    const word = WORD_CLIP[r.ipa], hold = QUALITY_HOLD.has(r.ipa);
    let src, aria, title, note = '';
    if(word){
      src = audioBase + word.file;
      aria = `Hear the long vowel ${ipa} in the native Arabic recording of the example word ${word.word} (${word.tr}) — heard in context, as no isolated IPA long-vowel clip exists`;
      title = `Example word ${word.word} (${word.tr}) — long ${ipa} in context`;
    } else if(hold){
      src = audioBase + 'ipa-' + IPA_TAG['/u/'] + '.ogg';
      aria = `Hear the ${ipa} vowel quality — a dedicated long-vowel recording is still being sourced`;
      title = `${ipa}: vowel quality only (dedicated long clip pending)`;
      note = ` <span class="sym-holdnote" title="No dedicated long /uː/ recording is available yet; this plays the vowel quality only">length pending</span>`;
    } else {
      const tag = IPA_TAG[r.ipa]; if(!tag) return '';
      src = audioBase + 'ipa-' + tag + '.ogg';
      aria = `Hear phoneme ${ipa} — the formal IPA reference sound (not the Egyptian pronunciation of the word)`;
      title = `IPA reference sound ${ipa}`;
    }
    if(!audioReady) return `<button type="button" class="sym-play unavailable" aria-disabled="true" aria-label="${ipa} — audio unavailable"><span class="sym-play-ico" aria-hidden="true">🔇</span><span class="sym-play-lbl">Hear ${ipa}</span></button>`;
    return `<button type="button" class="sym-play" data-audio="${esc(src)}" data-ipa="${ipa}" aria-pressed="false" aria-label="${aria}" title="${title}"><span class="sym-play-ico" aria-hidden="true">►</span><span class="sym-play-lbl">Hear ${ipa}</span></button>${note}`;
  }

  function rowHtml(r){
    const masri = r.masri ? `<span class="sym-masri">${esc(r.masri)}</span>` : '';
    return `<tr class="sym-row">`
      + `<td class="sym-ex"><span class="ar" dir="rtl">${esc(r.ar)}</span> <span class="tr" dir="ltr">${esc(r.tr)}</span> <span class="gloss">· ${esc(r.gloss)}</span> ${playBtnHtml(r)}</td>`
      + `<td><span class="sym-ipa" data-copy="${esc(ipaSymbol(r.ipa))}" title="Copy IPA symbol" role="button" aria-label="Copy IPA ${esc(ipaSymbol(r.ipa))}">${esc(r.ipa)}</span></td>`
      + `<td class="sym-en">${esc(r.eng)}${masri}</td>`
      + `<td><span class="sym-ar" data-copy="${esc(r.letter)}" title="Copy Arabic" role="button" aria-label="Copy Arabic letter">${esc(r.letter)}</span></td>`
      + `</tr>`;
  }

  function panelHtml(p){
    const head = `<thead><tr>`
      + `<th class="sym-h-ex">${esc(d.columns[0])}</th>`
      + `<th class="sym-h-ipa">${esc(d.columns[1])}</th>`
      + `<th class="sym-h-en">${esc(d.columns[2])}</th>`
      + `<th class="sym-h-ar">${esc(d.columns[3])}</th></tr></thead>`;
    const body = p.groups.map(g =>
      `<tbody><tr class="sym-grouprow"><td colspan="4">${esc(g.label)}</td></tr>`
      + g.rows.map(rowHtml).join('') + `</tbody>`).join('');
    return `<div class="sym-panel"><div class="sym-scroll"><table class="sym-table">`
      + `<colgroup><col class="sym-c-ex"><col class="sym-c-ipa"><col class="sym-c-en"><col class="sym-c-ar"></colgroup>`
      + head + body + `</table></div></div>`;
  }

  // No introductory paragraph — the tab opens directly with the short copy/audio hint
  // and the chart. The full "About the audio" note sits below the chart as a quiet
  // reference (see after the audio-status region).
  let h = `<p class="sym-copyhint">Tap any <b style="color:var(--green)">IPA symbol</b> or <b style="color:var(--gold)">Arabic letter</b> to copy it`
     + (audioReady ? `, or <b style="color:var(--gold)">Hear /…/</b> to play the reference sound for that row.` : `.`) + `</p>`;
  h += `<div class="sym-wrap">` + d.panels.map(panelHtml).join('') + `</div>`;
  h += `<div class="sym-audiostatus" id="sym-audiostatus" role="status" aria-live="polite"></div>`;
  if(audioReady) h += `<p class="sym-refnote"><b>About the audio:</b> most clips are the phoneme’s formal <b>IPA reference sound</b> (not an Egyptian recording of the example word). The <b>long vowels</b> /iː/ and /aː/ instead play a native Arabic recording of the example word (كبير, باب) so you can hear the length in context; a dedicated long /uː/ clip is still being sourced, so /uː/ currently plays the /u/ quality (“length pending”). Where Egyptian (Masri) differs — ج, ق, ث, ذ, ظ, and the diphthongs — the small “Masri:” note beside the row is the sound Egyptians actually use. Diphthongs (/aj/, /aw/) are a vowel sequence, so the chart has no single clip for them. Audio: Wikimedia Commons — IPA phonetic samples (CC BY-SA 3.0 / Public Domain) and Shtooka Project example words (CC BY 3.0 US); see <a href="audio/ipa/CREDITS.md">full credits</a>.</p>`;
  panel.innerHTML = h;

  panel.querySelectorAll('.sym-ipa, .sym-ar').forEach(el =>
    el.addEventListener('click', () => copyText(el.dataset.copy, el)));

  // Shared audio controller: one reusable Audio, only one clip at a time, no autoplay,
  // no preload. State is shown by icon + aria-pressed + a pulse (not colour alone). A
  // missing/unplayable file marks that button unavailable and announces it.
  const statusEl = panel.querySelector('#sym-audiostatus');
  const say = m => { if(statusEl) statusEl.textContent = m; };
  let audio = null, curBtn = null;
  const ico = (b,t) => { const s=b.querySelector('.sym-play-ico'); if(s) s.textContent=t; };
  function resetBtn(b){ if(!b) return; b.classList.remove('playing'); b.setAttribute('aria-pressed','false'); ico(b,'►'); b.setAttribute('aria-label','Hear phoneme '+b.dataset.ipa+' — the formal IPA reference sound (not the Egyptian pronunciation of the word)'); }
  function markUnavailable(b){ b.classList.remove('playing'); b.classList.add('unavailable'); b.setAttribute('aria-disabled','true'); b.setAttribute('aria-pressed','false'); ico(b,'🔇'); b.setAttribute('aria-label','IPA reference sound '+b.dataset.ipa+' — audio not available'); }
  function stop(){ try{ if(audio) audio.pause(); }catch(e){} if(curBtn){ resetBtn(curBtn); curBtn=null; } }
  function play(b){
    if(b.getAttribute('aria-disabled')==='true'){ say('The IPA reference sound for '+b.dataset.ipa+' isn’t available.'); return; }
    if(curBtn===b){ stop(); return; }         // clicking the active button again pauses it
    stop(); say('');
    if(!audio){ audio=new Audio(); audio.addEventListener('ended', ()=>{ if(curBtn){ resetBtn(curBtn); curBtn=null; } }); }
    audio.onerror = ()=>{ if(curBtn===b) curBtn=null; markUnavailable(b); say('The IPA reference sound for '+b.dataset.ipa+' isn’t available.'); };
    audio.src = b.dataset.audio;
    curBtn=b; b.classList.add('playing'); b.setAttribute('aria-pressed','true'); ico(b,'❚❚'); b.setAttribute('aria-label','Stop the IPA reference sound for '+b.dataset.ipa);
    const pr = audio.play();
    if(pr && pr.catch) pr.catch(()=>{ if(curBtn===b) curBtn=null; markUnavailable(b); say('Couldn’t play the IPA reference sound for '+b.dataset.ipa+'.'); });
  }
  panel.querySelectorAll('.sym-play').forEach(b => b.addEventListener('click', () => play(b)));
  // Expose the controller for verification/testing (no data, no side effects on load).
  window.MASRI._symbolAudio = { play, stop, get current(){ return curBtn; } };
})();

// LISTENING & SPEAKING — beginner listen/speak practice inside the Practice tab.
// Five modes (reveal, choose, shadow, respond, dialogues) over an original Cairene
// phrase library + 8 mini-dialogues (data/listening.js). One shared audio controller
// (one clip at a time, replay, stop-on-leave via showSection, error-announced, no
// autoplay/preload). When no native recordings exist (audioReady=false) the UI shows a
// clear "recording unavailable" state and never requests a file. Session progress is
// in-memory only (resets on reload); only harmless prefs (mode/topic/display) persist.
(function(){
  const panel = document.getElementById('p-listening');
  const D = M.listening;
  if(!panel || !D) return;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const audioReady = !!D.audioReady;
  const audioBase = D.audioBase || 'audio/listening/';
  const TOPICS = D.topics || [], PHRASES = D.phrases || [], DIALOGUES = D.dialogues || [];
  const topicLabel = id => (TOPICS.find(t => t.id === id) || {}).label || id;

  const pref = (k,d) => { try{ const v = localStorage.getItem('masri-listening-'+k); return v==null?d:v; }catch(e){ return d; } };
  const setPref = (k,v) => { try{ localStorage.setItem('masri-listening-'+k, v); }catch(e){} };

  const MODES = [['reveal','Listen & reveal'],['choose','Listen & choose'],['shadow','Shadow & repeat'],['respond','Respond out loud'],['dialogue','Mini-dialogues']];
  const MODE_DESC = {
    reveal:'Play the phrase, then reveal the Arabic, transliteration, and English one at a time.',
    choose:'Play the phrase and pick its English meaning. Wrong answers don’t advance; the answer is explained once you get it.',
    shadow:'See and hear the phrase, then repeat it aloud. No automatic pronunciation scoring — this is practice.',
    respond:'Read the prompt, answer out loud, then reveal a natural Egyptian response.',
    dialogue:'Choose a role and work through a short everyday conversation one line at a time.'
  };

  const S = {
    mode: MODES.some(m => m[0] === pref('mode','')) ? pref('mode','') : 'reveal',
    topic: 'all',
    display: ['both','tr','en','none'].indexOf(pref('display','both'))>=0 ? pref('display','both') : 'both',
    ri:0, ci:0, si:0, pi:0,
    revealed:{}, resp:{},
    chooseFor:null, chooseOpts:null, chooseAnswered:false, chooseWrong:false,
    completed:new Set(), practiced:new Set(),
    correct:0, total:0, streak:0, best:0,
    dlgId:(DIALOGUES[0]||{}).id||null, dlgRole:'A', dlgStep:0, dlgReveal:false, dlgShowAll:false, dlgDone:new Set()
  };
  { const t = pref('topic','all'); S.topic = (t==='all' || TOPICS.some(x=>x.id===t)) ? t : 'all'; }

  const filtered = () => S.topic==='all' ? PHRASES : PHRASES.filter(p => p.topic===S.topic);
  const clearCard = () => { S.revealed={}; S.resp={}; S.chooseFor=null; S.chooseOpts=null; S.chooseAnswered=false; S.chooseWrong=false; S.dlgReveal=false; };
  const bumpStreak = () => { S.streak++; if(S.streak>S.best) S.best=S.streak; };

  // ── shared audio controller ───────────────────────────────────────────────
  let audio=null, curBtn=null;
  const announce = m => { const el=panel.querySelector('#ls-status'); if(el) el.textContent = m||''; };
  function resetPlay(b){ if(!b) return; b.classList.remove('playing'); b.setAttribute('aria-pressed','false'); const l=b.querySelector('.ls-btn-lbl'); if(l) l.textContent=b.dataset.playlabel||'Play'; }
  function stop(){ try{ if(audio) audio.pause(); }catch(e){} if(curBtn){ resetPlay(curBtn); curBtn=null; } }
  function playBtn(b){
    const file = b.dataset.audiofile;
    if(!audioReady || !file){ announce('Recordings aren’t available yet — audio is coming. For now, read the phrase and say it aloud.'); return; }
    if(curBtn===b){ stop(); return; }
    stop(); announce('');
    if(!audio){ audio=new Audio(); audio.addEventListener('ended',()=>{ if(curBtn){ resetPlay(curBtn); curBtn=null; } }); }
    audio.onerror=()=>{ if(curBtn===b) curBtn=null; resetPlay(b); announce('That recording couldn’t be played.'); };
    audio.src=audioBase+file;
    curBtn=b; b.classList.add('playing'); b.setAttribute('aria-pressed','true'); const l=b.querySelector('.ls-btn-lbl'); if(l) l.textContent='Stop';
    const pr=audio.play(); if(pr&&pr.catch) pr.catch(()=>{ if(curBtn===b) curBtn=null; resetPlay(b); announce('That recording couldn’t be played.'); });
  }
  window.MASRI._listeningAudio = { stop, get current(){ return curBtn; } };

  function playHtml(file, label){
    label = label || 'Play';
    if(!audioReady) return `<button type="button" class="ls-btn play unavailable" aria-disabled="true" aria-label="${esc(label)} — recording unavailable (audio coming soon)"><span aria-hidden="true">🔊</span> <span class="ls-btn-lbl">${esc(label)}</span></button>`;
    return `<button type="button" class="ls-btn play" data-audiofile="${esc(file)}" data-playlabel="${esc(label)}" aria-pressed="false" aria-label="${esc(label)}"><span aria-hidden="true">▶</span> <span class="ls-btn-lbl">${esc(label)}</span></button>`;
  }
  const arHtml  = t => `<div class="ls-ar" dir="rtl">${esc(t)}</div>`;
  const trHtml  = t => `<div class="ls-tr" dir="ltr">${esc(t)}</div>`;
  const enHtml  = t => `<div class="ls-en" dir="ltr">${esc(t)}</div>`;
  const btn = (action, label, cls) => `<button type="button" class="ls-btn${cls?' '+cls:''}" data-action="${action}">${esc(label)}</button>`;

  // ── mode bodies ───────────────────────────────────────────────────────────
  function bodyReveal(){
    const list=filtered(), p=list[S.ri % list.length];
    const showAr = S.revealed.ar || !audioReady;   // with no audio, the Arabic is the stimulus
    let h = `<div class="ls-card"><div class="ls-count">${S.ri%list.length+1} of ${list.length} · ${esc(topicLabel(p.topic))}</div>`;
    h += `<div class="ls-controls">${playHtml(p.audio,'Play')}</div>`;
    h += showAr ? arHtml(p.arabic) : `<div class="ls-hidden">Arabic hidden — play, then reveal below.</div>`;
    h += S.revealed.tr ? trHtml(p.transliteration) : '';
    h += S.revealed.en ? enHtml(p.english) : '';
    h += `<div class="ls-controls">`;
    if(!showAr) h += btn('reveal-ar','Reveal Arabic');
    if(!S.revealed.tr) h += btn('reveal-tr','Reveal transliteration');
    if(!S.revealed.en) h += btn('reveal-en','Reveal English');
    h += btn('done-reveal','Got it ▸','primary');
    h += btn('next-reveal','Skip');
    h += `</div></div>`;
    return h;
  }
  function bodyChoose(){
    const list=filtered(), p=list[S.ci % list.length];
    if(S.chooseFor!==p.id){                       // (re)generate options for this card
      const pool=PHRASES.filter(x=>x.english!==p.english);
      for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
      const seen=new Set([p.english]), distract=[];
      for(const x of pool){ if(seen.has(x.english)) continue; seen.add(x.english); distract.push(x.english); if(distract.length===3) break; }
      const opts=distract.concat([p.english]);
      for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
      S.chooseFor=p.id; S.chooseOpts=opts; S.chooseAnswered=false; S.chooseWrong=false;
    }
    let h=`<div class="ls-card"><div class="ls-count">Question ${S.ci%list.length+1} of ${list.length} · what does this mean?</div>`;
    h += `<div class="ls-controls">${playHtml(p.audio,'Play phrase')}</div>`;
    if(!audioReady) h += arHtml(p.arabic) + trHtml(p.transliteration);   // read stimulus when no audio
    h += `<div class="ls-opts" role="group" aria-label="Choose the English meaning">`;
    S.chooseOpts.forEach((opt,i)=>{
      let cls=''; let dis='';
      if(S.chooseAnswered){ dis=' disabled'; if(opt===p.english) cls=' correct'; }
      h += `<button type="button" class="ls-opt${cls}" data-action="choose" data-i="${i}"${dis}>${esc(opt)}</button>`;
    });
    h += `</div>`;
    h += `<div class="ls-feedback" id="ls-fb" aria-live="polite"></div>`;
    if(S.chooseAnswered){
      h += arHtml(p.arabic) + trHtml(p.transliteration);
      h += `<div class="ls-controls">${btn('next-choose','Next ▸','primary')}</div>`;
    }
    h += `</div>`;
    return h;
  }
  function bodyShadow(){
    const list=filtered(), p=list[S.si % list.length];
    const showSupport = S.revealed.support!=null ? S.revealed.support : (S.display==='both'||S.display==='tr'||S.display==='en');
    let h=`<div class="ls-card"><div class="ls-count">${S.si%list.length+1} of ${list.length} · ${esc(topicLabel(p.topic))}</div>`;
    h += arHtml(p.arabic);
    const wantTr = (S.revealed.tr) || (S.revealed.support==null && (S.display==='both'||S.display==='tr'));
    const wantEn = (S.revealed.en) || (S.revealed.support==null && (S.display==='both'||S.display==='en'));
    if(wantTr) h += trHtml(p.transliteration);
    if(wantEn) h += enHtml(p.english);
    h += `<p class="ls-hidden">Play it, then say it aloud. (No automatic scoring.)</p>`;
    h += `<div class="ls-controls">${playHtml(p.audio,'Play')}`;
    if(audioReady) h += playHtml(p.audio.replace(/\.ogg$/,'-slow.ogg'),'Slower');
    if(!wantTr) h += btn('reveal-tr','Show transliteration');
    if(!wantEn) h += btn('reveal-en','Show English');
    h += btn('practiced-shadow','Mark practiced ✓','primary');
    h += btn('next-shadow','Next ▸');
    h += `</div></div>`;
    return h;
  }
  function bodyRespond(){
    const list=filtered(), p=list[S.pi % list.length];
    let h=`<div class="ls-card"><div class="ls-count">Prompt ${S.pi%list.length+1} of ${list.length} · ${esc(topicLabel(p.topic))}</div>`;
    h += `<div class="ls-prompt">${esc(p.promptEnglish)}</div>`;
    h += `<div class="ls-controls">${playHtml(p.audio,'Play prompt')}</div>`;
    h += `<p class="ls-hidden">Answer out loud, then reveal a suggested response.</p>`;
    if(S.resp.resp) h += `<div class="ls-count" style="margin-top:10px">Suggested response</div>` + arHtml(p.suggestedResponse);
    if(S.resp.tr) h += `<div class="ls-count">Prompt · transliteration</div>` + trHtml(p.transliteration);
    if(S.resp.en) h += `<div class="ls-count">Prompt · English</div>` + enHtml(p.english);
    h += `<div class="ls-controls">`;
    if(!S.resp.resp) h += btn('show-resp','Show suggested response','primary');
    if(!S.resp.tr) h += btn('show-tr','Show transliteration');
    if(!S.resp.en) h += btn('show-en','Show English');
    h += btn('practiced-respond','Mark practiced ✓');
    h += btn('next-respond','Next prompt ▸');
    h += `</div></div>`;
    return h;
  }
  function bodyDialogue(){
    const dl = DIALOGUES.find(x=>x.id===S.dlgId) || DIALOGUES[0];
    if(!dl) return `<div class="ls-card">No dialogues available.</div>`;
    S.dlgId=dl.id;
    const lines=dl.lines||[], step=Math.min(S.dlgStep, lines.length), me=S.dlgRole, meLabel=dl.roleLabels[me];
    let h=`<div class="ls-card">`;
    h += `<div class="ls-filter"><label for="ls-dlg-sel">Dialogue</label><select id="ls-dlg-sel" class="ls-select">`
       + DIALOGUES.map(d=>`<option value="${esc(d.id)}"${d.id===dl.id?' selected':''}>${esc(d.title)}</option>`).join('') + `</select></div>`;
    h += `<p class="ls-en" style="margin-top:10px">${esc(dl.situation)}</p>`;
    h += `<div class="ls-roles" role="group" aria-label="Choose your role">`
       + dl.roles.map(r=>`<button type="button" class="ls-mode" data-action="dlg-role" data-role="${esc(r)}" aria-pressed="${r===me}">Be ${esc(dl.roleLabels[r])}</button>`).join('')
       + `</div>`;
    h += `<div class="ls-controls" style="justify-content:flex-start">${btn('dlg-full', S.dlgShowAll?'Hide full dialogue':'Show full dialogue')}${btn('dlg-restart','Restart')}</div>`;

    if(S.dlgShowAll){
      h += `<div style="margin-top:12px">` + lines.map(ln=>renderLine(ln,dl,me,true)).join('') + `</div></div>`;
      return h;
    }
    h += `<div class="ls-count" style="margin-top:12px">Line ${Math.min(step+1,lines.length)} of ${lines.length} · you are ${esc(meLabel)}</div>`;
    h += `<div>` + lines.slice(0,step).map(ln=>renderLine(ln,dl,me,true)).join('') + `</div>`;
    if(step < lines.length){
      const ln=lines[step], mine=ln.role===me;
      h += `<div class="ls-card" style="background:var(--surf2);margin-top:12px">`;
      if(mine){
        h += `<div class="ls-dlg-turn">Your turn (${esc(meLabel)}) — say your line`+(audioReady?', then check it':'')+`.</div>`;
        h += S.dlgReveal ? renderLine(ln,dl,me,true) : `<div class="ls-hidden">Say it aloud, then reveal.</div>`;
        h += `<div class="ls-controls">`;
        if(!S.dlgReveal) h += btn('dlg-reveal','Reveal my line','primary');
        h += btn('dlg-next','Next line ▸');
        h += `</div>`;
      } else {
        h += `<div class="ls-dlg-turn">${esc(dl.roleLabels[ln.role])} says:</div>`;
        h += renderLine(ln,dl,me,true);
        h += `<div class="ls-controls">${btn('dlg-next','Next line ▸','primary')}</div>`;
      }
      h += `</div>`;
    } else {
      h += `<div class="ls-feedback good" style="margin-top:12px">Dialogue complete ✓</div>`;
      h += `<div class="ls-controls">${btn('dlg-restart','Practice again','primary')}</div>`;
    }
    h += `</div>`;
    return h;
  }
  function renderLine(ln,dl,me,full){
    const mine=ln.role===me;
    let h=`<div class="ls-dlg-line${mine?' you':''}"><div class="ls-dlg-role">${esc(dl.roleLabels[ln.role])}</div><div class="ls-dlg-body">`;
    h += `<div class="ls-controls" style="justify-content:flex-start;margin:0 0 4px">${playHtml(ln.audio, mine?'Play mine':'Play')}</div>`;
    if(full){ h += arHtml(ln.arabic) + trHtml(ln.transliteration) + enHtml(ln.english); }
    h += `</div></div>`;
    return h;
  }

  const BODY = { reveal:bodyReveal, choose:bodyChoose, shadow:bodyShadow, respond:bodyRespond, dialogue:bodyDialogue };

  function updateStats(){
    const el=panel.querySelector('#ls-stats'); if(!el) return;
    el.innerHTML = `<span class="ls-stat">Completed <b>${S.completed.size}</b></span>`
      + `<span class="ls-stat">Practiced <b>${S.practiced.size}</b></span>`
      + `<span class="ls-stat">Quiz <b>${S.correct}</b>/<b>${S.total}</b></span>`
      + `<span class="ls-stat">Streak <b>${S.streak}</b> (best ${S.best})</span>`;
  }
  function renderBody(){
    const body=panel.querySelector('#ls-body'); if(!body) return;
    body.innerHTML = (BODY[S.mode]||bodyReveal)();
    updateStats(); announce('');
  }
  function syncModes(){ panel.querySelectorAll('.ls-mode[data-mode]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===S.mode ? 'true':'false')); const d=panel.querySelector('#ls-desc'); if(d) d.textContent=MODE_DESC[S.mode]||''; }
  function toggleFilter(){ const f=panel.querySelector('#ls-filter'); if(f) f.style.display = (S.mode==='dialogue') ? 'none' : ''; }

  function handleChoose(i, elBtn){
    if(S.chooseAnswered) return;
    const list=filtered(), p=list[S.ci % list.length];
    const chosen=S.chooseOpts[i], fb=panel.querySelector('#ls-fb');
    if(chosen===p.english){
      S.chooseAnswered=true; S.total++;
      if(!S.chooseWrong){ S.correct++; bumpStreak(); }
      S.completed.add(p.id);
      renderBody();
      const fb2=panel.querySelector('#ls-fb'); if(fb2){ fb2.className='ls-feedback good'; fb2.textContent = S.chooseWrong ? 'Correct — that’s the one.' : 'Correct! Nice.'; }
    } else {
      S.chooseWrong=true; S.streak=0;
      if(elBtn){ elBtn.classList.add('wrong'); elBtn.disabled=true; }
      if(fb){ fb.className='ls-feedback bad'; fb.textContent='Not quite — try another.'; }
      updateStats();
    }
  }

  function onBodyClick(e){
    const playB=e.target.closest('.ls-btn.play'); if(playB){ playBtn(playB); return; }
    const el=e.target.closest('[data-action]'); if(!el) return;
    const a=el.dataset.action, list=filtered();
    switch(a){
      case 'reveal-ar': S.revealed.ar=true; renderBody(); break;
      case 'reveal-tr': S.revealed.tr=true; renderBody(); break;
      case 'reveal-en': S.revealed.en=true; renderBody(); break;
      case 'done-reveal': { const p=list[S.ri%list.length]; S.completed.add(p.id); bumpStreak(); S.ri++; clearCard(); renderBody(); break; }
      case 'next-reveal': S.ri++; clearCard(); renderBody(); break;
      case 'choose': handleChoose(+el.dataset.i, el); break;
      case 'next-choose': S.ci++; clearCard(); renderBody(); break;
      case 'practiced-shadow': { const p=list[S.si%list.length]; S.practiced.add(p.id); bumpStreak(); announce('Marked as practiced.'); updateStats(); break; }
      case 'next-shadow': S.si++; clearCard(); renderBody(); break;
      case 'show-resp': S.resp.resp=true; renderBody(); break;
      case 'show-tr': S.resp.tr=true; renderBody(); break;
      case 'show-en': S.resp.en=true; renderBody(); break;
      case 'practiced-respond': { const p=list[S.pi%list.length]; S.completed.add(p.id); bumpStreak(); announce('Marked as practiced.'); updateStats(); break; }
      case 'next-respond': S.pi++; clearCard(); renderBody(); break;
      case 'dlg-role': stop(); S.dlgRole=el.dataset.role; S.dlgStep=0; S.dlgReveal=false; renderBody(); break;
      case 'dlg-reveal': S.dlgReveal=true; renderBody(); break;
      case 'dlg-next': { const dl=DIALOGUES.find(x=>x.id===S.dlgId); const n=(dl.lines||[]).length; S.dlgStep=Math.min(S.dlgStep+1,n); S.dlgReveal=false; if(S.dlgStep>=n) S.dlgDone.add(dl.id); renderBody(); break; }
      case 'dlg-full': S.dlgShowAll=!S.dlgShowAll; renderBody(); break;
      case 'dlg-restart': stop(); S.dlgStep=0; S.dlgReveal=false; S.dlgShowAll=false; renderBody(); break;
    }
  }
  function onBodyChange(e){
    const sel=e.target.closest('#ls-dlg-sel'); if(sel){ stop(); S.dlgId=sel.value; S.dlgStep=0; S.dlgReveal=false; S.dlgShowAll=false; renderBody(); }
  }

  // ── shell (built once) ────────────────────────────────────────────────────
  let h = `<p class="lead">Move from reading to <b>recognizing</b> and <b>speaking</b> everyday Egyptian Arabic. Pick a mode, then work through the phrases or a short dialogue.</p>`;
  h += `<div class="ls-modes" role="group" aria-label="Practice mode">`
     + MODES.map(m=>`<button type="button" class="ls-mode" data-mode="${m[0]}" aria-pressed="${m[0]===S.mode?'true':'false'}">${esc(m[1])}</button>`).join('') + `</div>`;
  h += `<p class="ls-desc" id="ls-desc">${esc(MODE_DESC[S.mode]||'')}</p>`;
  if(!audioReady) h += `<p class="ls-audionote">Native Egyptian recordings are being prepared, so the <b>Play</b> buttons are inactive for now and each phrase is shown so you can read it and say it aloud. There is <b>no automatic pronunciation scoring</b> — this is guided practice. Required recordings are listed in <code>audio/listening/MANIFEST.md</code>.</p>`;
  h += `<div class="ls-bar">`
     + `<span class="ls-filter" id="ls-filter"><label for="ls-topic">Topic</label>`
     + `<select id="ls-topic" class="ls-select"><option value="all"${S.topic==='all'?' selected':''}>All topics</option>`
     + TOPICS.map(t=>`<option value="${esc(t.id)}"${t.id===S.topic?' selected':''}>${esc(t.label)}</option>`).join('') + `</select></span>`
     + `<span class="ls-stats" id="ls-stats" aria-live="polite"></span>`
     + `</div>`;
  h += `<div id="ls-body"></div>`;
  h += `<div class="ls-status" id="ls-status" role="status" aria-live="assertive"></div>`;
  panel.innerHTML = h;

  panel.querySelectorAll('.ls-mode[data-mode]').forEach(b => b.addEventListener('click', () => {
    if(S.mode===b.dataset.mode) return; stop(); S.mode=b.dataset.mode; setPref('mode',S.mode); clearCard(); syncModes(); toggleFilter(); renderBody();
  }));
  const topicSel=panel.querySelector('#ls-topic');
  if(topicSel) topicSel.addEventListener('change', () => { stop(); S.topic=topicSel.value; setPref('topic',S.topic); S.ri=S.ci=S.si=S.pi=0; clearCard(); renderBody(); });
  const body=panel.querySelector('#ls-body');
  body.addEventListener('click', onBodyClick);
  body.addEventListener('change', onBodyChange);
  syncModes(); toggleFilter(); renderBody();
})();

// WORD BUILDER — a pronunciation-reference tool (Sounds & Alphabet).
// The user types an Arabic word. If Masri already has that exact word in its
// reference data, the trusted English gloss / transliteration (and IPA, only when
// a real IPA value exists) are prefilled from that entry — nothing is invented for
// unknown words. Letters are always split out (RTL, logical order). An optional
// "letter details" layer names each letter. Autofilled values carry explicit
// provenance so a new word never inherits the previous word's data. Nothing is
// stored, no localStorage, and Word Builder is NOT added to the global search.
(function(){
  const panel = document.getElementById('p-word-builder'); if(!panel) return;
  const SL = (typeof SECTION_LABEL !== 'undefined') ? SECTION_LABEL : {};

  const LETTER_DETAILS = {
    'ا':'alif', 'أ':'hamza on alif', 'إ':'hamza under alif', 'آ':'alif madda, long ʾā',
    'ب':'bāʾ, b', 'ت':'tāʾ, t', 'ث':'thāʾ, th as in "think"', 'ج':'gīm, usually g in Cairene',
    'ح':'ḥāʾ, deep voiceless h', 'خ':'khāʾ, kh as in "loch"', 'د':'dāl, d', 'ذ':'dhāl, th as in "this"',
    'ر':'rāʾ, tapped or rolled r', 'ز':'zāy, z', 'س':'sīn, s', 'ش':'shīn, sh',
    'ص':'ṣād, emphatic s', 'ض':'ḍād, emphatic d', 'ط':'ṭāʾ, emphatic t', 'ظ':'ẓāʾ, emphatic z',
    'ع':'ʿayn, voiced throat sound', 'غ':'ghayn, gh', 'ف':'fāʾ, f', 'ق':'qāf, often a glottal stop in Cairene',
    'ك':'kāf, k', 'ل':'lām, l', 'م':'mīm, m', 'ن':'nūn, n', 'ه':'hāʾ, h',
    'و':'wāw, w / ū / ō', 'ي':'yāʾ, y / ī / ē', 'ة':'tāʾ marbūṭa, usually -a / -ah',
    'ى':'alif maqṣūra, long ā', 'ء':'hamza, glottal stop', 'ؤ':'hamza on wāw', 'ئ':'hamza on yāʾ'
  };

  let showDetails = false, curStatus = null, curGroups = null, curActiveTok = null, lastWord = null;
  // Autofill provenance: the exact value last auto-filled into each field ('' = none / user-owned).
  const auto = { def: '', tr: '', ipa: '', sound: '' };
  const FIELDS = [['#wb-def','def'], ['#wb-tr','tr'], ['#wb-ipa','ipa'], ['#wb-sound','sound']];

  panel.innerHTML =
    `<p class="lead">Type or paste an Arabic word. If it is already in Masri's
       reference data, its meaning and transliteration are filled in from that
       entry (never invented); its letters are always split out. Everything stays
       editable, and you can add IPA or a sound guide yourself. Nothing is saved.</p>
     <div class="wb-form">
       <label class="wb-field"><span>Arabic word <em>(required)</em></span>
         <input id="wb-word" class="wb-in ar" dir="rtl" placeholder="Example: أنا" autocomplete="off" spellcheck="false"></label>
       <label class="wb-field"><span>English definition</span>
         <input id="wb-def" class="wb-in" placeholder="Example: library" autocomplete="off"></label>
       <label class="wb-field"><span>Transliteration</span>
         <input id="wb-tr" class="wb-in wb-ltr" placeholder="Example: ana" autocomplete="off" spellcheck="false"></label>
       <label class="wb-field"><span>IPA</span>
         <input id="wb-ipa" class="wb-in wb-ltr" placeholder="Example: /ʔana/" autocomplete="off" spellcheck="false"></label>
       <label class="wb-field"><span>English sound guide</span>
         <input id="wb-sound" class="wb-in wb-ltr" placeholder="Example: ah-na" autocomplete="off"></label>
       <div class="wb-btns">
         <button class="btn" id="wb-create">Create Word Stack</button>
         <button class="wb-clear" id="wb-clear">Clear</button>
         <label class="wb-toggle"><input type="checkbox" id="wb-details-toggle"> Show letter details</label>
       </div>
     </div>
     <div id="wb-status" class="wb-status" aria-live="polite"></div>
     <div id="wb-out" aria-live="polite"></div>`;

  const $ = s => panel.querySelector(s);

  // Arabic-only normalization for exact lookup (unchanged): drop tashkeel / tatweel
  // / marks and fold آأإ->ا, ؤ->و, ئ/ى->ي, ة->ه. Code-point tests + literal replaces.
  function arNorm(s){
    let out = '';
    for(const ch of String(s)){
      const cp = ch.codePointAt(0);
      if(cp >= 0x064B && cp <= 0x0655) continue;
      if(cp === 0x0670 || cp === 0x0640) continue;
      if(cp >= 0x0610 && cp <= 0x061A) continue;
      if(cp >= 0x06D6 && cp <= 0x06ED) continue;
      let c = ch;
      if(cp === 0x0622 || cp === 0x0623 || cp === 0x0625) c = 'ا';
      else if(cp === 0x0624) c = 'و';
      else if(cp === 0x0626 || cp === 0x0649) c = 'ي';
      else if(cp === 0x0629) c = 'ه';
      else if(/\s/.test(ch)) c = ' ';
      out += c;
    }
    return out.replace(/\s+/g, ' ').trim();
  }

  // Split into underlying letters in logical order (unchanged — never reversed).
  function split(word){
    const raw = [];
    for(const ch of word){
      if(/\s/.test(ch)){ raw.push({gap:true}); continue; }
      const cp = ch.codePointAt(0);
      if(cp === 0x0640) continue;
      const isLetter = (cp >= 0x0621 && cp <= 0x063A) || (cp >= 0x0641 && cp <= 0x064A)
                     || (cp >= 0x0671 && cp <= 0x06D3);
      if(isLetter) raw.push({ ch });
    }
    const out = [];
    for(const it of raw){
      if(it.gap){ if(out.length && !out[out.length-1].gap) out.push(it); }
      else out.push(it);
    }
    while(out.length && out[out.length-1].gap) out.pop();
    return out;
  }

  // Letter row: RTL container (matches the word above) with each glyph bidi-isolated,
  // so the logical sequence renders right-to-left with no array reversal.
  function letterRow(word){
    const items = split(word);
    if(!items.some(i => i.ch)) return '';
    let h = '', prevLetter = false;
    for(const it of items){
      if(it.gap){ h += `<span class="wb-gap"></span>`; prevLetter = false; }
      else { if(prevLetter) h += `<span class="wb-sep">·</span>`;
             h += `<span class="wb-letter ar">${esc(it.ch)}</span>`; prevLetter = true; }
    }
    return `<div class="wb-letters" dir="rtl">${h}</div>`;
  }

  // Optional letter details: RTL sequence of chips (word order + letter order right
  // to left), but each chip's text stays LTR so the English name reads normally.
  function letterDetails(word){
    const items = split(word);
    if(!items.some(i => i.ch)) return '';
    const groups = [[]];
    for(const it of items){
      if(it.gap){ if(groups[groups.length-1].length) groups.push([]); }
      else groups[groups.length-1].push(it.ch);
    }
    const html = groups.filter(g => g.length).map(g =>
      `<div class="wb-ld-group">` + g.map(ch => {
        const det = LETTER_DETAILS[ch];
        return `<span class="wb-ld-item" dir="ltr"><span class="wb-ld-ch ar">${esc(ch)}</span>${det ? ' — ' + esc(det) : ''}</span>`;
      }).join('') + `</div>`
    ).join('');
    return `<div class="wb-ld" dir="rtl">${html}</div>`;
  }

  const index = (function(){
    const idx = [], M = window.MASRI || {};
    const add = (ar, tr, en, ipa, kind, src) => {
      if(!ar) return; const k = arNorm(ar); if(!k) return;
      idx.push({ k, ar: String(ar), tr: tr || '', en: en || '', ipa: ipa || '', kind, src: src || '' });
    };
    ['verbs','time','around','shopping','food','health','people','descriptions'].forEach(key => {
      if(M[key] && M[key].tables) M[key].tables.forEach(t => (t.rows || []).forEach(r => add(r[0], r[1], r[2], '', 'table', t.title || SL[key] || '')));
    });
    if(Array.isArray(M.grammar)) M.grammar.forEach(t => (t.rows || []).forEach(r => add(r[0], r[1], r[2], '', 'table', t.title || 'Grammar')));
    if(Array.isArray(M.phrases)) M.phrases.forEach(c => (c.items || []).forEach(it => add(it.ar, it.tr, it.en, '', 'phrase', c.category || 'Phrases')));
    if(Array.isArray(M.vocab))   M.vocab.forEach(t => (t.words || []).forEach(w => add(w.ar, w.tr, w.en, '', 'vocab', t.theme || 'Vocabulary')));
    if(M.numbers) ['ones','teens','tens'].forEach(g => (M.numbers[g] || []).forEach(n => add(n.ar, n.tr, String(n.n), '', 'vocab', 'Numbers')));
    if(M.sounds){
      (M.sounds.consonants || []).forEach(c => { add(c.ex_ar, c.ex, c.ex_en, '', 'example', 'Sounds'); add(c.letter, c.name, c.egyptian, c.ipa, 'letter', 'Sounds'); });
      if(M.sounds.vowels) (M.sounds.vowels.rows || []).forEach(v => add(v.ex_ar, v.ex, v.gloss, '', 'example', 'Sounds'));
    }
    if(M.alphabet) (M.alphabet.letters || []).forEach(l => add(l.letter, l.name, l.sound, '', 'letter', 'Alphabet'));
    return idx;
  })();

  const rank = { vocab: 0, table: 0, letter: 1, example: 2, phrase: 3 };
  const token = en => String(en).toLowerCase().split(/[\/,;(]/)[0].trim().split(/\s+/)[0] || '';

  function lookup(word){
    const key = arNorm(word), raw = word.trim();
    const ms = index.filter(r => r.k === key);
    ms.sort((a, b) => {
      const ax = (a.ar === raw) ? 0 : 1, bx = (b.ar === raw) ? 0 : 1; if(ax !== bx) return ax - bx;
      const ar = (rank[a.kind] != null ? rank[a.kind] : 4), br = (rank[b.kind] != null ? rank[b.kind] : 4); if(ar !== br) return ar - br;
      const al = (a.en || '').length, bl = (b.en || '').length; if(al !== bl) return al - bl;
      return a.ar.length - b.ar.length;
    });
    return ms;
  }

  function meaningGroups(ms){
    const seen = {}, groups = [];
    ms.forEach(m => { const t = token(m.en); if(!t || seen[t]) return; seen[t] = 1; groups.push(m); });
    return groups;
  }

  // Fill only empty fields from a trusted entry, recording each auto-filled value.
  function autofill(m){
    if(m){
      if(!$('#wb-def').value && m.en){ $('#wb-def').value = m.en; auto.def = m.en; }
      if(!$('#wb-tr').value  && m.tr){ $('#wb-tr').value  = m.tr; auto.tr = m.tr; }
      if(!$('#wb-ipa').value && m.ipa){ $('#wb-ipa').value = m.ipa; auto.ipa = m.ipa; }
    }
    if(!$('#wb-sound').value && $('#wb-tr').value){ $('#wb-sound').value = $('#wb-tr').value; auto.sound = $('#wb-tr').value; }
  }

  // Provenance reset: clear each field that still holds its exact auto-filled value
  // (safe — the user didn't touch it); keep fields the user manually changed. After
  // this, every field's provenance is cleared so the next lookup starts clean.
  function resetAutoFilled(){
    FIELDS.forEach(([sel, key]) => {
      if(auto[key] !== '' && $(sel).value === auto[key]) $(sel).value = '';
      auto[key] = '';
    });
  }

  function displayEn(en){
    return String(en)
      .replace(/\s*\(m\s*pl\)\s*$/i, ', masculine plural')
      .replace(/\s*\(f\s*pl\)\s*$/i, ', feminine plural')
      .replace(/\s*\(m\)\s*$/i, ', masculine')
      .replace(/\s*\(f\)\s*$/i, ', feminine')
      .replace(/\s*\(pl\)\s*$/i, ', plural');
  }

  function setStatus(st){
    const el = $('#wb-status');
    if(!st){ el.textContent = ''; el.className = 'wb-status'; return; }
    if(st.type === 'found'){ el.textContent = st.src ? ('Found in Masri: ' + st.src) : 'Found in Masri.'; el.className = 'wb-status wb-found'; }
    else { el.textContent = 'This word is not in the Masri reference yet. Add the information you know below.'; el.className = 'wb-status wb-unknown'; }
  }

  const drow = (label, valueHtml, cls) =>
    `<div class="wb-drow${cls ? ' ' + cls : ''}"><div class="wb-label">${esc(label)}</div><div class="wb-dval">${valueHtml}</div></div>`;

  function renderCard(status, groups, activeTok){
    curStatus = status; curGroups = groups; curActiveTok = activeTok;
    const word = $('#wb-word').value.trim();
    setStatus(status);
    if(!word){ $('#wb-out').innerHTML = `<p class="wb-hint">Enter an Arabic word above, then “Create Word Stack”.</p>`; return; }
    const def = $('#wb-def').value.trim(), tr = $('#wb-tr').value.trim(),
          ipa = $('#wb-ipa').value.trim(), snd = $('#wb-sound').value.trim();
    let h = '';
    if(groups && groups.length > 1){
      h += `<div class="wb-choose"><span class="wb-clabel">Multiple meanings in Masri — choose one</span>`
        + groups.map((g, i) => `<button class="wb-alt${token(g.en) === activeTok ? ' active' : ''}" data-i="${i}">${esc(g.en)}${g.tr ? ` · <i>${esc(g.tr)}</i>` : ''}</button>`).join('')
        + `</div>`;
    }
    h += `<div class="wb-card">`;
    h += `<div class="wb-head"><div class="wb-label">Arabic word</div>`
       + `<div class="wb-word ar" dir="rtl">${esc(word)}</div>`;
    const lr = letterRow(word);
    if(lr){
      h += `<div class="wb-label wb-letterslabel">Letters</div>` + lr;
      if(showDetails) h += letterDetails(word);
    }
    h += `</div>`;
    let d = '';
    if(def) d += drow('English', esc(displayEn(def)), 'wb-full');
    if(tr)  d += drow('Transliteration', `<span class="wb-ltr" dir="ltr">${esc(tr)}</span>`);
    if(ipa) d += drow('IPA', `<span class="wb-ltr wb-ipaval" dir="ltr">${esc(ipa)}</span>`);
    if(snd && snd.toLowerCase() !== tr.toLowerCase()) d += drow('English sound guide', `<span class="wb-ltr" dir="ltr">${esc(snd)}</span>`);
    if(d) h += `<div class="wb-details">${d}</div>`;
    h += `</div>`;
    $('#wb-out').innerHTML = h;
    if(groups && groups.length > 1){
      $('#wb-out').querySelectorAll('.wb-alt').forEach(b => b.onclick = () => {
        const g = groups[+b.dataset.i];
        $('#wb-def').value = ''; $('#wb-tr').value = ''; $('#wb-ipa').value = ''; $('#wb-sound').value = '';
        auto.def = auto.tr = auto.ipa = auto.sound = '';
        autofill(g); renderCard({ type: 'found', src: g.src }, groups, token(g.en));
      });
    }
  }

  function build(){
    const word = $('#wb-word').value.trim();
    if(!word){ renderCard(null, null); return; }
    if(word !== lastWord) resetAutoFilled();   // new word → drop stale autofill, keep manual edits
    lastWord = word;
    const ms = lookup(word);
    if(!ms.length){ renderCard({ type: 'unknown' }, null); return; }
    const groups = meaningGroups(ms);
    const top = groups[0] || ms[0];
    autofill(top);
    renderCard({ type: 'found', src: top.src }, groups.length > 1 ? groups : null, token(top.en));
  }

  $('#wb-create').onclick = build;
  $('#wb-word').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); build(); } });
  // As soon as the Arabic word is edited, drop the stale card / status / chooser /
  // match-state so nothing from the previous word lingers before the next Create.
  $('#wb-word').addEventListener('input', () => {
    $('#wb-out').innerHTML = ''; setStatus(null);
    curStatus = curGroups = curActiveTok = null;
  });
  $('#wb-details-toggle').addEventListener('change', () => {
    showDetails = $('#wb-details-toggle').checked;
    if($('#wb-out').querySelector('.wb-card')) renderCard(curStatus, curGroups, curActiveTok);
  });
  $('#wb-clear').onclick = () => {
    ['#wb-word','#wb-def','#wb-tr','#wb-ipa','#wb-sound'].forEach(s => { $(s).value = ''; });
    $('#wb-out').innerHTML = ''; setStatus(null);
    curStatus = curGroups = curActiveTok = null;
    auto.def = auto.tr = auto.ipa = auto.sound = ''; lastWord = null;
    $('#wb-word').focus();
  };
})();

// TYPE · TEST — adaptive keyboard-typing practice (Letter Typing, Word Typing,
// Keyboard reference + key quiz), with per-session mistakes review, difficulty /
// category / prompt-direction selection, and character-by-character feedback.
// Reuses the vetted 28-letter alphabet and derives its word pool at runtime from
// existing Masri datasets (no network, no second corpus). Keyboard = Windows Arabic
// (101), unshifted, from M.typing. Only harmless PREFERENCES persist in localStorage
// (mode, keyboard view, letter difficulty, word difficulty/category/prompt); scores,
// streaks, mistakes, decks and typed answers are session-only, never stored.
(function(){
  const panel = document.getElementById('p-test'); if(!panel) return;
  const M = window.MASRI || {};
  const SL = (typeof SECTION_LABEL!=='undefined') ? SECTION_LABEL : {};
  const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } };
  const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };

  // Compare-normalize: strip tatweel + diacritics ONLY — never fold distinct letters
  // (أ إ آ ا, ة ه, ي ى, and hamza forms stay distinct).
  const norm = s => String(s).replace(/[ً-ْٰـ]/g,'').trim();
  const isWord = s => /^[ء-ي]{2,8}$/.test(s);
  const nlow = s => String(s||'').toLowerCase().trim();
  const cp = s => Array.from(String(s));          // Unicode code points (not UTF-16 units)
  const arSpan = s => `<span class="ar" dir="rtl">${esc(s)}</span>`;
  function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=r[i]; r[i]=r[j]; r[j]=x; } return r; }
  function makeDeck(items, keyOf){
    let order=[], i=0, last=null;
    function refill(){ order=shuffle(items); if(order.length>1 && keyOf(order[0])===keyOf(last)) order.push(order.shift()); i=0; }
    refill();
    return { next(){ if(i>=order.length) refill(); const v=order[i++]; last=v; return v; } };
  }

  // Vetted inputs ------------------------------------------------------------
  const ALL_LETTERS = ((M.alphabet && M.alphabet.letters) || []).map(l => ({ ch:l.letter, name:l.name, name_ar:l.name_ar }));
  const LETTER_META = {}; ALL_LETTERS.forEach(l => LETTER_META[l.ch]=l);
  const KEYMAP={}, KEY_CODES=new Set(), CODE2AR={}, CODE2Q={};
  ((M.typing && M.typing.rows) || []).forEach(row => row.forEach(k => {
    KEY_CODES.add(k.code); CODE2AR[k.code]=k.ar; CODE2Q[k.code]=k.q;
    if(k.ar && k.ar.length===1 && !k.digit) KEYMAP[k.ar]={ code:k.code, q:k.q };
  }));
  const codeLabel = c => CODE2Q[c] || c;

  // Word pool derived from Masri datasets. Each word keeps its source categories
  // (cats Set), so one spelling from several topics is ONE prompt with all its
  // memberships. `common` flags curated beginner words; `len` = code-point count.
  const EXCLUDE = new Set(((M.typing && M.typing.excludeWords) || []).map(norm));
  const COMMON  = new Set(((M.typing && M.typing.commonWords)  || []).map(norm));
  const WORDS = (function(){
    const byNorm=new Map();
    const add=(ar,tr,en,cat)=>{ if(!ar) return; const w=norm(ar); if(!isWord(w)||EXCLUDE.has(w)) return;
      let o=byNorm.get(w);
      if(!o){ o={ ar:w, tr:tr||'', en:en||'', cats:new Set() }; byNorm.set(w,o); }
      else { if(!o.tr && tr) o.tr=tr; if(!o.en && en) o.en=en; }
      o.cats.add(cat); };
    ['verbs','food','people','descriptions','shopping','around','health','time'].forEach(k=>{ if(M[k]&&M[k].tables) M[k].tables.forEach(t=>(t.rows||[]).forEach(r=>add(r[0],r[1],r[2],k))); });
    if(Array.isArray(M.vocab)) M.vocab.forEach(t=>(t.words||[]).forEach(w=>add(w.ar,w.tr,w.en,'vocab')));
    if(Array.isArray(M.phrases)) M.phrases.forEach(c=>(c.items||[]).forEach(it=>{ if(!/\s/.test(String(it.ar))) add(it.ar,it.tr,it.en,'phrases'); }));
    if(M.numbers) ['ones','teens','tens'].forEach(g=>(M.numbers[g]||[]).forEach(n=>add(n.ar,n.tr,String(n.n),'numbers')));
    const arr=Array.from(byNorm.values());
    arr.forEach(w=>{ w.len=cp(w.ar).length; w.common=COMMON.has(w.ar); });
    return arr;
  })();
  // Ambiguity indexes: gloss/transliteration -> set of valid Arabic spellings. In
  // recall modes ANY valid spelling for the shown prompt is accepted (fair handling).
  const enIndex=new Map(), trIndex=new Map();
  WORDS.forEach(w=>{ if(w.en){ const k=nlow(w.en); (enIndex.get(k)||enIndex.set(k,new Set()).get(k)).add(w.ar); }
                     if(w.tr){ const k=nlow(w.tr); (trIndex.get(k)||trIndex.set(k,new Set()).get(k)).add(w.ar); } });
  const WORD_CATS = ['verbs','numbers','time','around','shopping','food','health','people','descriptions','phrases','vocab']
    .filter(c => WORDS.some(w=>w.cats.has(c)));

  // Difficulty pools --------------------------------------------------------
  const LSETS = (M.typing && M.typing.letterSets) || {};
  const LETTER_DIFFS = [
    { id:'beginner', label:'Beginner',  pool:()=>(LSETS.beginner||[]).map(ch=>LETTER_META[ch]).filter(Boolean) },
    { id:'all',      label:'All letters', pool:()=>ALL_LETTERS.slice() },
    { id:'similar',  label:'Similar letters', pool:()=>(LSETS.similar||[]).map(ch=>LETTER_META[ch]).filter(Boolean) },
    { id:'emphatic', label:'Emphatic & throat', pool:()=>(LSETS.emphatic||[]).map(ch=>LETTER_META[ch]).filter(Boolean) }
  ];
  const WORD_DIFFS = [ {id:'all',label:'All'},{id:'short',label:'Short'},{id:'common',label:'Common'},{id:'longer',label:'Longer'} ];
  const WORD_PROMPTS = [ {id:'copy',label:'Copy Arabic'},{id:'en',label:'English → Arabic'},{id:'tr',label:'Translit → Arabic'} ];

  // Preferences (persist) ----------------------------------------------------
  const MODES=[ {id:'keyboard',label:'Keyboard',desc:'Layout + key quiz'},{id:'letter',label:'Letter Typing',desc:'Type the shown letter'},{id:'word',label:'Word Typing',desc:'Type the shown word'},{id:'passage',label:'Passage Typing',desc:'Type sentences & passages'} ];
  let mode = lsGet('masri-type-mode','letter'); if(!MODES.some(m=>m.id===mode)) mode='letter';
  let letterDiff = lsGet('masri-letter-difficulty','all'); if(!LETTER_DIFFS.some(d=>d.id===letterDiff)) letterDiff='all';
  let wordDiff = lsGet('masri-word-difficulty','all'); if(!WORD_DIFFS.some(d=>d.id===wordDiff)) wordDiff='all';
  let wordCat = lsGet('masri-word-category','all'); if(wordCat!=='all' && WORD_CATS.indexOf(wordCat)<0) wordCat='all';
  let wordPrompt = lsGet('masri-word-prompt','copy'); if(!WORD_PROMPTS.some(p=>p.id===wordPrompt)) wordPrompt='copy';
  let kbView = lsGet('masri-keyboard-view','both'); if(kbView!=='both'&&kbView!=='ar') kbView='both';
  let kbTab='ref';
  // Passage Typing preferences (harmless; content/scores/mistakes stay session-only).
  const PASS_CATS = (M.passages && M.passages.categories) || [];
  const PASS_DIFFS = [ {id:'all',label:'All'},{id:'beginner',label:'Beginner'},{id:'intermediate',label:'Intermediate'},{id:'advanced',label:'Advanced'} ];
  let passCat = lsGet('masri-passage-category','egyptian'); if(!PASS_CATS.some(c=>c.id===passCat && c.available)) passCat='egyptian';
  let passDiff = lsGet('masri-passage-difficulty','all'); if(!PASS_DIFFS.some(d=>d.id===passDiff)) passDiff='all';
  let passDia = lsGet('masri-passage-diacritics','loose'); if(passDia!=='loose'&&passDia!=='exact') passDia='loose';
  let passDisplay = lsGet('masri-passage-display','hidden'); if(passDisplay!=='hidden'&&passDisplay!=='full') passDisplay='hidden';

  // Session score helpers (Correct/Total/Streak/Best; nothing persisted) -----
  function newScore(){ return {c:0,t:0,streak:0,best:0}; }
  function bump(s, kind){ // 'correct' | 'complete' (skip/reveal) | 'wrong'
    if(kind==='correct'){ s.c++; s.t++; s.streak++; if(s.streak>s.best) s.best=s.streak; }
    else if(kind==='complete'){ s.t++; s.streak=0; }
    else { s.streak=0; } }
  const scoreBar = s => `<div class="tt-score" role="status">Correct <b class="tt-sc">${s.c}</b> · Total <b class="tt-st">${s.t}</b> · Streak <b class="tt-ss">${s.streak}</b> · Best <b class="tt-sb">${s.best}</b></div>`;
  function updateScore(s){ const q=x=>body.querySelector(x); const a=q('.tt-sc'),b=q('.tt-st'),c=q('.tt-ss'),d=q('.tt-sb'); if(a)a.textContent=s.c; if(b)b.textContent=s.t; if(c)c.textContent=s.streak; if(d)d.textContent=s.best; }

  // Mistakes (session-only) --------------------------------------------------
  const mistakes = { letter:new Map(), word:new Map(), key:new Map(), passage:new Map() };
  function record(type, key, data, reason){
    const map=mistakes[type]; let m=map.get(key);
    if(!m){ m=Object.assign({ key, count:0, reviewCorrect:0 }, data); map.set(key,m); }
    else { Object.assign(m, data); }
    m.count++; m.reason=reason; m.reviewCorrect=0; updateReviewBtn();
  }
  const mCount = () => mistakes.letter.size + mistakes.word.size + mistakes.key.size + mistakes.passage.size;
  function clearMistakes(){ mistakes.letter.clear(); mistakes.word.clear(); mistakes.key.clear(); mistakes.passage.clear(); updateReviewBtn(); }
  function updateReviewBtn(){ const b=panel.querySelector('#tt-reviewbtn'); if(!b) return; const n=mCount();
    b.textContent='Review mistakes ('+n+')'; b.classList.toggle('has', n>0); b.setAttribute('aria-disabled', String(n===0)); }
  function collectReview(types){ const out=[];
    types.forEach(tp=> mistakes[tp].forEach(m=> out.push(Object.assign({_type:tp}, m))) ); return out; }

  // Unicode-aware character diff (Levenshtein alignment over code points) -----
  function diffOps(T, Y){ // arrays of code points (already normalized)
    const n=T.length, m=Y.length, dp=[];
    for(let i=0;i<=n;i++){ dp[i]=[]; for(let j=0;j<=m;j++){ dp[i][j]= i===0?j : j===0?i : 0; } }
    for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){ const cost=T[i-1]===Y[j-1]?0:1;
      dp[i][j]=Math.min(dp[i-1][j-1]+cost, dp[i-1][j]+1, dp[i][j-1]+1); }
    let i=n,j=m,ops=[];
    while(i>0||j>0){
      if(i>0&&j>0 && dp[i][j]===dp[i-1][j-1]+(T[i-1]===Y[j-1]?0:1)){ ops.push({op:T[i-1]===Y[j-1]?'match':'sub', t:T[i-1], y:Y[j-1]}); i--; j--; }
      else if(i>0 && dp[i][j]===dp[i-1][j]+1){ ops.push({op:'del', t:T[i-1], y:null}); i--; }   // target letter missing from typed
      else { ops.push({op:'ins', t:null, y:Y[j-1]}); j--; }                                       // extra typed letter
    }
    return ops.reverse();
  }
  // Two aligned RTL rows + a text caption of the first difference. State is shown by
  // outline + symbol + label (not colour alone), so it survives high-contrast Aa modes.
  function renderDiff(targetStr, typedStr){
    const ops=diffOps(cp(targetStr), cp(typedStr));
    const cell=(ch,state,sym)=> `<span class="tt-dc ${state}"><span class="tt-dsym" aria-hidden="true">${sym||''}</span><span class="tt-dch">${ch==null?'·':arSpan(ch)}</span></span>`;
    const targetRow = ops.map(o=> o.op==='ins' ? cell(null,'gap','') : cell(o.t, o.op==='match'?'ok':'exp', o.op==='match'?'':'●') ).join('');
    const typedRow  = ops.map(o=> o.op==='del' ? cell(null,'gap','') : cell(o.y, o.op==='match'?'ok':(o.op==='sub'?'bad':'extra'), o.op==='match'?'✓':'✗') ).join('');
    let cap='';
    const firstBad = ops.find(o=>o.op!=='match'); const posLogical = ops.filter((o,idx)=>idx<=ops.indexOf(firstBad)).filter(o=>o.op!=='ins').length;
    if(firstBad){ if(firstBad.op==='sub') cap=`Position ${posLogical}: expected ${arSpan(firstBad.t)}, you typed ${arSpan(firstBad.y)}`;
      else if(firstBad.op==='del') cap=`Missing ${arSpan(firstBad.t)} (around position ${posLogical})`;
      else cap=`Extra ${arSpan(firstBad.y)} that isn't in the word`; }
    return `<div class="tt-diff">`
      +`<div class="tt-diffline"><span class="tt-difflab">Target</span><div class="tt-diffrow" dir="rtl">${targetRow}</div></div>`
      +`<div class="tt-diffline"><span class="tt-difflab">You typed</span><div class="tt-diffrow" dir="rtl">${typedRow}</div></div>`
      +(cap?`<div class="tt-diffcap">${cap}</div>`:'')
      +`<div class="tt-difflegend"><span class="tt-dc ok"><span class="tt-dch">✓</span></span> match · <span class="tt-dc bad"><span class="tt-dsym">✗</span></span> wrong · <span class="tt-dc exp"><span class="tt-dsym">●</span></span> expected · <span class="tt-dc gap"><span class="tt-dch">·</span></span> missing/extra</div>`
      +`</div>`;
  }

  // Word filtering -----------------------------------------------------------
  function filterWords(){
    return WORDS.filter(w=>{
      if(wordCat!=='all' && !w.cats.has(wordCat)) return false;
      if(wordDiff==='short'  && !(w.len>=2 && w.len<=3)) return false;
      if(wordDiff==='longer' && !(w.len>=5)) return false;
      if(wordDiff==='common' && !w.common) return false;
      if(wordPrompt==='en' && !w.en) return false;
      if(wordPrompt==='tr' && !w.tr) return false;
      return true;
    });
  }
  function wordAccepts(target, inputNorm){
    if(wordPrompt==='en'){ const set=enIndex.get(nlow(target.en)); return set?set.has(inputNorm):inputNorm===target.ar; }
    if(wordPrompt==='tr'){ const set=trIndex.get(nlow(target.tr)); return set?set.has(inputNorm):inputNorm===target.ar; }
    return inputNorm===target.ar;
  }

  // Selector controls --------------------------------------------------------
  function pillGroup(name, opts, cur, label){
    return `<div class="tt-selgroup" role="group" aria-label="${esc(label)}"><span class="tt-sellabel">${esc(label)}</span><div class="tt-selopts">`
      + opts.map(o=>`<button type="button" class="tt-opt" data-sel="${name}" data-val="${o.id}" aria-pressed="${o.id===cur}">${esc(o.label)}</button>`).join('')
      + `</div></div>`;
  }
  const reviewBar = () => `<div class="tt-topbar"><button type="button" id="tt-reviewbtn" class="tt-review-btn${mCount()>0?' has':''}" aria-disabled="${mCount()===0}">Review mistakes (${mCount()})</button></div>`;

  // Shell --------------------------------------------------------------------
  // Order: mode cards → active-mode content (#tt-body) → unified Windows keyboard-help
  // box. The help box lives in the shell AFTER #tt-body, so it stays pinned at the
  // bottom of the section across every mode re-render (which only replace #tt-body).
  panel.innerHTML =
    `<div class="tt-modes" role="group" aria-label="Test mode">`
     + MODES.map(m=>`<button type="button" class="tt-mode" data-mode="${m.id}" aria-pressed="${m.id===mode}">${esc(m.label)}<span class="tt-mdesc">${esc(m.desc)}</span></button>`).join('')
   +`</div><div id="tt-body"></div>`
   +`<div class="tt-kbdnote"><div class="tt-kbdnote-lead">On Windows, press <kbd>Win</kbd> + <kbd>Space</kbd> to switch between installed keyboard languages. Arabic must already be added as a Windows keyboard language.</div>`
     +`<details class="tt-help"><summary>How to add the Arabic keyboard on Windows</summary>`
       +`<ol><li>Open <b>Windows Settings</b>.</li><li>Go to <b>Time &amp; language</b>.</li><li>Open <b>Language &amp; region</b>.</li>`
       +`<li>Add <b>Arabic</b> as a language or keyboard.</li><li>Press <kbd>Win</kbd> + <kbd>Space</kbd> to switch between English and Arabic.</li></ol></details></div>`;

  const body = panel.querySelector('#tt-body');
  panel.querySelectorAll('.tt-mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  function setMode(m){ mode=m; lsSet('masri-type-mode',m); reviewMode=null; reviewPanel=false;
    panel.querySelectorAll('.tt-mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
    render(); }

  // Session scores + per-mode transient state
  const L={ score:newScore(), deck:null, target:null, done:false };
  const W={ score:newScore(), deck:null, target:null, done:false, filtered:[], revealed:false };
  const Q={ score:newScore(), deck:null, target:null, done:false };
  // Passage Typing state — session-only. `passage` = current passage object; `seg` =
  // current segment index; `custom`/`customLines` hold pasted text (never persisted).
  const P={ score:newScore(), passage:null, seg:0, done:false, custom:'', customLines:null, showTr:false, showEn:false };
  // Passage session tally — counts this tab's finished passages, cleared segments and
  // wrong attempts. Session-only: never saved, and reset by the filters that reset P.
  const PS={ passages:0, segments:0, mistakes:0 };
  let reviewMode=null;       // {types:[...], score, last, item}
  let reviewPanel=false;     // summary overlay open?

  function render(){
    if(reviewMode){ renderReviewPractice(); return; }
    if(reviewPanel){ renderReviewSummary(); return; }
    if(mode==='letter') renderLetter(); else if(mode==='word') renderWord(); else if(mode==='passage') renderPassage(); else renderKeyboard();
  }

  // Wire the selector pill-groups + review button that a mode render just injected.
  function wireCommon(){
    body.querySelectorAll('.tt-opt').forEach(b=> b.addEventListener('click', ()=>onSelect(b.dataset.sel, b.dataset.val)));
    const rb=body.querySelector('#tt-reviewbtn'); if(rb) rb.addEventListener('click', ()=>{ if(mCount()===0) return; reviewPanel=true; render(); });
    const sel=body.querySelector('#tt-catsel'); if(sel) sel.addEventListener('change', ()=>onSelect('wordCat', sel.value));
  }
  function onSelect(name, val){
    if(name==='letterDiff'){ letterDiff=val; lsSet('masri-letter-difficulty',val); L.deck=null; L.target=null; L.score=newScore(); }
    else if(name==='wordDiff'){ wordDiff=val; lsSet('masri-word-difficulty',val); W.deck=null; W.target=null; W.score=newScore(); }
    else if(name==='wordCat'){ wordCat=val; lsSet('masri-word-category',val); W.deck=null; W.target=null; W.score=newScore(); }
    else if(name==='wordPrompt'){ wordPrompt=val; lsSet('masri-word-prompt',val); W.deck=null; W.target=null; W.score=newScore(); }
    else if(name==='passCat'){ passCat=val; lsSet('masri-passage-category',val); P.passage=null; P.seg=0; P.done=false; P.score=newScore(); }
    else if(name==='passDiff'){ passDiff=val; lsSet('masri-passage-difficulty',val); P.passage=null; P.seg=0; P.done=false; P.score=newScore(); }
    else if(name==='passDia'){ passDia=val; lsSet('masri-passage-diacritics',val); P.done=false; }
    else if(name==='passDisplay'){ passDisplay=val; lsSet('masri-passage-display',val); }
    render();
  }

  // Mode 1: Letter Typing ----------------------------------------------------
  function letterPool(){ const d=LETTER_DIFFS.find(x=>x.id===letterDiff)||LETTER_DIFFS[1]; return d.pool(); }
  function renderLetter(){
    const pool=letterPool();
    if(!pool.length){ body.innerHTML=reviewBar()+'<p class="note">No letters in this set.</p>'; wireCommon(); return; }
    if(!L.deck) L.deck=makeDeck(pool, x=>x&&x.ch);
    if(!L.target) L.target=L.deck.next();
    const t=L.target;
    body.innerHTML = reviewBar()
      + `<div class="tt-sel">`+pillGroup('letterDiff', LETTER_DIFFS, letterDiff, 'Difficulty')+`</div>`
      + `<div class="tt-card"><div class="tt-prompt">Type this letter</div>`
      +`<div class="tt-target letter">${esc(t.ch)}</div>`
      +`<div class="tt-hintline" id="tt-lh" aria-live="polite"></div>`
      +`<label class="tt-prompt" for="tt-li" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
      +`<input id="tt-li" class="tt-input" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the Arabic letter" maxlength="2">`
      +`<div class="tt-fb" id="tt-lf" role="status" aria-live="polite"></div>`
      +`<div class="tt-controls">`
        +`<button type="button" class="tt-btn primary" data-a="check">Check</button>`
        +`<button type="button" class="tt-btn" data-a="skip">Skip</button>`
        +`<button type="button" class="tt-btn" data-a="key">Show key</button>`
        +`<button type="button" class="tt-btn" data-a="name">Show name</button>`
      +`</div></div>`+scoreBar(L.score);
    wireCommon();
    const inp=body.querySelector('#tt-li'), fb=body.querySelector('#tt-lf'), hint=body.querySelector('#tt-lh'), checkBtn=body.querySelector('[data-a=check]');
    inp.focus();
    function next(){ L.target=L.deck.next(); L.done=false; renderLetter(); }
    function check(){
      if(L.done){ next(); return; }
      const v=inp.value.trim(); if(!v) return;
      const ok = cp(v).length===1 && v===t.ch;
      if(ok){ bump(L.score,'correct'); L.done=true; fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct'; checkBtn.textContent='Next'; }
      else { bump(L.score,'wrong'); record('letter', t.ch, {ch:t.ch, name:t.name}, 'incorrect');
        fb.className='tt-fb no';
        fb.innerHTML = `<div>You typed: ${arSpan(v)} &nbsp; Target: ${arSpan(t.ch)}</div>`
          + `<div class="tt-fbsub">Try again — the target is ${arSpan(t.ch)} (${esc(t.name||'')}). Use “Show key” for its keyboard position.</div>`;
        inp.value=''; inp.focus(); }
      updateScore(L.score);
    }
    checkBtn.addEventListener('click', check);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
    body.querySelector('[data-a=skip]').addEventListener('click', ()=>{ if(L.done){ next(); return; } bump(L.score,'complete'); record('letter', t.ch, {ch:t.ch, name:t.name}, 'skipped'); updateScore(L.score); fb.className='tt-fb no'; fb.innerHTML='Skipped — it was '+arSpan(t.ch); L.done=true; checkBtn.textContent='Next'; });
    body.querySelector('[data-a=key]').addEventListener('click', ()=>{ const k=KEYMAP[t.ch]; hint.innerHTML = k ? 'Windows Arabic key: <b>'+esc(k.q)+'</b>' : 'Not on this layout.'; });
    body.querySelector('[data-a=name]').addEventListener('click', ()=>{ hint.innerHTML = 'Name: <b>'+esc(t.name||'')+'</b> '+(t.name_ar?arSpan(t.name_ar):''); });
  }

  // Mode 2: Word Typing ------------------------------------------------------
  function wordPromptHtml(t){
    if(wordPrompt==='en') return `<div class="tt-prompt">Type the Arabic for this word</div><div class="tt-target enprompt" dir="ltr">${esc(t.en)}</div>`+catClue(t);
    if(wordPrompt==='tr') return `<div class="tt-prompt">Type the Arabic for this reading</div><div class="tt-target enprompt" dir="ltr">${esc(t.tr)}</div>`+catClue(t);
    return `<div class="tt-prompt">Type this word</div><div class="tt-target word">${esc(t.ar)}</div>`+(t.en?`<div class="tt-meaning">${esc(t.en)}</div>`:'');
  }
  function catClue(t){ const c=Array.from(t.cats)[0]; return c?`<div class="tt-meaning">Topic: ${esc(SL[c]||c)}</div>`:''; }
  function renderWord(){
    const pool=filterWords();
    W.filtered=pool;
    if(!pool.length){
      body.innerHTML = reviewBar()
        + `<div class="tt-sel">`+pillGroup('wordDiff',WORD_DIFFS,wordDiff,'Length')+wordCatSelect()+pillGroup('wordPrompt',WORD_PROMPTS,wordPrompt,'Prompt')+`</div>`
        + `<p class="note">No words match this combination${wordPrompt!=='copy'?' with a usable '+(wordPrompt==='en'?'meaning':'reading'):''}. Change the filters above.</p>`;
      wireCommon(); return;
    }
    if(!W.deck) W.deck=makeDeck(pool, x=>x&&x.ar);
    if(!W.target) W.target=W.deck.next();
    const t=W.target;
    body.innerHTML = reviewBar()
      + `<div class="tt-sel">`+pillGroup('wordDiff',WORD_DIFFS,wordDiff,'Length')+wordCatSelect()+pillGroup('wordPrompt',WORD_PROMPTS,wordPrompt,'Prompt')+`</div>`
      + `<div class="tt-card">`+wordPromptHtml(t)
      +`<div class="tt-hintline" id="tt-wh" aria-live="polite"></div>`
      +`<label class="tt-prompt" for="tt-wi" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
      +`<input id="tt-wi" class="tt-input" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the Arabic word">`
      +`<div class="tt-fb" id="tt-wf" role="status" aria-live="polite"></div>`
      +`<div class="tt-controls">`
        +`<button type="button" class="tt-btn primary" data-a="check">Check</button>`
        +`<button type="button" class="tt-btn" data-a="skip">Skip</button>`
        + (wordPrompt==='en' ? `<button type="button" class="tt-btn" data-a="hinttr">Show reading</button>` : '')
        + (wordPrompt==='tr' ? `<button type="button" class="tt-btn" data-a="hinten">Show meaning</button>` : '')
        + (wordPrompt==='copy' ? `<button type="button" class="tt-btn" data-a="hinttr">Show reading</button>` : '')
        + (wordPrompt!=='copy' ? `<button type="button" class="tt-btn" data-a="hintfirst">Show first letter</button>` : '')
        +`<button type="button" class="tt-btn" data-a="reveal">Show answer</button>`
      +`</div></div>`+scoreBar(W.score);
    wireCommon();
    const inp=body.querySelector('#tt-wi'), fb=body.querySelector('#tt-wf'), hint=body.querySelector('#tt-wh'), checkBtn=body.querySelector('[data-a=check]');
    inp.focus();
    function next(){ W.target=W.deck.next(); W.done=false; W.revealed=false; renderWord(); }
    function check(){
      if(W.done){ next(); return; }
      const v=norm(inp.value); if(!v) return;
      if(wordAccepts(t, v)){ bump(W.score,'correct'); W.done=true; fb.className='tt-fb ok'; fb.innerHTML='<span class="tag">✓</span> Correct — '+arSpan(t.ar); checkBtn.textContent='Next'; }
      else { bump(W.score,'wrong'); record('word', t.ar, {ar:t.ar, tr:t.tr, en:t.en, cats:t.cats, lastTyped:v}, 'incorrect');
        fb.className='tt-fb no'; fb.innerHTML='Not quite — try again.'+renderDiff(t.ar, v); inp.focus(); }
      updateScore(W.score);
    }
    checkBtn.addEventListener('click', check);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
    body.querySelector('[data-a=skip]').addEventListener('click', ()=>{ if(W.done){ next(); return; } bump(W.score,'complete'); record('word', t.ar, {ar:t.ar, tr:t.tr, en:t.en, cats:t.cats}, 'skipped'); updateScore(W.score); fb.className='tt-fb no'; fb.innerHTML='It was '+arSpan(t.ar)+(t.tr?' <span dir="ltr">('+esc(t.tr)+')</span>':''); W.done=true; checkBtn.textContent='Next'; });
    const rev=body.querySelector('[data-a=reveal]'); if(rev) rev.addEventListener('click', ()=>{ if(W.done) return; bump(W.score,'complete'); record('word', t.ar, {ar:t.ar, tr:t.tr, en:t.en, cats:t.cats}, 'revealed'); updateScore(W.score); fb.className='tt-fb no'; fb.innerHTML='Answer: '+arSpan(t.ar)+(t.tr?' <span dir="ltr">('+esc(t.tr)+')</span>':''); W.done=true; checkBtn.textContent='Next'; });
    const hTr=body.querySelector('[data-a=hinttr]'); if(hTr) hTr.addEventListener('click', ()=>{ hint.innerHTML = t.tr?'Reading: <b dir="ltr">'+esc(t.tr)+'</b>':'No transliteration available.'; });
    const hEn=body.querySelector('[data-a=hinten]'); if(hEn) hEn.addEventListener('click', ()=>{ hint.innerHTML = t.en?'Meaning: <b>'+esc(t.en)+'</b>':'No meaning available.'; });
    const hF=body.querySelector('[data-a=hintfirst]'); if(hF) hF.addEventListener('click', ()=>{ hint.innerHTML = 'First letter: '+arSpan(cp(t.ar)[0]); });
  }
  function wordCatSelect(){
    let h=`<div class="tt-selgroup"><label class="tt-sellabel" for="tt-catsel">Topic</label><select id="tt-catsel" class="tt-select">`;
    h+=`<option value="all"${wordCat==='all'?' selected':''}>All topics</option>`;
    WORD_CATS.forEach(c=>{ h+=`<option value="${c}"${wordCat===c?' selected':''}>${esc(SL[c]||c)}</option>`; });
    return h+`</select></div>`;
  }

  // Mistakes Review — summary overlay ---------------------------------------
  function renderReviewSummary(){
    const s = mode==='word'?W.score:(mode==='keyboard'?Q.score:L.score);
    const acc = s.t? Math.round(100*s.c/s.t):0;
    const lm=[...mistakes.letter.values()], wm=[...mistakes.word.values()], km=[...mistakes.key.values()], pm=[...mistakes.passage.values()];
    const topAll=[...lm,...wm,...km].sort((a,b)=>b.count-a.count).slice(0,6);
    let h = `<div class="tt-review" role="region" aria-label="Mistakes review">`
      +`<div class="tt-revhead"><h3 class="tt-revh">Session summary &amp; mistakes</h3><button type="button" class="tt-btn" data-a="close">Close</button></div>`
      +`<div class="tt-summary">Correct <b>${s.c}</b> · Completed <b>${s.t}</b> · Accuracy <b>${acc}%</b> · Streak <b>${s.streak}</b> · Best <b>${s.best}</b> · Mistakes <b>${mCount()}</b> <span class="tt-summode">(${mode} mode)</span></div>`;
    if(mCount()===0){ h+=`<p class="note">No mistakes recorded yet this session. Missed, skipped, or revealed prompts will appear here.</p>`; }
    else {
      if(topAll.length){ h+=`<div class="tt-mgroup"><div class="tt-sellabel">Most missed</div><div class="tt-mlist">`
        + topAll.map(m=>`<span class="tt-mitem">${m.ch?arSpan(m.ch):arSpan(m.ar)}<span class="tt-mcount">×${m.count}</span></span>`).join('')+`</div></div>`; }
      if(lm.length) h+=mistGroup('Missed letters', lm.map(m=>`${arSpan(m.ch)}<span class="tt-mcount">×${m.count}</span><span class="tt-mreason">${esc(m.reason)}</span>`));
      if(wm.length) h+=mistGroup('Missed words', wm.map(m=>`${arSpan(m.ar)}${m.en?'<span class="tt-mgloss">'+esc(m.en)+'</span>':''}<span class="tt-mcount">×${m.count}</span>${m.lastTyped?'<span class="tt-mreason">typed '+arSpan(m.lastTyped)+'</span>':'<span class="tt-mreason">'+esc(m.reason)+'</span>'}`));
      if(km.length) h+=mistGroup('Missed keyboard keys', km.map(m=>`${arSpan(m.ch)}<span class="tt-mreason">key ${esc(m.q||'')}</span><span class="tt-mcount">×${m.count}</span>`));
      if(pm.length) h+=mistGroup('Missed passage segments', pm.map(m=>`${arSpan(m.target)}<span class="tt-mgloss">${esc(m.title||'')} · seg ${m.seg+1}</span><span class="tt-mcount">×${m.count}</span>${m.lastTyped?'<span class="tt-mreason">typed '+arSpan(m.lastTyped)+'</span>':'<span class="tt-mreason">'+esc(m.reason)+'</span>'}`));
      h+=`<div class="tt-revactions">`
        +`<button type="button" class="tt-btn primary" data-r="all">Practice all mistakes</button>`
        + (lm.length?`<button type="button" class="tt-btn" data-r="letter">Practice letter mistakes</button>`:'')
        + (wm.length?`<button type="button" class="tt-btn" data-r="word">Practice word mistakes</button>`:'')
        + (km.length?`<button type="button" class="tt-btn" data-r="key">Practice keyboard mistakes</button>`:'')
        + (pm.length?`<button type="button" class="tt-btn" data-r="passage">Practice passage mistakes</button>`:'')
        +`<button type="button" class="tt-btn" data-a="clear">Clear mistakes</button></div>`;
    }
    h+=`</div>`;
    body.innerHTML=h;
    body.querySelector('[data-a=close]').addEventListener('click', ()=>{ reviewPanel=false; render(); });
    const clr=body.querySelector('[data-a=clear]'); if(clr) clr.addEventListener('click', ()=>{ clearMistakes(); render(); });
    body.querySelectorAll('[data-r]').forEach(b=> b.addEventListener('click', ()=>{ startReview(b.dataset.r); }));
    const cl=body.querySelector('[data-a=close]'); if(cl) cl.focus();
  }
  function mistGroup(title, rows){ return `<div class="tt-mgroup"><div class="tt-sellabel">${esc(title)}</div><div class="tt-mrows">`+rows.map(r=>`<div class="tt-mrow">${r}</div>`).join('')+`</div></div>`; }

  // Mistakes Review — practice mode -----------------------------------------
  function startReview(which){ const types = which==='all'?['letter','word','key','passage']:[which];
    reviewMode={ types, score:newScore(), last:null }; reviewPanel=false; render(); }
  function reviewNext(){
    const items=collectReview(reviewMode.types); if(!items.length) return null;
    const weighted=[]; items.forEach(it=>{ const w=Math.min(it.count,4); for(let i=0;i<w;i++) weighted.push(it); });
    let pick=weighted[Math.floor(Math.random()*weighted.length)];
    for(let tr=0; tr<8 && items.length>1 && pick.key===reviewMode.last; tr++) pick=weighted[Math.floor(Math.random()*weighted.length)];
    reviewMode.last=pick.key; return pick;
  }
  function reviewResolve(item, kind){ // 'correct' | 'wrong' | 'complete'
    bump(reviewMode.score, kind);
    const map=mistakes[item._type]; const m=map.get(item.key); if(!m) return;
    if(kind==='correct'){ m.reviewCorrect=(m.reviewCorrect||0)+1; if(m.reviewCorrect>=2){ map.delete(item.key); } }
    else { m.reviewCorrect=0; if(kind==='wrong') m.count++; }
    updateReviewBtn();
  }
  function renderReviewPractice(){
    const item=reviewNext();
    if(!item){ body.innerHTML=`<div class="tt-reviewbanner"><b>Review complete</b> — all selected items mastered. <button type="button" class="tt-btn primary" data-a="exit">Back to practice</button></div>`;
      body.querySelector('[data-a=exit]').addEventListener('click', exitReview); return; }
    const remain=collectReview(reviewMode.types).length;
    let card='';
    if(item._type==='letter'){
      card=`<div class="tt-card"><div class="tt-prompt">Type this letter</div><div class="tt-target letter">${esc(item.ch)}</div>`
        +`<label class="tt-prompt" for="tt-ri" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
        +`<input id="tt-ri" class="tt-input" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the Arabic letter" maxlength="2">`
        +`<div class="tt-fb" id="tt-rf" role="status" aria-live="polite"></div>`
        +`<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="check">Check</button><button type="button" class="tt-btn" data-a="show">Show answer</button></div></div>`;
    } else if(item._type==='word'){
      card=`<div class="tt-card"><div class="tt-prompt">Type this word</div><div class="tt-target word">${esc(item.ar)}</div>`+(item.en?`<div class="tt-meaning">${esc(item.en)}</div>`:'')
        +`<label class="tt-prompt" for="tt-ri" style="margin:14px 0 0;display:block">Your answer (Arabic)</label>`
        +`<input id="tt-ri" class="tt-input" dir="rtl" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the Arabic word">`
        +`<div class="tt-fb" id="tt-rf" role="status" aria-live="polite"></div>`
        +`<div class="tt-controls"><button type="button" class="tt-btn primary" data-a="check">Check</button><button type="button" class="tt-btn" data-a="show">Show answer</button></div></div>`;
