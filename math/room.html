<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Lab has moved</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../_shared/hub-nav.css">
  <link rel="stylesheet" href="../science/css/base.css">
  <style>
    body { background: var(--bg); }
    .moved { max-width: 34rem; margin: 0 auto; padding: 4rem 1.6rem;
      font-family: -apple-system, "Segoe UI", sans-serif; color: var(--muted); line-height: 1.6; }
    .moved h1 { font-family: Georgia, serif; font-size: 1.8rem; color: var(--fg); margin-bottom: 0.6rem; }
    .moved a { color: var(--gold); }
  </style>
</head>
<body>
  <nav class="ws-hub-nav" aria-label="Workspace navigation">
    <a class="ws-hub-home" href="../">&larr; Hub</a>
  </nav>
  <div class="moved">
    <h1>The Math Lab moved into Science</h1>
    <p id="msg">Taking you to the room's new home&hellip;</p>
    <p><a href="../science/">Science &amp; Math home dashboard</a></p>
  </div>
  <script>
    /* Every old Math Lab room key, mapped to where it lives now. Graphing
       is no longer a page here — it hands off to Desmos. */
    var MOVED = {
      algebra: "algebra", calculus: "calculus", geometry: "geometry",
      trigonometry: "trigonometry", statistics: "statistics",
      "time-series": "time-series", symbols: "symbols", notes: "notes"
    };
    var key = (new URLSearchParams(location.search).get("room") || "").toLowerCase();
    var dest = "../science/";
    if (key === "physics") dest = "../science/room.html?room=physics";
    else if (MOVED[key]) dest = "../science/room.html?room=math-" + MOVED[key];
    location.replace(dest);
  </script>
</body>
</html>
