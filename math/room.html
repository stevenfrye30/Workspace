<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Room</title>
  <meta name="description" content="A room inside the Mathematics lab.">
  <link rel="stylesheet" href="../atlas/atlas.css">
  <link rel="stylesheet" href="../_shared/hub-nav.css">
  <style>
    :root {
      --accent-warm: #7a4e26;
      --accent-deep: #5e2828;
      --rule-warm:   #c8b88f;
    }
    body {
      background:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(255, 250, 238, 0.55), transparent 70%),
        radial-gradient(ellipse 70% 50% at 22% 28%, rgba(140, 100, 50, 0.07), transparent 65%),
        var(--bg);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .room-main { max-width: var(--shell-max); margin: 0 auto; padding: 1.4rem var(--pad-x) 2.5rem; }

    .crumb {
      font-family: var(--sans); font-size: 0.78rem; font-weight: 600;
      margin-bottom: 1rem;
    }
    .crumb a { color: var(--m); text-decoration: none; }
    .crumb a:hover { text-decoration: underline; }
    .crumb .sep { color: var(--ink-soft); margin: 0 0.4rem; }
    .crumb .here { color: var(--ink-soft); }

    .room-head {
      position: relative;
      border-bottom: 1px solid var(--m);
      padding-bottom: 1rem;
      margin-bottom: 1.4rem;
    }
    .room-glyph-lg {
      position: absolute; top: -0.2rem; right: 0;
      font-family: var(--serif); font-size: 3.2rem; line-height: 1;
      color: var(--m); opacity: 0.28;
    }
    .room-kicker {
      font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--m); font-weight: 600; margin-bottom: 0.3rem;
    }
    .room-title {
      font-family: var(--serif); font-size: 2.3rem; font-weight: 700;
      letter-spacing: -0.015em; line-height: 1.02; margin: 0; color: var(--ink);
    }
    .room-blurb {
      font-family: var(--sans); font-size: 0.92rem; color: var(--ink-soft);
      margin-top: 0.5rem; max-width: 46rem; line-height: 1.45;
    }
    .room-status {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--sans); font-size: 0.7rem; font-weight: 600;
      color: var(--m); background: color-mix(in srgb, var(--m) 10%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 30%, transparent);
      border-radius: 999px; padding: 0.22rem 0.7rem; margin-top: 0.85rem;
    }
    .room-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--m); }

    .callout {
      font-family: var(--sans); font-size: 0.85rem; line-height: 1.5;
      color: var(--ink); background: color-mix(in srgb, var(--m) 8%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 26%, transparent);
      border-left: 3px solid var(--m);
      border-radius: 3px; padding: 0.7rem 0.9rem; margin: 0 0 1.4rem 0;
    }
    .callout b { color: var(--m); }

    .sections {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
      gap: 1rem;
    }
    .section-card {
      background:
        linear-gradient(155deg,
          color-mix(in srgb, var(--m) 9%, var(--bg)) 0%,
          color-mix(in srgb, var(--m) 5%, var(--bg)) 100%);
      border: 1px solid color-mix(in srgb, var(--m) 22%, transparent);
      border-radius: 3px;
      padding: 0.9rem 1rem 1rem;
      box-shadow: inset 0 1px 0 rgba(255,252,240,0.55);
    }
    .section-card h2 {
      font-family: var(--serif); font-size: 1.08rem; font-weight: 700;
      margin: 0 0 0.6rem 0; color: var(--ink);
      padding-bottom: 0.35rem; border-bottom: 1px dashed color-mix(in srgb, var(--m) 30%, transparent);
    }
    .section-card ul { list-style: none; margin: 0; padding: 0; }
    .section-card li {
      font-family: var(--sans); font-size: 0.82rem; color: var(--ink-soft);
      line-height: 1.35; padding: 0.22rem 0 0.22rem 1.1rem; position: relative;
    }
    .section-card li::before {
      content: "›"; position: absolute; left: 0; top: 0.18rem;
      color: var(--m); font-weight: 700;
    }

    .notfound { font-family: var(--sans); color: var(--ink-soft); }
    .notfound a { color: var(--accent-warm); }

    /* ── Rich room layout (Algebra; reusable for future rooms) ───── */
    .block { margin-bottom: 1.7rem; }
    .block-head { margin-bottom: 0.7rem; }
    .block-head h2 {
      font-family: var(--serif); font-size: 1.28rem; font-weight: 700;
      margin: 0; color: var(--ink); display: inline;
    }
    .block-head .tag {
      font-family: var(--sans); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--m);
      margin-left: 0.55rem; vertical-align: 0.15em;
    }
    .block-head p {
      font-family: var(--sans); font-size: 0.8rem; color: var(--ink-soft);
      margin: 0.25rem 0 0; line-height: 1.35;
    }

    /* Core topics */
    .topic-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .topic {
      font-family: var(--sans); font-size: 0.8rem; font-weight: 600; color: var(--ink);
      background: color-mix(in srgb, var(--m) 9%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 24%, transparent);
      border-left: 3px solid var(--m); border-radius: 3px; padding: 0.32rem 0.65rem;
    }

    /* Formula / rule cards */
    .formula-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.7rem; }
    .formula-card {
      background: linear-gradient(155deg, color-mix(in srgb, var(--m) 9%, var(--bg)), color-mix(in srgb, var(--m) 5%, var(--bg)));
      border: 1px solid color-mix(in srgb, var(--m) 22%, transparent);
      border-radius: 4px; padding: 0.7rem 0.85rem 0.75rem;
    }
    .f-name {
      font-family: var(--sans); font-size: 0.64rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--m); margin-bottom: 0.45rem;
    }
    .f-body {
      font-family: "Cambria Math", Cambria, Georgia, var(--serif);
      font-size: 1.05rem; color: var(--ink); line-height: 1.6;
    }
    .f-note { font-family: var(--sans); font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.5rem; line-height: 1.35; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.12rem; }
    .frac > span { padding: 0 0.35rem; }
    .frac .den { border-top: 1px solid currentColor; }

    /* Worked examples */
    .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 0.6rem; }
    details.ex {
      background: color-mix(in srgb, var(--m) 6%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 22%, transparent);
      border-radius: 4px; padding: 0.55rem 0.8rem 0.6rem;
    }
    details.ex > summary {
      cursor: pointer; list-style: none; font-family: var(--sans);
      font-size: 0.84rem; font-weight: 600; color: var(--ink); display: flex; gap: 0.45rem; align-items: baseline;
    }
    details.ex > summary::-webkit-details-marker { display: none; }
    details.ex > summary::before { content: "+"; color: var(--m); font-weight: 700; }
    details.ex[open] > summary::before { content: "\2212"; }
    .ex-q { font-family: "Cambria Math", Cambria, Georgia, serif; color: var(--ink); }
    .ex-steps { margin: 0.55rem 0 0; padding: 0; list-style: none; }
    .ex-steps li {
      font-family: var(--sans); font-size: 0.8rem; color: var(--ink-soft);
      line-height: 1.45; padding: 0.12rem 0 0.12rem 1.25rem; position: relative;
    }
    .ex-steps li::before { content: "\2192"; position: absolute; left: 0; color: var(--m); }
    .ex-ans {
      font-family: "Cambria Math", Cambria, Georgia, serif; font-weight: 700; color: var(--ink);
      margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px dashed color-mix(in srgb, var(--m) 30%, transparent);
    }
    .ex-ans b { color: var(--m); }

    /* Practice / tools */
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.6rem; }
    .tool {
      position: relative; display: block; text-decoration: none; color: var(--ink);
      background: color-mix(in srgb, var(--m) 5%, var(--bg));
      border: 1px dashed color-mix(in srgb, var(--m) 30%, transparent);
      border-radius: 4px; padding: 0.6rem 0.7rem 0.65rem;
    }
    .tool .t-name { font-family: var(--serif); font-weight: 700; font-size: 0.92rem; }
    .tool .t-desc { font-family: var(--sans); font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.22rem; line-height: 1.3; }
    .tool .t-badge {
      position: absolute; top: 0.5rem; right: 0.55rem;
      font-family: var(--sans); font-size: 0.52rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--m); background: color-mix(in srgb, var(--m) 12%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 30%, transparent); border-radius: 999px; padding: 0.1rem 0.4rem;
    }
    .tool.live { border-style: solid; transition: transform .12s, border-color .15s, background .2s; }
    .tool.live:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--m) 55%, transparent); background: color-mix(in srgb, var(--m) 11%, var(--bg)); }
    .tool.soon { opacity: 0.85; }

    /* Notes */
    .alg-notes {
      width: 100%; min-height: 130px; resize: vertical;
      font-family: ui-monospace, "Cascadia Code", monospace; font-size: 0.85rem; line-height: 1.5;
      color: var(--ink); background: color-mix(in srgb, var(--m) 4%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 26%, transparent); border-radius: 4px;
      padding: 0.7rem 0.8rem; outline: none;
    }
    .alg-notes:focus { border-color: var(--m); }
    .notes-status { font-family: var(--sans); font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.4rem; }

    /* Symbol library (click-to-copy cards) */
    .sym-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.7rem; }
    .sym-card {
      background: linear-gradient(155deg, color-mix(in srgb, var(--m) 9%, var(--bg)), color-mix(in srgb, var(--m) 5%, var(--bg)));
      border: 1px solid color-mix(in srgb, var(--m) 22%, transparent);
      border-radius: 4px; padding: 0.65rem 0.7rem 0.7rem;
    }
    .sym-card h3 {
      font-family: var(--sans); font-size: 0.64rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--m); margin: 0 0 0.5rem;
    }
    .sym-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .sym {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 2.5rem; padding: 0.28rem 0.35rem 0.3rem; cursor: pointer; user-select: none;
      background: color-mix(in srgb, var(--m) 7%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--m) 22%, transparent); border-radius: 4px;
      transition: background .12s, border-color .12s, transform .08s;
    }
    .sym:hover { background: color-mix(in srgb, var(--m) 18%, var(--bg)); border-color: color-mix(in srgb, var(--m) 50%, transparent); }
    .sym:active { transform: translateY(1px); }
    .sym.copied { background: color-mix(in srgb, var(--m) 32%, var(--bg)); border-color: var(--m); }
    .sym .g { font-family: "Cambria Math", Cambria, Georgia, serif; font-size: 1.15rem; line-height: 1.1; color: var(--ink); }
    .sym .n { font-family: var(--sans); font-size: 0.54rem; color: var(--ink-soft); margin-top: 0.18rem; text-align: center; line-height: 1.1; max-width: 4.2rem; }

    @media (max-width: 600px) {
      .room-title { font-size: 1.8rem; }
      .room-glyph-lg { font-size: 2.4rem; }
      .sections { grid-template-columns: 1fr; }
      .formula-grid, .examples, .tool-grid, .sym-groups { grid-template-columns: 1fr; }
    }
  </style>
</head>

            { name: "Logarithm rules", body: "log<sub>b</sub>(xy) = log<sub>b</sub>x + log<sub>b</sub>y<br>log<sub>b</sub>(x/y) = log<sub>b</sub>x &minus; log<sub>b</sub>y<br>log<sub>b</sub>(x<sup>n</sup>) = n&middot;log<sub>b</sub>x<br>change of base: log<sub>b</sub>x = <span class=\"frac\"><span class=\"num\">ln x</span><span class=\"den\">ln b</span></span>", note: "" },
            { name: "Factoring patterns", body: "GCF &rarr; grouping &rarr; ax<sup>2</sup>+bx+c<br>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> &minus; ab + b<sup>2</sup>)<br>a<sup>3</sup> &minus; b<sup>3</sup> = (a &minus; b)(a<sup>2</sup> + ab + b<sup>2</sup>)", note: "Try factors in order: common factor first, then a pattern." }
          ],
          examples: [
            { q: "Solve&nbsp; 3x + 5 = 20", steps: ["Subtract 5 from both sides: 3x = 15", "Divide both sides by 3"], ans: "x = <b>5</b>" },
            { q: "Factor&nbsp; x<sup>2</sup> + 5x + 6", steps: ["Find two numbers with product 6 and sum 5", "Those are 2 and 3"], ans: "(x + 2)(x + 3)" },
            { q: "Solve the system&nbsp; 2x + y = 7,&nbsp; x &minus; y = 2", steps: ["Add the equations: 3x = 9, so x = 3", "Substitute: 2(3) + y = 7"], ans: "x = <b>3</b>,&nbsp; y = <b>1</b>" },

        rich: {

          formulas: [
            { name: "Limit — idea & notation", body: "lim<sub>x&rarr;a</sub> f(x) = L", note: "f(x) heads toward L as x heads toward a — even if f(a) is undefined." },
            { name: "Power rule", body: "(x<sup>n</sup>)&prime; = n&middot;x<sup>n&minus;1</sup>", note: "" },
            { name: "Constant multiple rule", body: "(c&middot;f)&prime; = c&middot;f&prime;", note: "" },

            { name: "Common integrals", body: '&int; x<sup>n</sup> dx = <span class="frac"><span class="num">x<sup>n+1</sup></span><span class="den">n + 1</span></span> + C&nbsp; (n &ne; &minus;1)<br>&int; <span class="frac"><span class="num">1</span><span class="den">x</span></span> dx = ln|x| + C<br>&int; e<sup>x</sup> dx = e<sup>x</sup> + C', note: "" },

            { name: "Integration by substitution", body: "&int; f(g(x))&middot;g&prime;(x) dx = &int; f(u) du,&nbsp; u = g(x)", note: "Reverse of the chain rule." },
            { name: "Taylor series", body: 'f(x) = &Sigma;<sub>n=0</sub><sup>&infin;</sup> <span class="frac"><span class="num">f<sup>(n)</sup>(a)</span><span class="den">n!</span></span>(x &minus; a)<sup>n</sup>', note: "Maclaurin series is the special case a = 0." }

            { q: "Differentiate&nbsp; (2x + 1)<sup>5</sup>&nbsp; (chain rule)", steps: ["Outside: 5(2x + 1)<sup>4</sup>", "Inside derivative: 2", "Multiply"], ans: "10(2x + 1)<sup>4</sup>" },

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    var params = new URLSearchParams(location.search);
    var key = (params.get("room") || "").toLowerCase();
    var room = ROOMS[key];
    var main = document.getElementById("main");

    if (!room) {
      document.title = "Room not found — Mathematics";
      main.innerHTML =
        '<p class="notfound">That room doesn’t exist yet. ' +
        '<a href="./">← Back to Mathematics</a></p>';
      return;
    }

    document.title = room.name + " — Mathematics";
    document.documentElement.style.setProperty("--m", room.color);

    var html = "";
    html += '<nav class="crumb"><a href="./">Mathematics</a><span class="sep">/</span><span class="here">' + esc(room.name) + '</span></nav>';
    html += '<header class="room-head">';
    html += '<span class="room-glyph-lg">' + room.glyph + '</span>';
    html += '<div class="room-kicker">' + esc(room.kind) + '</div>';
    html += '<h1 class="room-title">' + esc(room.name) + '</h1>';
    html += '<p class="room-blurb">' + esc(room.blurb) + '</p>';
    var statusText = room.status || "Room in progress — structure ready, tools coming";
    html += '<div class="room-status"><span class="dot"></span>' + esc(statusText) + '</div>';
    html += '</header>';

    if (room.callout) html += '<div class="callout">' + room.callout + '</div>';

    if (room.rich) {
      html += richBody(room.rich);
    } else {
      html += '<div class="sections">';
      room.sections.forEach(function (sec) {
        html += '<div class="section-card"><h2>' + esc(sec.title) + '</h2><ul>';
        sec.items.forEach(function (it) { html += '<li>' + esc(it) + '</li>'; });
        html += '</ul></div>';
      });
      html += '</div>';
    }

    main.innerHTML = html;

    if (room.rich) initNotes(key);
    if (room.rich && room.rich.groups) initSymbolCopy();

    /* ---- Rich room renderer (raw HTML in formulas/examples is intentional) ---- */
    function block(title, tag, sub, inner) {
      var h = '<section class="block"><div class="block-head"><h2>' + esc(title) + '</h2>';
      if (tag) h += '<span class="tag">' + esc(tag) + '</span>';
      if (sub) h += '<p>' + esc(sub) + '</p>';
      h += '</div>' + inner + '</section>';
      return h;
    }
    function richBody(rich) {
      var h = "";

      // 1 · Core topics
      if (rich.topics) {
        h += block("Core Topics", "Map", "The territory this room covers.",
          '<div class="topic-grid">' +
          rich.topics.map(function (t) { return '<span class="topic">' + esc(t) + '</span>'; }).join("") +
          '</div>');
      }

      // 2 · Formula / rule cards
      if (rich.formulas) {
        h += block("Formula & Rule Cards", "Reference", "Clean, copy-from-the-page rules.",
          '<div class="formula-grid">' +
          rich.formulas.map(function (f) {
            return '<div class="formula-card"><div class="f-name">' + esc(f.name) + '</div>' +
                   '<div class="f-body">' + f.body + '</div>' +
                   (f.note ? '<div class="f-note">' + f.note + '</div>' : '') + '</div>';
          }).join("") +
          '</div>');
      }

      // 2b · Symbol library (click-to-copy group cards)
      if (rich.groups) {
        h += block("Symbol Library", "Click to copy", "Tap any symbol to copy it to your clipboard.",
          '<div class="sym-groups">' +
          rich.groups.map(function (g) {
            return '<div class="sym-card"><h3>' + esc(g.title) + '</h3><div class="sym-list">' +
              g.symbols.map(function (s) {
                return '<span class="sym" title="' + esc(s.n) + '"><span class="g">' + s.g + '</span><span class="n">' + esc(s.n) + '</span></span>';
              }).join("") +
              '</div></div>';
          }).join("") +
          '</div>');
      }

      // 3 · Worked / usage examples
      if (rich.examples) {
        h += block(rich.examplesTitle || "Worked Examples", "Practice", rich.examplesSub || "Click to reveal each solution.",
          '<div class="examples">' +
          rich.examples.map(function (ex) {
            return '<details class="ex"><summary><span class="ex-q">' + ex.q + '</span></summary>' +
                   '<ul class="ex-steps">' + ex.steps.map(function (s) { return '<li>' + s + '</li>'; }).join("") + '</ul>' +
                   '<div class="ex-ans">= ' + ex.ans + '</div></details>';
          }).join("") +
          '</div>');
      }

      // 4 · Practice / tools (scaffold)
      if (rich.tools) {
        h += block("Practice & Tools", "Coming soon", "Interactive helpers — scaffolded now, wired up later.",
          '<div class="tool-grid">' +
          rich.tools.map(function (t) {
            var cls = t.live ? "tool live" : "tool soon";
            var badge = t.live ? '<span class="t-badge">open</span>' : '<span class="t-badge">soon</span>';
            var inner = badge + '<div class="t-name">' + esc(t.name) + '</div><div class="t-desc">' + esc(t.desc) + '</div>';
            return t.href
              ? '<a class="' + cls + '" href="' + t.href + '">' + inner + '</a>'
              : '<div class="' + cls + '">' + inner + '</div>';
          }).join("") +
          '</div>');
      }

      // 5 · Notes (saved locally)
      h += block("Notes", "Saved locally", "Private to this browser — autosaves as you type.",
        '<textarea class="alg-notes" id="algNotes" placeholder="Scratch work, reminders, your own rules…" spellcheck="false"></textarea>' +
        '<div class="notes-status" id="algNotesStatus">Notes are stored only in this browser.</div>');

      return h;
    }

    /* ---- Symbol library: click-to-copy ---- */
    function initSymbolCopy() {
      var container = document.querySelector(".sym-groups");
      if (!container) return;
      container.addEventListener("click", function (e) {
        var chip = e.target.closest(".sym");
        if (!chip) return;
        copySymbol(chip.querySelector(".g").textContent, chip);
      });
    }
    function copySymbol(text, chip) {
      function flash() {
        var nameEl = chip.querySelector(".n");
        if (!chip.getAttribute("data-name")) chip.setAttribute("data-name", nameEl.textContent);
        chip.classList.add("copied");
        nameEl.textContent = "copied!";
        setTimeout(function () {
          chip.classList.remove("copied");
          nameEl.textContent = chip.getAttribute("data-name");
        }, 850);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(flash, function () { fallbackCopy(text); flash(); });
      } else { fallbackCopy(text); flash(); }
    }
    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    function initNotes(roomKey) {
      var ta = document.getElementById("algNotes");
      var status = document.getElementById("algNotesStatus");
      if (!ta) return;
      var storeKey = "mathlab.notes." + roomKey;
      var supported = true;
      try {
        var probe = "__t"; window.localStorage.setItem(probe, "1"); window.localStorage.removeItem(probe);
      } catch (e) { supported = false; }
      if (!supported) { status.textContent = "Saving unavailable in this browser context."; return; }

      try { ta.value = window.localStorage.getItem(storeKey) || ""; } catch (e) {}
      var t;
      ta.addEventListener("input", function () {
        status.textContent = "Saving…";
        clearTimeout(t);
        t = setTimeout(function () {
          try { window.localStorage.setItem(storeKey, ta.value); status.textContent = "Saved locally ✓"; }
          catch (e) { status.textContent = "Could not save (storage full?)."; }
        }, 350);
      });
    }
  })();
  </script>
