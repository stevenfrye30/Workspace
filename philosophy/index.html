<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Philosophy Shelf — Digital Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg:#f4ecd9; --panel:#faf5e8; --panel2:#efe6cf; --ink:#2e2417; --muted:#7a6a50;
  --accent:#8a6a14; --accent-deep:#b8901f; --accent2:#3a6b8c; --lapis:#3a6b8c;
  --line:#d8c9a6; --warm:#b05e20; --rust:#a04020; --sage:#5d7a3a;
  --gold-soft:rgba(138,106,20,0.45); --gold-faint:rgba(138,106,20,0.12);
  --papyrus-tint:rgba(138,106,20,0.03);
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
body {
  font-family:'Iowan Old Style', Georgia, 'Hoefler Text', serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at top, rgba(184,144,31,0.08), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 3px, var(--papyrus-tint) 3px 4px);
  color:var(--ink); line-height:1.6;
}
a { color:var(--accent2); } a:hover { color:var(--accent); }
header {
  padding:24px 28px 20px;
  background:linear-gradient(180deg,#efe4c8 0%, #f4ecd9 100%);
  border-bottom:3px double var(--gold-soft);
  position:relative; text-align:center;
}
header::before { content:''; position:absolute; left:28px; right:28px; top:6px; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); }
header h1 {
  margin:0 60px; font-size:30px; letter-spacing:6px; color:var(--accent);
  font-weight:normal; font-variant:small-caps;
  text-shadow:0 1px 0 rgba(255,255,255,0.6);
}
header h1::before { content:'𓂦'; margin-right:18px; font-size:1.1em; opacity:0.85; }
header h1::after  { content:'𓂧'; margin-left:18px;  font-size:1.1em; opacity:0.85; }
header p { margin:8px 0 0; color:var(--muted); font-style:italic; font-size:13px; letter-spacing:1px; }
header p::before { content:'❖  '; color:var(--accent-deep); font-style:normal; }
header p::after  { content:'  ❖'; color:var(--accent-deep); font-style:normal; }
.back-arrow {
  position:absolute; left:20px; top:50%; transform:translateY(-50%);
  font-size:22px; text-decoration:none; color:var(--muted); padding:6px 12px;
  border-radius:8px; transition:color .15s, background .15s;
}
.back-arrow:hover { color:var(--accent); background:var(--gold-faint); }
.doorway {
  display:flex; justify-content:flex-end; gap:10px; padding:10px 28px;
  background:#ece1c4; border-bottom:1px solid var(--line);
}
.doorway a {
  display:inline-block; text-decoration:none; color:var(--muted); white-space:nowrap;
  border:1px solid var(--line); border-radius:14px / 50%;
  padding:8px 18px; font-size:12px; letter-spacing:2px; text-transform:uppercase;
  background:linear-gradient(180deg, var(--panel), var(--panel2));
  transition:color .15s, border-color .15s;
}
.doorway a:hover { color:var(--accent); border-color:var(--gold-soft); }
main { padding:24px 28px 60px; max-width:1200px; margin:0 auto; }
.legend { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:6px 0 22px; font-size:12px; color:var(--muted); }
.legend .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:baseline; }
.legend .count { margin-left:auto; letter-spacing:1px; }
.wing { margin-bottom:34px; }
.wing > h2 {
  color:var(--accent); font-weight:normal; letter-spacing:3px; font-variant:small-caps;
  font-size:22px; margin:0 0 4px; padding-bottom:12px; position:relative;
}
.wing > h2::after {
  content:''; position:absolute; left:0; right:0; bottom:6px; height:3px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 30%, transparent 30.5%, transparent 32%, var(--accent-deep) 32.5%, var(--accent-deep) 100%);
  opacity:0.55;
}
.wing .range { color:var(--muted); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-left:14px; }
.wing .note { color:var(--muted); font-style:italic; margin:0 0 14px; max-width:80ch; font-size:14px; }
.authors { display:flex; flex-wrap:wrap; gap:9px; }
.author-btn {
  font-family:inherit; font-size:14px; color:var(--ink); cursor:pointer; white-space:nowrap;
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:9px 15px; display:flex; align-items:baseline; gap:8px;
  transition:border-color .2s, transform .15s, background .2s;
}
.author-btn:hover { border-color:var(--gold-soft); transform:translateY(-2px); background:linear-gradient(180deg, var(--panel), var(--panel2)); }
.author-btn.open { border-color:var(--accent-deep); background:linear-gradient(180deg, #caa53a, var(--accent-deep)); color:#fff8e8; font-weight:bold; }
.author-btn .n { font-size:11px; color:var(--muted); }
.author-btn.open .n { color:#f0e2b0; }
.author-btn .dot { width:7px; height:7px; border-radius:50%; background:var(--rust); align-self:center; }
.panel {
  background:var(--panel); border:1px solid var(--gold-soft); border-radius:10px;
  padding:20px 24px; margin-top:14px;
}
.panel .who { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.panel .who b { font-size:18px; color:var(--accent); font-weight:normal; letter-spacing:1px; }
.panel .who .dates { color:var(--muted); font-size:12px; letter-spacing:1px; }
.panel .who .room-link { margin-left:auto; font-size:13px; text-decoration:none; }
.panel .blurb { color:var(--muted); font-style:italic; font-size:13.5px; margin:8px 0 12px; max-width:82ch; }
.works { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:0 26px; }
.work { border-bottom:1px dotted var(--line); padding:9px 0; }
.work .t { font-style:italic; font-size:14.5px; }
.work .chip {
  font-size:10px; letter-spacing:1px; text-transform:uppercase; border-radius:3px;
  padding:2px 7px; margin-left:9px; white-space:nowrap; color:#fdf8ea; vertical-align:middle;
}
.work .ed { color:var(--muted); font-size:12.5px; margin-top:2px; }
footer { border-top:1px solid var(--line); margin-top:20px; padding:16px 28px; color:var(--muted); font-size:12.5px; text-align:center; font-style:italic; }
</style>
</head>
<body>
<header>
  <a class="back-arrow" href="../index.html" title="Back to the Archive">⟵</a>
  <h1>The Philosophy Shelf</h1>
  <p>the texts themselves, shelved by author — companion to the Compendium</p>
</header>
<div class="doorway">
  <a href="../philosophy/index.html">The Philosophy Room — 271 thinkers ⟶</a>
</div>
<main>
  <div class="legend" id="legend"></div>
  <div id="shelf"><p style="color:var(--muted);font-style:italic">Loading texts…</p></div>
</main>
<footer>Gap entries (rust) are the acquisitions list · the PD line sits at 1930 and advances every January 1 · structure drafted 2026-07-28</footer>
<script>
const CHIP = { pd:{c:'#5d7a3a',t:'PD ready'}, gap:{c:'#a04020',t:'PD gap'}, pointer:{c:'#3a6b8c',t:'religion shelf'} };
const ROOM = '../philosophy/index.html#/philosopher/';
// Names that differ between shelf and room, or have no room card — link only when a card exists.
const ROOM_ALIAS = { 'Marx & Engels':'Marx', 'Bādarāyaṇa + Śaṅkara':null, 'The Pre-Socratics':null, '→ Religion shelf':null };
let ROOM_NAMES = null; // filled from ../philosophy/data.json when reachable
function roomHref(name){
  let n = (name in ROOM_ALIAS) ? ROOM_ALIAS[name] : name;
  if (!n) return null;
  if (ROOM_NAMES && !ROOM_NAMES.has(n)) {
    const hit = [...ROOM_NAMES].find(r => r.includes(n) || n.includes(r));
    if (!hit) return null; n = hit;
  }
  return ROOM + encodeURIComponent(n);
}
let open = null;
function render(data){
  const shelf = document.getElementById('shelf');
  let nA=0, nW=0, nG=0;
  shelf.innerHTML = data.wings.map((wg,wi)=>{
    return `<section class="wing">
      <h2>${wg.name}<span class="range">${wg.range}</span></h2>
      <p class="note">${wg.note}</p>
      <div class="authors">${wg.authors.map((a,ai)=>{
        nA++; nW+=a.works.length;
        const g = a.works.some(w=>w.status==='gap'); if(g) nG+=a.works.filter(w=>w.status==='gap').length;
        const id = wi+'-'+ai;
        return `<button class="author-btn${open===id?' open':''}" data-id="${id}">
          <span>${a.name}</span><span class="n">${a.works.length}</span>${g&&open!==id?'<span class="dot"></span>':''}
        </button>`;
      }).join('')}</div>
      ${wg.authors.map((a,ai)=>{
        if(open!==wi+'-'+ai) return '';
        const href = roomHref(a.name);
        return `<div class="panel">
          <div class="who"><b>${a.name}</b><span class="dates">${a.dates}</span>
            ${href?`<a class="room-link" href="${href}">their card in the Room ⟶</a>`:''}</div>
          <p class="blurb">${a.blurb}</p>
          <div class="works">${a.works.map(w=>`<div class="work">
            <span class="t">${w.title}</span><span class="chip" style="background:${CHIP[w.status].c}">${CHIP[w.status].t}</span>
            <div class="ed">${w.edition}</div>
          </div>`).join('')}</div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');
  document.getElementById('legend').innerHTML =
    Object.values(CHIP).map(c=>`<span><span class="sw" style="background:${c.c}"></span>${c.t}</span>`).join('') +
    `<span class="count">${data.wings.length} wings · ${nA} authors · ${nW} texts · ${nG} PD gaps</span>`;
  shelf.querySelectorAll('.author-btn').forEach(b=>b.addEventListener('click',()=>{
    open = (open===b.dataset.id)? null : b.dataset.id;
    render(DATA);
    if(open){ const p=document.querySelector('.panel'); if(p){ const r=p.getBoundingClientRect(); if(r.bottom>innerHeight) window.scrollBy({top:r.top-90,behavior:'smooth'}); } }
  }));
}
let DATA = null;
(async ()=>{
  for (const p of ['../philosophy/texts.json','texts.json']) {
    try { const r = await fetch(p); if(r.ok){ DATA = await r.json(); break; } } catch(e){}
  }
  if(!DATA){ document.getElementById('shelf').innerHTML = '<p style="color:var(--rust)">Could not load texts.json — this page expects to live at archive/philosophy/ beside ../philosophy/texts.json.</p>'; return; }
  try { const r = await fetch('../philosophy/data.json'); if(r.ok){ const d = await r.json(); ROOM_NAMES = new Set(d.philosophers.map(p=>p.name)); } } catch(e){}
  if(location.hash){ const want = decodeURIComponent(location.hash.slice(1));
    DATA.wings.forEach((w,wi)=>w.authors.forEach((a,ai)=>{ if(a.name===want||a.name.includes(want)||want.includes(a.name)) open = wi+'-'+ai; })); }
  render(DATA);
})();
</script>
</body>
</html>
