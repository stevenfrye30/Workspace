<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Room</title>
  <meta name="description" content="A room inside the Science Lab.">
  <link rel="stylesheet" href="../_shared/hub-nav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e2a3a; --panel: #28384c; --fg: #e8ecf1; --muted: #8fa3ba;
      --border: #32445c; --gold: #d4a24c; --rule: #3a4d66; --c: #d4a24c;
    }
    body {
      font-family: Georgia, "Iowan Old Style", serif;
      background:
        radial-gradient(ellipse 90% 50% at 50% -10%, color-mix(in srgb, var(--c) 14%, transparent), transparent 60%),
        var(--bg);
      background-attachment: fixed; color: var(--fg); line-height: 1.5; min-height: 100vh;
    }
    .page { max-width: 1100px; margin: 0 auto; padding: 0.6rem 1.6rem 3rem; }

    .crumb { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.78rem; font-weight: 600; margin: 0.6rem 0 1rem; }
    .crumb a { color: var(--c); text-decoration: none; }
    .crumb a:hover { text-decoration: underline; }
    .crumb .sep { color: var(--muted); margin: 0 0.4rem; }
    .crumb .here { color: var(--muted); }

    .r-head { position: relative; border-bottom: 1px solid var(--c); padding-bottom: 1rem; margin-bottom: 1.3rem; }
    .r-glyph { position: absolute; top: -0.2rem; right: 0; font-size: 3.2rem; opacity: 0.3; }
    .r-kicker { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--c); font-weight: 700; }
    .r-title { font-size: 2.2rem; font-weight: 600; margin: 0.15rem 0 0; }
    .r-blurb { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.92rem; color: var(--muted); margin-top: 0.45rem; max-width: 50rem; line-height: 1.5; }
    .r-status { display: inline-flex; align-items: center; gap: 0.4rem; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.7rem; font-weight: 600; color: var(--c);
      background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); border-radius: 999px; padding: 0.22rem 0.7rem; margin-top: 0.8rem; }
    .r-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

    .callout { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.84rem; line-height: 1.5; color: var(--fg);
      background: color-mix(in srgb, var(--c) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
      border-left: 3px solid var(--c); border-radius: 3px; padding: 0.7rem 0.9rem; margin: 0 0 1.4rem; }
    .callout b { color: var(--c); }

    .block { margin-bottom: 1.7rem; }
    .block-head { margin-bottom: 0.7rem; }
    .block-head h2 { display: inline; font-size: 1.2rem; font-weight: 600; }
    .block-head .tag { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); margin-left: 0.55rem; vertical-align: 0.15em; }
    .block-head p { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    .topic-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .topic { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--fg);
      background: color-mix(in srgb, var(--c) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
      border-left: 3px solid var(--c); border-radius: 3px; padding: 0.32rem 0.65rem; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 0.7rem; }
    .card { background: linear-gradient(155deg, color-mix(in srgb, var(--c) 12%, var(--panel)), var(--panel)); border: 1px solid var(--border); border-radius: 4px; padding: 0.7rem 0.85rem 0.75rem; }
    .card .c-name { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); margin-bottom: 0.45rem; }
    .card .c-body { font-size: 1rem; line-height: 1.55; }
    .card .c-note { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.35; }

    /* Worked examples (click-to-expand) */
    .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 0.6rem; }
    details.ex { background: color-mix(in srgb, var(--c) 7%, var(--panel)); border: 1px solid var(--border); border-radius: 4px; padding: 0.55rem 0.8rem 0.6rem; }
    details.ex > summary { cursor: pointer; list-style: none; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.84rem; font-weight: 600; color: var(--fg); display: flex; gap: 0.45rem; align-items: baseline; }
    details.ex > summary::-webkit-details-marker { display: none; }
    details.ex > summary::before { content: "+"; color: var(--c); font-weight: 700; }
    details.ex[open] > summary::before { content: "\2212"; }
    .ex-q { font-family: Georgia, serif; color: var(--fg); }
    .ex-steps { margin: 0.55rem 0 0; padding: 0; list-style: none; }
    .ex-steps li { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.78rem; color: var(--muted); line-height: 1.45; padding: 0.12rem 0 0.12rem 1.25rem; position: relative; }
    .ex-steps li::before { content: "\2192"; position: absolute; left: 0; color: var(--c); }
    .ex-ans { font-family: Georgia, serif; font-weight: 700; color: var(--fg); margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px dashed color-mix(in srgb, var(--c) 30%, transparent); }
    .ex-ans b { color: var(--c); }

    /* element card preview (periodic table) */
    .elcard { display: inline-flex; flex-direction: column; width: 5.4rem; padding: 0.5rem 0.6rem; border: 1px solid var(--c); border-radius: 4px; background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
    .elcard .z { font-family: -apple-system, sans-serif; font-size: 0.62rem; color: var(--muted); }
    .elcard .sym { font-size: 1.9rem; font-weight: 700; line-height: 1; color: var(--c); }
    .elcard .nm { font-family: -apple-system, sans-serif; font-size: 0.66rem; color: var(--fg); margin-top: 0.15rem; }
    .elcard .ms { font-family: -apple-system, sans-serif; font-size: 0.6rem; color: var(--muted); }

    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.6rem; }
    .lnk { position: relative; display: block; text-decoration: none; color: var(--fg);
      background: color-mix(in srgb, var(--c) 7%, var(--panel)); border: 1px solid var(--border); border-radius: 4px; padding: 0.6rem 0.75rem; }
    .lnk.live { transition: transform 0.12s, border-color 0.15s, background 0.2s; }
    .lnk.live:hover { transform: translateY(-1px); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
    .lnk.soon { border-style: dashed; opacity: 0.85; }
    .lnk .l-name { font-family: -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 0.9rem; }
    .lnk .l-desc { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.3; }
    .lnk .l-badge { position: absolute; top: 0.5rem; right: 0.55rem; font-family: -apple-system, sans-serif; font-size: 0.52rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); border-radius: 999px; padding: 0.1rem 0.4rem; }

    .sci-notes { width: 100%; min-height: 150px; resize: vertical; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 0.85rem; line-height: 1.5;
      color: var(--fg); background: color-mix(in srgb, var(--c) 6%, #1a2433); border: 1px solid var(--border); border-radius: 4px; padding: 0.7rem 0.8rem; outline: none; }
    .sci-notes:focus { border-color: var(--c); }
    .sci-notes.tall { min-height: 280px; }
    .notes-status { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.7rem; color: var(--muted); margin-top: 0.4rem; }

    /* ── Interactive periodic table (periodic-table room only) ───── */
    .pt-wrap { display: grid; grid-template-columns: minmax(0,1fr) 18rem; gap: 1rem; align-items: start; }
    .pt-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.7rem; }
    .pt-search { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 0.82rem; color: var(--fg);
      background: #1a2433; border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.6rem; min-width: 12rem; outline: none; }
    .pt-search:focus { border-color: var(--c); }
    .pt-clear { font-family: -apple-system, sans-serif; font-size: 0.72rem; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 0.35rem 0.6rem; cursor: pointer; }
    .pt-clear:hover { color: var(--fg); border-color: var(--c); }
    .pt-count { font-family: -apple-system, sans-serif; font-size: 0.72rem; color: var(--muted); }

    .pt-scroll { overflow-x: auto; padding-bottom: 0.4rem; }
    .pt-grid { display: grid; grid-template-columns: repeat(18, minmax(2.05rem, 1fr)); gap: 2px; min-width: 41rem; }
    .pt-cell { position: relative; aspect-ratio: 1 / 1; border: 1px solid color-mix(in srgb, var(--cat,#888) 55%, transparent);
      background: color-mix(in srgb, var(--cat,#888) 20%, var(--panel)); border-radius: 2px; cursor: pointer; padding: 1px 0 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; text-align: center;
      transition: transform 0.08s, box-shadow 0.12s, opacity 0.12s; }
    .pt-cell:hover, .pt-cell.sel { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--cat,#fff), 0 4px 10px -4px var(--cat,#000); z-index: 2; }
    .pt-cell .z { font-family: -apple-system, sans-serif; font-size: 0.46rem; color: var(--muted); position: absolute; top: 1px; left: 2px; }
    .pt-cell .sym { font-family: Georgia, serif; font-weight: 700; font-size: 0.85rem; color: var(--fg); }
    .pt-cell .nm { font-family: -apple-system, sans-serif; font-size: 0.34rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pt-cell.dim { opacity: 0.16; }
    .pt-marker { grid-column: 3; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; font-size: 0.5rem; color: var(--muted); border: 1px dashed var(--border); border-radius: 2px; }

    .pt-legend { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.8rem 0; }
    .pt-leg { font-family: -apple-system, sans-serif; font-size: 0.6rem; font-weight: 600; color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.45rem; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }
    .pt-leg .sw { width: 9px; height: 9px; border-radius: 2px; }
    .pt-leg.off { opacity: 0.38; }

    .pt-detail { background: var(--panel); border: 1px solid var(--border); border-top: 3px solid var(--cat,var(--c)); border-radius: 4px; padding: 0.85rem 0.95rem; position: sticky; top: 0.6rem; }
    .pt-detail .d-top { display: flex; align-items: baseline; gap: 0.6rem; }
    .pt-detail .d-sym { font-family: Georgia, serif; font-weight: 700; font-size: 2.2rem; color: var(--cat,var(--c)); line-height: 1; }
    .pt-detail .d-z { font-family: -apple-system, sans-serif; font-size: 0.72rem; color: var(--muted); }
    .pt-detail .d-name { font-size: 1.25rem; font-weight: 600; margin-top: 0.1rem; }
    .pt-detail .d-cat { font-family: -apple-system, sans-serif; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cat,var(--c)); margin-top: 0.15rem; }
    .pt-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; margin: 0.7rem 0 0; font-family: -apple-system, sans-serif; font-size: 0.76rem; }
    .pt-detail dt { color: var(--muted); }
    .pt-detail dd { color: var(--fg); }
    .pt-detail .d-desc { font-family: -apple-system, sans-serif; font-size: 0.78rem; color: var(--fg); line-height: 1.45; margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
    .pt-detail .d-rel { font-family: -apple-system, sans-serif; font-size: 0.74rem; color: var(--muted); line-height: 1.4; margin-top: 0.5rem; }
    .pt-detail .d-rel b { color: var(--cat,var(--c)); font-weight: 600; }

    @media (max-width: 760px) { .pt-wrap { grid-template-columns: 1fr; } .pt-detail { position: static; } }

    .notfound { font-family: -apple-system, "Segoe UI", sans-serif; color: var(--muted); }
    .notfound a { color: var(--gold); }

    @media (max-width: 600px) { .r-title { font-size: 1.7rem; } .r-glyph { font-size: 2.4rem; } .card-grid, .links, .examples { grid-template-columns: 1fr; } }
  </style>

          { name: "Michaelis–Menten", body: "v = V<sub>max</sub>[S] / (K<sub>m</sub> + [S])", note: "Rate vs substrate for a simple enzyme." },
          { name: "K<sub>m</sub> and V<sub>max</sub>", body: "K<sub>m</sub> = [S] at ½V<sub>max</sub> (lower K<sub>m</sub> = tighter binding). V<sub>max</sub> = rate at saturation.", note: "" },
          { name: "Lineweaver–Burk", body: "1/v = (K<sub>m</sub>/V<sub>max</sub>)(1/[S]) + 1/V<sub>max</sub>", note: "Double-reciprocal: linearizes Michaelis–Menten." },
          { name: "pH and pK<sub>a</sub>", body: "When [HA] = [A⁻], pH = pK<sub>a</sub>. Below pK<sub>a</sub> the group is protonated.", note: "" },
          { name: "Henderson–Hasselbalch", body: "pH = pK<sub>a</sub> + log([A⁻] / [HA])", note: "Biological buffers: bicarbonate, phosphate, protein side chains." },
          { name: "ATP hydrolysis", body: "ATP + H₂O → ADP + P<sub>i</sub> + energy (ΔG°′ ≈ −30.5 kJ/mol).", note: "The cell's energy currency." },
          { name: "Redox carriers", body: "NAD⁺/NADH and FAD/FADH₂ shuttle electrons to the electron transport chain.", note: "" },
          { name: "Glycolysis (net)", body: "Glucose → 2 pyruvate + 2 ATP + 2 NADH.", note: "Cytoplasm; no O₂ required for the pathway itself." },
          { name: "TCA cycle", body: "Oxidizes acetyl-CoA → CO₂, yielding NADH, FADH₂, and GTP.", note: "Mitochondrial matrix." },
          { name: "Oxidative phosphorylation", body: "ETC pumps H⁺ → proton gradient → ATP synthase makes ATP; O₂ is the final e⁻ acceptor.", note: "Most ATP is made here." },
          { name: "DNA base pairing", body: "A–T (2 H-bonds), G–C (3 H-bonds); antiparallel strands.", note: "" },
          { name: "RNA vs DNA", body: "RNA: single-stranded, ribose, uracil (U). DNA: double-stranded, deoxyribose, thymine (T).", note: "" },
          { name: "Membrane phospholipid", body: "Amphipathic: hydrophilic head + two hydrophobic tails → forms a bilayer.", note: "" },
          { name: "Hydrophobic effect", body: "Nonpolar groups cluster to minimize disruption of water's H-bonding.", note: "Drives protein folding and membrane assembly." },
          { name: "Central dogma", body: "DNA → (transcription) → RNA → (translation) → protein.", note: "" },

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    var params = new URLSearchParams(location.search);
    var ROOM_ALIAS = { "symbols-units": "data-analysis" };  // merged into Data, Symbols & Units
    var key = (params.get("room") || "").toLowerCase();
    if (ROOM_ALIAS[key]) key = ROOM_ALIAS[key];
    var room = ROOMS[key];
    var main = document.getElementById("main");

    if (!room) {
      document.title = "Room not found — Science Lab";
      main.innerHTML = '<p class="notfound" style="margin-top:1.5rem;">That room doesn’t exist yet. <a href="./">← Back to the Science Lab</a></p>';
      return;
    }

    document.title = room.name + " — Science Lab";
    document.documentElement.style.setProperty("--c", room.color);

    var TAGLABEL = { room: "room", math: "math lab", archive: "coursework", quiz: "quiz", soon: "soon" };
    var h = "";
    h += '<nav class="crumb"><a href="./">Science Lab</a><span class="sep">/</span><span class="here">' + esc(room.name) + '</span></nav>';
    h += '<header class="r-head"><span class="r-glyph">' + room.glyph + '</span>' +
         '<div class="r-kicker">' + esc(room.kind) + '</div>' +
         '<h1 class="r-title">' + esc(room.name) + '</h1>' +
         '<p class="r-blurb">' + esc(room.blurb) + '</p>' +
         '<div class="r-status"><span class="dot"></span>' + esc(room.status || "Scaffold ready") + '</div></header>';

    if (room.callout) h += '<div class="callout">' + room.callout + '</div>';

    if (key === "periodic-table") h += periodicTableBlock();

    if (room.topics) {
      h += '<section class="block"><div class="block-head"><h2>Core Topics</h2><span class="tag">Map</span><p>The territory this room covers.</p></div>' +
        '<div class="topic-grid">' + room.topics.map(function (t) { return '<span class="topic">' + esc(t) + '</span>'; }).join("") + '</div></section>';
    }

    if (room.cards) {
      h += '<section class="block"><div class="block-head"><h2>Reference Cards</h2><span class="tag">Bench notes</span><p>Compact reminders — fuller material in the Class Archive.</p></div>' +
        '<div class="card-grid">' + room.cards.map(function (c) {
          return '<div class="card"><div class="c-name">' + esc(c.name) + '</div><div class="c-body">' + c.body + '</div>' +
            (c.note ? '<div class="c-note">' + c.note + '</div>' : '') + '</div>';
        }).join("") + '</div></section>';
    }

    if (room.examples) {
      h += '<section class="block"><div class="block-head"><h2>Worked Examples</h2><span class="tag">Practice</span><p>Click to reveal each solution.</p></div>' +
        '<div class="examples">' + room.examples.map(function (ex) {
          return '<details class="ex"><summary><span class="ex-q">' + ex.q + '</span></summary>' +
            '<ul class="ex-steps">' + ex.steps.map(function (s) { return '<li>' + s + '</li>'; }).join("") + '</ul>' +
            '<div class="ex-ans">= ' + ex.ans + '</div></details>';
        }).join("") + '</div></section>';
    }

    if (room.links) {
      h += '<section class="block"><div class="block-head"><h2>Tools &amp; Connections</h2><span class="tag">Links</span><p>Where this room connects across the labs and your coursework.</p></div>' +
        '<div class="links">' + room.links.map(function (l) {
          var cls = l.href ? "lnk live" : "lnk soon";
          var badge = '<span class="l-badge">' + esc(TAGLABEL[l.tag] || "soon") + '</span>';
          var inner = badge + '<div class="l-name">' + esc(l.name) + '</div><div class="l-desc">' + esc(l.desc) + '</div>';
          return l.href ? '<a class="' + cls + '" href="' + l.href + '">' + inner + '</a>' : '<div class="' + cls + '">' + inner + '</div>';
        }).join("") + '</div></section>';
    }

    // Notes (saved locally per room, key scilab.notes.<room>)
    var notesPh = room.notesPlaceholder || "Notes, definitions, reminders…";
    var notesCls = "sci-notes" + (room.notesTall ? " tall" : "");
    h += '<section class="block"><div class="block-head"><h2>Notes</h2><span class="tag">Saved locally</span><p>Private to this browser — autosaves as you type.</p></div>' +
      '<textarea class="' + notesCls + '" id="sciNotes" placeholder="' + notesPh + '" spellcheck="false"></textarea>' +
      '<div class="notes-status" id="sciNotesStatus">Notes are stored only in this browser.</div></section>';

    main.innerHTML = h;
    initNotes(key);
    if (key === "periodic-table") initPeriodicTable();

    function initNotes(roomKey) {
      var ta = document.getElementById("sciNotes");
      var status = document.getElementById("sciNotesStatus");
      if (!ta) return;
      var storeKey = "scilab.notes." + roomKey;
      var ok = true;
      try { var p = "__t"; window.localStorage.setItem(p, "1"); window.localStorage.removeItem(p); } catch (e) { ok = false; }
      if (!ok) { status.textContent = "Saving unavailable in this browser context."; return; }
      try { ta.value = window.localStorage.getItem(storeKey) || ""; } catch (e) {}
      var t;
      ta.addEventListener("input", function () {
        status.textContent = "Saving…";
        clearTimeout(t);
        t = setTimeout(function () {
          try { window.localStorage.setItem(storeKey, ta.value); status.textContent = "Saved locally ✓"; }
          catch (e) { status.textContent = "Could not save (storage full?)."; }
        }, 350);
      });
    }

    /* ── Interactive periodic table ─────────────────────────────── */
    function sup(n) { var m = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹" }; return String(n).split("").map(function (d) { return m[d] || d; }).join(""); }
    function electronConfig(z) {
      var order = [["1s",2],["2s",2],["2p",6],["3s",2],["3p",6],["4s",2],["3d",10],["4p",6],["5s",2],["4d",10],["5p",6],["6s",2],["4f",14],["5d",10],["6p",6],["7s",2],["5f",14],["6d",10],["7p",6]];
      var nobles = [[86,"Rn"],[54,"Xe"],[36,"Kr"],[18,"Ar"],[10,"Ne"],[2,"He"]];
      var core = null, i;
      for (i = 0; i < nobles.length; i++) { if (nobles[i][0] < z) { core = nobles[i]; break; } }
      var coreZ = core ? core[0] : 0, rem = z, cum = 0, parts = [];
      for (var j = 0; j < order.length && rem > 0; j++) {
        var cap = order[j][1], start = cum, put = Math.min(cap, rem);
        rem -= put; cum += put;
        if (start >= coreZ) parts.push(order[j][0] + sup(put));
      }
      return (core ? "[" + core[1] + "] " : "") + parts.join(" ");
    }
    function gridPos(el) {
      if (el.c === "lanthanide") return { x: 3 + (el.z - 57), y: 8 };
      if (el.c === "actinide") return { x: 3 + (el.z - 89), y: 9 };
      return { x: el.g, y: el.p };
    }
    function periodicTableBlock() {
      return '<section class="block"><div class="block-head"><h2>Interactive Periodic Table</h2><span class="tag">Instrument</span>' +
        '<p>Click any element for its detail card. Search by name, symbol, or atomic number; tap a category in the legend to filter.</p></div>' +
        '<div class="pt-controls"><input class="pt-search" id="ptSearch" type="text" placeholder="Search name, symbol, or number…" autocomplete="off" spellcheck="false">' +
        '<button class="pt-clear" id="ptClear" type="button">Clear</button><span class="pt-count" id="ptCount"></span></div>' +
        '<div class="pt-legend" id="ptLegend"></div>' +
        '<div class="pt-wrap"><div class="pt-scroll"><div class="pt-grid" id="ptGrid"></div></div><div class="pt-detail" id="ptDetail"></div></div></section>';
    }
    function initPeriodicTable() {
      var grid = document.getElementById("ptGrid");
      var legend = document.getElementById("ptLegend");
      var detail = document.getElementById("ptDetail");
      var search = document.getElementById("ptSearch");
      var clearBtn = document.getElementById("ptClear");
      var count = document.getElementById("ptCount");
      if (!grid || !detail) return;
      var byZ = {}, tileByZ = {}, activeCat = null;

      // legend
      Object.keys(CATS).forEach(function (code) {
        var c = CATS[code];
        var b = document.createElement("button");
        b.className = "pt-leg"; b.type = "button"; b.setAttribute("data-cat", code);
        b.innerHTML = '<span class="sw" style="background:' + c.color + '"></span>' + c.label;
        b.addEventListener("click", function () {
          activeCat = (activeCat === code) ? null : code;
          Array.prototype.forEach.call(legend.children, function (ch) {
            ch.classList.toggle("off", activeCat && ch.getAttribute("data-cat") !== activeCat);
          });
          applyFilter();
        });
        legend.appendChild(b);
      });

      // grid cells
      ELEMENTS.forEach(function (el) {
        byZ[el.z] = el;
        var pos = gridPos(el);
        var t = document.createElement("button");
        t.className = "pt-cell"; t.type = "button";
        t.style.gridColumn = pos.x; t.style.gridRow = pos.y;
        t.style.setProperty("--cat", CATS[el.c].color);
        t.innerHTML = '<span class="z">' + el.z + '</span><span class="sym">' + el.s + '</span><span class="nm">' + el.n + '</span>';
        t.addEventListener("click", function () { selectEl(el.z); });
        grid.appendChild(t);
        tileByZ[el.z] = t;
      });
      // f-block markers in the main table
      [[6, "57–71"], [7, "89–103"]].forEach(function (mk) {
        var d = document.createElement("div");
        d.className = "pt-marker"; d.style.gridColumn = 3; d.style.gridRow = mk[0]; d.textContent = mk[1];
        grid.appendChild(d);
      });

      function selectEl(z) {
        var el = byZ[z]; if (!el) return;
        var cat = CATS[el.c];
        detail.style.setProperty("--cat", cat.color);
        var r = REL[z] || {};
        var ox = r.ox || "—";
        var grp = (el.g != null) ? el.g : (el.c === "lanthanide" ? "Lanthanide" : (el.c === "actinide" ? "Actinide" : "—"));
        var desc = r.desc || (cat.label + " — " + (CATDESC[el.c] || ""));
        var rel = "";
        if (r.bio) rel += '<div class="d-rel"><b>Biology:</b> ' + r.bio + '</div>';
        if (r.lab) rel += '<div class="d-rel"><b>Lab:</b> ' + r.lab + '</div>';
        if (r.phys) rel += '<div class="d-rel"><b>Physics:</b> ' + r.phys + '</div>';
        detail.innerHTML =
          '<div class="d-top"><span class="d-sym">' + el.s + '</span><span class="d-z">Z ' + el.z + '</span></div>' +
          '<div class="d-name">' + el.n + '</div><div class="d-cat">' + cat.label + '</div>' +
          '<dl>' +
          '<dt>Atomic mass</dt><dd>' + el.m + '</dd>' +
          '<dt>Group</dt><dd>' + grp + '</dd>' +
          '<dt>Period</dt><dd>' + el.p + '</dd>' +
          '<dt>Config</dt><dd>' + electronConfig(el.z) + '</dd>' +
          '<dt>Oxidation</dt><dd>' + ox + '</dd>' +
          '</dl>' +
          '<div class="d-desc">' + desc + '</div>' + rel +
          '<div class="d-rel" style="margin-top:0.6rem;opacity:0.8;">↳ Explore in the Chemistry, Biochemistry, and Physics rooms below.</div>';
        Object.keys(tileByZ).forEach(function (k) { tileByZ[k].classList.remove("sel"); });
        tileByZ[z].classList.add("sel");
      }

      function applyFilter() {
        var q = (search.value || "").trim().toLowerCase();
        var isNum = /^[0-9]+$/.test(q), shown = 0;
        ELEMENTS.forEach(function (el) {
          var okCat = !activeCat || el.c === activeCat;
          var okQ = !q || (isNum ? (String(el.z) === q) : (el.n.toLowerCase().indexOf(q) >= 0 || el.s.toLowerCase().indexOf(q) >= 0));
          var vis = okCat && okQ;
          tileByZ[el.z].classList.toggle("dim", !vis);
          if (vis) shown++;
        });
        count.textContent = shown + " of " + ELEMENTS.length + " shown";
      }

      search.addEventListener("input", function () {
        applyFilter();
        var q = search.value.trim().toLowerCase();
        if (!q) return;
        var matches = ELEMENTS.filter(function (el) {
          return /^[0-9]+$/.test(q) ? String(el.z) === q : (el.n.toLowerCase().indexOf(q) >= 0 || el.s.toLowerCase() === q);
        });
        if (matches.length === 1) selectEl(matches[0].z);
      });
      search.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          var q = search.value.trim().toLowerCase();
          var m = ELEMENTS.filter(function (el) { return el.n.toLowerCase().indexOf(q) >= 0 || el.s.toLowerCase() === q || String(el.z) === q; });
          if (m.length) selectEl(m[0].z);
        }
      });
      clearBtn.addEventListener("click", function () {
        search.value = ""; activeCat = null;
        Array.prototype.forEach.call(legend.children, function (ch) { ch.classList.remove("off"); });
        applyFilter(); search.focus();
      });

      applyFilter();
      selectEl(6); // default: carbon, the center of organic life
    }
  })();
  </script>
