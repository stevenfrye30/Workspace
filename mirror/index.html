<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════════════════
  THE INVARIANT — the front layer is a control panel.

  Nothing on an instrument card may appear, disappear, move or resize
  because of what has been logged or saved. Not a chip, not a row, not a
  button, not a label. The card you reach for is the same shape after a
  hundred entries as it was before the first, so the thing you are aiming
  at is where it was last time.

  VALUES MAY CHANGE; GEOMETRY MAY NOT. The macro bar's numbers move, the
  Intake tabs carry a running count, the sleep button turns to "Entered ✓" —
  all fine, because none of them moves anything. A row of chips that grew
  with the activities you had logged is not fine, and is why this is
  written down: the button you were reaching for shifted down the card
  because of something you did last week.

  Data grows in the deeper layers only — the popovers, the Tracker,
  Records, the Overview. That is what they are for.

  AUDITED, and where each card stands:
    Food      macro bar (three fixed cells, numbers only), search, three
              fixed buttons. No list — it had one, and it grew. The status
              line under it speaks for the food library's network state,
              never for your data.
    Hygiene   five buttons, always five; a mark is a fill, not a row.
    Intake    six tabs and a fixed three-button slot — fully static; the
              "exact amount" fold went, because opening it grew the card.
              What the slot shows branches on the TAB you are on, never on
              what is in the log; the counts on the tabs are values.
    Movement  two rows of four tiles (six categories + the Workouts and
              Build doors) over a fill slot with a HARD height and overflow
              hidden — never min-height, which drifts. Values in the slot
              move (readouts, chip labels, Enter's state); its box never
              does. Lists that grow (remembered moves) live in fixed-height
              windows that scroll internally.
    How       five dot rows, a sleep track, two buttons — fixed. The "saved"
              note in the heading is absolutely positioned, so it costs no
              layout, and Enter -> "Entered ✓" is a button changing state.
    Log grid  six tiles, always six.

  Two things OUTSIDE the instrument cards do still change with data, both in
  the launchpad column, both deliberate: the birthday line appears when a
  birthday is near, and the launchpad grows a pill per link you add. They
  are a notice and a set of doors rather than instruments. If either ever
  needs to obey this too, it moves behind a button the way Movement's
  types did.
  ══════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a6a3e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1e24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" id="themeColor" content="#8a6a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirror">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪞</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f6f1e6; --panel:#fffdf7; --panel2:#efe8d8;
    --ink:#2a2620; --dim:#7a6f5e; --line:rgba(42,38,32,.12);
    --accent:#8a6a3e; --accent2:#5b7a55; --warn:#a85a3a;
    --shadow:0 1px 2px rgba(42,38,32,.05);
    --water:#4a7a9b; --coffee:#7a5232; --other:#3e7070;
    --alcohol:#7a4a7a; --nicotine:#6b6b6b; --weed:#4a7a4a;
  }
  body.theme-dark {
    --bg:#1c1e24; --panel:#24262e; --panel2:#2d3039;
    --ink:#e8e4dc; --dim:#9a948a; --line:rgba(232,228,220,.1);
    --accent:#c89b60; --accent2:#8fb080; --warn:#d87a5a;
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --water:#7aa8c8; --coffee:#b08055; --other:#6ba0a0;
    --alcohol:#a87aa8; --nicotine:#9a9a9a; --weed:#7aab7a;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    padding: 0 14px calc(40px + env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  /* 720px is a reading width. Three columns of it are ~228px each, which is
     too narrow for the intake tiles and the macro bar — so compact mode gets
     a dashboard width instead. */
  @media (min-width: 900px)  { body.dense { max-width: 1120px; } }
  @media (min-width: 1240px) { body.dense { max-width: 1440px; } }

  /* ---------- top bar ---------- */
  /* Three tracks so the title is centred on the page, not merely pushed
     around by whatever happens to sit either side of it. */
  .top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: calc(12px + env(safe-area-inset-top)) 0 10px;
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  .top h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; text-align: center; }
  .top .home {
    justify-self: start; display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none; color: var(--dim); font-size: .78rem;
    padding: 5px 10px; border-radius: 999px; border: 1px solid transparent;
  }
  .top .home:hover { color: var(--accent); border-color: var(--line); background: var(--panel); }
  .top .tools { justify-self: end; display: flex; align-items: center; gap: 6px; }
  /* On a phone the four tools plus a labelled link overrun the row, so the
     words drop away and the glyphs carry it. */
  @media (max-width: 560px) {
    .top .home .lbl, .top #undoBtn .lbl { display: none; }
    .top .home { padding: 5px 7px; }
    .top .tools { gap: 4px; }
    .icon-btn { padding: 5px 7px; }
  }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: .8rem;
    cursor: pointer; line-height: 1;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- date strip ---------- */
  /* A plain inline row, not a panel: it is a control, not a section. */
  .datestrip {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0; margin-bottom: 14px;
  }
  .datestrip .lbl { font-size: .7rem; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
  .datestrip input[type=date] {
    font: inherit; font-size: .78rem; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  body.dense .datestrip { margin-bottom: 12px; }
  body.dense .datestrip .chip { padding: 4px 11px; }
  .backdate-warn { width: 100%; font-size: .74rem; color: var(--warn); }

  /* ---------- the daily grid ----------
     CSS columns rather than grid: cards are wildly different heights, and
     this is the one layout that packs them without leaving holes. */
  /* Four assigned columns, priority-ordered. Each is an independent stack —
     align-items:start keeps a tall column from stretching its neighbours. */
  .daily { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
  @media (min-width: 900px)  { .daily { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1240px) { body.dense .daily { grid-template-columns: repeat(4, 1fr); } }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  body.dense .daily, body.dense .col { gap: 10px; }
  .col > .card { margin-bottom: 0; }

  /* ---------- cards ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  body.dense .card { padding: 11px; margin-bottom: 10px; border-radius: 10px; }
  .card > h2 {
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--dim); margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    position: relative; text-align: center; min-height: 1.1em;
  }
  /* Pinned rather than laid out, so a long note cannot shove the title
     off-centre. */
  .card > h2 .note, .card > h2 .sum {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    margin-left: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  body.dense .card > h2 { font-size: .66rem; margin-bottom: 8px; }
  .card > h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .saved { color: var(--accent2); }

  .rowlabel { font-size: .78rem; color: var(--dim); margin: 10px 0 5px; }
  .rowlabel:first-of-type { margin-top: 0; }
  /* A section label with its own small action on the end of it. */
  .rowlabel.splitlabel { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hr { height: 1px; background: var(--line); margin: 11px 0 9px; }

  /* ---------- dot rows (1-5 scales) ----------
     Label beside the dots, not above: five stacked scales used to cost ten
     lines of height, which is most of why the card felt long. */
  .dotline { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .dotline .dl { flex: 0 0 4.4rem; font-size: .74rem; color: var(--dim); }
  .dotline .dots { flex: 1; min-width: 0; }
  body.dense .dotline { gap: 7px; margin-bottom: 4px; }
  body.dense .dotline .dl { flex-basis: 3.9rem; font-size: .7rem; }

  .dots { display: flex; gap: 7px; }
  .dots button {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 999px; padding: 0;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
    transition: background .12s, border-color .12s, transform .1s;
  }
  .dots button:hover { border-color: var(--accent); }
  .dots button:active { transform: scale(.92); }
  .dots button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  body.dense .dots { gap: 6px; }
  body.dense .dots button { width: 30px; height: 30px; }

  /* ---------- the sleep track ---------- */
  .sleeptrack {
    position: relative; height: 34px; margin-top: 4px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--line);
    touch-action: none; cursor: pointer;
  }
  .sleepfill {
    position: absolute; top: 0; bottom: 0;
    background: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .sleephandle {
    position: absolute; top: 50%; width: 22px; height: 30px; margin-left: -11px;
    transform: translateY(-50%); border-radius: 7px; cursor: grab;
    background: var(--accent); border: 1px solid var(--accent); padding: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.28);
  }
  /* A 22px grip is the right size to look at and the wrong size to hit with a
     thumb, so the touch target is widened past the paint. Overlap when the two
     handles are close is harmless — a tap that lands on neither moves whichever
     is nearer anyway. */
  .sleephandle::after { content: ''; position: absolute; inset: -8px -12px; }
  .sleephandle:active { cursor: grabbing; }
  .sleephandle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #sleepWake { background: var(--accent2); border-color: var(--accent2); }
  .sleepticks {
    display: flex; justify-content: space-between; margin-top: 3px;
    font-size: .58rem; color: var(--dim);
  }
  .sleepread { flex: 1; min-width: 0; font-size: .8rem; color: var(--ink); }
  .sleepread b { font-variant-numeric: tabular-nums; }
  body.dense .sleeptrack { height: 30px; }
  body.dense .sleephandle { height: 26px; }

  /* ---------- chips ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 6px 13px; font: inherit; font-size: .8rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.theme-dark .chip[aria-pressed="true"] { color: #1c1e24; }
  .chip.ghost { border-style: dashed; color: var(--dim); }
  /* Safety net: a stray long label must never blow out the row. */

  /* ---------- inputs ---------- */
  input[type=text], input[type=number], input[type=password], textarea, select {
    font: inherit; font-size: .88rem; width: 100%;
    padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 60px; }
  .field { margin-top: 9px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline > * { min-width: 0; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  body.theme-dark button.primary { color: #1c1e24; }
  button.primary:hover { filter: brightness(1.08); }
  /* The same button at the same size, without the fill — for a pair where one
     side is the daily act and the other is the occasional one. Padding is a
     pixel short of .primary's on each side so the 1px border lands them on
     exactly the same box. */
  button.secondary {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 17px; font: inherit; font-size: .85rem;
    font-weight: 600; cursor: pointer;
  }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }
  button.secondary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- tabbed, colour-tinted boxes (drinks + substances) ----------
     The whole card takes the active tab's hue, so what you're about to log
     is unmistakable without reading anything. */
  /* The hue identifies the active tab; it does not need to wash the whole
     card to do that. A 3px inset cap, the header text and the active tab
     carry it, and the body stays the same panel as every other card. */
  .boxed {
    background: var(--panel);
    box-shadow: inset 0 3px 0 var(--c, var(--accent)), var(--shadow);
    transition: box-shadow .18s;
  }
  .boxed > h2 { color: var(--c, var(--dim)); }
  .boxed > h2 .note { color: var(--ink); font-weight: 600; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tabs button {
    flex: 1 1 30%; min-width: 0; cursor: pointer; font: inherit; font-size: .7rem;
    padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .14s, color .14s, border-color .14s;
  }
  .tabs button:hover { border-color: var(--tc); color: var(--tc); }
  .tabs button[aria-selected="true"] {
    background: var(--tc); border-color: var(--tc); color: #fff; font-weight: 600;
  }
  body.theme-dark .tabs button[aria-selected="true"] { color: #1c1e24; }
  .tabs button .n { font-size: .62rem; opacity: .75; margin-left: 3px; }
  body.dense .tabs { gap: 3px; margin-bottom: 8px; }
  body.dense .tabs button { font-size: .66rem; padding: 5px 3px; }

  /* A fixed slot: three buttons whatever the tab, so switching kinds never
     resizes the card. */
  .quick {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    align-content: center; min-height: 40px;
  }
  body.dense .quick { min-height: 36px; }
  /* The chosen-form tag rides IN the button row rather than on a line of its
     own — a reserved empty line read as dead space on the four tabs that
     never use it. One row either way, so the height still cannot move. */
  .quick.has-tag { grid-template-columns: auto repeat(3, 1fr); }
  .quick .chip { padding: 2px 9px; font-size: .7rem; align-self: center; }
  .namefield { grid-column: 1 / -1; display: flex; gap: 6px; }
  /* The name field borrows the step buttons' exact box metrics, so the slot is
     the same height on Other as on every other tab and the card never twitches
     as you move between them. (Its Enter button is already a `.quick button`.) */
  .namefield input {
    flex: 1; min-width: 0;
    font-size: .8rem; padding: 11px 9px; line-height: 1.15;
  }
  body.dense .namefield input { font-size: .76rem; padding: 9px 9px; }
  .quick button {
    cursor: pointer; font: inherit; font-size: .8rem; font-weight: 600; padding: 11px 4px;
    border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
    background: var(--panel); color: var(--c);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .quick button:hover { background: var(--c); color: #fff; border-color: var(--c); }
  body.theme-dark .quick button:hover { color: #1c1e24; }
  body.dense .quick button { padding: 9px 4px; font-size: .76rem; }
  .quick button .u { font-size: .6rem; font-weight: 400; opacity: .7; margin-left: 1px; }


  /* ---------- movement ----------
     Two rows of four tiles — six categories and the two workout doors —
     over a fill slot with a HARD height and overflow hidden. Values in the
     slot change; its box never does. Never min-height: it drifts. */
  .excats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .excat {
    min-width: 0; padding: 8px 2px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel2); color: var(--ink);
    font: inherit; font-size: .72rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    transition: background .12s, border-color .12s;
  }
  .excat:hover { border-color: var(--accent); }
  .excat[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 16%, var(--panel2));
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  /* The doors: dashed border, accent text — openings, not categories. */
  .excat.door { border-style: dashed; background: var(--panel); color: var(--accent); }
  body.dense .excat { padding: 7px 2px; font-size: .68rem; }

  .exslot {
    height: 248px;              /* HARD height + overflow hidden, per the invariant */
    overflow: hidden;
    margin-top: 9px;
    display: flex; flex-direction: column;
  }
  body.dense .exslot { height: 228px; }
  .exempty {
    flex: 1; display: grid; place-items: center;
    color: var(--dim); font-style: italic; font-size: .8rem;
  }
  .expanel { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .exline { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .exlab {
    flex: 0 0 46px; font-size: .6rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .exchip {
    flex: 1 1 0; min-width: 0; padding: 6px 2px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel2); color: var(--ink);
    font: inherit; font-size: .72rem; font-weight: 600; text-align: center; white-space: nowrap;
  }
  .exchip:hover { border-color: var(--accent); }
  .exchip:active { transform: scale(.95); }
  /* The running total: dashed because it is a readout, not a button — but
     tapping it clears the accumulator, and hover says so. */
  .exread {
    flex: 0 0 56px; padding: 6px 2px; border-radius: 8px; cursor: pointer;
    border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent);
    background: none; color: var(--ink);
    font: inherit; font-size: .72rem; font-weight: 600; text-align: center;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
  }
  .exread.zero { color: var(--dim); border-color: var(--line); }
  .exread:hover { border-color: var(--warn); color: var(--warn); }
  .expanel .dots { gap: 5px; }
  .exspace { flex: 1; }
  .exkcal {
    height: 15px; flex: 0 0 15px; font-size: .68rem; color: var(--dim);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .exenter { width: 100%; }
  .exenter[disabled] { opacity: .45; cursor: default; }

  /* The seven sleep chips wrapped to a second row inside a column, which cost
     nearly 40px on the tallest card in the grid. Narrower chips fit one row. */
  body.dense .card > .field:last-child .primary { padding: 8px 15px; }

  .icon-btn[disabled] { opacity: .35; cursor: default; }
  .icon-btn[disabled]:hover { color: var(--dim); border-color: var(--line); }

  /* ---------- food ---------- */
  .macrobar { display: flex; gap: 8px; margin-bottom: 12px; }
  .macrobar .m { flex: 1 1 0; min-width: 0; }     /* min-width:0 or the numbers push the row wide */
  .macrobar .m .k {
    font-size: .64rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .macrobar .m .v {
    font-size: .95rem; font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .macrobar .m .v .u { font-size: .6rem; color: var(--dim); font-weight: 400; }
  body.dense .macrobar { gap: 6px; margin-bottom: 10px; }
  body.dense .macrobar .m .v { font-size: .88rem; }
  .macrobar .bar { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .macrobar .bar > span { display: block; height: 100%; background: var(--accent2); }
  .macrobar .bar > span.over { background: var(--warn); }

  .searchwrap { position: relative; margin-top: 10px; }
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .results:empty { display: none; }
  .results button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 9px 12px; font: inherit;
    font-size: .84rem; color: var(--ink); cursor: pointer;
  }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button.sel { background: var(--panel2); }
  .results .meta { display: block; font-size: .68rem; color: var(--dim); }
  .results .none { padding: 10px 12px; font-size: .8rem; color: var(--dim); font-style: italic; }
  /* Inside the meal builder the popover already scrolls, so an absolutely
     positioned dropdown would be clipped by it. */
  .results.flat { position: static; max-height: 190px; margin-top: 6px; box-shadow: none; }

  .foodstatus { font-size: .72rem; color: var(--dim); font-style: italic; }

  /* ---------- hygiene ----------
     Five glyphs in two rows. No words in ink: a label beside each would be
     three lines of text explaining five taps, and an icon-only control's
     name belongs in title/aria-label, which is where these keep theirs.
     A mark is a fill, never a row, so the card cannot grow. 44px is the
     floor in both densities — a touch target is not a place to save space. */
  .hyg { display: flex; flex-direction: column; gap: 8px; }
  .hyg .hrow { display: flex; gap: 8px; }
  .hyg button {
    flex: 1 1 0; min-width: 44px; min-height: 44px;
    display: grid; place-items: center; padding: 0;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 1.15rem; line-height: 1; cursor: pointer;
    transition: background .12s, border-color .12s, transform .1s;
  }
  .hyg button:hover { border-color: var(--accent2); }
  .hyg button:active { transform: scale(.96); }
  .hyg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hyg button[aria-pressed="true"] { background: var(--accent2); border-color: var(--accent2); }

  /* The two ways into the food card, weighted by how often each is used.
     Meals takes the row and the accent; "your own food" is a square that
     carries its name in title/aria-label rather than in ink. */
  /* 1 1 0, not 1 1 auto: Build and Meals split the row down the middle
     whatever their words happen to measure. */
  .foodactions { display: flex; gap: 8px; margin-top: 9px; }
  .foodactions .grow { flex: 1 1 0; min-width: 0; }
  .sqbtn {
    flex: 0 0 40px; display: grid; place-items: center; padding: 0;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; font: inherit; font-size: 1rem; line-height: 1; cursor: pointer;
  }
  .sqbtn:hover { color: var(--accent); border-color: var(--accent); }
  .sqbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- the quantity stepper ----------
     One control, three places: a meal about to be logged, an ingredient in
     one, a portion in the picker. It reads as a single object rather than
     three buttons, because it is answering one question. */
  .qty {
    display: inline-flex; align-items: center; flex: 0 0 auto;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  }
  .qty button {
    width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
    background: none; border: 0; border-radius: 7px; color: var(--ink);
    font: inherit; font-size: .95rem; line-height: 1; cursor: pointer;
  }
  .qty button:hover:not([disabled]) { color: var(--accent); }
  .qty button[disabled] { opacity: .32; cursor: default; }
  .qty button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .qty .q {
    min-width: 22px; text-align: center; font-size: .82rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- meal rows (the list, and the builder's ingredients) ----------
     Name on its own line, controls under it. One line would fit on a laptop
     and overflow a phone, and the popover is 92vw wide there. */
  .meals { margin-top: 10px; }
  .mealrow { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mealrow:last-child { border-bottom: 0; }
  .mealrow .mh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .mealrow .mh .nm {
    flex: 1; min-width: 0; font-size: .86rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mealrow .mh .tiny { white-space: nowrap; }
  .mealrow .ma { display: flex; align-items: center; gap: 7px; }
  .mealrow .ma .sp { flex: 1; min-width: 4px; }
  .mealrow .ma input { width: auto; }
  .mealrow .ma .x { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; }
  .mealrow .ma .x:hover { color: var(--warn); }
  button.primary.sm { padding: 7px 16px; font-size: .8rem; }
  .pinbtn { background: none; border: 0; cursor: pointer; font: inherit; font-size: .95rem; color: var(--dim); padding: 0 4px; }
  .pinbtn.on { color: var(--accent); }

  /* ---------- your day ---------- */
  .feed { display: flex; flex-direction: column; }
  .feed .row {
    display: flex; align-items: baseline; gap: 9px;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .85rem;
  }
  .feed .row:last-child { border-bottom: 0; }
  .feed .t { font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 48px; }
  .feed .ic { width: 1.2em; text-align: center; }
  .feed .tx { flex: 1; min-width: 0; }
  .feed .x {
    background: none; border: 0; color: var(--dim); cursor: pointer;
    font: inherit; font-size: .95rem; padding: 0 2px; line-height: 1; opacity: 0;
  }
  .feed .row:hover .x, .feed .x:focus { opacity: 1; }
  .feed .x:hover { color: var(--warn); }

  .empty { color: var(--dim); font-size: .84rem; font-style: italic; padding: 6px 0; }
  .tiny { font-size: .74rem; color: var(--dim); }
  .list { margin-top: 10px; }
  .list .row {
    display: flex; align-items: baseline; gap: 8px; font-size: .84rem;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .list .row:last-child { border-bottom: 0; }
  .list .row .x { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; margin-left: auto; }
  .list .row .x:hover { color: var(--warn); }

  /* ---------- launchpad ----------
     Stacked icon-over-label tiles cost 226px — more than half the instrument
     grid — to hold nine links. Labelled pills cost about 40px. Icon-only
     pills cost one row and stay one row as you add your own: you recognise
     Gmail's envelope without reading the word, and the name is still there
     on hover and for a screen reader. */
  .launch { display: flex; flex-wrap: wrap; gap: 6px; }
  .launch a, .launch .pend, .launch .add {
    display: grid; place-items: center; position: relative; text-decoration: none;
    width: 34px; height: 34px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); font: inherit; font-size: .74rem; line-height: 1;
  }
  .launch a:hover { border-color: var(--accent); color: var(--accent); }
  .launch a:focus-visible, .launch .add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .launch .ic { font-size: 1.02rem; line-height: 1; }
  /* A drawn glyph sits where an emoji would; block kills the baseline gap. */
  .launch .ic svg { display: block; }
  .launch .pend { opacity: .4; }
  .launch .pend .soon { display: none; }       /* the dimming already says it */
  .launch .mine .del {
    position: absolute; top: -5px; right: -5px;
    width: 15px; height: 15px; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
    cursor: pointer; color: var(--dim); font-size: .6rem; padding: 0; opacity: 0;
  }
  .launch .mine:hover .del, .launch .mine:focus-within .del { opacity: 1; }
  .launch .mine .del:hover { color: var(--warn); border-color: var(--warn); }
  .launch .add { border-style: dashed; color: var(--dim); cursor: pointer; }
  body.dense .launch a, body.dense .launch .pend, body.dense .launch .add { width: 31px; height: 31px; }
  .launchrow { margin: 0 0 16px; }
  body.dense .launchrow { margin-bottom: 13px; }
  .bdayline { margin-top: 10px; font-size: .78rem; color: var(--dim); }
  .bdayline b { color: var(--ink); font-weight: 600; }

  /* ---------- the log grid ----------
     Four drawers, each opening onto a row of "＋ Add" buttons, charged a tap
     for nothing: the drawer's summary counted things whose full lists live on
     Records, and the button you actually wanted sat underneath it. Six tiles,
     one per thing you log, one tap each. Money and Values are wider because
     both open onto a choice rather than a plain form. */
  .loggrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .logtile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    padding: 12px 4px; min-height: 64px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    color: var(--dim); font: inherit; font-size: .64rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em; cursor: pointer;
    white-space: nowrap; overflow: hidden;
  }
  .logtile:hover { border-color: var(--accent); color: var(--accent); }
  .logtile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .logtile .ic { font-size: 1.2rem; letter-spacing: 0; line-height: 1; }
  .logtile.wide { grid-column: span 2; }
  body.dense .logtile { min-height: 56px; padding: 9px 4px; }
  /* Two across on a phone; the wide pair each take a full row. */
  @media (max-width: 560px) { .loggrid { grid-template-columns: repeat(2, 1fr); } }

  /* A row of choices inside a form — money categories, value words. */
  .pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button {
    flex: 1; padding: 8px 4px; font: inherit; font-size: .78rem; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
    color: var(--dim); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.theme-dark .seg button[aria-pressed="true"] { color: #1c1e24; }
  .mdy { display: grid; grid-template-columns: 1.3fr 1fr 1.2fr; gap: 6px; }
  .checkline { display: flex; align-items: center; gap: 7px; margin-top: 11px; font-size: .8rem; color: var(--dim); }
  .checkline input { width: auto; margin: 0; }

  .sum {
    margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--dim); font-size: .74rem; text-align: right;
  }
  .mini {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 7px; padding: 3px 9px; font: inherit; font-size: .7rem; cursor: pointer;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .valchips .chip { cursor: default; }

  /* ---------- weekly review ---------- */
  .wk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 520px) { .wk { grid-template-columns: repeat(2, 1fr); } }
  .wk .c { background: var(--panel2); border-radius: 9px; padding: 8px 10px; }
  .wk .c .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .wk .c .v { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .wk .c .v .u { font-size: .6rem; color: var(--dim); font-weight: 400; }
  .wkdays { display: flex; gap: 4px; margin-top: 12px; }
  .wkdays .d { flex: 1; text-align: center; font-size: .6rem; color: var(--dim); }
  .wkdays .d .box {
    height: 22px; border-radius: 5px; background: var(--panel2);
    border: 1px solid var(--line); margin-bottom: 3px;
  }
  .wkdays .d .box.on { background: var(--accent2); border-color: var(--accent2); }
  .wknote { margin-top: 12px; font-size: .8rem; color: var(--ink); }
  .wknote .l { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .wknote .l:last-child { border-bottom: 0; }
  .wknote .l .dt { font-size: .68rem; color: var(--dim); margin-right: 7px; }

  /* ---------- popover ---------- */
  .pop-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
  .pop-back.open { display: block; }
  .pop {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 380px); max-height: 80vh; overflow: auto; z-index: 41;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  .pop h3 { font-size: .95rem; margin-bottom: 10px; }
  /* The overview is a reading surface, not a form, so it gets the room. */
  .pop.wide { width: min(94vw, 620px); }

  /* ---------- the overview room ----------
     One layer past the dashboard, reached through the title. The dashboard
     answers "what am I logging right now"; this answers "what does it add up
     to". Deliberately no scores and no streaks: a streak turns a record into
     something you can fail, and then into something you stop keeping. */
  .ov { margin-top: 15px; }
  .ov:first-of-type { margin-top: 4px; }
  .ov > h4 {
    font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    color: var(--dim); margin-bottom: 8px;
  }
  .ovstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  @media (max-width: 460px) { .ovstats { grid-template-columns: repeat(2, 1fr); } }
  .ovstats .c { background: var(--panel2); border-radius: 9px; padding: 9px 10px; }
  .ovstats .c .k { font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .ovstats .c .v { font-size: 1.02rem; font-weight: 600; margin-top: 2px; }
  .ovstats .c .v .u { font-size: .64rem; font-weight: 400; color: var(--dim); }
  .ovhab { display: flex; flex-direction: column; gap: 6px; }
  .ovhab .h { display: flex; align-items: center; gap: 9px; font-size: .8rem; }
  .ovhab .h .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovhab .h .wk { display: flex; gap: 3px; }
  .ovhab .h .wk i { width: 11px; height: 11px; border-radius: 3px; background: var(--panel2); }
  .ovhab .h .wk i.on { background: var(--accent2); }
  .ovhab .h .n { font-size: .72rem; color: var(--dim); min-width: 46px; text-align: right; }
  .ovrecent { display: flex; flex-direction: column; gap: 5px; }
  .ovrecent .r { display: flex; gap: 8px; font-size: .8rem; align-items: baseline; }
  .ovrecent .r .ic { width: 17px; text-align: center; }
  .ovrecent .r .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovrecent .r .dt { font-size: .68rem; color: var(--dim); white-space: nowrap; }
  .pop .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .top h1 button {
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit; letter-spacing: inherit;
  }
  .top h1 button:hover { color: var(--accent); }
  .top h1 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .hint { display: block; font-size: .72rem; color: var(--dim); margin-top: 2px; }

  .nudge {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 8px 12px; margin-bottom: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--warn) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
    font-size: .78rem; color: var(--ink);
  }
  .nudge[hidden] { display: none; }
  .nudge span { flex: 1; min-width: 12rem; }

  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px); z-index: 60;
    background: var(--ink); color: var(--bg); font-size: .8rem;
    padding: 9px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .foot { text-align: center; color: var(--dim); font-size: .72rem; padding: 18px 0 4px; }
  .foot a { color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="top">
  <a class="home" href="../" title="Back to the workspace"><span class="arw">←</span><span class="lbl">Workspace</span></a>
  <h1><button type="button" id="overviewBtn" title="What this adds up to">Mirror</button></h1>
  <span class="tools">
    <button class="icon-btn" id="undoBtn" title="Nothing to undo" disabled>↶<span class="lbl"> Undo</span></button>
    <button class="icon-btn" id="densityBtn" title="Compact / roomy">▣</button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark">☾</button>
    <button class="icon-btn" id="syncBtn" title="Sync is off">○</button>
    <button class="icon-btn" id="dataBtn" title="Forever-copy, restore, snapshots">Data</button>
  </span>
</div>

<div class="nudge" id="nudge" hidden>
  <span id="nudgeMsg"></span>
  <button class="mini" id="nudgeGo">Save a forever-copy</button>
  <button class="mini" id="nudgeLater" title="Hide until more changes pile up">Later</button>
</div>
<input type="file" id="restoreFile" accept="application/json,.json" style="display:none">

<div class="datestrip">
  <span class="lbl">Logging for</span>
  <button class="chip" id="dTodayBtn">Today</button>
  <button class="chip" id="dYestBtn">Yesterday</button>
  <input type="date" id="dPick">
  <div class="backdate-warn" id="backdateWarn" hidden></div>
</div>

<!-- ============ THE DAILY GRID ============ -->
<!-- Four assigned columns, ordered by how often each is touched, rather than
     masonry. Masonry packs tightly but decides placement by height — which is
     how the drink controls once ended up below the fold. Assigned columns cost
     a little whitespace and never move.

     Each column is its own stack, so a long food list cannot stretch the one
     beside it. Stacked on a phone the DOM order is already the priority order:
     Food, Intake, Movement, How you are, then the rest. -->
<div class="daily">

  <div class="col">
  <div class="card" id="foodCard">
    <h2>Food</h2>
    <div class="macrobar" id="foodMacros"></div>
    <div class="searchwrap">
      <input type="text" id="foodSearch" placeholder="Search foods…" autocomplete="off">
      <div class="results" id="foodResults"></div>
    </div>
    <!-- Making a meal and logging one are different jobs, so they are
         different buttons rather than one door with the other hidden behind
         it. They split the row equally; only the fill separates them, because
         you build a meal once and log it for months. Defining a food of your
         own stays the rarer, one-off act and keeps the square on the end —
         its name lives in title/aria-label. -->
    <div class="foodactions">
      <button class="secondary grow" id="buildBtn" type="button">Build</button>
      <button class="primary grow" id="mealsBtn" type="button">Meals</button>
      <button class="sqbtn" id="customFoodBtn" type="button"
              title="Add your own food" aria-label="Add your own food">＋</button>
    </div>
    <!-- No list here on purpose. What you log lands in the Tracker, like
         everything else on this page, so the card you are aiming at is the
         same height after a meal as it was before one. -->
    <div class="foodstatus" id="foodStatus"></div>
  </div>

  <!-- Five things you either did today or didn't. Under Food because it is
       the other half of looking after yourself, and because column 1 had the
       room the moment the food list left it. -->
  <div class="card" id="hygieneCard">
    <h2>Hygiene</h2>
    <div class="hyg" id="hygRows"></div>
  </div>
  </div>

  <div class="col">
  <!-- Intake — one instrument, six tabs. Drinks and Substances were the same
       control twice; they differ only in the unit each kind is measured in,
       so that is the only thing the card branches on. Storage is unchanged:
       water -> body.water, coffee/other -> body.drinks, the rest ->
       body.substances. -->
  <div class="card boxed" id="intakeCard">
    <h2>Intake <span class="note" id="intakeTotal"></span></h2>
    <div class="tabs" id="intakeTabs"></div>
    <div class="quick" id="intakeQuick"></div>
    <!-- No "exact amount…" fold: it expanded the card when opened, which is
         exactly what THE INVARIANT forbids. The quick buttons are the only
         path; an unusual amount is a couple of taps instead of a form. -->
  </div>

  <!-- Two rows of four, then a fixed fill slot. Six category tiles fill the
       slot with that category's quick-log; Workouts and Build are the two
       doors to the saved sessions — dashed, because they are doors, not
       categories. The slot is a HARD height with overflow hidden (never
       min-height, which drifts), so nothing that happens inside it can move
       the card face (THE INVARIANT, top of file). -->
  <div class="card narrow" id="movementCard">
    <h2>Movement</h2>
    <div class="excats" id="exCats">
      <button class="excat" type="button" data-excat="walk">🚶 Walk</button>
      <button class="excat" type="button" data-excat="run">🏃 Run</button>
      <button class="excat" type="button" data-excat="bike">🚴 Bike</button>
      <button class="excat door" type="button" id="wkListBtn" title="Saved workouts">📋 Workouts</button>
      <button class="excat" type="button" data-excat="lift">🏋 Lift</button>
      <button class="excat" type="button" data-excat="stretch">🧘 Stretch</button>
      <button class="excat" type="button" data-excat="other">✳️ Other</button>
      <button class="excat door" type="button" id="wkBuildBtn" title="Build a workout">＋ Build</button>
    </div>
    <div class="exslot" id="exSlot"></div>
  </div>
  </div>

  <div class="col">
  <!-- How you are — one form replacing three that each asked for mood and
       energy separately (the old Today pulse, the Body check-in, and the
       Daily Card), with sleep folded in so it doesn't need its own card. -->
  <div class="card">
    <h2>How you are <span class="note saved" id="pulseSaved"></span></h2>
    <div class="dotline"><span class="dl">Mood</span><div class="dots" id="dMood"></div></div>
    <div class="dotline"><span class="dl">Energy</span><div class="dots" id="dEnergy"></div></div>
    <div class="dotline"><span class="dl">Fatigue</span><div class="dots" id="dFatigue"></div></div>
    <div class="dotline"><span class="dl">Soreness</span><div class="dots" id="dSore"></div></div>
    <div class="dotline"><span class="dl">Comfort</span><div class="dots" id="dComfort"></div></div>
    <div class="hr"></div>
    <div class="rowlabel">Sleep</div>
    <div class="sleeptrack" id="sleepTrack">
      <div class="sleepfill" id="sleepFillA"></div>
      <div class="sleepfill" id="sleepFillB"></div>
      <button class="sleephandle" id="sleepBed" type="button" role="slider"
              aria-label="Bedtime" aria-valuemin="0" aria-valuemax="24"></button>
      <button class="sleephandle" id="sleepWake" type="button" role="slider"
              aria-label="Wake time" aria-valuemin="0" aria-valuemax="24"></button>
    </div>
    <div class="sleepticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
    <div class="field inline" style="margin-top:6px">
      <div class="sleepread" id="sleepRead"></div>

<div class="card">

  <div class="feed" id="feed"></div>

  <h2>This week <span class="sum" id="sumWeek"></span></h2>
