/* =============================================================
   THE TRACKER — every instrument empties into here.

   Ordered by _at (when you entered it), not by t (the time of day it is
   about). Those differ whenever you backdate, and "the order I put things
   in" is the one that makes a running log make sense.
   ============================================================= */
function renderFeed() {
  $('feedDate').textContent = fmtDay(day);
  const rows = [];
  /* Sort on _up, not _at. For a logged entry they're the same, but a habit
     record was created the day you defined the habit — ticking it today has
     to place it where you tapped it, not months ago. Same for the pulse and
     sleep rows, which upsert into one record per day. */
  const push = (rec, ic, tx, del) => rows.push({
    at: (rec && (rec._up || rec._at)) || '', t: (rec && (rec.t || rec.time)) || '', ic, tx, del,
  });

  onDay(state.body.water).forEach((r) =>
    push(r, '💧', round1(r.oz) + ' oz water',
      () => dropRecord(state.body.water, r.id, round1(r.oz) + ' oz water')));
  onDay(state.body.drinks).forEach((r) =>
    push(r, (intakeMeta(r.kind) || {}).icon || '🥤', describeIntake(r.kind, r),
      () => dropRecord(state.body.drinks, r.id, describeIntake(r.kind, r))));
  onDay(state.body.substances).forEach((r) =>
    push(r, (intakeMeta(r.kind) || {}).icon || '•', describeIntake(r.kind, r),
      () => dropRecord(state.body.substances, r.id, describeIntake(r.kind, r))));
  /* A workout was replayed into its exercises, which is what it is in the
     data — but not what you did. The rows that share a `workoutLogId`
     collapse back into the one session, exactly as a meal's rows do. */
  const workouts = new Map();
  onDay(state.body.exercise).forEach((r) => {
    if (r.workoutLogId) {
      const g = workouts.get(r.workoutLogId) || { rows: [], first: r };
      g.rows.push(r); workouts.set(r.workoutLogId, g);
      return;
    }
    const icon = (r.cat && EXCATS[r.cat]) ? EXCATS[r.cat].icon : '🏃';
    const text = r.cat ? moveLine(r) : r.type + (r.minutes ? ' · ' + r.minutes + ' min' : '');
    push(r, icon, text, () => dropRecord(state.body.exercise, r.id, r.cat ? (r.label || r.type) : r.type));
  });
  workouts.forEach((g) => {
    const min = g.rows.reduce((n, r) => n + (Number(r.minutes) || 0), 0);
    const label = g.first.workoutName || 'workout';
    push(g.first, '🏋', label + (min ? ' · ' + min + ' min' : ''),
      // Removing the line removes the session: every row it stood for, each
      // with its own tombstone, and one press of Undo to put it all back.
      () => dropGroup(state.body.exercise, g.rows, label));
  });
  /* A meal was replayed into its ingredients, which is what it is in the
     data — but not what you did. The rows that share a `mealLogId` collapse
     back into the one thing you ate. */
  const meals = new Map();
  onDay(state.body.food).forEach((r) => {
    if (r.mealLogId) {
      const g = meals.get(r.mealLogId) || { rows: [], first: r };
      g.rows.push(r); meals.set(r.mealLogId, g);
      return;
    }
    push(r, '🍽', foodLine(r), () => dropRecord(state.body.food, r.id, r.foodName));
  });
  meals.forEach((g) => {
    const kc = g.rows.reduce((n, r) => n + (kcalOf(r) || 0), 0);
    const times = Math.max(1, Math.round(Number(g.first.mealQty) || 1));
    const label = (times > 1 ? times + '× ' : '') + (g.first.mealName || 'meal');
    push(g.first, '🍱', label + (kc ? ' · ' + Math.round(kc) + ' kcal' : ''),
      // Removing the line removes the meal: every row it stood for, each with
      // its own tombstone, and one press of Undo to put it all back.
      () => dropGroup(state.body.food, g.rows, label));
  });
  onDay(state.body.symptoms).forEach((r) =>
    push(r, '⚕', r.note, () => dropRecord(state.body.symptoms, r.id, r.note)));

  /* The marks all hang off one record per day, so they share its `_up` and
     sit together in the order they are listed on the card. Removing one here
     un-marks it — the same act as tapping it again, and undoable the same way. */
  const hyg = hygieneOn(day);
  if (hyg) HYGIENE_MARKS.forEach(([key, glyph, name]) => {
    if (hyg[key] === true) push(hyg, glyph, name, () => setHygiene(key, name, false));
  });

  onDay(state.body.sleep).forEach((r) => {
    const nap = (r.kind || 'overnight') === 'nap';
    const when = (r.start != null && r.end != null) ? ' · ' + fmtHour(r.start) + ' → ' + fmtHour(r.end) : '';
    push(r, nap ? '💤' : '🌙',
      round1(r.hours) + ' h ' + (nap ? 'nap' : 'sleep') + when +
      (r.quality ? ' · quality ' + r.quality : ''),
      () => dropRecord(state.body.sleep, r.id, round1(r.hours) + ' h ' + (nap ? 'nap' : 'sleep')));
  });
  const c = card(day);
  if (c && (c.mood != null || c.energy != null)) {
    const bits = [];
    if (c.mood != null) bits.push('mood ' + c.mood);
    if (c.energy != null) bits.push('energy ' + c.energy);
    push(c, '◉', bits.join(' · '), null);
  }
  (state.habits.items || []).filter((h) => (h.done || []).includes(day))
    .forEach((h) => push(h, '✓', h.name, null));

  /* Things added from the panels. These have no `date` of their own — a
     person isn't "about" a day — so they're matched on when they were
     entered, which is exactly what the tracker is a record of. */
  const enteredToday = (arr) => (arr || []).filter((r) =>
    r && r._at && toLocalISO(new Date(r._at)) === day);
  const added = [
    [state.relationships.people, '🧑', (r) => r.name + (r.relation ? ' · ' + r.relation : '')],
    [state.relationships.birthdays, '🎂', (r) => r.name + ' · ' + (MONTHS[r.month - 1] || '?') + (r.day ? ' ' + r.day : '')],
    [state.mind.books, '📕', (r) => r.title + (r.author ? ' · ' + r.author : '')],
    [state.mind.quotes, '❝', (r) => shortName(r.text, 44) + (r.source ? ' — ' + r.source : '')],
    [state.mind.ideas, '💡', (r) => shortName(r.text, 52)],
    [state.money.expenses, '💵', (r) => fmt$(r.amount) + (r.note ? ' · ' + r.note : '')],
    [state.money.income, '💰', (r) => '+' + fmt$(r.amount) + (r.source ? ' · ' + r.source : '')],
    [state.money.categories, '📊', (r) => r.name + (r.planned ? ' · ' + fmt$(r.planned) + '/mo' : '')],
    [state.money.subscriptions, '🔁', (r) => r.name + ' · ' + fmt$(r.amount) + '/' + (r.cadence || 'monthly')],
    [state.places.items, '📍', (r) => r.name + ' · ' + r.kind],
  ];
  added.forEach(([arr, icon, label]) => enteredToday(arr).forEach((r) =>
    push(r, icon, label(r), () => dropRecord(arr, r.id, label(r)))));

  // Oldest first: the log grows downward as the day does.
  rows.sort((a, b) => String(a.at).localeCompare(String(b.at)) || String(a.t).localeCompare(String(b.t)));

  const feed = $('feed');
  feed.innerHTML = '';
  if (!rows.length) {
    feed.innerHTML = '<div class="empty">Nothing logged yet for ' + fmtDay(day) + '.</div>';
    return;
  }
  rows.forEach((r) => {
    const div = document.createElement('div'); div.className = 'row';
    div.innerHTML = '<span class="t">' + esc(r.t) + '</span><span class="ic">' + r.ic +
                    '</span><span class="tx">' + esc(r.tx) + '</span>';
    if (r.del) {
      const x = document.createElement('button');
      x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Remove';
      x.onclick = () => { r.del(); saveState(); renderAll(); };
      div.appendChild(x);
    }
    feed.appendChild(div);
  });
}

/* =============================================================
   POPOVER
   ============================================================= */
let popConfirm = null;
function openPop(title, bodyHTML, onConfirm, afterRender, okLabel) {
  const pop = $('pop');
  pop.innerHTML = '<h3>' + esc(title) + '</h3>' + bodyHTML +
    '<div class="actions">' +
      (onConfirm ? '<button class="chip" id="popCancel">Cancel</button><button class="primary" id="popOk">' +
                     esc(okLabel || 'Save') + '</button>'
                 : '<button class="primary" id="popOk">Done</button>') +
    '</div>';
  pop.style.display = 'block';
  $('popBack').classList.add('open');
  popConfirm = onConfirm;
  if (afterRender) afterRender();
  const cancel = $('popCancel');
  if (cancel) cancel.onclick = closePop;
  $('popOk').onclick = () => {
    if (popConfirm && popConfirm() === false) return;   // false = validation failed, stay open
    closePop();
  };
  const first = pop.querySelector('input[type=text]');
  if (first) first.focus();
  /* Enter means "the obvious thing", and in a plain form that is the OK
     button. A field that has already said what Enter means to it — pick the
     first search result, make the type you just named — keeps its own
     answer; this used to overwrite it, silently, after afterRender ran. */
  pop.querySelectorAll('input').forEach((i) => {
    if (i.onkeydown) return;
    i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('popOk').click(); } };
  });
}
function closePop() {
  $('pop').classList.remove('wide');
  $('pop').style.display = 'none';
  $('popBack').classList.remove('open');
  popConfirm = null;
}

/* =============================================================
   FORMS — one helper behind every "＋ Add" in the drawers.
   fields: [{ key, label, type, placeholder, options }]
   onSave gets an object of trimmed values; return false to keep the form open.
   ============================================================= */
function openForm(title, fields, values, onSave, okLabel) {
  const html = fields.map((f) => {
    const id = 'ff_' + f.key;
    const lab = '<div class="rowlabel">' + esc(f.label) + '</div>';
    if (f.type === 'select') {
      return lab + '<select id="' + id + '">' + f.options.map((o) => {
        const v = typeof o === 'string' ? o : o.v;
        const l = typeof o === 'string' ? o : o.l;
        return '<option value="' + esc(v) + '">' + esc(l) + '</option>';
      }).join('') + '</select>';
    }
    /* A date you know by month and day but often not by year — a birthday.
       `<input type=date>` would demand all three and a full-year answer. */
    if (f.type === 'mdy') {
      return lab + '<div class="mdy">' +
        '<select id="' + id + '_m"><option value="">month</option>' +
          MONTHS.map((m, i) => '<option value="' + (i + 1) + '">' + m + '</option>').join('') +
        '</select>' +
        '<input type="number" id="' + id + '_d" placeholder="day" min="1" max="31">' +
        '<input type="number" id="' + id + '_y" placeholder="year" min="1900" max="2100">' +
      '</div>';
    }
    if (f.type === 'textarea') return lab + '<textarea id="' + id + '" placeholder="' + esc(f.placeholder || '') + '"></textarea>';
    return lab + '<input type="' + (f.type || 'text') + '" id="' + id + '" placeholder="' +
           esc(f.placeholder || '') + '"' + (f.step ? ' step="' + f.step + '"' : '') + '>';
  }).join('');
  openPop(title, html, () => {
    const out = {};
    fields.forEach((f) => {
      if (f.type === 'mdy') {
        const g = (sfx) => String($('ff_' + f.key + sfx).value || '').trim();
        out[f.key] = { m: g('_m'), d: g('_d'), y: g('_y') };
        return;
      }
      out[f.key] = String($('ff_' + f.key).value || '').trim();
    });
    return onSave(out);
  }, () => {
    fields.forEach((f) => {
      if (f.type === 'mdy' || !values || values[f.key] == null) return;
      $('ff_' + f.key).value = values[f.key];
    });
    const first = $('pop').querySelector('input,select,textarea');
    if (first) first.focus();
  }, okLabel || 'Add');
}

const ACCOUNT = 'stevenfrye28@gmail.com';
const DOORS = [

  // does not carry.

  { ic: '📰', name: 'News',      url: '../news/',      pending: true },

/** Only ever emit a link we'd be willing to click. */
function safeUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u) && !u.startsWith('/') && !u.startsWith('.')) u = 'https://' + u;
  if (/^(javascript|data|vbscript):/i.test(u)) return null;
  return u;
}
/* Icon-only, so the name has to live in `title` and `aria-label` — the pill
   would otherwise be an unreadable glyph to anything that is not an eye. */
function renderLaunch() {
  const box = $('launch'); box.innerHTML = '';
  DOORS.forEach((d) => {
    if (d.pending) {
      const el = document.createElement('div');
      el.className = 'pend'; el.title = d.name + ' — not published yet';
      el.setAttribute('aria-label', d.name + ' — not published yet');
      el.innerHTML = '<span class="soon">soon</span><span class="ic">' + d.ic + '</span>';
      box.appendChild(el);
      return;
    }
    const a = document.createElement('a');
    // The tooltip says which account a pinned door opens, so the label a
    // screen reader hears says it too rather than a shorter half-truth.
    const label = d.title || d.name;
    a.href = d.url; a.title = label;
    a.setAttribute('aria-label', label);
    a.innerHTML = '<span class="ic">' + (d.svg || d.ic) + '</span>';
    box.appendChild(a);
  });
  (state.links || []).forEach((l) => {
    const url = safeUrl(l.url);
    if (!url) return;
    const a = document.createElement('a');
    a.className = 'mine'; a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.title = l.label + ' — ' + url;
    a.setAttribute('aria-label', l.label);
    a.innerHTML = '<span class="ic">' + esc(l.icon || '🔗') + '</span>';
    const del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.textContent = '✕'; del.title = 'Remove link';
    del.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      dropRecord(state.links, l.id); saveState(); renderLaunch();
    };
    a.appendChild(del);
    box.appendChild(a);
  });
  const add = document.createElement('button');
  add.className = 'add'; add.type = 'button';
  add.title = 'Add a link'; add.setAttribute('aria-label', 'Add a link');
  add.innerHTML = '<span class="ic">＋</span>';
  add.onclick = () => openForm('Add a link', [
    { key: 'label', label: 'Name', placeholder: 'what you call it' },
    { key: 'url', label: 'Address', placeholder: 'example.com/page' },
    { key: 'icon', label: 'Icon (optional)', placeholder: '🔗' },
  ], {}, (v) => {
    if (!v.label || !safeUrl(v.url)) return false;
    state.links.push(stamp({ id: uid(), label: v.label, url: v.url, icon: v.icon || '🔗' }));
    saveState(); renderLaunch();
  });
  box.appendChild(add);
}

/* ---- upcoming birthdays: the one time-sensitive thing in the drawers ---- */
function upcomingBirthdays(withinDays) {
  const now = new Date();
  const out = [];
  (state.relationships.birthdays || []).forEach((b) => {
    if (!b.month || b.deceased) return;
    const d = new Date(now.getFullYear(), b.month - 1, b.day || 1);
    if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d.setFullYear(now.getFullYear() + 1);
    const days = Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    if (days <= withinDays) out.push({ b, days, when: d });
  });
  return out.sort((a, b) => a.days - b.days);
}
function renderBirthdayLine() {
  const up = upcomingBirthdays(30);
  const el = $('bdayLine');
  if (!up.length) { el.textContent = ''; return; }
  el.innerHTML = '🎂 ' + up.slice(0, 3).map((u) =>
    '<b>' + esc(u.b.name) + '</b> ' + (u.days === 0 ? 'today' : u.days === 1 ? 'tomorrow' : 'in ' + u.days + ' days')
  ).join(' · ');
}

function currentHome() {

  const live = homes.filter((p) => !p.to || p.to >= todayStr());

/* =============================================================
   THIS WEEK — derived live from the last 7 days, never stored.
   Descriptive, not evaluative: counts and averages, no score, no
   streak, nothing you can fail.
   ============================================================= */
function weekDays() {
  const out = [];
  for (let i = 6; i >= 0; i--) out.push(shiftDay(todayStr(), -i));
  return out;
}
function renderWeek() {
  const days = weekDays();
  const inWeek = (arr) => (arr || []).filter((r) => days.includes(r.date));
  const cards = inWeek(state.daily.cards);
  const avg = (nums) => nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;

  const mood = avg(cards.map((c) => c.mood).filter((n) => n != null));
  const energy = avg(cards.map((c) => c.energy).filter((n) => n != null));
  const sleeps = inWeek(state.body.sleep).map((s) => Number(s.hours)).filter((n) => !isNaN(n));
  const water = inWeek(state.body.water).reduce((n, r) => n + (Number(r.oz) || 0), 0);
  const ex = inWeek(state.body.exercise);
  const exMin = ex.reduce((n, e) => n + (Number(e.minutes) || 0), 0);
  const subs = inWeek(state.body.substances);
  const cnt = (k) => subs.filter((s) => s.kind === k).reduce((n, s) => n + (Number(s.count) || 1), 0);
  // Counts of a thing done, never a target missed: a 0 here reads the same way
  // a 0 in Alcohol does — as what happened, not as a failure.
  const hyg = inWeek(state.body.hygiene);
  const marks = (k) => hyg.filter((h) => h[k] === true).length;

  const cell = (k, v, u) => '<div class="c"><div class="k">' + k + '</div><div class="v">' +
    (v == null ? '—' : v) + (u ? '<span class="u"> ' + u + '</span>' : '') + '</div></div>';

  $('wkCells').innerHTML =
    cell('Days logged', cards.length, 'of 7') +
    cell('Mood', mood == null ? null : round1(mood), 'avg') +
    cell('Energy', energy == null ? null : round1(energy), 'avg') +
    cell('Sleep', sleeps.length ? round1(avg(sleeps)) : null, 'h avg') +
    cell('Water', Math.round(water / 7), 'oz/day') +
    cell('Movement', ex.length, ex.length ? 'x · ' + exMin + ' min' : '') +
    cell('Alcohol', cnt('alcohol'), '') +
    cell('Nicotine / weed', cnt('nicotine') + ' / ' + cnt('weed'), '') +
    cell('Brushed', marks('brush_am') + marks('brush_pm'), 'of 14') +
    cell('Flossed', marks('floss'), 'of 7') +
    cell('Showers', marks('shower'), '') +
    cell('Haircut', marks('haircut'), '');

  $('wkDays').innerHTML = days.map((d) => {
    const on = cards.some((c) => c.date === d);
    const lbl = new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'narrow' });
    return '<div class="d"><div class="box' + (on ? ' on' : '') + '"></div>' + lbl + '</div>';
  }).join('');

  const notes = cards.filter((c) => c.one_sentence).slice().reverse();
  $('wkNotes').innerHTML = notes.length
    ? notes.map((c) => '<div class="l"><span class="dt">' + esc(fmtDay(c.date)) + '</span>' +
        esc(c.one_sentence) + '</div>').join('')
    : '<div class="empty">No day notes this week.</div>';

  $('sumWeek').textContent = cards.length + ' of 7 days logged';
}

/* =============================================================
   DATA — snapshots, restore, and the forever-copy.

   The dashboard could produce a backup but not read one back, which made
   the front door a one-way street: a file you cannot restore is not a
   backup. Everything needed to get data OUT and back IN lives here.

   Three homes, in increasing order of permanence (SCHEMA.md §1):
     localStorage      the working copy, lost on a cache clear
     snapshots         undo safety, same browser, last 12
     the forever-copy  mirror-data.json + .md, kept by you, survives all
   ============================================================= */
const BACKUP_KEY = 'mirror_backups';
const MAX_SNAPS = 12;
const LAST_REPO_KEY = 'mirror_last_repo';
const CHANGES_KEY = 'mirror_changes_since_repo';

function loadSnaps() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) || []; } catch { return []; }
}
/** Never destroy without one of these first. */
function takeSnapshot(reason) {
  const snaps = loadSnaps();
  snaps.unshift({ ts: Date.now(), reason, data: JSON.stringify(state) });
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(snaps.slice(0, MAX_SNAPS))); }
  catch { /* snapshots are best-effort; never block the real save */ }
}
function changesSinceRepo() { return Number(localStorage.getItem(CHANGES_KEY) || 0); }
function bumpChanges() {
  try { localStorage.setItem(CHANGES_KEY, String(changesSinceRepo() + 1)); } catch {}
}

function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---- the human-readable companion ----
   mirror-data.json is lossless and is what Restore reads. This is the copy
   a person can open in fifty years with no app at all, so durable and
   qualitative content is written in full and only the high-volume logs are
   summarised — the numbers live in the JSON either way.

   Written fresh rather than copied from self.html, whose version predates
   v13 and knows nothing of drinks, substances or links. */
const MD_FULL = [

  ['People', () => (state.relationships.people || []).map((p) =>
    `- **${p.name}**${p.relation ? ` — ${p.relation}` : ''}`)],
  ['Birthdays', () => (state.relationships.birthdays || [])
    .slice().sort((a, b) => (a.month - b.month) || ((a.day || 0) - (b.day || 0)))
    .map((b) => `- **${b.name}** — ${MONTHS[b.month - 1] || '?'}${b.day ? ` ${b.day}` : ''}${b.year ? `, ${b.year}` : ''}`)],
  ['Books', () => (state.mind.books || []).map((b) =>
    `- **${b.title}**${b.author ? ` — ${b.author}` : ''}${b.status ? ` (${b.status})` : ''}`)],
  ['Quotes', () => (state.mind.quotes || []).map((q) =>
    `- "${q.text}"${q.source ? ` — ${q.source}` : ''}${q.date ? ` _(${q.date})_` : ''}`)],
  ['Ideas', () => (state.mind.ideas || []).map((i) =>
    `- ${i.text}${i.source ? ` _(${i.source})_` : ''}${i.date ? ` _(${i.date})_` : ''}`)],
  ['Questions', () => (state.mind.questions || []).map((q) =>
    `- ${q.q}${q.status ? ` (${q.status})` : ''}${q.note ? ` — ${q.note}` : ''}`)],
  ['Habits', () => (state.habits.items || []).map((h) => {
    const done = (h.done || []).slice().sort().reverse();
    return `- **${h.name}** — kept ${done.length} day${done.length === 1 ? '' : 's'}` +
           `${h.created ? `, since ${h.created}` : ''}${h.active === false ? ' _(archived)_' : ''}` +
           (done.length ? `\n  - recent: ${done.slice(0, 10).join(', ')}${done.length > 10 ? ` … (+${done.length - 10} more)` : ''}` : '');
  })],
  ['Budget', () => (state.money.categories || []).map((c) =>

  ['Subscriptions', () => (state.money.subscriptions || []).map((s) =>
    `- **${s.name}** — ${fmt$(s.amount)} / ${s.cadence || 'monthly'}`)],
  ['Savings goals', () => (state.money.goals || []).map((g) =>
    `- **${g.name}** — ${fmt$(g.saved || 0)} of ${fmt$(g.target || 0)}${g.by ? ` by ${g.by}` : ''}`)],
  ['Net worth', () => (state.money.netWorth || []).slice().reverse().map((n) =>

  ['Movement types kept', () => (state.body.exerciseTypes || [])

  ['Journal', () => (state.identity.journal || []).slice().reverse().map((j) =>

  ['Reflections', () => (state.identity.reflections || []).slice().reverse().map((r) =>
    `- **${r.date}** (${r.period})${r.prompt ? ` — ${r.prompt}` : ''}${r.answer ? `\n  - ${r.answer}` : ''}`)],

/* High-volume: a count plus the tail. The JSON holds every row. */
const MD_SUMMARY = [

    `${(r.kind || 'overnight') === 'nap' ? 'nap' : 'sleep'}` +

function buildDataMarkdown() {
  const L = [];
  const p = (x = '') => L.push(x);
  const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || ''));

  p('# Mirror — life record');
  p('');
  p(`_Saved ${todayStr()} · schema v${SCHEMA_VERSION} · human-readable companion to ` +
    '**mirror-data.json**, which is lossless and is what Restore reads._');
  p('');

  p('## At a glance');
  p('');
  const counts = [
    ['Daily cards', state.daily.cards], ['Food entries', state.body.food],
    ['Water', state.body.water], ['Drinks', state.body.drinks],
    ['Substances', state.body.substances], ['Sleep nights', state.body.sleep],
    ['Hygiene days', state.body.hygiene],
    ['Exercise sessions', state.body.exercise], ['Symptoms', state.body.symptoms],
    ['Habits', state.habits.items], ['People', state.relationships.people],
    ['Birthdays', state.relationships.birthdays], ['Books', state.mind.books],
    ['Quotes', state.mind.quotes], ['Ideas', state.mind.ideas],
    ['Expenses', state.money.expenses], ['Places', state.places.items],
  ];
  counts.forEach(([k, a]) => p(`- **${k}:** ${Array.isArray(a) ? a.length : 0}`));
  p('');

  /* The Daily Card is the heartbeat — written in full, newest first, so the
     Markdown is genuinely readable without the app. */
  const cards = (state.daily.cards || []).slice().sort(byDateDesc);
  if (cards.length) {
    p('## Daily record');
    p('');
    cards.forEach((c) => {
      const head = [
        c.mood != null ? `mood ${c.mood}` : null,
        c.energy != null ? `energy ${c.energy}` : null,
        c.sleep_hours != null ? `sleep ${c.sleep_hours}h` : null,
        c.sleep_quality != null ? `quality ${c.sleep_quality}/5` : null,
        (c.tags && c.tags.length) ? `tags: ${c.tags.join(', ')}` : null,
      ].filter(Boolean).join(', ');
      p(`- **${c.date}**${head ? ` — ${head}` : ''}`);
      if (c.one_sentence) p(`  - Today: ${c.one_sentence}`);
      if (c.body_note) p(`  - Body: ${c.body_note}`);
      if (c.food_note) p(`  - Food: ${c.food_note}`);
      if (c.money_note) p(`  - Money: ${c.money_note}`);
      if (c.social_note) p(`  - People: ${c.social_note}`);
    });
    p('');
  }

  MD_FULL.forEach(([title, rows]) => {
    const lines = rows().filter(Boolean);
    if (!lines.length) return;
    p(`## ${title}`); p('');
    lines.forEach((l) => p(l));
    p('');
  });

  p('## Logs');
  p('');
  p('_Summarised here; every row is in the JSON._');
  p('');
  MD_SUMMARY.forEach(([title, get, fmt]) => {
    const arr = get() || [];
    if (!arr.length) return;
    const recent = arr.slice().sort(byDateDesc).slice(0, 14);
    p(`### ${title} — ${arr.length}`);
    recent.forEach((r) => p(`- ${fmt(r)}`));
    if (arr.length > recent.length) p(`- _… and ${arr.length - recent.length} more in the JSON._`);
    p('');
  });

  return L.join('\n');
}

/* ---- the forever-copy: two fixed-name files you keep somewhere permanent ---- */
function foreverCopy() {
  download('mirror-data.json', JSON.stringify(state, null, 2));
  // A second programmatic download in the same tick is often swallowed.
  setTimeout(() => download('mirror-data.md', buildDataMarkdown(), 'text/markdown'), 600);
  localStorage.setItem(LAST_REPO_KEY, String(Date.now()));
  localStorage.setItem(CHANGES_KEY, '0');
  setTimeout(() => { refreshNudge(); toast('Forever-copy saved — keep both files somewhere permanent'); }, 700);
}

function datedBackup() {
  download('mirror-' + todayStr() + '.json', JSON.stringify(state, null, 2));
  toast('Backup downloaded');
}

/* ---- restore ---- */
function restoreFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); }
    catch { alert('That file is not valid JSON, so it is not a Mirror backup.'); return; }
    if (!obj || typeof obj !== 'object' || (!obj.body && !obj.identity)) {
      alert('That does not look like a Mirror backup — no body or identity section.');
      return;
    }
    const n = (a) => (Array.isArray(a) ? a.length : 0);
    const summary = [
      n(obj.daily && obj.daily.cards) + ' daily cards',
      n(obj.body && obj.body.food) + ' food entries',
      n(obj.relationships && obj.relationships.people) + ' people',
    ].join(', ');
    if (!confirm('Replace everything in this browser with this backup?\n\n' +
                 'The file holds ' + summary + '.\n' +
                 'Your current data is snapshotted first, so this is undoable.')) return;
    takeSnapshot('before restore');
    state = mergeLoaded(obj);
    saveState(); renderAll(); refreshNudge();
    toast('Restored — ' + summary);
  };
  reader.readAsText(file);
}

/* ---- snapshots ---- */
function openSnapshots() {
  const snaps = loadSnaps();
  openPop('Snapshots',
    '<div class="tiny" style="margin-bottom:9px">Automatic copies taken before anything destructive. ' +
    'They live in this browser only — they are not a backup.</div>' +
    '<div class="list" id="snapList"></div>', null, () => {
      const box = $('snapList');
      if (!snaps.length) { box.innerHTML = '<div class="empty">No snapshots yet.</div>'; return; }
      box.innerHTML = '';
      snaps.forEach((s) => {
        const div = document.createElement('div'); div.className = 'row';
        const when = new Date(s.ts).toLocaleString();
        div.innerHTML = '<span style="flex:1;min-width:0">' + esc(s.reason || 'snapshot') +
                        '</span><span class="tiny">' + esc(when) + '</span>';
        const b = document.createElement('button');
        b.className = 'mini'; b.type = 'button'; b.textContent = 'Restore';
        b.onclick = () => {
          if (!confirm('Roll back to this snapshot? The current state is snapshotted first.')) return;
          takeSnapshot('before rollback');
          try {
            state = mergeLoaded(JSON.parse(s.data));
            saveState(); renderAll(); closePop(); toast('Rolled back');
          } catch { alert('That snapshot could not be read.'); }
        };
        div.appendChild(b);
        box.appendChild(div);
      });
    });
}

        div.innerHTML = '<span style="flex:1;min-width:0">' + esc(label) +
                        '<span class="hint">' + esc(note) + '</span></span>';
        const b = document.createElement('button');
        b.className = 'mini'; b.type = 'button'; b.textContent = warn ? 'Erase' : 'Go';
        if (warn) b.style.color = 'var(--warn)';
        b.onclick = fn;
        div.appendChild(b); box.appendChild(div);
      };
      box.innerHTML = '';
      row('Forever-copy', 'mirror-data.json + a readable .md — the archive', () => { closePop(); foreverCopy(); });
      row('Restore from a file…', 'reads a backup you choose; snapshotted first', () => $('restoreFile').click());
      row('Snapshots', 'roll back to an automatic in-browser copy', () => { closePop(); openSnapshots(); });
      row('Download a dated backup', 'mirror-' + todayStr() + '.json', () => { closePop(); datedBackup(); });
      row('Erase everything', 'wipes this browser; snapshotted first', () => {
        if (!confirm('Erase ALL Mirror data in this browser?\n\nA snapshot is kept, so it is undoable here — but not on any other device.')) return;
        if (!confirm('Really sure? Everything in this browser goes.')) return;
        takeSnapshot('before erase');
        state = defaultState(); saveState(); renderAll(); closePop(); toast('Erased — undo via Snapshots');
      }, true);
    });
}

/* ---- the nudge ---- */
function refreshNudge() {
  const bar = $('nudge');
  const since = changesSinceRepo();
  const last = Number(localStorage.getItem(LAST_REPO_KEY) || 0);
  const stale = last && (Date.now() - last) > 21 * 864e5;
  /* A healthy sync means the record exists in two places, which takes the
     urgency out — but it is still one account, one provider, one token.
     Sync is redundancy; the forever-copy is the archive. */
  const synced = syncConfigured() && syncStatus === 'synced';
  const threshold = synced ? 400 : 60;
  if (since < threshold && !(stale && !synced)) { bar.hidden = true; return; }
  bar.hidden = false;
  $('nudgeMsg').textContent = last
    ? since + ' changes since your last forever-copy' +
      (stale ? ', and it is over three weeks old' : '') +
      (synced ? ' — sync is redundancy, not an archive' : '')
    : (synced
        ? 'Synced across devices, but never archived — sync is not a backup'
        : 'You have never saved a forever-copy — this browser is the only copy of your record');
}

/* =============================================================
   SYNC — one record across devices, via a private GitHub repo.

   Local-first, always. Every write has already landed in localStorage by
   the time anything here runs; sync is a layer on top. No network, a dead
   token, an expired PAT — none of it may block or lose a log.

   The token lives in its own localStorage key and is never part of `state`,
   so it cannot reach mirror-data.json, a backup, or the forever-copy by
   construction rather than by remembering to strip it.

   Encoding and the sha-conflict protocol are ported from inventory/store.js
   in this repo, which solved them first.
   ============================================================= */
const SYNC_TOKEN_KEY = 'mirror_gh_token';   // this device only, never exported
const SYNC_CFG_KEY   = 'mirror_gh_cfg';     // { owner, repo, branch, path }
const SYNC_SHA_KEY   = 'mirror_gh_sha';     // blob sha of the version we last read
const SYNC_LAST_KEY  = 'mirror_gh_last';    // when a push last succeeded     // blob sha of the version we last read
const GH_API = 'https://api.github.com';

/* btoa() throws on anything above U+00FF, so a single "café" or "🌿" in a
   note would break the push. Encode to UTF-8 bytes first. */
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}

/* iOS Private Browsing (and some locked-down configs) accept a write and
   drop it. A token "saved" there is gone next launch, so probe once and say
   so rather than pretending the device is synced. */
function storagePersists() {
  try {
    const k = '__mirror_probe__';
    localStorage.setItem(k, '1');
    const ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    return ok;
  } catch { return false; }
}

function syncCfg() {
  try { return JSON.parse(localStorage.getItem(SYNC_CFG_KEY)) || null; } catch { return null; }
}
function syncToken() {
  try { return localStorage.getItem(SYNC_TOKEN_KEY) || ''; } catch { return ''; }
}
function syncConfigured() {
  const c = syncCfg();
  return !!(c && c.owner && c.repo && syncToken());
}
function setSyncConfig(cfg, token) {
  try {
    localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg));
    localStorage.setItem(SYNC_TOKEN_KEY, token);
  } catch { return false; }
  // Only true if it is actually still there — see storagePersists().
  return syncToken() === token && !!syncCfg();
}
function forgetSync() {
  try {
    localStorage.removeItem(SYNC_TOKEN_KEY);
    localStorage.removeItem(SYNC_CFG_KEY);
    localStorage.removeItem(SYNC_SHA_KEY);
  } catch { /* ignore */ }
}

/* The public Workspace repo serves this page. Syncing a life record into it
   would publish the lot. Refused by name, not by policy note. */
function isForbiddenRepo(owner, repo) {
  return String(repo || '').trim().toLowerCase() === 'workspace';
}

/* ---- the merge ----------------------------------------------------------
   Two devices, one record. Mirror's data is overwhelmingly append-only
   dated rows with unique ids, which is what makes this tractable: almost
   everything is a union, and only three stores need cleverness.

   Every array falls into one of three kinds:

     BY ID      union on id; on collision the newer _up wins outright.
     BY DATE    daily.cards, body.checkins, identity.pulse hold ONE row per
                day and are upserted, so two devices logging Tuesday must
                collapse to one Tuesday — merged field by field, newer _up
                winning each contested field, so a field only one side has
                still survives.
     SET-ISH    habits.items carry `done[]`, the dates you kept them. A
                straight newest-wins would throw away the days ticked on the
                other device, so the record merges but the date set unions.

   Config objects have no _up of their own, so "last writer" is decided by
   which side holds the most recent stamp anywhere in its tree.
   ------------------------------------------------------------------------ */
const TOMBSTONE_DAYS = 90;

/* Missing _up sorts as oldest — correct for rows written before v13. */
const upOf = (r) => String((r && r._up) || '');

/** Every array of records, and how each must be merged. */
const MERGE_BY_ID = [
  ['identity', 'reflections'], ['identity', 'journal'],
  ['body', 'food'], ['body', 'water'], ['body', 'sleep'], ['body', 'exercise'],
  ['body', 'symptoms'], ['body', 'customFoods'], ['body', 'meals'],
  ['body', 'drinks'], ['body', 'substances'], ['body', 'exerciseTypes'],
  ['body', 'workouts'],
  ['mind', 'books'], ['mind', 'ideas'], ['mind', 'questions'], ['mind', 'quotes'],
  ['money', 'categories'], ['money', 'expenses'], ['money', 'income'], ['money', 'subscriptions'],
  ['money', 'netWorth'], ['money', 'goals'],
  ['relationships', 'people'], ['relationships', 'followUps'],
  ['relationships', 'giftIdeas'], ['relationships', 'birthdays'],
  ['decisions', 'items'], ['places', 'items'],
];
const MERGE_BY_DATE = [
  ['daily', 'cards'], ['body', 'checkins'], ['identity', 'pulse'],
  ['body', 'hygiene'],
];
/** Date-keyed maps: merged per key, so two devices tagging different days
 *  both keep their day. Wholesale last-writer-wins would drop one. */
const MERGE_BY_KEY = [['places', 'days'], ['completion', null]];
/** Plain config: no ids, no dates, so the newer side's version wins whole. */
const MERGE_CONFIG = [
  ['body', 'targets'], ['identity', 'values'], ['identity', 'season'],
  ['home', null], ['calendar', null],
];

/** The most recent write anywhere in a tree — the proxy for "who wrote last". */
function latestStamp(s) {
  let max = '';
  const walk = (arr) => {
    if (!Array.isArray(arr)) return;
    for (const r of arr) { const u = upOf(r); if (u > max) max = u; }
  };
  [...MERGE_BY_ID, ...MERGE_BY_DATE].forEach(([a, b]) => walk(s && s[a] && s[a][b]));
  walk(s && s.habits && s.habits.items);
  walk(s && s.links);
  return max;
}

/** Union the tombstones, dropping any older than 90 days. */
function mergeTombstones(mine, theirs) {
  const byId = new Map();
  for (const t of [...(theirs || []), ...(mine || [])]) {
    if (!t || t.id == null) continue;
    const prev = byId.get(t.id);
    if (!prev || String(t.at || '') > String(prev.at || '')) byId.set(t.id, t);
  }
  const cutoff = new Date(Date.now() - TOMBSTONE_DAYS * 864e5).toISOString();
  return [...byId.values()].filter((t) => String(t.at || '') > cutoff);
}

/** Deleted, unless the record was written again after the deletion. */
const alive = (row, dead) => {
  const killedAt = dead.get(row.id);
  return !killedAt || upOf(row) > killedAt;
};

function mergeById(mine, theirs, dead) {
  const byId = new Map();
  // theirs first, mine second: on an exact _up tie the local copy wins, which
  // keeps a device's own view stable rather than flickering on every sync.
  for (const row of [...(theirs || []), ...(mine || [])]) {
    if (!row || row.id == null) continue;
    const prev = byId.get(row.id);
    if (!prev || upOf(row) >= upOf(prev)) byId.set(row.id, row);
  }
  return [...byId.values()].filter((r) => alive(r, dead));
}

function mergeByDate(mine, theirs, dead) {
  const byDate = new Map();
  for (const row of [...(theirs || []), ...(mine || [])]) {
    if (!row || !row.date) continue;
    const prev = byDate.get(row.date);
    if (!prev) { byDate.set(row.date, row); continue; }
    // Field-level: the newer row's values win, the older row's unique fields
    // survive. Losing a note because the other device saved sleep later would
    // be silent data loss.
    const [older, newer] = upOf(row) >= upOf(prev) ? [prev, row] : [row, prev];
    byDate.set(row.date, { ...older, ...newer });
  }
  return [...byDate.values()].filter((r) => alive(r, dead));
}

/** Habits merge as records, but `done[]` unions — it is a set of days kept,
 *  and each device holds only the days it saw. */
function mergeHabits(mine, theirs, dead) {
  const byId = new Map();
  for (const row of [...(theirs || []), ...(mine || [])]) {
    if (!row || row.id == null) continue;
    const prev = byId.get(row.id);
    if (!prev) { byId.set(row.id, { ...row }); continue; }
    const [older, newer] = upOf(row) >= upOf(prev) ? [prev, row] : [row, prev];
    byId.set(row.id, {
      ...older, ...newer,
      done: [...new Set([...(older.done || []), ...(newer.done || [])])].sort(),
    });
  }
  return [...byId.values()].filter((r) => alive(r, dead));
}

const pick = (s, a, b) => (b == null ? (s || {})[a] : ((s || {})[a] || {})[b]);

/**
 * Merge a remote tree into a local one. Order-independent for records;
 * idempotent when nothing has changed on either side.
 */
function mergeStates(mine, theirs) {
  if (!theirs || typeof theirs !== 'object') return mine;
  if (!mine || typeof mine !== 'object') return theirs;

  const out = mergeLoaded(JSON.parse(JSON.stringify(mine)));
  const tombs = mergeTombstones(mine._deleted, theirs._deleted);
  const dead = new Map(tombs.map((t) => [t.id, String(t.at || '')]));
  out._deleted = tombs;

  MERGE_BY_ID.forEach(([a, b]) => {
    out[a] = out[a] || {};
    out[a][b] = mergeById(pick(mine, a, b), pick(theirs, a, b), dead);
  });
  MERGE_BY_DATE.forEach(([a, b]) => {
    out[a] = out[a] || {};
    out[a][b] = mergeByDate(pick(mine, a, b), pick(theirs, a, b), dead);
  });
  out.links = mergeById(mine.links, theirs.links, dead);
  out.habits = out.habits || {};
  out.habits.items = mergeHabits(pick(mine, 'habits', 'items'), pick(theirs, 'habits', 'items'), dead);

  // favoriteFoods is a bag of ids — union is lossless and needs no ordering.
  out.body.favoriteFoods = [...new Set([...(mine.body?.favoriteFoods || []),
                                        ...(theirs.body?.favoriteFoods || [])])];

  MERGE_BY_KEY.forEach(([a, b]) => {
    const m = pick(mine, a, b) || {}, t = pick(theirs, a, b) || {};
    const merged = { ...t, ...m };     // per key; local wins a contested day
    if (b == null) out[a] = merged; else { out[a] = out[a] || {}; out[a][b] = merged; }
  });

  // No _up on a config object, so defer to whichever tree was written last.
  const theirsNewer = latestStamp(theirs) > latestStamp(mine);
  if (theirsNewer) {
    MERGE_CONFIG.forEach(([a, b]) => {
      const v = pick(theirs, a, b);
      if (v === undefined) return;
      if (b == null) out[a] = v; else { out[a] = out[a] || {}; out[a][b] = v; }
    });
  }

  out.__v = SCHEMA_VERSION;
  return out;
}

/* ---- the GitHub contents API ----
   One file in one private repo. The protocol is the one inventory/store.js
   established: every read hands back the blob sha it read, every write
   carries that sha, and GitHub refuses a write whose sha has moved on. A
   conflict is therefore always DETECTED — resolving it is ours, below. */
function ghUrl() {
  const c = syncCfg();
  return GH_API + '/repos/' + encodeURIComponent(c.owner) + '/' +
         encodeURIComponent(c.repo) + '/contents/' + (c.path || 'mirror-data.json');
}
function ghHeaders() {
  return {
    Authorization: 'Bearer ' + syncToken(),
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}
function ghAuthError(status) {
  return new Error(status === 404
    ? 'Repo or file not found — check owner/repo, and that mirror-data.json exists.'
    : 'GitHub rejected the token (' + status + '). It may have expired, or it may ' +
      'not have Contents: read and write on this repo.');
}

/** Returns { state, sha }. state is null when the file is the empty {} seed. */
async function ghLoad() {
  const c = syncCfg();
  const res = await fetch(ghUrl() + '?ref=' + encodeURIComponent(c.branch || 'main') +
                          '&t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
  if (res.status === 404 || res.status === 401 || res.status === 403) throw ghAuthError(res.status);
  if (!res.ok) throw new Error('GitHub said ' + res.status);
  const body = await res.json();
  let parsed;
  try { parsed = JSON.parse(b64decode(body.content)); }
  catch { throw new Error('mirror-data.json is not valid JSON — refusing to merge it.'); }
  if (!parsed || typeof parsed !== 'object' || !Object.keys(parsed).length) {
    return { state: null, sha: body.sha };     // the {} you seeded it with
  }
  return { state: parsed, sha: body.sha };
}

/** Throws err.conflict when the sha has moved on. Returns the new sha. */
async function ghPut(obj, sha) {
  const c = syncCfg();
  const res = await fetch(ghUrl(), {
    method: 'PUT',
    headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'mirror ' + new Date().toISOString().slice(0, 16).replace('T', ' '),
      content: b64encode(JSON.stringify(obj, null, 2)),
      branch: c.branch || 'main',
      ...(sha ? { sha } : {}),
    }),
  });
  if (res.status === 409 || res.status === 422) {
    const e = new Error('the remote changed first'); e.conflict = true; throw e;
  }
  if (res.status === 404 || res.status === 401 || res.status === 403) throw ghAuthError(res.status);
  if (!res.ok) throw new Error('GitHub said ' + res.status);
  return (await res.json()).content.sha;
}

/** Setup-time check: reachable, and PRIVATE. */
async function ghCheckRepo(owner, repo, token) {
  const res = await fetch(GH_API + '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo), {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
               'X-GitHub-Api-Version': '2022-11-28' },
  });
  if (res.status === 404) throw new Error('Not found. Check owner/repo, and that the token can see this repo.');
  if (res.status === 401 || res.status === 403) throw ghAuthError(res.status);
  if (!res.ok) throw new Error('GitHub said ' + res.status);
  const r = await res.json();
  if (!r.private) {
    throw new Error('That repo is PUBLIC. Mirror will not sync a life record to a public repo.');
  }
  return r;
}

/* ---- the engine ----
   Local-first: state is already in localStorage before any of this runs. A
   dead network, an expired token or no configuration at all must leave the
   app working exactly as it does today. */
const PUSH_DEBOUNCE = 4000;
const MAX_CONFLICT_RETRIES = 2;

let syncStatus = 'off';        // off | synced | syncing | offline | conflict | error
let syncDetail = '';
let pushTimer = null;
let applyingRemote = false;    // a pull's own saveState must not trigger a push
let syncBusy = false;

function setSync(status, detail) {
  syncStatus = status; syncDetail = detail || '';
  renderSyncPill();
}

/* Belt and braces. The token lives outside `state` so it cannot be here —
   but anything token-shaped that ever ends up in the tree must not leave
   the device either. The calendar integration is the reason this exists. */
function scrubForSync(s) {
  const clone = JSON.parse(JSON.stringify(s));
  const strip = (o) => {
    if (!o || typeof o !== 'object') return;
    for (const k of Object.keys(o)) {
      if (/token|secret|password|access_key|client_id/i.test(k)) delete o[k];
      else strip(o[k]);
    }
  };
  strip(clone);
  return clone;
}

/** Compare only what sync is about, so cosmetic churn never causes a push. */
function syncFingerprint(s) {
  const parts = [];
  [...MERGE_BY_ID, ...MERGE_BY_DATE].forEach(([a, b]) => parts.push(JSON.stringify(pick(s, a, b) || [])));
  parts.push(JSON.stringify(s.links || []), JSON.stringify(pick(s, 'habits', 'items') || []));
  parts.push(JSON.stringify(s._deleted || []), JSON.stringify(pick(s, 'body', 'targets') || {}));
  parts.push(JSON.stringify(pick(s, 'identity', 'values') || []));
  return parts.join('|');
}

/** Pull, merge, and push back only if we ended up ahead. */
async function syncPull(quiet) {
  if (!syncConfigured() || syncBusy) return;
  if (!navigator.onLine) { setSync('offline'); return; }
  syncBusy = true;
  if (!quiet) setSync('syncing');
  try {
    const { state: remote, sha } = await ghLoad();
    localStorage.setItem(SYNC_SHA_KEY, sha || '');
    if (remote) {
      const merged = mergeStates(state, remote);
      const changed = syncFingerprint(merged) !== syncFingerprint(state);
      applyingRemote = true;
      state = merged;
      saveState();
      applyingRemote = false;
      if (changed) renderAll();
      // We are ahead of the remote whenever the merge added anything of ours.
      if (syncFingerprint(merged) !== syncFingerprint(remote)) {
        syncBusy = false; await pushNow(); return;
      }
    } else {
      // Empty seed: this device's record becomes the starting point.
      syncBusy = false; await pushNow(); return;
    }
    setSync('synced');
  } catch (err) {
    setSync('error', err.message);
  } finally {
    syncBusy = false;
  }
}

/** Push, and on a stale sha re-pull, re-merge and try again. Never clobbers. */
async function pushNow(attempt) {
  attempt = attempt || 0;
  if (!syncConfigured()) return;
  if (!navigator.onLine) { setSync('offline'); return; }
  if (syncBusy) return;
  syncBusy = true;
  setSync('syncing');
  try {
    const sha = localStorage.getItem(SYNC_SHA_KEY) || null;
    const newSha = await ghPut(scrubForSync(state), sha);
    localStorage.setItem(SYNC_SHA_KEY, newSha);
    localStorage.setItem(SYNC_LAST_KEY, String(Date.now()));
    setSync('synced');
  } catch (err) {
    if (err.conflict && attempt < MAX_CONFLICT_RETRIES) {
      setSync('conflict');
      try {
        const { state: remote, sha } = await ghLoad();
        applyingRemote = true;
        state = mergeStates(state, remote || {});
        saveState();
        applyingRemote = false;
        localStorage.setItem(SYNC_SHA_KEY, sha || '');
        renderAll();
        syncBusy = false;
        return await pushNow(attempt + 1);
      } catch (err2) {
        setSync('error', err2.message);
      }
    } else {
      setSync(err.conflict ? 'conflict' : 'error', err.message);
    }
  } finally {
    syncBusy = false;
  }
}

/** Coalesce a burst of logging into one push. */
function schedulePush() {
  if (!syncConfigured() || applyingRemote) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushNow(), PUSH_DEBOUNCE);
}

/* ---- the pill ----
   One glyph in the tools row. It is the only place sync is allowed to
   interrupt: everything else about it happens quietly or not at all. */
const SYNC_LOOK = {
  off:      { g: '○', c: 'var(--dim)',     t: 'Sync is off — this device only. Tap to set it up.' },
  synced:   { g: '●', c: 'var(--accent2)', t: 'Synced' },
  syncing:  { g: '◔', c: 'var(--accent)',  t: 'Syncing…' },
  offline:  { g: '○', c: 'var(--dim)',     t: 'Offline — your logs are saved here and will sync when you are back.' },
  conflict: { g: '◑', c: 'var(--warn)',    t: 'Merging a change from another device…' },
  error:    { g: '●', c: 'var(--warn)',    t: 'Sync problem' },
};
function renderSyncPill() {
  const b = $('syncBtn');
  if (!b) return;
  const look = SYNC_LOOK[syncStatus] || SYNC_LOOK.off;
  b.textContent = look.g;
  b.style.color = look.c;
  b.title = look.t + (syncDetail ? ' — ' + syncDetail : '');
  b.setAttribute('aria-label', 'Sync: ' + syncStatus);
}

/* ---- setup ---- */
function openSyncSetup() {
  const c = syncCfg() || {};
  const on = syncConfigured();
  openPop('Sync across devices',
    '<div class="tiny" style="margin-bottom:11px">' +
      'One record on every device, through a file in a <b>private</b> GitHub repo. ' +
      'Logging always lands on this device first — sync catches up, and never gets in the way.' +
    '</div>' +
    (on ? '<div class="tiny" style="margin-bottom:11px">Connected to <b>' +
            esc(c.owner + '/' + c.repo) + '</b> · <span id="syncStateLine">' + esc(syncStatus) + '</span></div>' : '') +
    '<div class="rowlabel">Repository</div>' +
    '<input type="text" id="syncRepo" placeholder="your-username/mirror-data" autocomplete="off">' +
    '<div class="rowlabel">Fine-grained token</div>' +
    '<input type="password" id="syncTok" placeholder="' +
      (on ? 'saved on this device — paste again to replace' : 'github_pat_…') + '" autocomplete="off">' +
    '<div class="tiny" style="margin-top:8px">Contents: read and write, on that one repo. ' +
      'It is stored on this device only and never written into your data, a backup, or the repo. ' +
      'Fine-grained tokens expire — the pill turns amber when yours does.</div>' +
    '<div class="tiny" id="syncTest" style="margin-top:9px"></div>' +
    '<div class="chips" style="margin-top:10px">' +
      '<button class="mini" id="syncTestBtn">Test &amp; connect</button>' +
      '<button class="mini" id="syncNowBtn">Sync now</button>' +
      (on ? '<button class="mini" id="syncOffBtn">Disconnect</button>' : '') +
    '</div>',
    null,
    () => {
      if (c.owner && c.repo) $('syncRepo').value = c.owner + '/' + c.repo;
      const say = (msg, bad) => {
        $('syncTest').innerHTML = esc(msg);
        $('syncTest').style.color = bad ? 'var(--warn)' : 'var(--accent2)';
      };

      $('syncTestBtn').onclick = async () => {
        const raw = $('syncRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '');
        const [owner, repo] = raw.split('/').map((x) => (x || '').trim());
        const tok = $('syncTok').value.trim() || syncToken();
        if (!owner || !repo) return say('Enter it as owner/repo.', true);
        if (isForbiddenRepo(owner, repo)) {
          return say('Not Workspace — that repo is public and serves this page.', true);
        }
        if (!tok) return say('Paste a token.', true);
        if (!storagePersists()) {
          return say('This browser will not keep the token (private mode?), so sync cannot hold.', true);
        }
        say('Checking…');
        try {
          await ghCheckRepo(owner, repo, tok);
          if (!setSyncConfig({ owner, repo, branch: 'main', path: 'mirror-data.json' }, tok)) {
            return say('Could not save the token on this device.', true);
          }
          say('Connected to ' + owner + '/' + repo + ' — syncing…');
          setSync('syncing');
          await syncPull();
          say(syncStatus === 'synced' ? 'Synced.' : (syncDetail || syncStatus), syncStatus !== 'synced');
          refreshNudge();
        } catch (err) {
          forgetSync();
          say(err.message, true);
        }
      };

      $('syncNowBtn').onclick = async () => {
        if (!syncConfigured()) return say('Connect first.', true);
        say('Syncing…');
        await syncPull();
        say(syncStatus === 'synced' ? 'Synced.' : (syncDetail || syncStatus), syncStatus !== 'synced');
        refreshNudge();
      };

      const off = $('syncOffBtn');
      if (off) off.onclick = () => {
        if (!confirm('Disconnect this device?\n\nYour record stays here and in the repo — only the token is removed from this browser.')) return;
        forgetSync();
        setSync('off');
        closePop();
        refreshNudge();
        toast('Disconnected — this device only');
      };
    });
}

/* ---- money -------------------------------------------------------------
   Expense and income are the same gesture - an amount, and where it came from
   or went - so they share a form and differ by a toggle. The categories you
   already use are chips, because picking one is faster than typing it and
   keeps the spelling consistent; "Other" opens a text field and the name you
   type becomes a new category, so the list grows by being used rather than by
   being maintained. A subscription is an expense that repeats, which is a
   checkbox, not a third form. */
const INCOME_SEED = ['Salary', 'Freelance', 'Gift', 'Refund'];
function incomeSources() {
  return [...new Set([...INCOME_SEED, ...(state.money.income || []).map((r) => r.source).filter(Boolean)])];
}
$('logMoney').onclick = () => {
  let side = 'expense';       // 'expense' | 'income'
  let chosen = null;          // a category id, a source string, or '__other'
  openPop('Money',
    '<div class="seg" id="mSeg">' +
      '<button type="button" data-s="expense">Expense</button>' +
      '<button type="button" data-s="income">Income</button>' +
    '</div>' +
    '<div class="rowlabel">Amount</div>' +
    '<input type="number" step="0.01" id="mAmt" placeholder="0.00">' +
    '<div class="rowlabel" id="mPickLabel">Category</div>' +
    '<div class="pickrow" id="mPick"></div>' +
    '<input type="text" id="mOther" placeholder="name it" hidden>' +
    '<div class="rowlabel">Note (optional)</div>' +
    '<input type="text" id="mNote" placeholder="what it was for">' +
    '<div class="rowlabel">Date</div>' +
    '<input type="date" id="mDate">' +
    '<label class="checkline" id="mRepeatLine"><input type="checkbox" id="mRepeat">repeats every month</label>',
    () => {
      const amt = Number($('mAmt').value);
      if (!amt || amt <= 0) { $('mAmt').focus(); return false; }
      const other = $('mOther').value.trim();
      if (chosen === '__other' && !other) { $('mOther').focus(); return false; }
      const date = $('mDate').value || day;
      const note = $('mNote').value.trim();

      if (side === 'income') {
        const source = chosen === '__other' ? other : (chosen || 'Other');
        addTo(state.money.income, { id: uid(), date, amount: amt, source, note }, '+' + fmt$(amt));
        return;
      }
      // An expense needs a category; "Other" mints one, so the list grows by use.
      let catId = (chosen && chosen !== '__other') ? chosen : null;
      if (!catId) {
        const name = other || 'Other';
        let cat = (state.money.categories || []).find((c) => c.name.toLowerCase() === name.toLowerCase());
        if (!cat) { cat = stamp({ id: uid(), name, planned: 0 }); appendRec(state.money.categories, cat, name); }
        catId = cat.id;
      }
      if ($('mRepeat').checked) {
        const cat = (state.money.categories || []).find((c) => c.id === catId);
        addTo(state.money.subscriptions, {
          id: uid(), name: note || (cat && cat.name) || 'Subscription',
          amount: amt, cadence: 'monthly', categoryId: catId,
        }, fmt$(amt) + '/mo');
        return;
      }
      addTo(state.money.expenses, { id: uid(), date, amount: amt, categoryId: catId, note }, fmt$(amt));
    },
    () => {
      $('mDate').value = day;
      const paint = () => {
        [...$('mSeg').children].forEach((b) =>
          b.setAttribute('aria-pressed', String(b.dataset.s === side)));
        $('mPickLabel').textContent = side === 'expense' ? 'Category' : 'Source';
        $('mRepeatLine').hidden = side !== 'expense';
        if (side !== 'expense') $('mRepeat').checked = false;

        const box = $('mPick'); box.innerHTML = '';
        const opts = side === 'expense'
          ? (state.money.categories || []).map((c) => ({ v: c.id, l: c.name }))
          : incomeSources().map((x) => ({ v: x, l: x }));
        opts.concat([{ v: '__other', l: 'Other\u2026' }]).forEach((o) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'chip';
          b.textContent = o.l;
          b.setAttribute('aria-pressed', String(chosen === o.v));
          b.onclick = () => { chosen = (chosen === o.v ? null : o.v); paint(); };
          box.appendChild(b);
        });
        const other = $('mOther');
        other.hidden = chosen !== '__other';
        if (chosen === '__other') other.focus();
      };
      $('mSeg').onclick = (e) => {
        const b = e.target.closest('button[data-s]');
        if (!b) return;
        side = b.dataset.s; chosen = null; $('mOther').value = ''; paint();
      };
      paint();
      $('mAmt').focus();
    }, 'Log');
};

   A textarea asked you to compose a list from nothing. A picker asks you to
   recognise words instead, which is the easier act and the one that produces
   an honest answer; anything missing you can still type. */
const VALUE_WORDS = [
  'Honesty', 'Curiosity', 'Discipline', 'Kindness', 'Courage', 'Patience',
  'Craft', 'Health', 'Family', 'Freedom', 'Generosity', 'Humility',
  'Loyalty', 'Presence', 'Rest', 'Service', 'Simplicity', 'Wonder',
];
$('logValues').onclick = () => {
  const held = (state.identity.values || []).slice();
  const picked = new Set(held);
  const vocab = [...new Set([...held, ...VALUE_WORDS])];
  openPop('Values',
    '<div class="tiny" style="margin-bottom:11px">The handful you want to be measured by. ' +
      'Tap to keep or drop one.</div>' +
    '<div class="pickrow" id="vPick"></div>' +
    '<div class="namefield" style="margin-top:10px">' +
      '<input type="text" id="vNew" placeholder="a word of your own">' +
      '<button class="mini" type="button" id="vAdd">Add</button>' +
    '</div>',
    () => {
      // Values you already held keep their order; newly picked ones follow.
      state.identity.values = held.filter((v) => picked.has(v))
        .concat(vocab.filter((v) => picked.has(v) && !held.includes(v)));
      saveState(); renderDrawers();
    },
    () => {
      const paint = () => {
        const box = $('vPick'); box.innerHTML = '';
        vocab.forEach((w) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'chip'; b.textContent = w;
          b.setAttribute('aria-pressed', String(picked.has(w)));
          b.onclick = () => { picked.has(w) ? picked.delete(w) : picked.add(w); paint(); };
          box.appendChild(b);
        });
      };
      const take = () => {
        const w = $('vNew').value.trim();
        if (!w) return;
        const already = vocab.find((x) => x.toLowerCase() === w.toLowerCase());
        if (!already) vocab.push(w);
        picked.add(already || w);
        $('vNew').value = ''; paint(); $('vNew').focus();
      };
      $('vAdd').onclick = take;
      $('vNew').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); take(); } };
      paint();
    }, 'Save');
};

/* =============================================================
   THE OVERVIEW ROOM
   Everything here is derived at open time and stored nowhere, so it can
   never disagree with the record it describes.
   ============================================================= */
/* Every array of records, borrowed from the merge table so a store added
   there is never silently missing here — less the ones that are settings
   wearing a record's clothes. Keeping "Pickleball" at the top of a list is
   a preference; it is not a thing you did, and a day you did it on is not
   a day you kept the record. */
const NOT_ENTRIES = new Set(['exerciseTypes']);
const ALL_STORES = [...MERGE_BY_ID, ...MERGE_BY_DATE].filter(([, b]) => !NOT_ENTRIES.has(b));

/** One line for any record, whatever store it came out of. */
function recordLabel(r, store) {
  if (store === 'water' || store === 'drinks') {
    return round1(r.oz) + ' oz' + (r.label ? ' ' + r.label : '') + (store === 'water' ? ' water' : '');
  }
  if (store === 'substances') {
    return (r.kind || 'substance') + (r.amount ? ' \u00b7 ' + round1(r.amount) + (r.unit || '') : '');
  }
  if (store === 'sleep') {
    return round1(r.hours) + ' h ' + ((r.kind || 'overnight') === 'nap' ? 'nap' : 'sleep');
  }
  if (store === 'exercise') return (r.type || 'movement') + (r.minutes ? ' \u00b7 ' + r.minutes + ' min' : '');
  if (store === 'expenses') return fmt$(r.amount) + (r.note ? ' \u00b7 ' + r.note : '');
  if (store === 'income') return '+' + fmt$(r.amount) + (r.source ? ' \u00b7 ' + r.source : '');
  if (store === 'subscriptions') return r.name + ' \u00b7 ' + fmt$(r.amount) + '/' + (r.cadence || 'monthly');
  if (store === 'birthdays') {
    return r.name + ' \u00b7 ' + (MONTHS[r.month - 1] || '?') + (r.day ? ' ' + r.day : '');
  }
  if (store === 'people') return r.name + (r.relation ? ' \u00b7 ' + r.relation : '');
  if (store === 'items') return r.name + (r.kind ? ' \u00b7 ' + r.kind : '');
  if (store === 'cards') return r.one_sentence ? shortName(r.one_sentence, 52) : 'day note';
  const t = r.name || r.title || r.text || r.note || r.one_sentence || r.q || r.question || '';
  return t ? shortName(String(t), 52) : store;
}

function ovStat(k, v, u) {
  // No value, no unit: "— h avg" reads as a broken number rather than as none.
  return '<div class="c"><div class="k">' + esc(k) + '</div><div class="v">' +
    (v == null ? '&mdash;'
               : esc(String(v)) + (u ? '<span class="u"> ' + esc(u) + '</span>' : '')) +
    '</div></div>';
}

/** Days with any entry at all, over the whole record — not a streak. */
function daysKept() {
  const d = new Set();
  ALL_STORES.forEach(([a, b]) => (pick(state, a, b) || []).forEach((r) => {
    if (r && r.date) d.add(r.date);
    else if (r && r._at) d.add(toLocalISO(new Date(r._at)));
  }));
  return d;
}

$('overviewBtn').onclick = () => {
  const days = daysKept();
  const sorted = [...days].sort();
  const first = sorted[0];
  const mk = monthKey();
  const spent = (state.money.expenses || [])
    .filter((e) => (e.date || '').startsWith(mk)).reduce((n, e) => n + Number(e.amount || 0), 0);
  const earned = (state.money.income || [])
    .filter((r) => (r.date || '').startsWith(mk)).reduce((n, r) => n + Number(r.amount || 0), 0);
  const home = currentHome();
  let homeSince = '';
  if (home && home.from) {
    const months = Math.max(0, Math.round(daysBetween(home.from, todayStr()) / 30.44));
    homeSince = months >= 12
      ? Math.floor(months / 12) + 'y' + (months % 12 ? ' ' + (months % 12) + 'm' : '')
      : (months ? months + 'm' : 'new');
  }
  const sleeps = (state.body.sleep || [])
    .filter((r) => (r.kind || 'overnight') === 'overnight').map((r) => Number(r.hours))
    .filter((n) => !isNaN(n));
  const avgSleep = sleeps.length ? sleeps.reduce((a, b) => a + b, 0) / sleeps.length : null;
  const week = weekDays();

  /* Habits, as a picture of the last seven days rather than a run you can
     break. A dot per day, and the count over the whole record. */
  const habits = (state.habits.items || []).map((h) => {
    const done = h.done || [];
    return '<div class="h"><span class="nm">' + esc(h.name) + '</span>' +
      '<span class="wk">' + week.map((d) =>
        '<i class="' + (done.includes(d) ? 'on' : '') + '" title="' + esc(fmtDay(d)) + '"></i>').join('') +
      '</span><span class="n">' + plural(done.length, 'day') + '</span></div>';
  }).join('');

  const vals = state.identity.values || [];

  /* The last ten things entered anywhere, newest first — the record as it
     actually grew, across every store. */
  const recent = [];
  /* MERGE_BY_ID, not ALL_STORES: the by-date rows (the daily card, the body
     check-in, the pulse) are upserted once per day and one of them is created
     as a side effect of logging sleep. Listing those as things you "added"
     would be reporting your own bookkeeping back to you. */
  MERGE_BY_ID.forEach(([a, b]) => {
    if (NOT_ENTRIES.has(b)) return;
    (pick(state, a, b) || []).forEach((r) => {
      if (r && r._at) recent.push({ r, at: r._at, store: b || a });
    });
  });
  recent.sort((x, y) => String(y.at).localeCompare(String(x.at)));
  const RECENT_IC = {
    people: '🧑', birthdays: '🎂', books: '📕', quotes: '❝', ideas: '💡',
    expenses: '💵', income: '💰', categories: '📊', subscriptions: '🔁',
    items: '📍', food: '🍽', water: '💧', drinks: '🥤', substances: '◍',
    sleep: '🌙', exercise: '🏃', symptoms: '⚕', meals: '🍱', customFoods: '🍳',
  };
  const rows = recent.slice(0, 10).map(({ r, at, store }) =>
    '<div class="r"><span class="ic">' + (RECENT_IC[store] || '·') + '</span>' +
    '<span class="tx">' + esc(recordLabel(r, store)) + '</span>' +
    '<span class="dt">' + esc(fmtDay(toLocalISO(new Date(at)))) + '</span></div>').join('');

  openPop('Mirror',
    '<div class="ov"><h4>At a glance</h4><div class="ovstats">' +
      ovStat('Days kept', days.size) +
      ovStat('Keeping since', first ? fmtDay(first) : null) +
      ovStat('Sleep', avgSleep == null ? null : round1(avgSleep), 'h avg') +
      ovStat('This month out', spent ? fmt$(spent) : null) +
      ovStat('This month in', earned ? fmt$(earned) : null) +
      ovStat('Home', home ? home.name : null, homeSince) +
    '</div></div>' +
    '<div class="ov"><h4>Behavior &middot; last 7 days</h4>' +
      (habits ? '<div class="ovhab">' + habits + '</div>'
              : '<div class="empty">No habits yet.</div>') +
    '</div>' +
    '<div class="ov"><h4>Values you keep</h4>' +
      (vals.length
        ? '<div class="chips valchips">' + vals.map((v) =>
            '<span class="chip">' + esc(v) + '</span>').join('') + '</div>'
        : '<div class="empty">None set yet &mdash; the Values tile.</div>') +
    '</div>' +
    '<div class="ov"><h4>Recently added</h4>' +
      (rows ? '<div class="ovrecent">' + rows + '</div>'
            : '<div class="empty">Nothing yet.</div>') +
    '</div>',
    null, () => { $('pop').classList.add('wide'); });
};

$('popBack').onclick = closePop;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

// A day can roll over while the app sits open on a phone overnight.
setInterval(() => {
  if (day !== todayStr() && $('dTodayBtn').getAttribute('aria-pressed') === 'true') setDay(todayStr());
}, 60000);

setDay(todayStr());

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is a bonus, not a requirement */ });
}
</script>
</body>
</html>
