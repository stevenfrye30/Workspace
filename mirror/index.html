<div class="toast" id="toast"></div>

<script>
/* =============================================================
   Mirror — the one-page dashboard.

   Shares storage key `mirror_v1` with self.html on purpose: same origin,
   same data, so your existing record simply appears here and both apps
   stay usable side by side while this one earns its place.

   Golden rule inherited from SCHEMA.md: store raw observations, derive on
   read. Nothing here writes a score, a streak, or a conclusion.
   ============================================================= */

const STORAGE_KEY = 'mirror_v1';
const SCHEMA_VERSION = 18;

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
// Local YYYY-MM-DD. Never UTC: an evening entry must not land on tomorrow.
function toLocalISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
const todayStr = () => toLocalISO(new Date());
function shiftDay(iso, n) {
  const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + n); return toLocalISO(d);
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtDay(iso) {
  if (iso === todayStr()) return 'today';
  if (iso === shiftDay(todayStr(), -1)) return 'yesterday';
  return new Date(iso + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function round1(n) { return Math.round(n * 10) / 10; }
function fmt$(n) {
  const v = Number(n || 0);
  const [whole, cents] = Math.abs(v).toFixed(2).split('.');
  return (v < 0 ? '-$' : '$') + whole.replace(/\B(?=(\d{3})+$)/g, ',') +
         (cents === '00' ? '' : '.' + cents);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
}
/** "1 quote" / "2 quotes" — summaries read as prose, so they have to agree. */
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ---------- state ---------- */
/* The full tree, including stores this dashboard does not surface. They are
   listed so a save from here can never drop data that self.html wrote. */
const defaultState = () => ({
  identity: { values: [], season: '', reflections: [], pulse: [], journal: [] },
  body: {
    food: [], water: [], sleep: [], exercise: [], symptoms: [],
    targets: { kcal: 2200, protein_g: 80, water_oz: 64 },
    favoriteFoods: [], customFoods: [], meals: [], checkins: [],
    drinks: [], substances: [],            // v13
    hygiene: [],                           // v15
    exerciseTypes: [],                     // v16
    workouts: [],                          // v17
  },
  mind: { books: [], ideas: [], questions: [], quotes: [] },
  money: { categories: [], expenses: [], income: [], subscriptions: [], netWorth: [], goals: [] },
  relationships: { people: [], followUps: [], giftIdeas: [], birthdays: [] },
  daily: { cards: [] },
  decisions: { items: [] },
  habits: { items: [] },
  places: { items: [], days: {} },
  completion: {},
  calendar: { events: [], integration: {} },
  home: { widgets: [] },
  links: [],                                // v13
  _deleted: [],                             // v13 — tombstones, for sync
});

/** Merge a loaded blob onto the current defaults. Every path that brings data
 *  in — first load, restore from a file, snapshot rollback — goes through
 *  here, so none of them can miss a backfill the others get. */
function mergeLoaded(saved) {
  const base = defaultState();
  if (!saved || typeof saved !== 'object') return base;
  // Shallow-merge each namespace so new v13 fields are backfilled while every
  // existing key — including ones this dashboard never touches — is preserved.
  const out = { ...base, ...saved };
  for (const k of Object.keys(base)) {
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      out[k] = { ...base[k], ...(saved[k] && typeof saved[k] === 'object' ? saved[k] : {}) };
    }
  }
  // v12 -> v13: the new stores. Purely additive; nothing is reshaped.
  if (!Array.isArray(out.body.drinks)) out.body.drinks = [];
  if (!Array.isArray(out.body.substances)) out.body.substances = [];
  // v14 -> v15: the hygiene marks. Purely additive; nothing is reshaped.
  if (!Array.isArray(out.body.hygiene)) out.body.hygiene = [];
  // v15 -> v16: the movement types you keep. Also purely additive.
  if (!Array.isArray(out.body.exerciseTypes)) out.body.exerciseTypes = [];
  // v16 -> v17: saved workouts. Also purely additive.
  if (!Array.isArray(out.body.workouts)) out.body.workouts = [];
  // v17 -> v18: the movement quick-log. New OPTIONAL fields only — cat /
  // distanceMi / intensity / kcalEst / moves / label on exercise[], cat /
  // gone on exerciseTypes[] — so there is nothing to backfill.
  if (!Array.isArray(out.links)) out.links = [];
  if (!Array.isArray(out._deleted)) out._deleted = [];
  return out;
}
function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { /* corrupt */ }
  return mergeLoaded(saved);
}

let state = loadState();

/* Provenance, per SCHEMA.md §2. `_at` is when a record was FIRST entered and
   never changes. `_up` is stamped on every write — it is what a sync merge
   uses to decide which of two edits is newer, which `_at` cannot do. */
function stamp(rec) {
  if (!rec._src) rec._src = 'manual';
  if (!rec._at) rec._at = nowISO();
  rec._up = nowISO();
  return rec;
}
function saveState() {
  state.__v = SCHEMA_VERSION;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    bumpChanges();
    schedulePush();          // local first, always; the network catches up
  } catch (e) {
    alert('Could not save — this browser is out of storage space, or is in private mode.');
  }
}
/* =============================================================
   UNDO — a stack of inverse operations, not state snapshots.

   The state tree runs to megabytes after a few years, and copying all of
   it on every tap so a sip of water is undoable would be absurd. Each
   entry instead knows only how to put back the one thing it changed.
   ============================================================= */
const undoStack = [];
const UNDO_MAX = 25;

function pushUndo(label, revert) {
  undoStack.push({ label, revert });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  refreshUndo();
}
function refreshUndo() {
  const b = $('undoBtn');
  if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.disabled = !top;
  b.title = top ? 'Undo ' + top.label : 'Nothing to undo';
}
function doUndo() {
  const top = undoStack.pop();
  if (!top) return;
  top.revert();
  saveState();
  refreshUndo();
  renderAll();
  toast('Undid ' + top.label);
}
/** Append a record and make it undoable in one move. */
function appendRec(arr, rec, label) {
  arr.push(rec);
  pushUndo(label, () => {
    const i = arr.findIndex((r) => r.id === rec.id);
    if (i >= 0) arr.splice(i, 1);
  });
  return rec;
}

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/** Remove a record, leave a tombstone so a future sync can't resurrect it,
 *  and keep enough to put it back exactly where it was. */
function dropRecord(arr, id, label) {
  const i = arr.findIndex((r) => r.id === id);
  if (i < 0) return;
  const [rec] = arr.splice(i, 1);
  state._deleted.push({ id, at: nowISO() });
  pushUndo('removing ' + (label || 'an entry'), () => {
    arr.splice(i, 0, rec);
    const j = state._deleted.findIndex((t) => t.id === id);
    if (j >= 0) state._deleted.splice(j, 1);
  });
}

/** Remove several records as one act: a tombstone each, one press to undo.
 *  A meal is five rows in the data and one thing you ate — taking it back
 *  five times over would be reporting the bookkeeping back at you. */
function dropGroup(arr, recs, label) {
  const before = undoStack.length;
  recs.forEach((r) => dropRecord(arr, r.id, label));
  const mine = undoStack.splice(Math.min(before, undoStack.length));
  if (mine.length) {
    pushUndo('removing ' + label, () => mine.slice().reverse().forEach((u) => u.revert()));
  }
}

/* ---------- the quantity stepper ----------
   − n +  . Used wherever "how many of these" is the question: a meal you are
   about to log, an ingredient inside one, a portion in the picker. Minimum 1,
   because logging none of something is not a thing you can do. */
function stepper(value, onChange, name) {
  const n = Math.max(1, Math.round(Number(value) || 1));
  const wrap = document.createElement('div');
  wrap.className = 'qty';
  const mk = (glyph, delta, label) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = glyph;
    b.title = label;
    b.setAttribute('aria-label', label + (name ? ' — ' + name : ''));
    b.onclick = () => onChange(Math.max(1, n + delta));
    return b;
  };
  const less = mk('−', -1, 'One fewer');
  less.disabled = n <= 1;
  const out = document.createElement('span');
  out.className = 'q'; out.textContent = n;
  // The live count has to reach a screen reader too — the buttons only say
  // which way they move it.
  out.setAttribute('aria-live', 'polite');
  out.setAttribute('aria-label', n + (name ? ' × ' + name : ''));
  wrap.appendChild(less); wrap.appendChild(out); wrap.appendChild(mk('＋', 1, 'One more'));
  return wrap;
}

/* ---------- selected day ---------- */
let day = todayStr();

function setDay(iso) {
  day = iso;
  $('dPick').value = iso;
  $('dTodayBtn').setAttribute('aria-pressed', String(iso === todayStr()));
  $('dYestBtn').setAttribute('aria-pressed', String(iso === shiftDay(todayStr(), -1)));
  const warn = $('backdateWarn');
  if (iso === todayStr()) { warn.hidden = true; }
  else { warn.hidden = false; warn.textContent = 'Backdating — everything below is being logged for ' + fmtDay(iso) + '.'; }
  renderAll();
}
/* Time-of-day only makes sense on the day it happened. Backfilled entries get
   no `t`, rather than a fictional one. */
const stampTime = () => (day === todayStr() ? nowHM() : '');

const onDay = (arr) => (arr || []).filter((r) => r && r.date === day);

/* ---------- dot rows ---------- */
/* Progressive fill: tapping the 4th dot fills 1-4, so the row reads as a
   quantity rather than five things you might have chosen. No numerals are
   drawn — they were the same five digits repeated six times down the card —
   but every dot still carries its value in aria-label, and aria-pressed is
   true for all dots up to it, which is what makes the fill legible to a
   screen reader too. */
function buildDots(el, value, onPick, name) {
  el.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(value != null && i <= value));
    b.setAttribute('aria-label', (name || 'Rating') + ' ' + i + ' of 5');
    b.title = i + ' of 5';
    b.onclick = () => onPick(value === i ? null : i);   // tap the same one to clear
    el.appendChild(b);
  }
}

/* =============================================================
   PULSE — one form, three stores.
   daily.cards[]      the heartbeat (mood, energy, sleep, notes)
   body.checkins[]    the subjective body reads
   identity.pulse[]   mood + energy, kept for existing history
   All three upsert by date, so re-saving a day never duplicates it.
   ============================================================= */
let pulse = { mood: null, energy: null, fatigue: null, soreness: null, comfort: null };

function card(d) { return state.daily.cards.find((c) => c.date === d); }
function checkin(d) { return state.body.checkins.find((c) => c.date === d); }

function loadPulse() {
  const c = card(day) || {}, ck = checkin(day) || {};
  pulse = {
    mood: c.mood ?? null,
    energy: c.energy ?? ck.energy ?? null,
    fatigue: ck.fatigue ?? null,
    soreness: ck.soreness ?? null,
    comfort: ck.comfort ?? null,
  };
  renderPulse();
}
function renderPulse() {
  buildDots($('dMood'), pulse.mood, (v) => { pulse.mood = v; renderPulse(); }, 'Mood');
  buildDots($('dEnergy'), pulse.energy, (v) => { pulse.energy = v; renderPulse(); }, 'Energy');
  buildDots($('dFatigue'), pulse.fatigue, (v) => { pulse.fatigue = v; renderPulse(); }, 'Fatigue');
  buildDots($('dSore'), pulse.soreness, (v) => { pulse.soreness = v; renderPulse(); }, 'Soreness');
  buildDots($('dComfort'), pulse.comfort, (v) => { pulse.comfort = v; renderPulse(); }, 'Comfort');
  const c = card(day);
  $('pulseSaved').textContent = c ? 'saved' : '';
}
function savePulse() {
  // The free-text fields were removed from this card; any note already on a
  // record stays exactly as it was rather than being blanked by a re-save.
  let c = card(day);
  if (!c) { c = { id: uid(), date: day, tags: [] }; state.daily.cards.push(c); }
  c.mood = pulse.mood; c.energy = pulse.energy;
  stamp(c);

  let ck = checkin(day);
  if (!ck) { ck = { id: uid(), date: day }; state.body.checkins.push(ck); }
  ck.energy = pulse.energy; ck.fatigue = pulse.fatigue;
  ck.soreness = pulse.soreness; ck.comfort = pulse.comfort;
  stamp(ck);

  if (pulse.mood != null || pulse.energy != null) {
    let p = state.identity.pulse.find((x) => x.date === day);
    if (!p) { p = { id: uid(), date: day }; state.identity.pulse.push(p); }
    p.mood = pulse.mood; p.energy = pulse.energy;
    stamp(p);
  }

  saveState();
  $('pulseSaved').textContent = 'saved ✓';
  setTimeout(() => renderPulse(), 1400);
  renderFeed();
}

/* ---- sleep: a night on a track ----------------------------------------
   Hour chips asked "how many hours?", which is a sum you have to do in your
   head at 7am. Two handles on a 24-hour track ask when you went down and
   when you got up, which is what you actually remember, and the duration
   falls out.

   Crossing midnight is the normal case, not an edge case: it means the
   overnight sleep, and it is filed under the WAKE day — the day you are
   looking at — so you never open Yesterday to record a bedtime. A night
   that does not cross midnight is a nap.

   Dragging never logs. Enter does. Sleep is the one thing here you tend to
   fiddle with before it is right, and a control that wrote on every pixel
   of movement would fill the tracker with noise.
   ------------------------------------------------------------------------ */
let bedH = 23;          // hours-of-day, half-hour resolution
let wakeH = 7;
let sleepArmed = true;  // false once entered, until a handle moves

const snapHalf = (h) => Math.max(0, Math.min(24, Math.round(h * 2) / 2));
const sleepDur = () => (wakeH - bedH + 24) % 24;
/* Two different questions. `wraps` is geometry — does the bar cross the right
   edge and continue on the left. `isOvernight` is classification — is this the
   night's sleep or a nap. They agree except at a bedtime of exactly midnight,
   which does not wrap but is plainly the night rather than an 8-hour nap. */
const wraps = () => wakeH < bedH;
const isOvernight = () => wraps() || bedH === 0;

function fmtHour(h) {
  h = ((h % 24) + 24) % 24;
  const whole = Math.floor(h);
  const half = h - whole >= 0.5 ? ':30' : '';
  const ap = whole < 12 ? 'am' : 'pm';
  let display = whole % 12; if (display === 0) display = 12;
  return display + half + ap;
}

function renderSleep() {
  const dur = sleepDur();
  const pct = (h) => (h / 24) * 100;
  const fillA = $('sleepFillA'), fillB = $('sleepFillB');
  if (wraps()) {
    // Two segments: bed -> midnight, midnight -> wake.
    fillA.style.left = pct(bedH) + '%'; fillA.style.width = pct(24 - bedH) + '%';
    fillB.style.left = '0%';            fillB.style.width = pct(wakeH) + '%';
    fillB.hidden = false;
  } else {
    fillA.style.left = pct(bedH) + '%'; fillA.style.width = pct(wakeH - bedH) + '%';
    fillB.hidden = true;
  }
  $('sleepBed').style.left = pct(bedH) + '%';
  $('sleepWake').style.left = pct(wakeH) + '%';
  $('sleepBed').setAttribute('aria-valuetext', 'Bedtime ' + fmtHour(bedH));
  $('sleepWake').setAttribute('aria-valuetext', 'Wake ' + fmtHour(wakeH));

  const kind = isOvernight() ? 'last night' : 'nap';
  $('sleepRead').innerHTML =
    '<b>' + round1(dur) + ' h</b> · ' + esc(kind) + ' ' +
    esc(fmtHour(bedH)) + ' → ' + esc(fmtHour(wakeH));
  const btn = $('sleepEnter');
  btn.textContent = sleepArmed ? 'Enter' : 'Entered ✓';
  btn.disabled = !sleepArmed || dur === 0;

  buildDots($('sQuality'), sleepDraft.quality, (v) => { sleepDraft.quality = v; renderSleep(); }, 'Sleep quality');
}

/** The overnight for a date is single — entering another replaces it. */
function sleepFor(d) {
  return (state.body.sleep || []).find((s) => s.date === d && (s.kind || 'overnight') === 'overnight');
}

function enterSleep() {
  const dur = sleepDur();
  if (!dur) return;
  const overnight = isOvernight();
  const quality = sleepDraft.quality;

  if (overnight) {
    let s = sleepFor(day);
    if (!s) { s = { id: uid(), date: day }; appendRec(state.body.sleep, stamp(s), 'sleep'); }
    s.hours = dur; s.quality = quality;
    s.start = bedH; s.end = wakeH; s.kind = 'overnight';
    stamp(s);
    // The Daily Card tracks the overnight, so the Weekly Review reads one source.
    let c = card(day);
    if (!c) { c = { id: uid(), date: day, tags: [] }; state.daily.cards.push(c); }
    c.sleep_hours = dur; c.sleep_quality = quality;
    stamp(c);
  } else {
    // A nap is just another entry — no upsert, they stack.
    appendRec(state.body.sleep, stamp({
      id: uid(), date: day, hours: dur, quality,
      start: bedH, end: wakeH, kind: 'nap',
    }), round1(dur) + ' h nap');
  }
  sleepArmed = false;
  saveState(); renderSleep(); renderFeed();
  toast(round1(dur) + ' h ' + (overnight ? 'sleep' : 'nap') + ' — tap Undo to take it back');
}

/** Load the day's overnight back onto the track, if there is one. */
function loadSleep() {
  const s = sleepFor(day);
  sleepDraft = { hours: s ? s.hours : null, quality: s ? s.quality : null };
  if (s && s.start != null && s.end != null) { bedH = s.start; wakeH = s.end; sleepArmed = false; }
  else { sleepArmed = true; }
  renderSleep();
}

/* Pointer drag on the track. Nudging either handle re-arms Enter. */
function wireSleepTrack() {
  const track = $('sleepTrack');
  let dragging = null;
  const hourAt = (clientX) => {
    const r = track.getBoundingClientRect();
    return snapHalf(((clientX - r.left) / r.width) * 24);
  };
  const move = (e) => {
    if (!dragging) return;
    const h = hourAt(e.clientX);
    if (dragging === 'bed') bedH = h; else wakeH = h;
    sleepArmed = true;
    renderSleep();
  };
  const stop = () => {
    dragging = null;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', stop);
  };
  [['sleepBed', 'bed'], ['sleepWake', 'wake']].forEach(([id, which]) => {
    $(id).addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragging = which;
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
    });
    // Keyboard: the handles are real buttons, so they must move without a mouse.
    $(id).addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 1 : 0.5;
      let d = 0;
      if (e.key === 'ArrowLeft') d = -step;
      else if (e.key === 'ArrowRight') d = step;
      else return;
      e.preventDefault();
      const v = snapHalf((which === 'bed' ? bedH : wakeH) + d);
      if (which === 'bed') bedH = v; else wakeH = v;
      sleepArmed = true;
      renderSleep();
    });
  });
  // Tapping the track moves whichever handle is nearer.
  track.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('sleephandle')) return;
    const h = hourAt(e.clientX);
    const dBed = Math.min(Math.abs(h - bedH), 24 - Math.abs(h - bedH));
    const dWake = Math.min(Math.abs(h - wakeH), 24 - Math.abs(h - wakeH));
    if (dBed <= dWake) bedH = h; else wakeH = h;
    sleepArmed = true;
    renderSleep();
  });
}

/* =============================================================
   INTAKE — one tabbed instrument over three stores.

   Drinks and Substances were the same control twice. Six tabs in one card
   instead, split only by the unit each kind is measured in — volume for the
   first three, count for the last three. A tap on a quick button logs
   immediately; exact amounts live behind the fold.

   The UI groups by what a thing IS; storage stays exactly where it was, so
   no history has to move:
     water            -> body.water[]       { oz }
     coffee / other   -> body.drinks[]      { kind, label, oz, count }
     alcohol          -> body.substances[]  { kind, count, oz }
     weed / nicotine  -> body.substances[]  { kind, count, note }
   ============================================================= */
const KINDS = {
  water:    { name: 'Water',    icon: '💧', c: 'water',    store: 'water' },
  coffee:   { name: 'Coffee',   icon: '☕', c: 'coffee',   store: 'drinks' },
  other:    { name: 'Other',    icon: '🥤', c: 'other',    store: 'drinks' },
  alcohol:  { name: 'Alcohol',  icon: '🍺', c: 'alcohol',  store: 'substances' },
  nicotine: { name: 'Nicotine', icon: '🚬', c: 'nicotine', store: 'substances' },
  weed:     { name: 'Weed',     icon: '🌿', c: 'weed',     store: 'substances' },
};
const intakeMeta = (k) => KINDS[k];          // the tracker reads its icons from here
/* Three buttons, always, whatever the tab — the slot is a fixed height so
   the card cannot twitch as you move between kinds. Two tabs need a choice
   before the amounts make sense, and both make it in the same slot rather
   than in a dialog: weed needs a form (bud is weighed, edibles are dosed),
   and Other needs a name before "+8 oz" means anything. */
const INTAKE_TABS = ['water', 'coffee', 'alcohol', 'nicotine', 'weed', 'other'];
const OZ_STEPS = [2, 8, 16];
const COUNT_STEPS = [1, 2, 3];
const WEED_FORMS = {
  bud:    { label: 'Bud',    unit: 'g',  steps: [0.1, 0.5, 1] },
  edible: { label: 'Edible', unit: 'mg', steps: [5, 20, 50] },
};
const isVolume = (kind) => KINDS[kind].store !== 'substances';

let intakeTab = 'water';
let weedForm = null;        // 'bud' | 'edible' — chosen in the slot
let otherLabel = '';        // the name you gave this drink

/** A tag that shows the choice and lets you take it back. */
function chosenTag(text, onClear) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip';
  b.setAttribute('aria-pressed', 'true');
  b.innerHTML = esc(text) + ' <span aria-hidden="true">✕</span>';
  b.title = 'Change';
  b.onclick = onClear;
  return b;
}
function stepButton(label, unit, onTap) {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = esc(label) + (unit ? '<span class="u">' + esc(unit) + '</span>' : '');
  b.onclick = onTap;
  return b;
}

function renderIntake() {
  const m = KINDS[intakeTab];
  $('intakeCard').style.setProperty('--c', 'var(--' + m.c + ')');
  // Title stays 'Intake'; the tint is what says which tab you are on.
  const t = totalOf(intakeTab);
  $('intakeTotal').textContent = (intakeTab !== 'water' && t.n)
    ? round1(t.n) + (t.unit ? ' ' + t.unit : '') : '';
  renderTabs($('intakeTabs'), INTAKE_TABS, intakeTab, (k) => {
    intakeTab = k; renderIntake();
  });

  const el = $('intakeQuick');
  el.innerHTML = ''; el.classList.remove('has-tag');

  if (intakeTab === 'weed' && !weedForm) {
    // Ask the one question that decides the unit, in the slot itself.
    ['bud', 'edible'].forEach((f) => el.appendChild(
      stepButton(WEED_FORMS[f].label, '', () => { weedForm = f; renderIntake(); })));
    return;
  }
  if (intakeTab === 'other' && !otherLabel) {
    const wrap = document.createElement('div');
    wrap.className = 'namefield';
    const input = document.createElement('input');
    input.type = 'text'; input.id = 'otherName';
    input.placeholder = 'what is it? — tea, juice, soda';
    const go = document.createElement('button');
    go.className = 'primary'; go.type = 'button'; go.textContent = 'Enter';
    const take = () => {
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      otherLabel = v; renderIntake();
    };
    go.onclick = take;
    input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); take(); } };
    wrap.appendChild(input); wrap.appendChild(go);
    el.appendChild(wrap);
    return;
  }

  if (intakeTab === 'weed') {
    const f = WEED_FORMS[weedForm];
    el.classList.add('has-tag');
    el.appendChild(chosenTag(f.label, () => { weedForm = null; renderIntake(); }));
    f.steps.forEach((n) => el.appendChild(
      stepButton(String(n), f.unit, () => logIntake(n))));
    return;
  }
  if (intakeTab === 'other') {
    el.classList.add('has-tag');
    el.appendChild(chosenTag(otherLabel, () => { otherLabel = ''; renderIntake(); }));
    OZ_STEPS.forEach((n) => el.appendChild(stepButton('+' + n, 'oz', () => logIntake(n))));
    return;
  }
  const vol = isVolume(intakeTab);
  (vol ? OZ_STEPS : COUNT_STEPS).forEach((n) => el.appendChild(
    stepButton('+' + n, vol ? 'oz' : '', () => logIntake(n))));
}

/* One tap logs. Undo is the safety net that makes committing immediately
   safe — the toast says so. */
function logIntake(n) {
  if (intakeTab === 'weed') {
    const f = WEED_FORMS[weedForm] || WEED_FORMS.bud;
    addIntake('weed', { count: 1, amount: n, unit: f.unit, form: weedForm || 'bud' });
    return;
  }
  if (isVolume(intakeTab)) {
    const opts = { oz: n };
    if (intakeTab === 'other') opts.label = otherLabel || 'Other';
    addIntake(intakeTab, opts);
    return;
  }
  addIntake(intakeTab, { count: n });
}
function arrOf(kind) {
  const s = KINDS[kind].store;
  return s === 'water' ? state.body.water : s === 'drinks' ? state.body.drinks : state.body.substances;
}
function entriesOf(kind) {
  return kind === 'water' ? onDay(state.body.water) : onDay(arrOf(kind)).filter((r) => r.kind === kind);
}
/** The day's headline number for a kind, in the unit that kind is about. */
function totalOf(kind) {
  const rows = entriesOf(kind);
  if (isVolume(kind)) {
    return { n: rows.reduce((a, r) => a + (Number(r.oz) || 0), 0), unit: 'oz' };
  }
  const n = rows.reduce((a, r) => a + (Number(r.count) || 1), 0);
  // A 12 oz beer and a 1.5 oz shot are one drink each. Counting is the only
  // reading of alcohol that carries that equivalence; ounces throw it away.
  if (kind === 'alcohol') return { n, unit: n === 1 ? 'drink' : 'drinks' };
  return { n, unit: '' };
}
/** How an entry reads in the tracker and in an undo message. */
function describeIntake(kind, rec) {
  if (kind === 'water') return round1(rec.oz) + ' oz water';
  const bits = [];
  // Weed carries an amount and a form, so it reads "0.5 g bud".
  if (rec.amount != null && rec.unit) {
    return round1(rec.amount) + ' ' + rec.unit + ' ' + (rec.form || KINDS[kind].name.toLowerCase());
  }
  if (rec.oz) bits.push(round1(rec.oz) + ' oz');
  else if (rec.count > 1) bits.push('×' + rec.count);
  bits.push(rec.label && rec.label !== KINDS[kind].name ? rec.label : KINDS[kind].name.toLowerCase());
  if (rec.note) bits.push('· ' + rec.note);
  return bits.join(' ');
}

function addIntake(kind, opts) {
  const m = KINDS[kind];
  const rec = stamp({ id: uid(), date: day, t: stampTime() });
  if (kind === 'water') {
    rec.oz = opts.oz;
  } else if (m.store === 'drinks') {
    rec.kind = kind; rec.count = 1;
    if (opts.oz != null) rec.oz = opts.oz;
    rec.label = opts.label || m.name;
  } else {
    rec.kind = kind; rec.count = Number(opts.count) || 1;
    if (opts.oz != null) rec.oz = opts.oz;
    if (opts.note) rec.note = opts.note;
    // Additive, optional: weed is weighed as bud and dosed as an edible.
    if (opts.form) rec.form = opts.form;
    if (opts.amount != null) { rec.amount = opts.amount; rec.unit = opts.unit; }
  }
  appendRec(arrOf(kind), rec, describeIntake(kind, rec));
  saveState();
  renderIntake();
  renderFoodTotals();
  renderFeed();
  toast(describeIntake(kind, rec) + ' — tap Undo to take it back');
}

function renderTabs(el, kinds, active, onPick) {
  el.innerHTML = '';
  kinds.forEach((k) => {
    const m = KINDS[k];
    const t = totalOf(k);
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--tc', 'var(--' + m.c + ')');
    b.setAttribute('aria-selected', String(k === active));
    const badge = (k !== 'water' && t.n) ? '<span class="n">' + round1(t.n) + '</span>' : '';
    b.innerHTML = esc(m.name) + badge;   // colour identifies the kind
    b.onclick = () => onPick(k);
    el.appendChild(b);
  });
}

/* =============================================================
   FOOD — NutriLens favorites + search.

   The library is 1.2 MB, so it is fetched lazily: when the card scrolls
   into view, or the moment you touch it. Paying for it on page load would
   make the first launch feel broken on mobile data, and most days you can
   log everything from the chip row without it.

   Per SCHEMA.md: an entry stores foodId + grams only. Nutrients are looked
   up at read time, so a library correction retroactively fixes history.
   ============================================================= */
const FOODS_URL = '../nutrilens/foods.json';
let foodsIndex = null;      // { list, byId }
let foodsPromise = null;    // in-flight fetch, so parallel callers share one
let chosenLabel = '';       // the named portion picked in the portion popover

function indexCustomFoods() {
  if (!foodsIndex) foodsIndex = { list: [], byId: new Map() };
  for (const f of (state.body.customFoods || [])) foodsIndex.byId.set(f.id, f);
}
function loadFoods() {
  if (foodsPromise) return foodsPromise;
  $('foodStatus').textContent = 'loading food library…';
  foodsPromise = fetch(FOODS_URL)
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      const list = (data.foods || []).map((f) => ({
        id: f.id, name: f.name, category: f.category, portions: f.portions || [], n: f,
      }));
      foodsIndex = { list, byId: new Map(list.map((f) => [f.id, f])) };
      indexCustomFoods();
      $('foodStatus').textContent = '';
      // The Tracker is now the only place the day's eating is shown, so it has
      // to be redrawn when the nutrients it reads finally arrive.
      renderFoodTotals(); renderFeed();
    })
    .catch(() => {
      // Opened as a file://, or served without the library beside it. Custom
      // foods still work and history stays readable — say so instead of failing.
      foodsIndex = foodsIndex || { list: [], byId: new Map() };
      indexCustomFoods();
      $('foodStatus').textContent = 'Food library unavailable — your own foods still work.';
      renderFoodTotals(); renderFeed();
    });
  return foodsPromise;
}
/* USDA names carry a lot of boilerplate ("Oats (Includes foods for USDA's Food
   Distribution Program)"). Shorten for display only — the stored foodName keeps
   the library's real name, so history stays faithful. */
function shortName(name, max) {
  let s = String(name || '')
    .replace(/\s*\((?:includes|prepared|packaged)[^)]*\)/ig, '')
    .replace(/,\s*(?:includes|prepared)[^,]*$/i, '')
    .trim();
  const lim = max || 22;
  if (s.length > lim) s = s.slice(0, lim - 1).replace(/[\s,]+$/, '') + '…';
  return s;
}

/** Per-100g nutrients for a logged entry, or null when unresolvable. */
function nutrientsFor(foodId) {
  const f = foodsIndex && foodsIndex.byId.get(foodId);
  return f ? (f.n || f) : null;
}
function kcalOf(entry) {
  const n = nutrientsFor(entry.foodId);
  return n && n.kcal != null ? (n.kcal * entry.grams) / 100 : null;
}
function proteinOf(entry) {
  const n = nutrientsFor(entry.foodId);
  return n && n.protein_g != null ? (n.protein_g * entry.grams) / 100 : null;
}

/* `qty` is how many of the named portion this entry stands for. It is display
   and provenance only — `grams` is always the total actually eaten, so nothing
   derived ever multiplies by it and no reading of this record can double-count.
   Same meaning self.html has given the field since before v13. */
function logFood(foodId, foodName, grams, portionLabel, qty) {
  const times = Math.max(1, Math.round(Number(qty) || 1));
  const rec = stamp({
    id: uid(), date: day, foodId, foodName,
    grams: Math.round(grams * 10) / 10,
    portion: portionLabel || '', t: stampTime(),
  });
  if (times > 1) rec.qty = times;
  const label = (times > 1 ? times + '× ' : '') + shortName(foodName, 24);
  appendRec(state.body.food, rec, label);
  saveState(); renderFoodTotals(); renderFeed();
  toast('Logged ' + label);
}
/** How many of a thing a record stands for; absent means one. */
const timesOf = (r) => Math.max(1, Math.round(Number(r && r.qty) || 1));
/** How a food entry reads back: "2× Egg · 1 large egg · 155 kcal".
 *  `portionLabel` is self.html's older name for `portion`; read both. */
function foodLine(r) {
  const times = timesOf(r);
  const kc = kcalOf(r);
  return (times > 1 ? times + '× ' : '') + shortName(r.foodName || 'food', 28) +
    ' · ' + (r.portion || r.portionLabel || round1(r.grams) + ' g') +
    (kc == null ? '' : ' · ' + Math.round(kc) + ' kcal');
}

/* ---- search ----
   Ranking matters more than it looks. Sorting ties by shortest name buried
   "Egg, hard-boiled" (16 chars) under "Eggnog" (6) and "Eggplant" (13) — the
   database had the egg all along, the search just never showed it. So a
   WHOLE-WORD match now outranks a prefix-of-a-longer-word: "egg" matches the
   word "Egg," in "Egg, hard-boiled" before it matches the start of "Eggnog". */
const WORD_EDGE = /[\s,()\-/]/;
/** How well one word matches a name: 0 exact, 1 whole word, 2 word-prefix, 3 buried, -1 absent. */
function tokenRank(name, t) {
  const i = name.indexOf(t);
  if (i < 0) return { rank: -1, pos: -1 };
  const startsWord = i === 0 || WORD_EDGE.test(name[i - 1]);
  const after = name[i + t.length];
  const endsWord = after === undefined || WORD_EDGE.test(after);
  return { rank: name === t ? 0 : (startsWord && endsWord) ? 1 : startsWord ? 2 : 3, pos: i };
}
function searchFoods(q) {
  if (!foodsIndex || !q) return [];
  const s = q.toLowerCase().trim();
  if (s.length < 2) return [];
  // Every word must appear, in any order: "boiled egg" has to find
  // "Egg, hard-boiled", which a whole-phrase match never would.
  const tokens = s.split(/\s+/).filter(Boolean);
  const anchor = tokens.slice().sort((a, b) => b.length - a.length)[0];
  const hits = [];
  const all = [...foodsIndex.list, ...(state.body.customFoods || [])];
  for (const f of all) {
    const name = (f.name || '').toLowerCase();
    // Curated foods carry aliases — "mayo", "bbq sauce", "red pepper flakes".
    // A word found only there still counts, just at a worse tier than the name.
    // loadFoods() maps records to {id,name,category,portions,n}, so the raw
    // record — and its aliases — hangs off .n; customFoods carry theirs flat.
    const alias = ((f.aliases || (f.n && f.n.aliases) || []).join(' ')).toLowerCase();
    const each = tokens.map((t) => {
      const r = tokenRank(name, t);
      if (r.rank >= 0) return r;
      return alias.includes(t) ? { rank: 4, pos: 0 } : { rank: -1, pos: -1 };
    });
    if (each.some((r) => r.rank < 0)) continue;
    // The worst word decides the tier, so a stray buried word can't flatter a match.
    const rank = Math.max(...each.map((r) => r.rank));
    hits.push({ f, rank, pos: tokenRank(name, anchor).pos, len: name.length });
    if (hits.length > 600) break;
  }
  hits.sort((a, b) => a.rank - b.rank || a.pos - b.pos || a.len - b.len);
  return hits.slice(0, 14).map((h) => h.f);
}

function renderResults(q) {
  const box = $('foodResults');
  const rows = searchFoods(q);
  box.innerHTML = '';
  if (!q || q.trim().length < 2) return;
  if (!rows.length) {
    box.innerHTML = '<div class="none">' +
      (foodsIndex && foodsIndex.list.length ? 'No match.' : 'Food library still loading…') + '</div>';
    return;
  }
  rows.forEach((f) => {
    const b = document.createElement('button');
    b.type = 'button';
    const n = f.n || f;
    const kc = n && n.kcal != null ? Math.round(n.kcal) + ' kcal/100g' : '';
    b.innerHTML = esc(f.name) + '<span class="meta">' +
      esc([f.category, kc].filter(Boolean).join(' · ')) + '</span>';
    b.onclick = () => {
      $('foodSearch').value = ''; box.innerHTML = '';
      openPortion(f.id, f.name);
    };
    box.appendChild(b);
  });
}

/* ---- portion picker ----
   Grams stays the number that is stored. The stepper above it is a multiplier
   on the chosen portion — three eggs is a thing you know, 150 g of egg is a
   thing you would have to work out — and it simply drives the grams field. */
function openPortion(foodId, foodName) {
  const f = foodsIndex && foodsIndex.byId.get(foodId);
  const name = (f && f.name) || foodName || 'food';
  const portions = (f && f.portions) || [];
  let unit = portions[0] ? portions[0].grams : 100;   // grams in one of them
  let count = 1;

  openPop(name,
    (portions.length ? '<div class="rowlabel">Portion</div><div class="chips" id="popPortions"></div>' : '') +
    '<div class="rowlabel">How many</div><div id="popQty"></div>' +
    '<div class="rowlabel">Grams</div><input type="number" id="popGrams" min="1" step="1" value="' +
      unit + '">' +
    '<div class="tiny" id="popKcal" style="margin-top:8px"></div>' +
    '',
    () => {
      const g = parseFloat($('popGrams').value);
      if (!g || g <= 0) return false;
      // Grams typed by hand is the total you meant; the multiple no longer
      // describes it, so it is not recorded as one.
      const times = Math.abs(g - round1(unit * count)) < 0.05 ? count : 1;
      logFood(foodId, name, g, chosenLabel, times);
    },
    () => {
      const gEl = $('popGrams');
      const showKcal = () => {
        const n = nutrientsFor(foodId);
        const g = parseFloat(gEl.value) || 0;
        $('popKcal').textContent = n && n.kcal != null
          ? Math.round((n.kcal * g) / 100) + ' kcal · ' + Math.round((n.protein_g || 0) * g / 100) + ' g protein'
          : '';
      };
      const paintQty = () => {
        const box = $('popQty'); box.innerHTML = '';
        box.appendChild(stepper(count, (v) => {
          count = v; gEl.value = round1(unit * v); showKcal(); paintQty();
        }, name));
      };
      // Typing keeps the readout live; the multiple is re-based on the way out,
      // so the field never loses focus mid-number.
      gEl.oninput = () => { chosenLabel = ''; showKcal(); };
      gEl.onchange = () => {
        const g = parseFloat(gEl.value);
        if (g > 0) { unit = g; count = 1; paintQty(); }
      };
      if (portions.length) {
        const box = $('popPortions');
        portions.slice(0, 8).forEach((p, i) => {
          const b = document.createElement('button');
          b.className = 'chip'; b.type = 'button'; b.textContent = p.label;
          b.setAttribute('aria-pressed', String(i === 0));
          b.onclick = () => {
            unit = p.grams; count = 1;
            gEl.value = p.grams; chosenLabel = p.label; showKcal(); paintQty();
            [...box.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
          };
          box.appendChild(b);
        });
        chosenLabel = portions[0].label;
      }
      paintQty(); showKcal();
    }, 'Log');
}

/* The Food card is an instrument, not a ledger. It kept the day's eating in
   a list below the search box, which grew a row per entry and pushed the
   card — and the column under it — down the page as the day went on. Every
   other card on this page holds still while you use it, and this one now
   does too: the macro bar is three fixed cells, and the day's eating is in
   the Tracker with everything else you logged. */
function renderFoodTotals() {
  const rows = onDay(state.body.food);
  const t = state.body.targets || {};
  let kcal = 0, protein = 0, unknown = 0;
  rows.forEach((e) => {
    const k = kcalOf(e), p = proteinOf(e);
    if (k == null) unknown++; else { kcal += k; protein += p || 0; }
  });
  const cell = (label, val, target, unit) => {
    const pct = target ? Math.min(100, (val / target) * 100) : 0;
    const over = target && val > target;
    return '<div class="m"><div class="k">' + label + '</div>' +
      '<div class="v">' + Math.round(val).toLocaleString() +
        '<span class="u">' + (target ? ' / ' + target + unit : unit) + '</span></div>' +
      '<div class="bar"><span class="' + (over ? 'over' : '') + '" style="width:' + pct + '%"></span></div></div>';
  };
  // Water reads against a target, and the macro bar is the only row on the
  // page with targets in it — so it belongs here, and only here.
  const water = onDay(state.body.water).reduce((n, r) => n + (Number(r.oz) || 0), 0);
  $('foodMacros').innerHTML =
    cell('Calories', kcal, t.kcal, unknown ? ' kcal · ' + unknown + ' unresolved' : ' kcal') +
    cell('Protein', protein, t.protein_g, ' g') +
    cell('Water', water, t.water_oz || 64, ' oz');
}

/* ---- meals: the combinations you eat again ----
   Two ways in, because they suit different moments. Build one deliberately
   from search when you know the recipe, or keep a day you have already
   logged when it turns out to be worth repeating. */
function mealKcal(meal) {
  return (meal.items || []).reduce((n, it) => {
    const nut = nutrientsFor(it.foodId);
    return n + (nut && nut.kcal != null ? (nut.kcal * it.grams) / 100 : 0);
  }, 0);
}
/** Replay a meal into food[] as ordinary entries, `qty` times over.
 *
 *  A meal stays a shortcut for typing and never becomes a record of eating in
 *  its own right (SCHEMA.md §3) — so nutrients still resolve per ingredient at
 *  read time, and editing the meal tomorrow cannot rewrite what you ate today.
 *  What is new is that the entries share a `mealLogId`, which lets the Tracker
 *  show the one thing you ate instead of the five rows it took to record it.
 *
 *  The popover stays open: each row commits itself, and Done is what closes it. */
function logMeal(meal, qty) {
  const times = Math.max(1, Math.round(Number(qty) || 1));
  const logId = uid();
  const added = [];
  (meal.items || []).forEach((it) => {
    const each = Math.max(1, Math.round(Number(it.qty) || 1)) * times;
    const rec = stamp({
      id: uid(), date: day, foodId: it.foodId, foodName: it.foodName,
      grams: Math.round(it.grams * times * 10) / 10,
      portion: it.portion || '', t: stampTime(),
      mealLogId: logId, mealName: meal.name, mealQty: times,
    });
    if (each > 1) rec.qty = each;
    state.body.food.push(rec);
    added.push(rec.id);
  });
  if (!added.length) { toast('That meal has no foods in it yet'); return; }
  const label = (times > 1 ? times + '× ' : '') + meal.name;
  // One press of Undo takes back the meal, not one ingredient of it.
  pushUndo(label, () => added.forEach((id) => {
    const i = state.body.food.findIndex((r) => r.id === id);
    if (i >= 0) state.body.food.splice(i, 1);
  }));
  saveState(); renderFoodTotals(); renderFeed();
  toast('Logged ' + label);
}

/* ---- the builder ---- */
let mealDraft = [];        // [{ foodId, foodName, grams, portion }]
let mealEditing = null;    // the meal being edited, or null for a new one

function openMealBuilder(existing) {
  loadFoods();
  mealEditing = existing || null;
  mealDraft = existing ? (existing.items || []).map((i) => ({ ...i })) : [];

  openPop(existing ? 'Edit meal' : 'New meal',
    '<input type="text" id="mbName" placeholder="what do you call it? — breakfast, post-gym…">' +
    /* Two ways to fill the list, and they suit different moments: search for
       it when you know the recipe, or take a day you have already logged when
       it turns out to be worth repeating. The second rides on the label of the
       section it belongs to, so it never moves when results appear. */
    '<div class="rowlabel splitlabel">Add foods' +
      '<button class="mini" id="mbToday" type="button">＋ From today’s food</button></div>' +
    '<div class="searchwrap">' +
      '<input type="text" id="mbSearch" placeholder="Search foods…" autocomplete="off">' +
      '<div class="results flat" id="mbResults"></div>' +
    '</div>' +
    '<div class="meals" id="mbItems"></div>' +
    '<div class="tiny" id="mbTotal" style="margin-top:8px"></div>',
    () => {
      const name = $('mbName').value.trim();
      if (!name || !mealDraft.length) return false;
      if (mealEditing) {
        mealEditing.name = name;
        mealEditing.items = mealDraft.map((i) => ({ ...i }));
        stamp(mealEditing);
        saveState(); toast('Saved ' + name);
      } else {
        appendRec(state.body.meals, stamp({
          id: uid(), name, items: mealDraft.map((i) => ({ ...i })),
        }), 'meal “' + name + '”');
        saveState(); toast('Saved ' + name);
      }
      mealDraft = []; mealEditing = null;
    },
    () => {
      if (existing) $('mbName').value = existing.name || '';

      const paint = () => {
        const box = $('mbItems');
        box.innerHTML = '';
        if (!mealDraft.length) {
          box.innerHTML = '<div class="empty">No foods yet — search above and tap to add.</div>';
        }
        mealDraft.forEach((it, idx) => {
          const times = Math.max(1, Math.round(Number(it.qty) || 1));
          const unit = it.grams / times;              // grams in one of them
          const div = document.createElement('div'); div.className = 'mealrow';
          div.innerHTML = '<div class="mh"><span class="nm">' +
            esc(shortName(it.foodName, 30)) + '</span>' +
            (it.portion ? '<span class="tiny">' + esc(it.portion) + '</span>' : '') + '</div>';
          const act = document.createElement('div'); act.className = 'ma';
          act.appendChild(stepper(times, (v) => {
            it.qty = v; it.grams = Math.round(unit * v * 10) / 10;
            if (v === 1) delete it.qty;
            paint();
          }, it.foodName));
          const g = document.createElement('input');
          g.type = 'number'; g.min = '1'; g.step = '1'; g.value = round1(it.grams);
          g.style.cssText = 'width:72px;padding:5px 7px;font-size:.78rem';
          g.title = 'grams'; g.setAttribute('aria-label', 'Grams of ' + it.foodName);
          // Live while typing; re-based on the way out. A hand-typed number is
          // the whole amount, so the named portion and the multiple both go.
          g.oninput = () => {
            const v = parseFloat(g.value);
            if (v > 0) { it.grams = v; it.portion = ''; delete it.qty; total(); }
          };
          g.onchange = () => paint();
          const sp = document.createElement('span'); sp.className = 'sp';
          const x = document.createElement('button');
          x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Remove';
          x.setAttribute('aria-label', 'Remove ' + it.foodName);
          x.onclick = () => { mealDraft.splice(idx, 1); paint(); };
          act.appendChild(g); act.appendChild(sp); act.appendChild(x);
          div.appendChild(act);
          box.appendChild(div);
        });
        total();
      };
      const total = () => {
        const kc = mealDraft.reduce((n, it) => {
          const nut = nutrientsFor(it.foodId);
          return n + (nut && nut.kcal != null ? (nut.kcal * it.grams) / 100 : 0);
        }, 0);
        $('mbTotal').textContent = mealDraft.length
          ? mealDraft.length + ' item' + (mealDraft.length === 1 ? '' : 's') +
            (kc ? ' · ' + Math.round(kc) + ' kcal' : '')
          : '';
      };

      const search = $('mbSearch');
      const showResults = () => {
        const box = $('mbResults');
        const rows = searchFoods(search.value);
        box.innerHTML = '';
        if (search.value.trim().length < 2) return;
        if (!rows.length) {
          box.innerHTML = '<div class="none">' +
            (foodsIndex && foodsIndex.list.length ? 'No match.' : 'Food library still loading…') + '</div>';
          return;
        }
        rows.slice(0, 8).forEach((f) => {
          const b = document.createElement('button');
          b.type = 'button';
          const n = f.n || f;
          b.innerHTML = esc(f.name) + '<span class="meta">' +
            esc([f.category, n && n.kcal != null ? Math.round(n.kcal) + ' kcal/100g' : '']
              .filter(Boolean).join(' · ')) + '</span>';
          b.onclick = () => {
            const p = (f.portions || [])[0];
            mealDraft.push({ foodId: f.id, foodName: f.name,
                             grams: p ? p.grams : 100, portion: p ? p.label : '' });
            search.value = ''; box.innerHTML = '';
            paint(); search.focus();
          };
          box.appendChild(b);
        });
      };
      search.oninput = () => { loadFoods().then(showResults); showResults(); };
      search.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const first = $('mbResults').querySelector('button');
          if (first) first.click();
        }
      };

      /* Adds the day to the list you are building rather than replacing it,
         and you drop what was not part of the meal with the ✕ beside each —
         a day's eating is rarely exactly one meal. A meal already logged
         today arrives as its ingredients, which is what it is in the data. */
      $('mbToday').onclick = () => {
        const rows = onDay(state.body.food);
        if (!rows.length) { toast('Nothing logged today to take'); return; }
        rows.forEach((r) => {
          const it = { foodId: r.foodId, foodName: r.foodName,
                       grams: r.grams, portion: r.portion || r.portionLabel || '' };
          if (timesOf(r) > 1) it.qty = timesOf(r);
          mealDraft.push(it);
        });
        paint();
        toast('Took ' + plural(rows.length, 'food') + ' from today');
      };

      paint();
      $('mbName').focus();
    },
    'Save meal');
}

/* Each row is its own little form: how many, then Add. Nothing here is
   pending when you leave, so the footer is a plain Done rather than a Save
   that would imply the row you already logged had not been. */
function openMeals() {
  loadFoods();
  // Reset every time the popover opens: yesterday's "3×" is not a standing
  // intention, and a stepper you did not set is a quantity you did not choose.
  const count = new Map();
  openPop('Meals',
    '<div class="meals" id="mealList"></div>',
    null,
    () => {
      const box = $('mealList');
      const paint = () => {
        box.innerHTML = '';
        const live = state.body.meals || [];
        if (!live.length) {
          box.innerHTML = '<div class="empty">No meals yet — use Build.</div>';
          return;
        }
        live.slice().reverse().forEach((m) => {
          const times = Math.max(1, Math.round(count.get(m.id) || 1));
          const kc = Math.round(mealKcal(m) * times);
          const div = document.createElement('div'); div.className = 'mealrow';
          div.innerHTML = '<div class="mh"><span class="nm">' + esc(m.name) + '</span>' +
            '<span class="tiny">' + plural((m.items || []).length, 'item') +
            (kc ? ' · ' + kc + ' kcal' : '') + '</span></div>';
          const act = document.createElement('div'); act.className = 'ma';
          act.appendChild(stepper(times, (v) => { count.set(m.id, v); paint(); }, m.name));
          const add = document.createElement('button');
          add.className = 'primary sm'; add.type = 'button'; add.textContent = 'Add';
          add.setAttribute('aria-label', 'Log ' + times + ' × ' + m.name);
          add.onclick = () => { logMeal(m, count.get(m.id) || 1); paint(); };
          const sp = document.createElement('span'); sp.className = 'sp';
          const edit = document.createElement('button');
          edit.className = 'mini'; edit.type = 'button'; edit.textContent = 'Edit';
          edit.setAttribute('aria-label', 'Edit ' + m.name);
          edit.onclick = () => openMealBuilder(m);
          const x = document.createElement('button');
          x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Delete meal';
          x.setAttribute('aria-label', 'Delete the meal ' + m.name);
          x.onclick = () => { dropRecord(state.body.meals, m.id, m.name); saveState(); paint(); };
          act.appendChild(add); act.appendChild(sp); act.appendChild(edit); act.appendChild(x);
          div.appendChild(act);
          box.appendChild(div);
        });
      };
      paint();
    });
}

/* =============================================================
   MOVEMENT — a control panel, not a history.

   Two rows of four tiles pick a category; the category's quick-log fills
   a slot whose height never changes. Everything in the slot is an
   ACCUMULATOR: a chip adds its face value to a running total in the
   dashed readout at the row's right, the readout taps back to zero, and
   nothing is written until Enter. One Enter = one exercise[] record —
   the session you did, not a row per chip.
   ============================================================= */
/* A starting set for the workout builder's type list, so it is useful on
   the first day. Only suggestions: none is stored until you use it. */
const EX_SEEDS = ['Walk', 'Run', 'Lift', 'Bike', 'Swim', 'Yoga', 'Pickleball',
                  'Hike', 'Stretch', 'Row', 'Climb', 'Sport'];

/** Every type worth offering in the workout builder: the moves you have
 *  remembered, the types you have logged, then the seeds. Deduped on case,
 *  because "Walk" and "walk" are one activity, and first spelling seen wins
 *  so your own wording survives. Moves you deleted (`gone`) stay gone. */
function exTypes() {
  const out = new Map();
  const add = (t) => {
    const s = String(t || '').trim();
    if (!s) return;
    const k = s.toLowerCase();
    if (!out.has(k)) out.set(k, s);
  };
  (state.body.exerciseTypes || []).forEach((r) => { if (!r.gone) add(r.name); });
  (state.body.exercise || []).slice().reverse().forEach((e) => add(e.type));
  EX_SEEDS.forEach(add);
  return [...out.values()];
}

/* The six categories. `time` chips differ where the natural session does:
   a walk grows by twenties, a set of stretches by fives. */
const EXCATS = {
  walk:    { label: 'Walk',    icon: '🚶', time: [2, 5, 20, 30], dist: true },
  run:     { label: 'Run',     icon: '🏃', time: [2, 5, 20, 30], dist: true },
  bike:    { label: 'Bike',    icon: '🚴', time: [2, 5, 20, 30], dist: true },
  lift:    { label: 'Lift',    icon: '🏋', time: [1, 5, 10, 25], moves: 'reps' },
  stretch: { label: 'Stretch', icon: '🧘', time: [1, 5, 10, 25], moves: 'plain' },
  other:   { label: 'Other',   icon: '✳️', time: [2, 5, 20, 30], named: true },
};
const DIST_STEPS = [0.5, 1, 3, 10];
const REPS_STEPS = [1, 5, 10, 25];

/** The category open right now, and its accumulating session. Runtime only,
 *  never persisted; discarded on collapse, written only by Enter. */
let exCat = '';
let exSess = null;
const freshSess = () => ({ min: 0, mi: 0, dots: 0, moves: [], sel: '', name: '', adding: false, edit: false });

function pickCat(cat) {
  exCat = (exCat === cat) ? '' : cat;    // tap the open one again to collapse
  exSess = exCat ? freshSess() : null;
  renderMovement();
}

/** Every mutation of the session goes through here: read-modify-write in one
 *  synchronous step, then one repaint — so rapid taps can never drop. */
function updSess(fn) {
  if (!exSess) return;
  fn(exSess);
  renderMovement();
}

/* ---- the rows the panels are made of ---- */
/** label · chips · dashed readout. Chips ADD; the readout taps to zero. */
function accRow(label, steps, fmtChip, onAdd, readText, isZero, onClear) {
  const row = document.createElement('div'); row.className = 'exline';
  const lab = document.createElement('span'); lab.className = 'exlab'; lab.textContent = label;
  row.appendChild(lab);
  steps.forEach((n) => {
    const b = document.createElement('button');
    b.className = 'exchip'; b.type = 'button'; b.textContent = fmtChip(n);
    b.setAttribute('aria-label', 'Add ' + n + ' to ' + label);
    b.onclick = () => onAdd(n);
    row.appendChild(b);
  });
  const read = document.createElement('button');
  read.className = 'exread' + (isZero() ? ' zero' : ''); read.type = 'button';
  read.textContent = readText();
  read.title = 'Tap to clear'; read.setAttribute('aria-label', label + ' so far: ' + readText() + ' — tap to clear');
  read.onclick = onClear;
  row.appendChild(read);
  return row;
}
function dotRow(value, onPick) {
  const row = document.createElement('div'); row.className = 'exline';
  const lab = document.createElement('span'); lab.className = 'exlab'; lab.textContent = 'Intensity';
  const dots = document.createElement('div'); dots.className = 'dots';
  buildDots(dots, value || null, onPick, 'Intensity');
  row.appendChild(lab); row.appendChild(dots);
  return row;
}

function timeRow(meta, s) {
  return accRow('Time', meta.time, (n) => '+' + n,
    (n) => updSess((x) => { x.min += n; }),
    () => s.min + 'm', () => s.min === 0,
    () => updSess((x) => { x.min = 0; }));
}

/** Can this session be entered yet? Content rules per category. */
function canEnter() {
  const s = exSess;
  if (!s) return false;
  const meta = EXCATS[exCat] || {};
  if (meta.dist) return s.min > 0 || s.mi > 0;
  if (meta.moves === 'reps') return s.min > 0 || s.moves.some((m) => m.reps > 0);
  if (meta.moves === 'plain') return s.min > 0 || s.moves.length > 0;
  if (meta.named) return !!s.name.trim() && (s.min > 0 || s.dots > 0);
  return s.min > 0;
}

function renderMovement() {
  const wrap = $('exCats');
  if (!wrap) return;
  wrap.querySelectorAll('[data-excat]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.excat === exCat)));
  const slot = $('exSlot');
  slot.innerHTML = '';
  if (!exCat) {
    const empty = document.createElement('div');
    empty.className = 'exempty'; empty.textContent = 'Pick what you did.';
    slot.appendChild(empty);
    return;
  }
  const meta = EXCATS[exCat];
  const s = exSess;
  const panel = document.createElement('div'); panel.className = 'expanel';

  panel.appendChild(timeRow(meta, s));
  if (meta.dist) {
    panel.appendChild(accRow('Dist', DIST_STEPS, (n) => '+' + n,
      (n) => updSess((x) => { x.mi = round1(x.mi + n); }),
      () => round1(s.mi) + 'mi', () => s.mi === 0,
      () => updSess((x) => { x.mi = 0; })));
  }
  panel.appendChild(dotRow(s.dots, (v) => updSess((x) => { x.dots = v || 0; })));

  const space = document.createElement('div'); space.className = 'exspace';
  panel.appendChild(space);

  // Reserved height whether or not there is an estimate to show, so the
  // line appearing cannot move Enter.
  const kcal = document.createElement('div'); kcal.className = 'exkcal'; kcal.id = 'exKcal';
  panel.appendChild(kcal);

  const enter = document.createElement('button');
  enter.className = 'primary exenter'; enter.type = 'button'; enter.id = 'exEnter';
  enter.textContent = 'Enter';
  enter.disabled = !canEnter();
  enter.onclick = logMove;
  panel.appendChild(enter);

  slot.appendChild(panel);
}

/** How a quick-log entry reads back — in the Tracker, in an undo message,
 *  in the forever-copy. Every optional field earns its clause. */
function moveLine(r) {
  const bits = [r.cat === 'other' ? (r.label || r.type) : r.type];
  if (r.minutes) bits.push(r.minutes + ' min');
  if (r.distanceMi) bits.push(round1(r.distanceMi) + ' mi');
  if (r.moves && r.moves.length) {
    bits.push(r.moves.map((m) => m.name + (m.reps ? ' ×' + m.reps : '')).join(', '));
  }
  if (r.kcalEst) bits.push('≈' + r.kcalEst + ' kcal');
  if (r.intensity) bits.push('●'.repeat(r.intensity) + '○'.repeat(5 - r.intensity));
  return bits.join(' · ');
}

/** One Enter, one record. The session is a single thing you did — unlike a
 *  workout, which replays into one entry per exercise on purpose. */
function logMove() {
  if (!canEnter()) return;
  const meta = EXCATS[exCat];
  const s = exSess;
  const rec = {
    id: uid(), date: day, cat: exCat, type: meta.label,
    minutes: s.min > 0 ? s.min : null, time: stampTime(),
  };
  if (meta.dist && s.mi > 0) rec.distanceMi = round1(s.mi);
  if (s.dots) rec.intensity = s.dots;
  stamp(rec);
  appendRec(state.body.exercise, rec, moveLine(rec));
  saveState(); renderFeed();
  exCat = ''; exSess = null;
  renderMovement();
  toast('Logged ' + moveLine(rec));
}

/* ---- workouts: the sessions you repeat ----
   The Food card's meals machinery, repeated for movement — same two doors,
   same contract. Build one deliberately from the type list, or keep a day
   you have already logged when it turns out to be worth repeating. */
function workoutMin(w) {
  return (w.items || []).reduce((n, it) => n + (Number(it.minutes) || 0), 0);
}
/** Replay a workout into exercise[] as ordinary entries.
 *
 *  A workout stays a shortcut for typing and never becomes a record of moving
 *  in its own right (SCHEMA.md §3, same contract as meals) — so editing the
 *  workout tomorrow cannot rewrite what you did today. The entries share a
 *  `workoutLogId`, which lets the Tracker show the one session you did
 *  instead of the rows it took to record it. */
function logWorkout(w) {
  const logId = uid();
  const added = [];
  (w.items || []).forEach((it) => {
    const rec = stamp({
      id: uid(), date: day, type: it.type,
      minutes: it.minutes != null ? it.minutes : null, time: stampTime(),
      workoutLogId: logId, workoutName: w.name,
    });
    state.body.exercise.push(rec);
    added.push(rec.id);
  });
  if (!added.length) { toast('That workout has no exercises in it yet'); return; }
  // One press of Undo takes back the session, not one exercise of it.
  pushUndo(w.name, () => added.forEach((id) => {
    const i = state.body.exercise.findIndex((r) => r.id === id);
    if (i >= 0) state.body.exercise.splice(i, 1);
  }));
  saveState(); renderFeed();
  toast('Logged ' + w.name);
}

/* ---- the workout builder ---- */
let wkDraft = [];        // [{ type, minutes|null }]
let wkEditing = null;    // the workout being edited, or null for a new one

function openWorkoutBuilder(existing) {
  wkEditing = existing || null;
  wkDraft = existing
    ? (existing.items || []).map((i) => ({ type: i.type, minutes: i.minutes != null ? i.minutes : null }))
    : [];

  openPop(existing ? 'Edit workout' : 'New workout',
    '<input type="text" id="wkName" placeholder="what do you call it? — leg day, morning run…">' +
    /* Two ways to fill the list, same as a meal: pick from the types when you
       know the plan, or take a day you have already logged when it turns out
       to be worth repeating. */
    '<div class="rowlabel splitlabel">Add exercises' +
      '<button class="mini" id="wkToday" type="button">＋ From today’s movement</button></div>' +
    '<div class="searchwrap">' +
      '<input type="text" id="wkSearch" placeholder="Search types, or name a new one…" autocomplete="off">' +
      '<div class="results flat" id="wkResults"></div>' +
    '</div>' +
    '<div class="meals" id="wkItems"></div>' +
    '<div class="tiny" id="wkTotal" style="margin-top:8px"></div>',
    () => {
      const name = $('wkName').value.trim();
      if (!name || !wkDraft.length) return false;
      // Minutes are optional per exercise; a blank one is simply not written.
      const items = wkDraft.map((i) => (i.minutes != null ? { type: i.type, minutes: i.minutes } : { type: i.type }));
      if (wkEditing) {
        wkEditing.name = name;
        wkEditing.items = items;
        stamp(wkEditing);
        saveState(); toast('Saved ' + name);
      } else {
        appendRec(state.body.workouts, stamp({ id: uid(), name, items }), 'workout “' + name + '”');
        saveState(); toast('Saved ' + name);
      }
      wkDraft = []; wkEditing = null;
    },
    () => {
      if (existing) $('wkName').value = existing.name || '';

      const total = () => {
        const min = wkDraft.reduce((n, it) => n + (Number(it.minutes) || 0), 0);
        $('wkTotal').textContent = wkDraft.length
          ? plural(wkDraft.length, 'exercise') + (min ? ' · ' + min + ' min' : '')
          : '';
      };
      const paint = () => {
        const box = $('wkItems');
        box.innerHTML = '';
        if (!wkDraft.length) {
          box.innerHTML = '<div class="empty">No exercises yet — pick from the list above.</div>';
        }
        wkDraft.forEach((it, idx) => {
          const div = document.createElement('div'); div.className = 'mealrow';
          div.innerHTML = '<div class="mh"><span class="nm">' + esc(it.type) + '</span></div>';
          const act = document.createElement('div'); act.className = 'ma';
          const m = document.createElement('input');
          m.type = 'number'; m.min = '1'; m.step = '1'; m.placeholder = 'min';
          if (it.minutes != null) m.value = it.minutes;
          m.style.cssText = 'width:72px;padding:5px 7px;font-size:.78rem';
          m.title = 'minutes'; m.setAttribute('aria-label', 'Minutes of ' + it.type);
          m.oninput = () => {
            const v = parseInt(m.value, 10);
            it.minutes = v > 0 ? v : null;
            total();
          };
          const sp = document.createElement('span'); sp.className = 'sp';
          const x = document.createElement('button');
          x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Remove';
          x.setAttribute('aria-label', 'Remove ' + it.type);
          x.onclick = () => { wkDraft.splice(idx, 1); paint(); };
          act.appendChild(m); act.appendChild(sp); act.appendChild(x);
          div.appendChild(act);
          box.appendChild(div);
        });
        total();
      };

      /* The whole type list shows before anything is typed — it is short,
         and it is the same list the Type button offers, so the builder and
         the card cannot know different exercises. */
      const search = $('wkSearch');
      const addToDraft = (t) => {
        wkDraft.push({ type: t, minutes: null });
        search.value = ''; showResults();
        paint(); search.focus();
      };
      const showResults = () => {
        const box = $('wkResults');
        const raw = search.value.trim();
        const q = raw.toLowerCase();
        box.innerHTML = '';
        const all = exTypes();
        if (raw && !all.some((t) => t.toLowerCase() === q)) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = '＋ Add “' + raw + '”';
          b.onclick = () => addToDraft(raw);
          box.appendChild(b);
        }
        all.filter((t) => !q || t.toLowerCase().includes(q)).forEach((t) => {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = t;
          b.onclick = () => addToDraft(t);
          box.appendChild(b);
        });
      };
      search.oninput = showResults;
      search.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const first = $('wkResults').querySelector('button');
          if (first) first.click();
        }
      };

      /* Adds the day to the list you are building rather than replacing it,
         and you drop what was not part of the session with the ✕ beside
         each. A workout already logged today arrives as its exercises,
         which is what it is in the data. */
      $('wkToday').onclick = () => {
        const rows = onDay(state.body.exercise);
        if (!rows.length) { toast('Nothing logged today to take'); return; }
        rows.forEach((r) => wkDraft.push({ type: r.type, minutes: r.minutes != null ? r.minutes : null }));
        paint();
        toast('Took ' + plural(rows.length, 'exercise') + ' from today');
      };

      showResults();
      paint();
      $('wkName').focus();
    },
    'Save workout');
}

function renderHabits() {
  const wrap = $('habitChips');
  if (!wrap) return;      // habits live in the Overview room now
  wrap.innerHTML = '';

    b.setAttribute('aria-pressed', String(kept));

      if (adding) h.done.push(day); else h.done.splice(i, 1);
      stamp(h);
      pushUndo((adding ? 'keeping ' : 'clearing ') + h.name, () => {
        const j = h.done.indexOf(day);
        if (adding && j >= 0) h.done.splice(j, 1);
        else if (!adding && j < 0) h.done.push(day);
      });
      saveState(); renderHabits(); renderFeed();
    };
    wrap.appendChild(b);

  add.className = 'chip ghost'; add.type = 'button'; add.textContent = '＋ Habit';

/* =============================================================
   HYGIENE — five marks, one record per day.

   Stored the way the other once-a-day rows are: upserted by date and merged
   field by field, so two devices marking two different things on the same day
   both keep theirs rather than one overwriting the other.

   Un-marking writes `false`; it does not drop the field. A missing field
   cannot beat another device's `true` in a field-by-field merge, so dropping
   it would make "I un-marked that" indistinguishable from "I never heard
   about it" — and the un-mark would silently come back. Absent still means
   never touched, which is a third thing and worth keeping distinct.
   ============================================================= */
const HYGIENE = [
  [['brush_am', '🪥', 'Brush AM'], ['brush_pm', '🪥', 'Brush PM'], ['floss', '🧵', 'Floss']],
  [['shower', '🚿', 'Shower'], ['haircut', '✂️', 'Haircut']],
];
const HYGIENE_MARKS = HYGIENE.flat();

function hygieneOn(d) { return (state.body.hygiene || []).find((h) => h.date === d); }

function renderHygiene() {
  const box = $('hygRows');
  if (!box) return;
  const rec = hygieneOn(day) || {};
  box.innerHTML = '';
  HYGIENE.forEach((row) => {
    const div = document.createElement('div'); div.className = 'hrow';
    row.forEach(([key, glyph, name]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = glyph;
      // The two brushes are the same glyph; only the name tells them apart.
      b.title = name; b.setAttribute('aria-label', name);
      b.setAttribute('aria-pressed', String(rec[key] === true));
      b.onclick = () => toggleHygiene(key, name);
      div.appendChild(b);
    });
    box.appendChild(div);
  });
}

/** Set one mark, undoably. Saving and redrawing is left to the caller, so the
 *  card and the Tracker's ✕ can both use it. Returns false if nothing moved. */
function setHygiene(key, name, on) {
  let rec = hygieneOn(day);
  if (!rec) { rec = { id: uid(), date: day }; state.body.hygiene.push(rec); }
  const was = rec[key] === true;
  if (was === on) return false;
  rec[key] = on;
  stamp(rec);
  pushUndo((on ? '' : 'un-marking ') + name, () => { rec[key] = was; stamp(rec); });
  return true;
}
function toggleHygiene(key, name) {
  const rec = hygieneOn(day);
  const on = !(rec && rec[key] === true);
  if (!setHygiene(key, name, on)) return;
  saveState(); renderHygiene(); renderFeed();
  toast(on ? name : name + ' un-marked');
}

/* =============================================================
   SYMPTOMS — sparse, free text, high value.
   ============================================================= */
