<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a6a3e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1e24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" id="themeColor" content="#8a6a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirror">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪞</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f6f1e6; --panel:#fffdf7; --panel2:#efe8d8;
    --ink:#2a2620; --dim:#7a6f5e; --line:rgba(42,38,32,.12);
    --accent:#8a6a3e; --accent2:#5b7a55; --warn:#a85a3a;
    --shadow:0 1px 2px rgba(42,38,32,.05);
    --water:#4a7a9b; --coffee:#7a5232; --other:#3e7070;
    --alcohol:#7a4a7a; --nicotine:#6b6b6b; --weed:#4a7a4a;
  }
  body.theme-dark {
    --bg:#1c1e24; --panel:#24262e; --panel2:#2d3039;
    --ink:#e8e4dc; --dim:#9a948a; --line:rgba(232,228,220,.1);
    --accent:#c89b60; --accent2:#8fb080; --warn:#d87a5a;
    --shadow:0 1px 2px rgba(0,0,0,.25);
    --water:#7aa8c8; --coffee:#b08055; --other:#6ba0a0;
    --alcohol:#a87aa8; --nicotine:#9a9a9a; --weed:#7aab7a;
  }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    padding: 0 14px calc(40px + env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  /* 720px is a reading width. Three columns of it are ~228px each, which is
     too narrow for the intake tiles and the macro bar — so compact mode gets
     a dashboard width instead. */
  @media (min-width: 900px)  { body.dense { max-width: 1120px; } }
  @media (min-width: 1240px) { body.dense { max-width: 1440px; } }

  /* ---------- top bar ---------- */
  /* Three tracks so the title is centred on the page, not merely pushed
     around by whatever happens to sit either side of it. */
  .top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: calc(12px + env(safe-area-inset-top)) 0 10px;
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  .top h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; text-align: center; }
  .top .home {
    justify-self: start; display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none; color: var(--dim); font-size: .78rem;
    padding: 5px 10px; border-radius: 999px; border: 1px solid transparent;
  }
  .top .home:hover { color: var(--accent); border-color: var(--line); background: var(--panel); }
  .top .tools { justify-self: end; display: flex; align-items: center; gap: 6px; }
  /* On a phone the four tools plus a labelled link overrun the row, so the
     words drop away and the glyphs carry it. */
  @media (max-width: 560px) {
    .top .home .lbl, .top #undoBtn .lbl { display: none; }
    .top .home { padding: 5px 7px; }
    .top .tools { gap: 4px; }
    .icon-btn { padding: 5px 7px; }
  }
  .icon-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: .8rem;
    cursor: pointer; line-height: 1;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- date strip ---------- */
  /* A plain inline row, not a panel: it is a control, not a section. */
  .datestrip {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0; margin-bottom: 14px;
  }
  .datestrip .lbl { font-size: .7rem; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
  .datestrip input[type=date] {
    font: inherit; font-size: .78rem; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  body.dense .datestrip { margin-bottom: 12px; }
  body.dense .datestrip .chip { padding: 4px 11px; }
  .backdate-warn { width: 100%; font-size: .74rem; color: var(--warn); }

  /* ---------- the daily grid ----------
     CSS columns rather than grid: cards are wildly different heights, and
     this is the one layout that packs them without leaving holes. */
  .daily { column-count: 2; column-gap: 12px; }
  @media (min-width: 900px)  { body.dense .daily { column-count: 3; } }
  /* A fourth column only once there is room for it to still be ~300px —
     below that the dot rows and the drink tabs start clipping. */
  @media (min-width: 1240px) { body.dense .daily { column-count: 4; } }

  /* Phone: masonry can't mix widths, so drop to a real grid. The instruments
     keep the full width they need; the small cards and the drawer summaries
     pair up two-across, which is where the scrolling actually went. */
  @media (max-width: 640px) {
    .daily {
      column-count: initial; display: grid;
      grid-template-columns: 1fr 1fr; gap: 10px; align-items: start;
    }
    .daily > .card { grid-column: span 2; margin-bottom: 0; }
    .daily > .card.narrow { grid-column: span 1; margin-bottom: 0; }
  }
  .daily > .card { break-inside: avoid; -webkit-column-break-inside: avoid; }

  /* The reference panels: their own masonry, below the instruments. */
  .panels { column-count: 2; column-gap: 12px; }
  @media (min-width: 900px)  { body.dense .panels { column-count: 3; } }
  @media (min-width: 1240px) { body.dense .panels { column-count: 4; } }
  @media (max-width: 640px)  { .panels { column-count: 1; } }
  .panels > .card { break-inside: avoid; -webkit-column-break-inside: avoid; }

  /* ---------- cards ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  body.dense .card { padding: 11px; margin-bottom: 10px; border-radius: 10px; }
  .card > h2 {
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--dim); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  body.dense .card > h2 { font-size: .66rem; margin-bottom: 8px; }
  .card > h2 .note { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .saved { color: var(--accent2); }

  .rowlabel { font-size: .78rem; color: var(--dim); margin: 10px 0 5px; }
  .rowlabel:first-of-type { margin-top: 0; }
  .hr { height: 1px; background: var(--line); margin: 11px 0 9px; }

  /* ---------- folds: the keyboard-only parts ---------- */
  .fold { margin-top: 9px; }
  .fold > summary {
    cursor: pointer; list-style: none; font-size: .73rem; color: var(--dim);
    padding: 3px 0; display: flex; align-items: center; gap: 6px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: '▸'; transition: transform .15s; }
  .fold[open] > summary::before { transform: rotate(90deg); }
  .fold > summary:hover { color: var(--accent); }

  /* ---------- dot rows (1-5 scales) ----------
     Label beside the dots, not above: five stacked scales used to cost ten
     lines of height, which is most of why the card felt long. */
  .dotline { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .dotline .dl { flex: 0 0 4.4rem; font-size: .74rem; color: var(--dim); }
  .dotline .dots { flex: 1; min-width: 0; }
  body.dense .dotline { gap: 7px; margin-bottom: 4px; }
  body.dense .dotline .dl { flex-basis: 3.9rem; font-size: .7rem; }

  .dots { display: flex; gap: 7px; }
  .dots button {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 999px; padding: 0;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
    transition: background .12s, border-color .12s, transform .1s;
  }
  .dots button:hover { border-color: var(--accent); }
  .dots button:active { transform: scale(.92); }
  .dots button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  body.dense .dots { gap: 6px; }
  body.dense .dots button { width: 30px; height: 30px; }

  /* ---------- chips ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 6px 13px; font: inherit; font-size: .8rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.theme-dark .chip[aria-pressed="true"] { color: #1c1e24; }
  .chip.ghost { border-style: dashed; color: var(--dim); }
  /* Safety net: a stray long label must never blow out the row. */

  /* ---------- inputs ---------- */
  input[type=text], input[type=number], textarea, select {
    font: inherit; font-size: .88rem; width: 100%;
    padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 60px; }
  .field { margin-top: 9px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline > * { min-width: 0; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  body.theme-dark button.primary { color: #1c1e24; }
  button.primary:hover { filter: brightness(1.08); }

  /* ---------- tabbed, colour-tinted boxes (drinks + substances) ----------
     The whole card takes the active tab's hue, so what you're about to log
     is unmistakable without reading anything. */
  /* The hue identifies the active tab; it does not need to wash the whole
     card to do that. A 3px inset cap, the header text and the active tab
     carry it, and the body stays the same panel as every other card. */
  .boxed {
    background: var(--panel);
    box-shadow: inset 0 3px 0 var(--c, var(--accent)), var(--shadow);
    transition: box-shadow .18s;
  }
  .boxed > h2 { color: var(--c, var(--dim)); }
  .boxed > h2 .note { color: var(--ink); font-weight: 600; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .tabs button {
    flex: 1 1 4.2rem; min-width: 0; cursor: pointer; font: inherit; font-size: .7rem;
    padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .14s, color .14s, border-color .14s;
  }
  .tabs button:hover { border-color: var(--tc); color: var(--tc); }
  .tabs button[aria-selected="true"] {
    background: var(--tc); border-color: var(--tc); color: #fff; font-weight: 600;
  }
  body.theme-dark .tabs button[aria-selected="true"] { color: #1c1e24; }
  .tabs button .n { font-size: .62rem; opacity: .75; margin-left: 3px; }
  body.dense .tabs { gap: 3px; margin-bottom: 8px; }
  body.dense .tabs button { font-size: .66rem; padding: 5px 3px; }

  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; }
  .quick button {
    cursor: pointer; font: inherit; font-size: .8rem; font-weight: 600; padding: 11px 4px;
    border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
    background: var(--panel); color: var(--c);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .quick button:hover { background: var(--c); color: #fff; border-color: var(--c); }
  body.theme-dark .quick button:hover { color: #1c1e24; }
  body.dense .quick button { padding: 9px 4px; font-size: .76rem; }
  .quick button .u { font-size: .6rem; font-weight: 400; opacity: .7; margin-left: 1px; }

  #drinkLabelRow { margin-bottom: 8px; }

  /* Movement keeps a row of the types you use most. Empty it collapses
     rather than holding open a blank gap between the heading and the
     fields — the reservation only made sense when a fold sat below it. */
  #exChips:empty { display: none; }
  #exChips { margin-bottom: 9px; }

  /* The seven sleep chips wrapped to a second row inside a column, which cost
     nearly 40px on the tallest card in the grid. Narrower chips fit one row. */
  body.dense #sHours .chip { padding: 5px 9px; font-size: .76rem; }
  body.dense .card > .field:last-child .primary { padding: 8px 15px; }

  .icon-btn[disabled] { opacity: .35; cursor: default; }
  .icon-btn[disabled]:hover { color: var(--dim); border-color: var(--line); }

  /* ---------- food ---------- */
  .macrobar { display: flex; gap: 8px; margin-bottom: 12px; }
  .macrobar .m { flex: 1 1 0; min-width: 0; }     /* min-width:0 or the numbers push the row wide */
  .macrobar .m .k {
    font-size: .64rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .macrobar .m .v {
    font-size: .95rem; font-weight: 600; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .macrobar .m .v .u { font-size: .6rem; color: var(--dim); font-weight: 400; }
  body.dense .macrobar { gap: 6px; margin-bottom: 10px; }
  body.dense .macrobar .m .v { font-size: .88rem; }
  .macrobar .bar { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .macrobar .bar > span { display: block; height: 100%; background: var(--accent2); }
  .macrobar .bar > span.over { background: var(--warn); }

  .searchwrap { position: relative; margin-top: 10px; }
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .results:empty { display: none; }
  .results button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 9px 12px; font: inherit;
    font-size: .84rem; color: var(--ink); cursor: pointer;
  }
  .results button:last-child { border-bottom: 0; }
  .results button:hover, .results button.sel { background: var(--panel2); }
  .results .meta { display: block; font-size: .68rem; color: var(--dim); }
  .results .none { padding: 10px 12px; font-size: .8rem; color: var(--dim); font-style: italic; }
  /* Inside the meal builder the popover already scrolls, so an absolutely
     positioned dropdown would be clipped by it. */
  .results.flat { position: static; max-height: 190px; margin-top: 6px; box-shadow: none; }

  .foodrow { display: flex; align-items: baseline; gap: 8px; font-size: .85rem; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .foodrow:last-child { border-bottom: 0; }
  .foodrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foodrow .g { font-size: .72rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .foodrow .kc { font-size: .74rem; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .foodrow .x { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; }
  .foodrow .x:hover { color: var(--warn); }
  .foodstatus { font-size: .72rem; color: var(--dim); font-style: italic; }
  .pinbtn { background: none; border: 0; cursor: pointer; font: inherit; font-size: .95rem; color: var(--dim); padding: 0 4px; }
  .pinbtn.on { color: var(--accent); }

  /* ---------- your day ---------- */
  .feed { display: flex; flex-direction: column; }
  .feed .row {
    display: flex; align-items: baseline; gap: 9px;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .85rem;
  }
  .feed .row:last-child { border-bottom: 0; }
  .feed .t { font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 48px; }
  .feed .ic { width: 1.2em; text-align: center; }
  .feed .tx { flex: 1; min-width: 0; }
  .feed .x {
    background: none; border: 0; color: var(--dim); cursor: pointer;
    font: inherit; font-size: .95rem; padding: 0 2px; line-height: 1; opacity: 0;
  }
  .feed .row:hover .x, .feed .x:focus { opacity: 1; }
  .feed .x:hover { color: var(--warn); }

  .empty { color: var(--dim); font-size: .84rem; font-style: italic; padding: 6px 0; }
  .tiny { font-size: .74rem; color: var(--dim); }
  .list { margin-top: 10px; }
  .list .row {
    display: flex; align-items: baseline; gap: 8px; font-size: .84rem;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .list .row:last-child { border-bottom: 0; }
  .list .row .x { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; margin-left: auto; }
  .list .row .x:hover { color: var(--warn); }

  /* ---------- launchpad ----------
     Stacked icon-over-label tiles cost 226px — more than half the whole
     instrument grid — to hold nine links. As inline pills they cost about
     40px and keep their labels. */
  .launch { display: flex; flex-wrap: wrap; gap: 6px; }
  .launch a, .launch .pend, .launch .add {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px 6px 10px; text-decoration: none; position: relative;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); font: inherit; font-size: .74rem; line-height: 1.15; white-space: nowrap;
  }
  .launch a:hover { border-color: var(--accent); color: var(--accent); }
  .launch .ic { font-size: .95rem; line-height: 1; }
  .launch .pend { opacity: .45; }
  .launch .pend .soon { display: none; }       /* the dimming already says it */
  .launch .mine { padding-right: 24px; }
  .launch .mine .del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; cursor: pointer;
    color: var(--dim); font-size: .78rem; line-height: 1; padding: 0; opacity: .5;
  }
  .launch .mine:hover .del { opacity: 1; }
  .launch .mine .del:hover { color: var(--warn); }
  .launch .add { border-style: dashed; color: var(--dim); cursor: pointer; }
  .launchrow { margin: 0 0 16px; }
  body.dense .launchrow { margin-bottom: 13px; }
  .bdayline { margin-top: 10px; font-size: .78rem; color: var(--dim); }
  .bdayline b { color: var(--ink); font-weight: 600; }

  /* The reference panels are real collapsibles. Closed they are one line;
     they open themselves once, on load, if they have anything to show. */
  .panels > .card, .panels > details { box-shadow: none; }
  .panels > details > summary {
    cursor: pointer; list-style: none;
    font-size: .68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--dim);
    display: flex; align-items: baseline; gap: 8px;
  }
  .panels > details > summary::-webkit-details-marker { display: none; }
  /* Reference cards read one step quieter than the daily instruments. */
  .panels > details > summary, .panels > .card > h2 { font-size: .64rem; }
  .panels > details > summary::after {
    content: '+'; margin-left: 6px; font-size: .9rem; line-height: 1; color: var(--dim);
  }
  .panels > details[open] > summary::after { content: '−'; }
  .panels > details > summary:hover { color: var(--ink); }
  .panels > details[open] > summary { margin-bottom: 10px; }

  .sum {
    margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--dim); font-size: .74rem; text-align: right;
  }
  .sub { margin-top: 14px; }
  .sub:first-child { margin-top: 0; }
  .sub h3 {
    font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin-bottom: 7px; display: flex; align-items: center; gap: 8px;
  }
  .sub h3 .act { margin-left: auto; }
  .mini {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 7px; padding: 3px 9px; font: inherit; font-size: .7rem; cursor: pointer;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .quote { font-size: .84rem; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .quote:last-child { border-bottom: 0; }
  .quote .src { display: block; font-size: .7rem; color: var(--dim); margin-top: 2px; }
  .valchips .chip { cursor: default; }

  /* ---------- weekly review ---------- */
  .wk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 520px) { .wk { grid-template-columns: repeat(2, 1fr); } }
  .wk .c { background: var(--panel2); border-radius: 9px; padding: 8px 10px; }
  .wk .c .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .wk .c .v { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .wk .c .v .u { font-size: .6rem; color: var(--dim); font-weight: 400; }
  .wkdays { display: flex; gap: 4px; margin-top: 12px; }
  .wkdays .d { flex: 1; text-align: center; font-size: .6rem; color: var(--dim); }
  .wkdays .d .box {
    height: 22px; border-radius: 5px; background: var(--panel2);
    border: 1px solid var(--line); margin-bottom: 3px;
  }
  .wkdays .d .box.on { background: var(--accent2); border-color: var(--accent2); }
  .wknote { margin-top: 12px; font-size: .8rem; color: var(--ink); }
  .wknote .l { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .wknote .l:last-child { border-bottom: 0; }
  .wknote .l .dt { font-size: .68rem; color: var(--dim); margin-right: 7px; }

  /* ---------- popover ---------- */
  .pop-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
  .pop-back.open { display: block; }
  .pop {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 380px); max-height: 80vh; overflow: auto; z-index: 41;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  .pop h3 { font-size: .95rem; margin-bottom: 10px; }
  .pop .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  .hint { display: block; font-size: .72rem; color: var(--dim); margin-top: 2px; }

  .nudge {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 8px 12px; margin-bottom: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--warn) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
    font-size: .78rem; color: var(--ink);
  }
  .nudge[hidden] { display: none; }

  .toast {

    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* =============================================================
   Mirror — the one-page dashboard.

   Shares storage key `mirror_v1` with self.html on purpose: same origin,
   same data, so your existing record simply appears here and both apps
   stay usable side by side while this one earns its place.

   Golden rule inherited from SCHEMA.md: store raw observations, derive on
   read. Nothing here writes a score, a streak, or a conclusion.
   ============================================================= */

const STORAGE_KEY = 'mirror_v1';
const SCHEMA_VERSION = 13;

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
// Local YYYY-MM-DD. Never UTC: an evening entry must not land on tomorrow.
function toLocalISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
const todayStr = () => toLocalISO(new Date());
function shiftDay(iso, n) {
  const d = new Date(iso + 'T00:00'); d.setDate(d.getDate() + n); return toLocalISO(d);
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtDay(iso) {
  if (iso === todayStr()) return 'today';
  if (iso === shiftDay(todayStr(), -1)) return 'yesterday';
  return new Date(iso + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function round1(n) { return Math.round(n * 10) / 10; }
function fmt$(n) {
  const v = Number(n || 0);
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2).replace(/\.00$/, '');
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
}
/** "1 quote" / "2 quotes" — summaries read as prose, so they have to agree. */
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ---------- state ---------- */
/* The full tree, including stores this dashboard does not surface. They are
   listed so a save from here can never drop data that self.html wrote. */
const defaultState = () => ({
  identity: { values: [], season: '', reflections: [], pulse: [], journal: [] },
  body: {
    food: [], water: [], sleep: [], exercise: [], symptoms: [],
    targets: { kcal: 2200, protein_g: 80, water_oz: 64 },
    favoriteFoods: [], customFoods: [], meals: [], checkins: [],
    drinks: [], substances: [],            // v13
  },
  mind: { books: [], ideas: [], questions: [], quotes: [] },
  money: { categories: [], expenses: [], subscriptions: [], netWorth: [], goals: [] },
  relationships: { people: [], followUps: [], giftIdeas: [], birthdays: [] },
  daily: { cards: [] },
  decisions: { items: [] },
  habits: { items: [] },
  places: { items: [], days: {} },
  completion: {},
  calendar: { events: [], integration: {} },
  home: { widgets: [] },
  links: [],                                // v13
  _deleted: [],                             // v13 — tombstones, for sync
});

/** Merge a loaded blob onto the current defaults. Every path that brings data
 *  in — first load, restore from a file, snapshot rollback — goes through
 *  here, so none of them can miss a backfill the others get. */
function mergeLoaded(saved) {
  const base = defaultState();
  if (!saved || typeof saved !== 'object') return base;
  // Shallow-merge each namespace so new v13 fields are backfilled while every
  // existing key — including ones this dashboard never touches — is preserved.
  const out = { ...base, ...saved };
  for (const k of Object.keys(base)) {
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      out[k] = { ...base[k], ...(saved[k] && typeof saved[k] === 'object' ? saved[k] : {}) };
    }
  }
  // v12 -> v13: the new stores. Purely additive; nothing is reshaped.
  if (!Array.isArray(out.body.drinks)) out.body.drinks = [];
  if (!Array.isArray(out.body.substances)) out.body.substances = [];
  if (!Array.isArray(out.links)) out.links = [];
  if (!Array.isArray(out._deleted)) out._deleted = [];
  return out;
}
function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { /* corrupt */ }
  return mergeLoaded(saved);
}

let state = loadState();

/* Provenance, per SCHEMA.md §2. `_at` is when a record was FIRST entered and
   never changes. `_up` is stamped on every write — it is what a sync merge
   uses to decide which of two edits is newer, which `_at` cannot do. */
function stamp(rec) {
  if (!rec._src) rec._src = 'manual';
  if (!rec._at) rec._at = nowISO();
  rec._up = nowISO();
  return rec;
}
function saveState() {
  state.__v = SCHEMA_VERSION;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    bumpChanges();
  } catch (e) {
    alert('Could not save — this browser is out of storage space, or is in private mode.');
  }
}
/* =============================================================
   UNDO — a stack of inverse operations, not state snapshots.

   The state tree runs to megabytes after a few years, and copying all of
   it on every tap so a sip of water is undoable would be absurd. Each
   entry instead knows only how to put back the one thing it changed.
   ============================================================= */
const undoStack = [];
const UNDO_MAX = 25;

function pushUndo(label, revert) {
  undoStack.push({ label, revert });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  refreshUndo();
}
function refreshUndo() {
  const b = $('undoBtn');
  if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.disabled = !top;
  b.title = top ? 'Undo ' + top.label : 'Nothing to undo';
}
function doUndo() {
  const top = undoStack.pop();
  if (!top) return;
  top.revert();
  saveState();
  refreshUndo();
  renderAll();
  toast('Undid ' + top.label);
}
/** Append a record and make it undoable in one move. */
function appendRec(arr, rec, label) {
  arr.push(rec);
  pushUndo(label, () => {
    const i = arr.findIndex((r) => r.id === rec.id);
    if (i >= 0) arr.splice(i, 1);
  });
  return rec;
}

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/** Remove a record, leave a tombstone so a future sync can't resurrect it,
 *  and keep enough to put it back exactly where it was. */
function dropRecord(arr, id, label) {
  const i = arr.findIndex((r) => r.id === id);
  if (i < 0) return;
  const [rec] = arr.splice(i, 1);
  state._deleted.push({ id, at: nowISO() });
  pushUndo('removing ' + (label || 'an entry'), () => {
    arr.splice(i, 0, rec);
    const j = state._deleted.findIndex((t) => t.id === id);
    if (j >= 0) state._deleted.splice(j, 1);
  });
}

/* ---------- selected day ---------- */
let day = todayStr();

function setDay(iso) {
  day = iso;
  $('dPick').value = iso;
  $('dTodayBtn').setAttribute('aria-pressed', String(iso === todayStr()));
  $('dYestBtn').setAttribute('aria-pressed', String(iso === shiftDay(todayStr(), -1)));
  const warn = $('backdateWarn');
  if (iso === todayStr()) { warn.hidden = true; }
  else { warn.hidden = false; warn.textContent = 'Backdating — everything below is being logged for ' + fmtDay(iso) + '.'; }
  renderAll();
}
/* Time-of-day only makes sense on the day it happened. Backfilled entries get
   no `t`, rather than a fictional one. */
const stampTime = () => (day === todayStr() ? nowHM() : '');

const onDay = (arr) => (arr || []).filter((r) => r && r.date === day);

/* ---------- dot rows ---------- */
/* Progressive fill: tapping the 4th dot fills 1-4, so the row reads as a
   quantity rather than five things you might have chosen. No numerals are
   drawn — they were the same five digits repeated six times down the card —
   but every dot still carries its value in aria-label, and aria-pressed is
   true for all dots up to it, which is what makes the fill legible to a
   screen reader too. */
function buildDots(el, value, onPick, name) {
  el.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(value != null && i <= value));
    b.setAttribute('aria-label', (name || 'Rating') + ' ' + i + ' of 5');
    b.title = i + ' of 5';
    b.onclick = () => onPick(value === i ? null : i);   // tap the same one to clear
    el.appendChild(b);
  }
}

/* =============================================================
   PULSE — one form, three stores.
   daily.cards[]      the heartbeat (mood, energy, sleep, notes)
   body.checkins[]    the subjective body reads
   identity.pulse[]   mood + energy, kept for existing history
   All three upsert by date, so re-saving a day never duplicates it.
   ============================================================= */
let pulse = { mood: null, energy: null, fatigue: null, soreness: null, comfort: null };

function card(d) { return state.daily.cards.find((c) => c.date === d); }
function checkin(d) { return state.body.checkins.find((c) => c.date === d); }

function loadPulse() {
  const c = card(day) || {}, ck = checkin(day) || {};
  pulse = {
    mood: c.mood ?? null,
    energy: c.energy ?? ck.energy ?? null,
    fatigue: ck.fatigue ?? null,
    soreness: ck.soreness ?? null,
    comfort: ck.comfort ?? null,
  };
  renderPulse();
}
function renderPulse() {
  buildDots($('dMood'), pulse.mood, (v) => { pulse.mood = v; renderPulse(); }, 'Mood');
  buildDots($('dEnergy'), pulse.energy, (v) => { pulse.energy = v; renderPulse(); }, 'Energy');
  buildDots($('dFatigue'), pulse.fatigue, (v) => { pulse.fatigue = v; renderPulse(); }, 'Fatigue');
  buildDots($('dSore'), pulse.soreness, (v) => { pulse.soreness = v; renderPulse(); }, 'Soreness');
  buildDots($('dComfort'), pulse.comfort, (v) => { pulse.comfort = v; renderPulse(); }, 'Comfort');
  const c = card(day);
  $('pulseSaved').textContent = c ? 'saved' : '';
}
function savePulse() {
  // The free-text fields were removed from this card; any note already on a
  // record stays exactly as it was rather than being blanked by a re-save.
  let c = card(day);
  if (!c) { c = { id: uid(), date: day, tags: [] }; state.daily.cards.push(c); }
  c.mood = pulse.mood; c.energy = pulse.energy;
  stamp(c);

  let ck = checkin(day);
  if (!ck) { ck = { id: uid(), date: day }; state.body.checkins.push(ck); }
  ck.energy = pulse.energy; ck.fatigue = pulse.fatigue;
  ck.soreness = pulse.soreness; ck.comfort = pulse.comfort;
  stamp(ck);

  if (pulse.mood != null || pulse.energy != null) {
    let p = state.identity.pulse.find((x) => x.date === day);
    if (!p) { p = { id: uid(), date: day }; state.identity.pulse.push(p); }
    p.mood = pulse.mood; p.energy = pulse.energy;
    stamp(p);
  }

  writeSleep();          // same card, same button — see writeSleep()

  saveState();
  $('pulseSaved').textContent = 'saved ✓';
  setTimeout(() => { renderPulse(); renderSleep(); }, 1400);
  renderSleep(); renderFeed();
}

/* =============================================================
   SLEEP — chips for the common values, a field for the rest.
   ============================================================= */
const SLEEP_CHIPS = [5, 6, 6.5, 7, 7.5, 8, 9];
let sleepDraft = { hours: null, quality: null };

function sleepFor(d) { return (state.body.sleep || []).find((s) => s.date === d); }

function loadSleep() {
  const s = sleepFor(day);
  sleepDraft = { hours: s ? s.hours : null, quality: s ? s.quality : null };
  renderSleep();
}
function renderSleep() {
  const wrap = $('sHours'); wrap.innerHTML = '';
  SLEEP_CHIPS.forEach((h) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = h;
    b.setAttribute('aria-pressed', String(sleepDraft.hours === h));
    b.onclick = () => { sleepDraft.hours = sleepDraft.hours === h ? null : h; renderSleep(); };
    wrap.appendChild(b);
  });
  buildDots($('sQuality'), sleepDraft.quality, (v) => { sleepDraft.quality = v; renderSleep(); }, 'Sleep quality');
  const s = sleepFor(day);
  $('sleepNote').textContent = s ? round1(s.hours) + ' h logged' : '';
}
/* Sleep shares the pulse card's one Save button, so this writes only when
   there is something to write — logging a mood must not demand a sleep
   figure you don't have. Returns whether anything was written. */
function writeSleep() {
  const hours = sleepDraft.hours;
  if (hours == null) return false;

  let s = sleepFor(day);
  if (!s) { s = { id: uid(), date: day }; state.body.sleep.push(s); }
  s.hours = hours; s.quality = sleepDraft.quality;
  stamp(s);

  // The Daily Card mirrors sleep so the Weekly Review keeps reading one source.
  let c = card(day);
  if (!c) { c = { id: uid(), date: day, tags: [] }; state.daily.cards.push(c); }
  c.sleep_hours = hours; c.sleep_quality = sleepDraft.quality;
  stamp(c);

  sleepDraft.hours = hours;
  return true;
}

/* =============================================================
   INTAKE — one tabbed instrument over three stores.

   Drinks and Substances were the same control twice. Six tabs in one card
   instead, split only by the unit each kind is measured in — volume for the
   first three, count for the last three. A tap on a quick button logs
   immediately; exact amounts live behind the fold.

   The UI groups by what a thing IS; storage stays exactly where it was, so
   no history has to move:
     water            -> body.water[]       { oz }
     coffee / other   -> body.drinks[]      { kind, label, oz, count }
     alcohol          -> body.substances[]  { kind, count, oz }
     weed / nicotine  -> body.substances[]  { kind, count, note }
   ============================================================= */
const KINDS = {
  water:    { name: 'Water',    icon: '💧', c: 'water',    store: 'water' },
  coffee:   { name: 'Coffee',   icon: '☕', c: 'coffee',   store: 'drinks' },
  other:    { name: 'Other',    icon: '🥤', c: 'other',    store: 'drinks' },
  alcohol:  { name: 'Alcohol',  icon: '🍺', c: 'alcohol',  store: 'substances' },
  nicotine: { name: 'Nicotine', icon: '🚬', c: 'nicotine', store: 'substances' },
  weed:     { name: 'Weed',     icon: '🌿', c: 'weed',     store: 'substances' },
};
const intakeMeta = (k) => KINDS[k];          // the tracker reads its icons from here
const INTAKE_TABS = ['water', 'coffee', 'other', 'alcohol', 'nicotine', 'weed'];
const OZ_STEPS = [2, 8, 16];                 // ounces; compose to anything useful
const COUNT_STEPS = [1];
/** Volume or count — the only axis on which the six kinds differ. */
const isVolume = (kind) => KINDS[kind].store !== 'substances';

let intakeTab = 'water';

function arrOf(kind) {
  const s = KINDS[kind].store;
  return s === 'water' ? state.body.water : s === 'drinks' ? state.body.drinks : state.body.substances;
}
function entriesOf(kind) {
  return kind === 'water' ? onDay(state.body.water) : onDay(arrOf(kind)).filter((r) => r.kind === kind);
}
/** The day's headline number for a kind, in the unit that kind is about. */
function totalOf(kind) {
  const rows = entriesOf(kind);
  if (isVolume(kind)) {
    return { n: rows.reduce((a, r) => a + (Number(r.oz) || 0), 0), unit: 'oz' };
  }
  const n = rows.reduce((a, r) => a + (Number(r.count) || 1), 0);
  // A 12 oz beer and a 1.5 oz shot are one drink each. Counting is the only
  // reading of alcohol that carries that equivalence; ounces throw it away.
  if (kind === 'alcohol') return { n, unit: n === 1 ? 'drink' : 'drinks' };
  return { n, unit: '' };
}
/** How an entry reads in the tracker and in an undo message. */
function describeIntake(kind, rec) {
  if (kind === 'water') return round1(rec.oz) + ' oz water';
  const bits = [];
  if (rec.oz) bits.push(round1(rec.oz) + ' oz');
  else if (rec.count > 1) bits.push('×' + rec.count);
  bits.push(rec.label && rec.label !== KINDS[kind].name ? rec.label : KINDS[kind].name.toLowerCase());
  if (rec.note) bits.push('· ' + rec.note);
  return bits.join(' ');
}

function addIntake(kind, opts) {
  const m = KINDS[kind];
  const rec = stamp({ id: uid(), date: day, t: stampTime() });
  if (kind === 'water') {
    rec.oz = opts.oz;
  } else if (m.store === 'drinks') {
    rec.kind = kind; rec.count = 1;
    if (opts.oz != null) rec.oz = opts.oz;
    rec.label = opts.label || m.name;
  } else {
    rec.kind = kind; rec.count = Number(opts.count) || 1;
    if (opts.oz != null) rec.oz = opts.oz;
    if (opts.note) rec.note = opts.note;
  }
  appendRec(arrOf(kind), rec, describeIntake(kind, rec));
  saveState();
  renderIntake();
  renderFoodTotals(onDay(state.body.food));
  renderFeed();
  toast(describeIntake(kind, rec) + ' — tap Undo to take it back');
}

function renderTabs(el, kinds, active, onPick) {
  el.innerHTML = '';
  kinds.forEach((k) => {
    const m = KINDS[k];
    const t = totalOf(k);
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--tc', 'var(--' + m.c + ')');
    b.setAttribute('aria-selected', String(k === active));
    const badge = (k !== 'water' && t.n) ? '<span class="n">' + round1(t.n) + '</span>' : '';
    b.innerHTML = esc(m.name) + badge;   // colour identifies the kind
    b.onclick = () => onPick(k);
    el.appendChild(b);
  });
}

/* Labels you have used before, so "Other" is one tap the second time. */
function renderDrinkRecent() {
  const box = $('drinkRecent');
  const recent = [...new Set((state.body.drinks || [])
    .filter((d) => d.kind === 'other' && d.label && d.label !== 'Other')
    .slice(-40).map((d) => d.label))].slice(-5).reverse();
  box.innerHTML = '';
  recent.forEach((label) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label;
    b.onclick = () => { $('drinkLabel').value = label; };
    box.appendChild(b);
  });
}

function renderIntake() {
  const m = KINDS[intakeTab];
  const vol = isVolume(intakeTab);
  $('intakeCard').style.setProperty('--c', 'var(--' + m.c + ')');
  $('intakeName').textContent = m.name;
  const t = totalOf(intakeTab);
  // Water is the only kind with a target, so it is the only one that reads
  // as a fraction. It appears here and nowhere else on the page.
  const target = intakeTab === 'water' ? Number((state.body.targets || {}).water_oz) || 0 : 0;
  $('intakeTotal').textContent = target
    ? round1(t.n) + ' / ' + target + ' oz'
    : (t.n ? round1(t.n) + (t.unit ? ' ' + t.unit : '') : '');
  renderTabs($('intakeTabs'), INTAKE_TABS, intakeTab, (k) => {
    intakeTab = k; renderIntake();
  });

  $('drinkLabelRow').hidden = intakeTab !== 'other';
  if (intakeTab === 'other') renderDrinkRecent();

  const el = $('intakeQuick');
  el.innerHTML = '';
  (vol ? OZ_STEPS : COUNT_STEPS).forEach((n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '+' + n + (vol ? '<span class="u">oz</span>' : '');
    b.onclick = () => logIntake(n);          // a tap IS the log
    el.appendChild(b);
  });
  $('intakeExact').placeholder = vol ? 'ounces' : 'how many';

  // A note belongs with the substance, not the amount, so it gets its own way in.
  if (!vol) {
    const note = document.createElement('button');
    note.type = 'button'; note.textContent = '＋ note';
    note.onclick = () => openForm(m.name, [
      { key: 'count', label: 'How many', type: 'number', placeholder: '1' },
      { key: 'note', label: 'Note', placeholder: 'strain, brand, context…' },
    ], { count: '1' }, (v) => {
      addIntake(intakeTab, { count: Number(v.count) || 1, note: v.note });
    }, 'Log');
    el.appendChild(note);
  }
}

/* One tap logs. The adding machine it replaces cost two taps for the
   commonest action in the app and put a number on screen that meant
   "not yet". Undo is the safety net that makes committing immediately
   safe — the toast says so. */
function logIntake(n) {
  if (isVolume(intakeTab)) {
    const opts = { oz: n };
    if (intakeTab === 'other') opts.label = $('drinkLabel').value.trim() || 'Other';
    addIntake(intakeTab, opts);
    if (intakeTab === 'other') $('drinkLabel').value = '';
  } else {
    addIntake(intakeTab, { count: n });
  }
}
function logExactIntake() {
  const n = parseFloat($('intakeExact').value);
  if (!n || n <= 0) { $('intakeExact').focus(); return; }
  $('intakeExact').value = '';
  logIntake(n);
}

/* =============================================================
   FOOD — NutriLens favorites + search.

   The library is 1.2 MB, so it is fetched lazily: when the card scrolls
   into view, or the moment you touch it. Paying for it on page load would
   make the first launch feel broken on mobile data, and most days you can
   log everything from the chip row without it.

   Per SCHEMA.md: an entry stores foodId + grams only. Nutrients are looked
   up at read time, so a library correction retroactively fixes history.
   ============================================================= */
const FOODS_URL = '../nutrilens/foods.json';
let foodsIndex = null;      // { list, byId }
let foodsPromise = null;    // in-flight fetch, so parallel callers share one
let chosenLabel = '';       // the named portion picked in the portion popover

function indexCustomFoods() {
  if (!foodsIndex) foodsIndex = { list: [], byId: new Map() };
  for (const f of (state.body.customFoods || [])) foodsIndex.byId.set(f.id, f);
}
function loadFoods() {
  if (foodsPromise) return foodsPromise;
  $('foodStatus').textContent = 'loading food library…';
  foodsPromise = fetch(FOODS_URL)
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      const list = (data.foods || []).map((f) => ({
        id: f.id, name: f.name, category: f.category, portions: f.portions || [], n: f,
      }));
      foodsIndex = { list, byId: new Map(list.map((f) => [f.id, f])) };
      indexCustomFoods();
      $('foodStatus').textContent = '';
      renderFoodLog();
    })
    .catch(() => {
      // Opened as a file://, or served without the library beside it. Custom
      // foods still work and history stays readable — say so instead of failing.
      foodsIndex = foodsIndex || { list: [], byId: new Map() };
      indexCustomFoods();
      $('foodStatus').textContent = 'Food library unavailable — your own foods still work.';
      renderFoodLog();
    });
  return foodsPromise;
}
/* USDA names carry a lot of boilerplate ("Oats (Includes foods for USDA's Food
   Distribution Program)"). Shorten for display only — the stored foodName keeps
   the library's real name, so history stays faithful. */
function shortName(name, max) {
  let s = String(name || '')
    .replace(/\s*\((?:includes|prepared|packaged)[^)]*\)/ig, '')
    .replace(/,\s*(?:includes|prepared)[^,]*$/i, '')
    .trim();
  const lim = max || 22;
  if (s.length > lim) s = s.slice(0, lim - 1).replace(/[\s,]+$/, '') + '…';
  return s;
}

/** Per-100g nutrients for a logged entry, or null when unresolvable. */
function nutrientsFor(foodId) {
  const f = foodsIndex && foodsIndex.byId.get(foodId);
  return f ? (f.n || f) : null;
}
function kcalOf(entry) {
  const n = nutrientsFor(entry.foodId);
  return n && n.kcal != null ? (n.kcal * entry.grams) / 100 : null;
}
function proteinOf(entry) {
  const n = nutrientsFor(entry.foodId);
  return n && n.protein_g != null ? (n.protein_g * entry.grams) / 100 : null;
}

function logFood(foodId, foodName, grams, portionLabel) {
  const rec = stamp({
    id: uid(), date: day, foodId, foodName,
    grams: Math.round(grams * 10) / 10,
    portion: portionLabel || '', t: stampTime(),
  });
  appendRec(state.body.food, rec, shortName(foodName, 24));
  saveState(); renderFoodLog(); renderFeed();
  toast('Logged ' + shortName(foodName, 24));
}

/* ---- search ----
   Ranking matters more than it looks. Sorting ties by shortest name buried
   "Egg, hard-boiled" (16 chars) under "Eggnog" (6) and "Eggplant" (13) — the
   database had the egg all along, the search just never showed it. So a
   WHOLE-WORD match now outranks a prefix-of-a-longer-word: "egg" matches the
   word "Egg," in "Egg, hard-boiled" before it matches the start of "Eggnog". */
const WORD_EDGE = /[\s,()\-/]/;
/** How well one word matches a name: 0 exact, 1 whole word, 2 word-prefix, 3 buried, -1 absent. */
function tokenRank(name, t) {
  const i = name.indexOf(t);
  if (i < 0) return { rank: -1, pos: -1 };
  const startsWord = i === 0 || WORD_EDGE.test(name[i - 1]);
  const after = name[i + t.length];
  const endsWord = after === undefined || WORD_EDGE.test(after);
  return { rank: name === t ? 0 : (startsWord && endsWord) ? 1 : startsWord ? 2 : 3, pos: i };
}
function searchFoods(q) {
  if (!foodsIndex || !q) return [];
  const s = q.toLowerCase().trim();
  if (s.length < 2) return [];
  // Every word must appear, in any order: "boiled egg" has to find
  // "Egg, hard-boiled", which a whole-phrase match never would.
  const tokens = s.split(/\s+/).filter(Boolean);
  const anchor = tokens.slice().sort((a, b) => b.length - a.length)[0];
  const hits = [];
  const all = [...foodsIndex.list, ...(state.body.customFoods || [])];
  for (const f of all) {
    const name = (f.name || '').toLowerCase();
    // Curated foods carry aliases — "mayo", "bbq sauce", "red pepper flakes".
    // A word found only there still counts, just at a worse tier than the name.
    // loadFoods() maps records to {id,name,category,portions,n}, so the raw
    // record — and its aliases — hangs off .n; customFoods carry theirs flat.
    const alias = ((f.aliases || (f.n && f.n.aliases) || []).join(' ')).toLowerCase();
    const each = tokens.map((t) => {
      const r = tokenRank(name, t);
      if (r.rank >= 0) return r;
      return alias.includes(t) ? { rank: 4, pos: 0 } : { rank: -1, pos: -1 };
    });
    if (each.some((r) => r.rank < 0)) continue;
    // The worst word decides the tier, so a stray buried word can't flatter a match.
    const rank = Math.max(...each.map((r) => r.rank));
    hits.push({ f, rank, pos: tokenRank(name, anchor).pos, len: name.length });
    if (hits.length > 600) break;
  }
  hits.sort((a, b) => a.rank - b.rank || a.pos - b.pos || a.len - b.len);
  return hits.slice(0, 14).map((h) => h.f);
}

function renderResults(q) {
  const box = $('foodResults');
  const rows = searchFoods(q);
  box.innerHTML = '';
  if (!q || q.trim().length < 2) return;
  if (!rows.length) {
    box.innerHTML = '<div class="none">' +
      (foodsIndex && foodsIndex.list.length ? 'No match.' : 'Food library still loading…') + '</div>';
    return;
  }
  rows.forEach((f) => {
    const b = document.createElement('button');
    b.type = 'button';
    const n = f.n || f;
    const kc = n && n.kcal != null ? Math.round(n.kcal) + ' kcal/100g' : '';
    b.innerHTML = esc(f.name) + '<span class="meta">' +
      esc([f.category, kc].filter(Boolean).join(' · ')) + '</span>';
    b.onclick = () => {
      $('foodSearch').value = ''; box.innerHTML = '';
      openPortion(f.id, f.name);
    };
    box.appendChild(b);
  });
}

/* ---- portion picker ---- */
function openPortion(foodId, foodName) {
  const f = foodsIndex && foodsIndex.byId.get(foodId);
  const name = (f && f.name) || foodName || 'food';
  const portions = (f && f.portions) || [];

  openPop(name,
    (portions.length ? '<div class="rowlabel">Portion</div><div class="chips" id="popPortions"></div>' : '') +
    '<div class="rowlabel">Grams</div><input type="number" id="popGrams" min="1" step="1" value="' +
      (portions[0] ? portions[0].grams : 100) + '">' +
    '<div class="tiny" id="popKcal" style="margin-top:8px"></div>' +
    '',
    () => {
      const g = parseFloat($('popGrams').value);
      if (!g || g <= 0) return false;
      logFood(foodId, name, g, chosenLabel);
    },
    () => {
      const gEl = $('popGrams');
      const showKcal = () => {
        const n = nutrientsFor(foodId);
        const g = parseFloat(gEl.value) || 0;
        $('popKcal').textContent = n && n.kcal != null
          ? Math.round((n.kcal * g) / 100) + ' kcal · ' + Math.round((n.protein_g || 0) * g / 100) + ' g protein'
          : '';
      };
      gEl.oninput = () => { chosenLabel = ''; showKcal(); };
      if (portions.length) {
        const box = $('popPortions');
        portions.slice(0, 8).forEach((p, i) => {
          const b = document.createElement('button');
          b.className = 'chip'; b.type = 'button'; b.textContent = p.label;
          b.setAttribute('aria-pressed', String(i === 0));
          b.onclick = () => {
            gEl.value = p.grams; chosenLabel = p.label; showKcal();
            [...box.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
          };
          box.appendChild(b);
        });
        chosenLabel = portions[0].label;
      }
      showKcal();
    }, 'Log');
}

/* The day's food lives in the tracker now, not here — this card keeps only
   the running totals, which are a fixed shape whatever you've eaten. */
function renderFoodLog() { renderFoodTotals(onDay(state.body.food)); }
function renderFoodTotals(rows) {
  const t = state.body.targets || {};
  let kcal = 0, protein = 0, unknown = 0;
  rows.forEach((e) => {
    const k = kcalOf(e), p = proteinOf(e);
    if (k == null) unknown++; else { kcal += k; protein += p || 0; }
  });
  const cell = (label, val, target, unit) => {
    const pct = target ? Math.min(100, (val / target) * 100) : 0;
    const over = target && val > target;
    return '<div class="m"><div class="k">' + label + '</div>' +
      '<div class="v">' + Math.round(val).toLocaleString() +
        '<span class="u">' + (target ? ' / ' + target + unit : unit) + '</span></div>' +
      '<div class="bar"><span class="' + (over ? 'over' : '') + '" style="width:' + pct + '%"></span></div></div>';
  };
  // Water belongs to Intake, which shows it against its target. Food shows
  // what Food knows.
  $('foodMacros').innerHTML =
    cell('Calories', kcal, t.kcal, unknown ? ' kcal · ' + unknown + ' unresolved' : ' kcal') +
    cell('Protein', protein, t.protein_g, ' g');
}

/* ---- meals: the combinations you eat again ----
   Two ways in, because they suit different moments. Build one deliberately
   from search when you know the recipe, or keep a day you have already
   logged when it turns out to be worth repeating. */
function mealKcal(meal) {
  return (meal.items || []).reduce((n, it) => {
    const nut = nutrientsFor(it.foodId);
    return n + (nut && nut.kcal != null ? (nut.kcal * it.grams) / 100 : 0);
  }, 0);
}
function logMeal(meal) {
  // Each food pushes its own undo; collapse them so undoing a meal is one
  // press rather than one per ingredient.
  const before = undoStack.length;
  (meal.items || []).forEach((it) => logFood(it.foodId, it.foodName, it.grams, it.portion));
  const mine = undoStack.splice(Math.min(before, undoStack.length));
  if (mine.length) pushUndo(meal.name, () => { mine.slice().reverse().forEach((u) => u.revert()); });
  closePop();
  toast('Logged ' + meal.name);
}

/* ---- the builder ---- */
let mealDraft = [];        // [{ foodId, foodName, grams, portion }]
let mealEditing = null;    // the meal being edited, or null for a new one

function openMealBuilder(existing) {
  loadFoods();
  mealEditing = existing || null;
  mealDraft = existing ? (existing.items || []).map((i) => ({ ...i })) : [];

  openPop(existing ? 'Edit meal' : 'New meal',
    '<input type="text" id="mbName" placeholder="what do you call it? — breakfast, post-gym…">' +
    '<div class="rowlabel">Add foods</div>' +
    '<div class="searchwrap">' +
      '<input type="text" id="mbSearch" placeholder="Search foods…" autocomplete="off">' +
      '<div class="results flat" id="mbResults"></div>' +
    '</div>' +
    '<div class="list" id="mbItems"></div>' +
    '<div class="tiny" id="mbTotal" style="margin-top:8px"></div>',
    () => {
      const name = $('mbName').value.trim();
      if (!name || !mealDraft.length) return false;
      if (mealEditing) {
        mealEditing.name = name;
        mealEditing.items = mealDraft.map((i) => ({ ...i }));
        stamp(mealEditing);
        saveState(); toast('Saved ' + name);
      } else {
        appendRec(state.body.meals, stamp({
          id: uid(), name, items: mealDraft.map((i) => ({ ...i })),
        }), 'meal “' + name + '”');
        saveState(); toast('Saved ' + name);
      }
      mealDraft = []; mealEditing = null;
    },
    () => {
      if (existing) $('mbName').value = existing.name || '';

      const paint = () => {
        const box = $('mbItems');
        box.innerHTML = '';
        if (!mealDraft.length) {
          box.innerHTML = '<div class="empty">No foods yet — search above and tap to add.</div>';
        }
        mealDraft.forEach((it, idx) => {
          const div = document.createElement('div'); div.className = 'row';
          div.innerHTML = '<span style="flex:1;min-width:0">' + esc(shortName(it.foodName, 26)) + '</span>';
          const g = document.createElement('input');
          g.type = 'number'; g.min = '1'; g.step = '1'; g.value = it.grams;
          g.style.cssText = 'width:66px;padding:4px 6px;font-size:.78rem';
          g.title = 'grams';
          g.oninput = () => {
            const v = parseFloat(g.value);
            if (v > 0) { it.grams = v; it.portion = ''; total(); }
          };
          const x = document.createElement('button');
          x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Remove';
          x.onclick = () => { mealDraft.splice(idx, 1); paint(); };
          div.appendChild(g); div.appendChild(x);
          box.appendChild(div);
        });
        total();
      };
      const total = () => {
        const kc = mealDraft.reduce((n, it) => {
          const nut = nutrientsFor(it.foodId);
          return n + (nut && nut.kcal != null ? (nut.kcal * it.grams) / 100 : 0);
        }, 0);
        $('mbTotal').textContent = mealDraft.length
          ? mealDraft.length + ' item' + (mealDraft.length === 1 ? '' : 's') +
            (kc ? ' · ' + Math.round(kc) + ' kcal' : '')
          : '';
      };

      const search = $('mbSearch');
      const showResults = () => {
        const box = $('mbResults');
        const rows = searchFoods(search.value);
        box.innerHTML = '';
        if (search.value.trim().length < 2) return;
        if (!rows.length) {
          box.innerHTML = '<div class="none">' +
            (foodsIndex && foodsIndex.list.length ? 'No match.' : 'Food library still loading…') + '</div>';
          return;
        }
        rows.slice(0, 8).forEach((f) => {
          const b = document.createElement('button');
          b.type = 'button';
          const n = f.n || f;
          b.innerHTML = esc(f.name) + '<span class="meta">' +
            esc([f.category, n && n.kcal != null ? Math.round(n.kcal) + ' kcal/100g' : '']
              .filter(Boolean).join(' · ')) + '</span>';
          b.onclick = () => {
            const p = (f.portions || [])[0];
            mealDraft.push({ foodId: f.id, foodName: f.name,
                             grams: p ? p.grams : 100, portion: p ? p.label : '' });
            search.value = ''; box.innerHTML = '';
            paint(); search.focus();
          };
          box.appendChild(b);
        });
      };
      search.oninput = () => { loadFoods().then(showResults); showResults(); };
      search.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const first = $('mbResults').querySelector('button');
          if (first) first.click();
        }
      };
      paint();
      $('mbName').focus();
    },
    'Save meal');
}

function openMeals() {
  loadFoods();
  openPop('Meals',
    '<div class="list" id="mealList"></div>' +
    '<div class="chips" style="margin-top:10px">' +
      '<button class="mini" id="mealNew">＋ New meal</button>' +

/* =============================================================
   THE TRACKER — every instrument empties into here.

   Ordered by _at (when you entered it), not by t (the time of day it is
   about). Those differ whenever you backdate, and "the order I put things
   in" is the one that makes a running log make sense.
   ============================================================= */
function renderFeed() {
  $('feedDate').textContent = fmtDay(day);
  const rows = [];
  /* Sort on _up, not _at. For a logged entry they're the same, but a habit
     record was created the day you defined the habit — ticking it today has
     to place it where you tapped it, not months ago. Same for the pulse and
     sleep rows, which upsert into one record per day. */
  const push = (rec, ic, tx, del) => rows.push({
    at: (rec && (rec._up || rec._at)) || '', t: (rec && (rec.t || rec.time)) || '', ic, tx, del,
  });

  onDay(state.body.water).forEach((r) =>
    push(r, '💧', round1(r.oz) + ' oz water',
      () => dropRecord(state.body.water, r.id, round1(r.oz) + ' oz water')));
  onDay(state.body.drinks).forEach((r) =>
    push(r, (intakeMeta(r.kind) || {}).icon || '🥤', describeIntake(r.kind, r),
      () => dropRecord(state.body.drinks, r.id, describeIntake(r.kind, r))));
  onDay(state.body.substances).forEach((r) =>
    push(r, (intakeMeta(r.kind) || {}).icon || '•', describeIntake(r.kind, r),
      () => dropRecord(state.body.substances, r.id, describeIntake(r.kind, r))));
  onDay(state.body.exercise).forEach((r) =>
    push(r, '🏃', r.type + (r.minutes ? ' · ' + r.minutes + ' min' : ''),
      () => dropRecord(state.body.exercise, r.id, r.type)));
  onDay(state.body.food).forEach((r) => {
    const kc = kcalOf(r);
    push(r, '🍽', shortName(r.foodName || 'food', 28) +
      ' · ' + (r.portion || round1(r.grams) + ' g') + (kc == null ? '' : ' · ' + Math.round(kc) + ' kcal'),
      () => dropRecord(state.body.food, r.id, r.foodName));
  });
  onDay(state.body.symptoms).forEach((r) =>
    push(r, '⚕', r.note, () => dropRecord(state.body.symptoms, r.id, r.note)));

  const s = sleepFor(day);
  if (s) push(s, '🌙', round1(s.hours) + ' h sleep' + (s.quality ? ' · quality ' + s.quality : ''), null);
  const c = card(day);
  if (c && (c.mood != null || c.energy != null)) {
    const bits = [];
    if (c.mood != null) bits.push('mood ' + c.mood);
    if (c.energy != null) bits.push('energy ' + c.energy);
    push(c, '◉', bits.join(' · '), null);
  }
  (state.habits.items || []).filter((h) => (h.done || []).includes(day))
    .forEach((h) => push(h, '✓', h.name, null));

  /* Things added from the panels. These have no `date` of their own — a
     person isn't "about" a day — so they're matched on when they were
     entered, which is exactly what the tracker is a record of. */
  const enteredToday = (arr) => (arr || []).filter((r) =>
    r && r._at && toLocalISO(new Date(r._at)) === day);
  const added = [
    [state.relationships.people, '🧑', (r) => r.name + (r.relation ? ' · ' + r.relation : '')],
    [state.relationships.birthdays, '🎂', (r) => r.name + ' · ' + (MONTHS[r.month - 1] || '?') + (r.day ? ' ' + r.day : '')],
    [state.mind.books, '📕', (r) => r.title + (r.author ? ' · ' + r.author : '')],
    [state.mind.quotes, '❝', (r) => shortName(r.text, 44) + (r.source ? ' — ' + r.source : '')],
    [state.mind.ideas, '💡', (r) => shortName(r.text, 52)],
    [state.money.expenses, '💵', (r) => fmt$(r.amount) + (r.note ? ' · ' + r.note : '')],
    [state.money.categories, '📊', (r) => r.name + (r.planned ? ' · ' + fmt$(r.planned) + '/mo' : '')],
    [state.money.subscriptions, '🔁', (r) => r.name + ' · ' + fmt$(r.amount) + '/' + (r.cadence || 'monthly')],
    [state.places.items, '📍', (r) => r.name + ' · ' + r.kind],
  ];
  added.forEach(([arr, icon, label]) => enteredToday(arr).forEach((r) =>
    push(r, icon, label(r), () => dropRecord(arr, r.id, label(r)))));

  // Oldest first: the log grows downward as the day does.
  rows.sort((a, b) => String(a.at).localeCompare(String(b.at)) || String(a.t).localeCompare(String(b.t)));

  const feed = $('feed');
  feed.innerHTML = '';
  if (!rows.length) {
    feed.innerHTML = '<div class="empty">Nothing logged yet for ' + fmtDay(day) + '.</div>';
    return;
  }
  rows.forEach((r) => {
    const div = document.createElement('div'); div.className = 'row';
    div.innerHTML = '<span class="t">' + esc(r.t) + '</span><span class="ic">' + r.ic +
                    '</span><span class="tx">' + esc(r.tx) + '</span>';
    if (r.del) {
      const x = document.createElement('button');
      x.className = 'x'; x.type = 'button'; x.textContent = '✕'; x.title = 'Remove';
      x.onclick = () => { r.del(); saveState(); renderAll(); };
      div.appendChild(x);
    }
    feed.appendChild(div);
  });
}

let popConfirm = null;
function openPop(title, bodyHTML, onConfirm, afterRender, okLabel) {
  const pop = $('pop');
  pop.innerHTML = '<h3>' + esc(title) + '</h3>' + bodyHTML +
    '<div class="actions">' +
      (onConfirm ? '<button class="chip" id="popCancel">Cancel</button><button class="primary" id="popOk">' +
                     esc(okLabel || 'Save') + '</button>'
                 : '<button class="primary" id="popOk">Done</button>') +
    '</div>';
  pop.style.display = 'block';
  $('popBack').classList.add('open');
  popConfirm = onConfirm;
  if (afterRender) afterRender();
  const cancel = $('popCancel');
  if (cancel) cancel.onclick = closePop;
  $('popOk').onclick = () => {
    if (popConfirm && popConfirm() === false) return;   // false = validation failed, stay open
    closePop();
  };
  const first = pop.querySelector('input[type=text]');
  if (first) first.focus();
  pop.querySelectorAll('input').forEach((i) => {
    i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('popOk').click(); } };
  });
}
function closePop() {
  $('pop').style.display = 'none';
  $('popBack').classList.remove('open');
  popConfirm = null;
}

/* =============================================================
   FORMS — one helper behind every "＋ Add" in the drawers.
   fields: [{ key, label, type, placeholder, options }]
   onSave gets an object of trimmed values; return false to keep the form open.
   ============================================================= */
function openForm(title, fields, values, onSave, okLabel) {
  const html = fields.map((f) => {
    const id = 'ff_' + f.key;
    const lab = '<div class="rowlabel">' + esc(f.label) + '</div>';
    if (f.type === 'select') {
      return lab + '<select id="' + id + '">' + f.options.map((o) => {
        const v = typeof o === 'string' ? o : o.v;
        const l = typeof o === 'string' ? o : o.l;
        return '<option value="' + esc(v) + '">' + esc(l) + '</option>';
      }).join('') + '</select>';
    }
    if (f.type === 'textarea') return lab + '<textarea id="' + id + '" placeholder="' + esc(f.placeholder || '') + '"></textarea>';
    return lab + '<input type="' + (f.type || 'text') + '" id="' + id + '" placeholder="' +
           esc(f.placeholder || '') + '"' + (f.step ? ' step="' + f.step + '"' : '') + '>';
  }).join('');
  openPop(title, html, () => {
    const out = {};
    fields.forEach((f) => { out[f.key] = String($('ff_' + f.key).value || '').trim(); });
    return onSave(out);
  }, () => {
    fields.forEach((f) => { if (values && values[f.key] != null) $('ff_' + f.key).value = values[f.key]; });
    const first = $('pop').querySelector('input,select,textarea');
    if (first) first.focus();
  }, okLabel || 'Add');
}

/** Only ever emit a link we'd be willing to click. */
function safeUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u) && !u.startsWith('/') && !u.startsWith('.')) u = 'https://' + u;
  if (/^(javascript|data|vbscript):/i.test(u)) return null;
  return u;
}
function renderLaunch() {

  DOORS.forEach((d) => {
    if (d.pending) {
      const el = document.createElement('div');
      el.className = 'pend'; el.title = d.name + ' — not published yet';
      el.innerHTML = '<span class="soon">soon</span><span class="ic">' + d.ic + '</span>' + esc(d.name);
      box.appendChild(el);
      return;

    const a = document.createElement('a');

    box.appendChild(a);

    a.title = l.label + ' — ' + url;
    a.innerHTML = '<span class="ic">' + esc(l.icon || '🔗') + '</span>' + esc(shortName(l.label, 14));
    const del = document.createElement('button');

    del.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();

/* ---- upcoming birthdays: the one time-sensitive thing in the drawers ---- */
function upcomingBirthdays(withinDays) {
  const now = new Date();
  const out = [];
  (state.relationships.birthdays || []).forEach((b) => {
    if (!b.month || b.deceased) return;
    const d = new Date(now.getFullYear(), b.month - 1, b.day || 1);
    if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d.setFullYear(now.getFullYear() + 1);
    const days = Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    if (days <= withinDays) out.push({ b, days, when: d });
  });
  return out.sort((a, b) => a.days - b.days);
}
function renderBirthdayLine() {
  const up = upcomingBirthdays(30);
  const el = $('bdayLine');
  if (!up.length) { el.textContent = ''; return; }
  el.innerHTML = '🎂 ' + up.slice(0, 3).map((u) =>
    '<b>' + esc(u.b.name) + '</b> ' + (u.days === 0 ? 'today' : u.days === 1 ? 'tomorrow' : 'in ' + u.days + ' days')
  ).join(' · ');
}

/* =============================================================
   THIS WEEK — derived live from the last 7 days, never stored.
   Descriptive, not evaluative: counts and averages, no score, no
   streak, nothing you can fail.
   ============================================================= */
function weekDays() {
  const out = [];
  for (let i = 6; i >= 0; i--) out.push(shiftDay(todayStr(), -i));
  return out;
}
function renderWeek() {
  const days = weekDays();
  const inWeek = (arr) => (arr || []).filter((r) => days.includes(r.date));
  const cards = inWeek(state.daily.cards);
  const avg = (nums) => nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;

  const mood = avg(cards.map((c) => c.mood).filter((n) => n != null));
  const energy = avg(cards.map((c) => c.energy).filter((n) => n != null));
  const sleeps = inWeek(state.body.sleep).map((s) => Number(s.hours)).filter((n) => !isNaN(n));
  const water = inWeek(state.body.water).reduce((n, r) => n + (Number(r.oz) || 0), 0);
  const ex = inWeek(state.body.exercise);
  const exMin = ex.reduce((n, e) => n + (Number(e.minutes) || 0), 0);
  const subs = inWeek(state.body.substances);
  const cnt = (k) => subs.filter((s) => s.kind === k).reduce((n, s) => n + (Number(s.count) || 1), 0);

  const cell = (k, v, u) => '<div class="c"><div class="k">' + k + '</div><div class="v">' +
    (v == null ? '—' : v) + (u ? '<span class="u"> ' + u + '</span>' : '') + '</div></div>';

  $('wkCells').innerHTML =
    cell('Days logged', cards.length, 'of 7') +
    cell('Mood', mood == null ? null : round1(mood), 'avg') +
    cell('Energy', energy == null ? null : round1(energy), 'avg') +
    cell('Sleep', sleeps.length ? round1(avg(sleeps)) : null, 'h avg') +
    cell('Water', Math.round(water / 7), 'oz/day') +
    cell('Movement', ex.length, ex.length ? 'x · ' + exMin + ' min' : '') +
    cell('Alcohol', cnt('alcohol'), '') +
    cell('Nicotine / weed', cnt('nicotine') + ' / ' + cnt('weed'), '');

  $('wkDays').innerHTML = days.map((d) => {
    const on = cards.some((c) => c.date === d);
    const lbl = new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'narrow' });
    return '<div class="d"><div class="box' + (on ? ' on' : '') + '"></div>' + lbl + '</div>';
  }).join('');

  const notes = cards.filter((c) => c.one_sentence).slice().reverse();
  $('wkNotes').innerHTML = notes.length
    ? notes.map((c) => '<div class="l"><span class="dt">' + esc(fmtDay(c.date)) + '</span>' +
        esc(c.one_sentence) + '</div>').join('')
    : '<div class="empty">No day notes this week.</div>';

  $('sumWeek').textContent = cards.length + ' of 7 days logged';
}
